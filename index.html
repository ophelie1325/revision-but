<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F3EC">
<title>Prépa BUT TC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#F7F3EC; --carte:#FFFFFF; --encre:#241C16; --encre2:#6B6058; --encre3:#A79C8E;
  --trait:#E3DCD1; --trait2:#F0EAE1;
  --terre:#D9603C; --terre-fonce:#B14526; --terre-pale:#FAEDE7;
  --c1:#B14526; --c2:#2E6B5E; --c3:#4A5BA8;
  --or:#C08A1E; --or-pale:#FBF1DC; --or-fonce:#8F6410;
  --rouge:#C33A28; --rouge-pale:#FBEAE6;
  --ombre:0 1px 2px rgba(40,28,20,.05), 0 6px 16px rgba(40,28,20,.07);
  --r:18px; --r2:13px; --hautNav:66px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Outfit',system-ui,-apple-system,sans-serif;background:var(--fond);color:var(--encre);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.2;letter-spacing:-.02em;font-weight:700}
:focus-visible{outline:2px solid var(--terre);outline-offset:2px;border-radius:6px}

.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--hautNav) + env(safe-area-inset-bottom));position:relative}
.ecran{padding:18px 16px 20px}
.enTete{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.enTete h1{font-size:25px}
.sousTitre{color:var(--encre2);font-size:14px;margin-bottom:18px}
.jour{background:var(--carte);border-radius:999px;padding:5px 12px;font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;font-weight:600;color:var(--terre-fonce);box-shadow:var(--ombre);white-space:nowrap;flex:none}
.iconeBtn{width:38px;height:38px;border-radius:12px;background:var(--carte);box-shadow:var(--ombre);
  display:grid;place-items:center;font-size:17px;flex:none}

.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,253,249,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--trait);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:520px;margin:0 auto;display:flex;width:100%}
.nav button{flex:1;padding:9px 0 12px;font-size:11.5px;font-weight:600;color:var(--encre3);
  display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.act{color:var(--terre)}
.nav .ic{font-size:19px;line-height:1}

.bloc{background:var(--carte);border-radius:var(--r);padding:14px 15px;margin-bottom:11px;box-shadow:var(--ombre)}
.bloc-t{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.point{width:10px;height:10px;border-radius:3px;flex:none}
.bloc-nom{font-size:14px;font-weight:600;min-width:0}
.bloc-meta{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--encre3);flex:none}

.cta{display:block;width:100%;background:var(--terre);color:#fff;border-radius:var(--r2);padding:14px;
  text-align:center;font-weight:600;font-size:15.5px;box-shadow:0 3px 0 var(--terre-fonce);margin-top:6px}
.cta:active{transform:translateY(2px);box-shadow:0 1px 0 var(--terre-fonce)}
.cta.sec{background:var(--carte);color:var(--encre);box-shadow:var(--ombre)}
.cta[disabled]{opacity:.45;box-shadow:none}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--carte);border-radius:11px;padding:9px 14px;
  font-size:14px;font-weight:600;box-shadow:var(--ombre)}
.btn.plein{background:var(--terre);color:#fff;box-shadow:0 2px 0 var(--terre-fonce)}
.btn.mini{padding:6px 11px;font-size:13px;font-weight:500}
.btn[disabled]{opacity:.45}
.rang{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}

.jauge{height:7px;background:var(--trait2);border-radius:4px;overflow:hidden}
.jauge i{display:block;height:100%;background:var(--terre);border-radius:4px;transition:width .45s ease}
.progLigne{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.progLigne .jauge{flex:1}
.progLigne span{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--encre2);flex:none}

.lecon{min-height:100vh;display:flex;flex-direction:column;padding:14px 16px calc(var(--hautNav) + 14px)}
.lecon-haut{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pts{display:flex;gap:3px;flex:1}
.pts span{height:4px;flex:1;border-radius:2px;background:#E0D8CC;transition:background .3s}
.pts span.f{background:var(--terre)}
.fermer{font-size:22px;color:var(--encre3);line-height:1;padding:0 2px}
.diapo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 0 18px;animation:entre .28s ease}
@keyframes entre{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kick{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--terre-fonce);margin-bottom:9px}
.diapo h2{font-size:24px;margin-bottom:13px}
.diapo h3{font-size:20px;margin-bottom:11px}
.diapo p{font-size:15.5px;line-height:1.55;color:#3D332C;margin-bottom:11px}
.diapo p strong{font-weight:600;color:var(--encre)}
.encart{border-radius:var(--r2);padding:13px 14px;margin-top:6px;font-size:14.5px;line-height:1.5}
.encart b.et{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;margin-bottom:5px;font-weight:600}
.encart.astuce{background:var(--or-pale)} .encart.astuce b.et{color:var(--or-fonce)}
.encart.piege{background:var(--rouge-pale)} .encart.piege b.et{color:var(--rouge)}
.encart.garde{background:#E8F0EE} .encart.garde b.et{color:var(--c2)}
.encart.info{background:var(--terre-pale)} .encart.info b.et{color:var(--terre-fonce)}
.vocab{list-style:none}
.vocab li{background:var(--carte);border-radius:var(--r2);padding:11px 13px;margin-bottom:8px;font-size:14.5px;
  box-shadow:var(--ombre);line-height:1.45}
.vocab b{display:block;font-size:14px;margin-bottom:2px}
.vocab span{color:var(--encre2)}
.etapes{list-style:none;counter-reset:e}
.etapes li{counter-increment:e;display:flex;gap:11px;align-items:flex-start;margin-bottom:9px;font-size:14.5px;line-height:1.4}
.etapes li::before{content:counter(e);flex:none;width:24px;height:24px;border-radius:8px;background:var(--terre);
  color:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.chiffres{list-style:none}
.chiffres li{display:flex;gap:11px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--trait);font-size:14.5px}
.chiffres li:last-child{border:none}
.chiffres b{font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--terre-fonce);flex:none;min-width:64px}
.sources{list-style:none;font-size:13px}
.sources li{padding:9px 0;border-bottom:1px solid var(--trait);color:var(--encre2);line-height:1.4}
.sources li:last-child{border:none}
.sources b{display:block;color:var(--encre);font-size:13.5px;font-weight:600}
.sources a{color:var(--terre-fonce);word-break:break-all;font-size:12px;text-decoration:none;font-family:'IBM Plex Mono',monospace}

.opt{display:block;width:100%;text-align:left;background:var(--carte);border:1.5px solid var(--trait);
  border-radius:var(--r2);padding:13px 14px;margin-bottom:9px;font-size:15px;line-height:1.4;box-shadow:var(--ombre)}
.opt.pris{border-color:var(--terre);background:var(--terre-pale)}
.opt.juste{border-color:var(--c2);background:#E8F0EE}
.opt.faux{border-color:var(--rouge);background:var(--rouge-pale)}
.verdict{border-radius:var(--r2);padding:13px 14px;margin:12px 0;font-size:14.5px;line-height:1.5}
.verdict.ok{background:#E8F0EE} .verdict.ko{background:var(--rouge-pale)}
.verdict b{display:block;margin-bottom:3px}
.champ{display:block;font-size:13px;font-weight:600;color:var(--encre2);margin:0 0 6px}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{
  width:100%;padding:12px 13px;border:1.5px solid var(--trait);border-radius:var(--r2);background:var(--carte)}
textarea{min-height:150px;resize:vertical;line-height:1.5}
.duo{display:grid;gap:11px;grid-template-columns:1fr 1fr}
.puce{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--carte);
  font-size:12.5px;font-weight:500;box-shadow:var(--ombre);color:var(--encre2)}
.puce.on{background:var(--terre);color:#fff;box-shadow:0 2px 0 var(--terre-fonce)}
.puce.mono{font-family:'IBM Plex Mono',monospace;font-size:11px}
.liste-puces{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.avis{border-radius:var(--r2);padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.5;background:var(--or-pale)}
.avis.info{background:var(--terre-pale)} .avis.err{background:var(--rouge-pale)}
.avis b{display:block;margin-bottom:3px}
.vide{text-align:center;padding:38px 16px;color:var(--encre2)}
.vide .em{font-size:34px;margin-bottom:10px}
.vide h3{font-size:17px;margin-bottom:6px;color:var(--encre)}
.carteAct{display:flex;align-items:center;gap:12px;background:var(--carte);border-radius:var(--r);padding:14px 15px;
  margin-bottom:10px;box-shadow:var(--ombre);width:100%;text-align:left}
.carteAct .ic{width:40px;height:40px;border-radius:12px;background:var(--terre-pale);display:grid;place-items:center;
  font-size:18px;flex:none}
.carteAct .tx{flex:1;min-width:0}
.carteAct .tx b{display:block;font-size:15px;font-weight:600}
.carteAct .tx small{font-size:12.5px;color:var(--encre2)}
.carteAct .fl{color:var(--encre3);font-size:18px}
.tableau{width:100%;border-collapse:collapse;font-size:14px}
.tableau th,.tableau td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--trait)}
.tableau th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--encre3);font-weight:500}
.tableau td.n{font-family:'IBM Plex Mono',monospace;text-align:right}
.chrono{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--terre-fonce)}
.src{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--encre3);border-bottom:1px dotted var(--trait)}
.srcTxt{display:none;font-size:13.5px;color:var(--encre2);background:var(--trait2);padding:10px 12px;
  border-radius:10px;margin:8px 0;font-style:italic;line-height:1.45}
.srcTxt.ouvert{display:block}
.semaine{border-left:2px solid var(--trait);padding:0 0 15px 14px;position:relative}
.semaine::before{content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--terre)}
.semaine .quand{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--encre3);text-transform:uppercase;letter-spacing:.08em}

.depli{background:var(--carte);border-radius:var(--r2);margin-bottom:8px;box-shadow:var(--ombre);overflow:hidden}
.depli>summary{padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;list-style:none;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.depli>summary::-webkit-details-marker{display:none}
.depli>summary::after{content:"›";color:var(--encre3);font-size:17px;transform:rotate(90deg)}
.depli[open]>summary::after{transform:rotate(-90deg)}
.depli .corps{padding:0 14px 12px;font-size:13.5px;color:var(--encre2);line-height:1.5}
.depli .corps li{margin:0 0 7px 16px}

.horsCours{background:#EEF1F8;border-left:3px solid var(--c3);padding:10px 12px;border-radius:0;margin:8px 0;font-size:13.5px;line-height:1.45}
.horsCours .et{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--c3);font-weight:600;margin-bottom:4px}
.triLigne{display:flex;gap:10px;align-items:flex-start;background:var(--carte);border-radius:var(--r2);
  padding:11px 13px;margin-bottom:8px;box-shadow:var(--ombre)}
.triLigne input[type=checkbox]{width:19px;height:19px;flex:none;margin-top:2px;accent-color:var(--terre)}
.triLigne .tx{flex:1;min-width:0;font-size:14px;line-height:1.4}
.triLigne select{width:auto;padding:5px 8px;font-size:12px;flex:none}

.vign{background:var(--carte);border-radius:var(--r2);padding:11px 12px;margin-bottom:9px;box-shadow:var(--ombre)}
.vign img{width:100%;height:auto;border-radius:8px;border:1px solid var(--trait);display:block;background:#fff}
.vign .tabWrap{overflow-x:auto;border:1px solid var(--trait);border-radius:8px}
.vign .tabWrap table{font-size:12.5px;min-width:100%}
.vign .tabWrap td,.vign .tabWrap th{border:1px solid var(--trait);padding:5px 7px;white-space:nowrap}
.vign .tabWrap th{background:var(--trait2);font-weight:600}
.vign .barre{display:flex;gap:7px;align-items:center;margin-top:9px;flex-wrap:wrap}
.vign .barre input[type=text]{flex:1;min-width:120px;padding:7px 9px;font-size:13px}
.vign .barre select{width:auto;padding:7px 9px;font-size:12.5px}
.pdfZone{position:relative;background:var(--carte);border-radius:var(--r2);box-shadow:var(--ombre);
  overflow:hidden;margin-bottom:12px;touch-action:none}
.pdfZone canvas{display:block;width:100%;height:auto}
.pdfZone .cadreSel{position:absolute;border:2px solid var(--terre);background:rgba(217,96,60,.14);
  pointer-events:none;border-radius:2px}
/* ---- tableau de bord ---- */
.anneaux{display:flex;gap:10px;justify-content:center;margin:4px 0 16px;flex-wrap:wrap}
.anneau{display:flex;flex-direction:column;align-items:center;gap:5px}
.anneau svg{display:block}
.anneau .lab{font-size:11.5px;color:var(--encre2);text-align:center;max-width:96px;line-height:1.25}
.anneau .val{font-family:'IBM Plex Mono',monospace;font-weight:600}
.grandAnneau{display:flex;align-items:center;gap:16px;background:var(--carte);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--ombre);margin-bottom:12px}
.grandAnneau .chiffres{flex:1;min-width:0}
.grandAnneau .chiffres b{display:block;font-family:'IBM Plex Mono',monospace;font-size:22px;line-height:1.1}
.grandAnneau .chiffres small{display:block;font-size:12.5px;color:var(--encre2);margin-top:2px}
.boites{display:flex;gap:6px;margin-bottom:6px}
.boites .b{flex:1;border-radius:8px;padding:9px 6px;text-align:center}
.boites .b b{display:block;font-family:'IBM Plex Mono',monospace;font-size:16px}
.boites .b small{font-size:10.5px;display:block;margin-top:1px}
.boites .b1{background:var(--rouge-pale);color:var(--rouge)}
.boites .b2{background:var(--or-pale);color:var(--or-fonce)}
.boites .b3{background:#E8F0EE;color:var(--c2)}
.activite{display:flex;align-items:flex-end;gap:3px;height:64px;margin:6px 0 4px}
.activite .j{flex:1;background:var(--trait2);border-radius:3px 3px 0 0;position:relative;min-height:3px}
.activite .j i{position:absolute;left:0;right:0;bottom:0;background:var(--terre);border-radius:3px 3px 0 0;display:block}
.activite .j.vide{background:var(--trait2)}
.legJours{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
  font-size:10px;color:var(--encre3);margin-bottom:14px}
.ligneMat{display:flex;align-items:center;gap:11px;background:var(--carte);border-radius:var(--r2);
  padding:10px 12px;margin-bottom:7px;box-shadow:var(--ombre)}
.ligneMat .tx{flex:1;min-width:0}
.ligneMat .tx b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.ligneMat .tx small{display:block;font-size:12px;color:var(--encre2);line-height:1.35}
.ligneMat .btn{flex:none}
.legSeg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:11.5px;
  color:var(--encre2);margin:-8px 0 16px}
.legSeg span{display:inline-flex;align-items:center;gap:5px}
.legSeg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.grilleOutils{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.outil{position:relative;background:var(--carte);border-radius:var(--r2);padding:12px 6px 10px;
  box-shadow:var(--ombre);display:flex;flex-direction:column;align-items:center;gap:5px;min-height:76px;
  justify-content:center;transition:transform .12s}
.outil:active{transform:scale(.96)}
.outil .ic{font-size:19px;line-height:1}
.outil .nom{font-size:11.5px;color:var(--encre2);text-align:center;line-height:1.2}
.outil .pastille{position:absolute;top:6px;right:8px;background:var(--terre);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;min-width:17px;height:17px;
  border-radius:9px;display:grid;place-items:center;padding:0 4px}
.choixGros{display:flex;gap:10px;margin-bottom:14px}
.choixGros button{flex:1;background:var(--carte);border-radius:var(--r);padding:18px 12px;box-shadow:var(--ombre);
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.choixGros .ic{font-size:24px;line-height:1}
.choixGros b{font-size:15px}
.choixGros small{font-size:12px;color:var(--encre2);line-height:1.3}
.boite{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;width:22px;height:22px;
  border-radius:7px;display:grid;place-items:center;flex:none;background:var(--trait2);color:var(--encre3)}
.boite.b1{background:var(--rouge-pale);color:var(--rouge)}
.boite.b2{background:var(--or-pale);color:var(--or-fonce)}
.boite.b3{background:#E8F0EE;color:var(--c2)}
.pages{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:4px}
.page{position:relative;flex:none;width:88px}
.page img{width:88px;height:118px;object-fit:cover;border-radius:10px;border:1px solid var(--trait);
  background:#fff;display:block}
.page .ret{position:absolute;top:-5px;right:-5px;width:22px;height:22px;border-radius:50%;
  background:var(--rouge);color:#fff;font-size:14px;line-height:1;display:grid;place-items:center;box-shadow:var(--ombre)}
.page .num{position:absolute;bottom:5px;left:5px;background:rgba(36,28,22,.72);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:10px;padding:1px 5px;border-radius:5px}
.classeLigne{display:flex;gap:7px;align-items:center;background:var(--carte);border-radius:var(--r2);
  padding:10px 12px;margin-bottom:8px;box-shadow:var(--ombre);flex-wrap:wrap}
.classeLigne .tx{flex:1;min-width:110px;font-size:14.5px;line-height:1.35}
.classeLigne .puce.bon{background:#E8F0EE;color:var(--c2);box-shadow:inset 0 0 0 1.5px var(--c2)}
.classeLigne .puce.mauvais{background:var(--rouge-pale);color:var(--rouge);box-shadow:inset 0 0 0 1.5px var(--rouge)}
.niv{display:flex;gap:10px;align-items:center;background:var(--carte);border-radius:var(--r);padding:13px 14px;
  margin-bottom:10px;box-shadow:var(--ombre);width:100%;text-align:left}
.niv .rond{width:34px;height:34px;border-radius:11px;background:var(--trait2);display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--encre2);flex:none}
.niv.ouvert .rond{background:var(--terre);color:#fff}
.niv.acquis .rond{background:#E8F0EE;color:var(--c2)}
.niv .tx{flex:1;min-width:0}
.niv .tx b{display:block;font-size:15px}
.niv .tx small{font-size:12.5px;color:var(--encre2)}
.niv[disabled]{opacity:.5}

#impression{display:none}
@media print{
  body{background:#fff}
  .app,.nav{display:none !important}
  #impression{display:block}
  @page{size:A4;margin:12mm 11mm}

}

/* =========================================================================
   4 bis. STOCKAGE DES IMAGES
   Les schémas ne tiennent pas dans le stockage local : ils vont dans une
   base IndexedDB séparée. Si elle est indisponible, on retombe sur une
   réserve en mémoire, qui ne survit pas à la fermeture de l'onglet.
   ========================================================================= */
const BDD = "buttc_visuels", MAGASIN = "img";
let bddPromesse = null, replisImg = {}, bddOk = true;
function bdd(){
  if(bddPromesse) return bddPromesse;
  bddPromesse = new Promise((ok, ko) => {
    if(!window.indexedDB){ bddOk = false; return ko(new Error("IndexedDB indisponible")); }
    const r = indexedDB.open(BDD, 1);
    r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains(MAGASIN)) r.result.createObjectStore(MAGASIN); };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => { bddOk = false; ko(r.error || new Error("Ouverture impossible")); };
  });
  return bddPromesse;
}
function tx(mode, fn){
  return bdd().then(db => new Promise((ok, ko) => {
    const t = db.transaction(MAGASIN, mode);
    const req = fn(t.objectStore(MAGASIN));
    t.oncomplete = () => ok(req ? req.result : undefined);
    t.onerror = () => ko(t.error);
  }));
}
async function poserImage(id, dataUrl){
  try{ await tx("readwrite", s => s.put(dataUrl, id)); }
  catch(e){ bddOk = false; replisImg[id] = dataUrl; }
}
async function prendreImage(id){
  if(replisImg[id]) return replisImg[id];
  try{ return await tx("readonly", s => s.get(id)); }
  catch(e){ return null; }
}
async function retirerImage(id){
  delete replisImg[id];
  try{ await tx("readwrite", s => s.delete(id)); }catch(e){}
}
async function toutesImages(ids){
  const out = {};
  for(const id of ids){ const v = await prendreImage(id); if(v) out[id] = v; }
  return out;
}

/* Réduction : au plus 1400 px de large, JPEG de qualité 0,78.
   Un schéma de cours pèse alors une centaine de kilo-octets. */
const LARGEUR_MAX = 1400;
function reduireImage(source){
  return new Promise((ok, ko) => {
    const im = new Image();
    im.onload = () => {
      const ech = Math.min(1, LARGEUR_MAX / im.width);
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.width * ech));
      c.height = Math.max(1, Math.round(im.height * ech));
      const g = c.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(im, 0, 0, c.width, c.height);
      ok({data: c.toDataURL("image/jpeg", 0.78), w: c.width, h: c.height});
    };
    im.onerror = () => ko(new Error("Image illisible."));
    im.src = source;
  });
}
function poidsData(d){ return Math.round((String(d||"").length * 3 / 4) / 1024); }

/* =========================================================================
   4 ter. TABLEAUX
   Un tableau importé est reconstruit cellule par cellule à partir du DOM :
   seuls le texte et la structure sont conservés, jamais le balisage d'origine.
   ========================================================================= */
function assainirTableau(el){
  const lignes = [];
  el.querySelectorAll("tr").forEach(tr => {
    const cells = [];
    tr.querySelectorAll("td,th").forEach(td => {
      cells.push({t: td.tagName.toLowerCase() === "th",
        txt: (td.textContent || "").replace(/\s+/g," ").trim()});
    });
    if(cells.some(c => c.txt)) lignes.push(cells);
  });
  if(lignes.length < 2) return null;
  const cols = Math.max.apply(null, lignes.map(l => l.length));
  if(cols < 2) return null;
  return {lignes, cols};
}
function tableauHtml(t, classe){
  return '<table class="' + (classe || "tableau") + '"><tbody>' + t.lignes.map(l =>
    "<tr>" + l.map(c => "<" + (c.t ? "th" : "td") + ">" + esc(c.txt) + "</" + (c.t ? "th" : "td") + ">").join("") + "</tr>"
  ).join("") + "</tbody></table>";
}

/* =========================================================================
   5. LECTURE DU COURS
   Les prises de notes sont fragmentaires : les seuils sont volontairement
   bas, et la mise en forme d'origine (titres, gras, listes) est conservée
   parce qu'elle dit déjà ce qui est important.
   ========================================================================= */
const UNITES = "%|€|k€|M€|mois|ans?|jours?|semaines?|heures?|h|min|km|m|kg|g|L|ml|pts?|points?|ECTS|/20|/10";
const RE_CHIFFRE = new RegExp("(?:^|[\\s(])(\\d+(?:[.,]\\d+)?)\\s?(" + UNITES + ")(?![a-zA-Zéèà])", "");
const RE_FORMULE = /(=|\btaux\b|\bmarge\b|\bcoefficient\b|\bratio\b|\bseuil\b|\bcalcul)/i;
const RE_JURI = /(article [LRD]\.?\s?\d|code (?:de la consommation|de commerce|du travail|civil)|loi (?:n°\s?)?\d|décret|règlement \(UE\)|RGPD|directive)/i;
const RE_PIEGE = /\b(attention|jamais|ne (?:doit|peut|faut) (?:pas|jamais)|interdit|obligatoire|piège|erreur|à ne pas confondre|contrairement à|nuance|sauf)\b/i;
const RE_EXEMPLE = /\b(par exemple|ex\s?:|exemple\s?:|cas de|illustration)\b/i;
const RE_DEF = /^(.{2,70}?)\s*(?::|\s[—–-]\s)\s*(.{12,})$/;
const RE_DEF_VERBE = /^(.{2,60}?)\s+(?:est|sont|désigne|désignent|correspond à|correspondent à|se définit comme|consiste à|permet de)\s+(.{10,})$/i;
const RE_PUCE = /^\s*(?:[-•–*·>]|\d{1,2}\s*[.)°]|[a-h]\s*[.)]|[IVX]{1,4}\s*[.)])\s+(.{2,})$/;

function decouper(texte){
  const lignes = texte.replace(/\r/g,"").split("\n").map(l => l.replace(/\s+$/,""));
  const blocs = [];
  lignes.forEach(l => {
    const t = l.trim();
    if(!t){ blocs.push({type:"vide", txt:"", fort:[]}); return; }
    const p = t.match(RE_PUCE);
    if(p){ blocs.push({type:"puce", txt:p[1].trim(), brut:t, fort:[]}); return; }
    const estTitre = t.length < 85 && !/[.;:!?]$/.test(t) &&
      /^[A-ZÉÈÀÇ0-9]/.test(t) && t.split(" ").length <= 12 && !RE_DEF.test(t);
    blocs.push({type: estTitre ? "titre" : "para", txt:t, fort:[]});
  });
  return blocs;
}

/* Conversion du HTML issu de mammoth : on récupère la hiérarchie, le gras,
   les images intégrées et les tableaux. */
function depuisHtml(html){
  const doc = new DOMParser().parseFromString("<div>" + html + "</div>", "text/html");
  const blocs = [];
  const forts = new Set();
  const images = [], tableaux = [];
  doc.querySelectorAll("img").forEach(im => {
    const s = im.getAttribute("src") || "";
    if(/^data:image\//.test(s)) images.push(s);
  });
  doc.querySelectorAll("table").forEach(tb => {
    const t = assainirTableau(tb);
    if(t) tableaux.push(t);
    tb.remove();
  });
  doc.querySelectorAll("strong,b,em,u,mark").forEach(e => {
    const t = (e.textContent || "").trim();
    if(t.length > 2 && t.length < 90) forts.add(t);
  });
  doc.querySelectorAll("h1,h2,h3,h4,p,li").forEach(e => {
    const t = (e.textContent || "").replace(/\s+/g," ").trim();
    if(!t) return;
    const n = e.tagName.toLowerCase();
    const type = /^h[1-4]$/.test(n) ? "titre" : (n === "li" ? "puce" : "para");
    const propres = [];
    e.querySelectorAll("strong,b,em,u,mark").forEach(x => {
      const s = (x.textContent || "").trim();
      if(s.length > 2 && s.length < 90) propres.push(s);
    });
    blocs.push({type, txt:t, brut:t, fort:propres, niveau: /^h([1-4])$/.test(n) ? Number(n[1]) : 0});
  });
  return {blocs, forts:[...forts], images, tableaux, texte: blocs.map(b => b.txt).join("\n")};
}

function phrases(texte){
  return texte.replace(/\s+/g," ")
    .split(/(?<=[.!?;])\s+(?=[A-ZÉÈÀÇ0-9«"])/)
    .map(p => p.trim()).filter(p => p.length > 15 && p.length < 400);
}
function detecterRessource(texte){
  const n = " " + normaliser(texte) + " ";
  let meilleur = null, best = 0;
  RESS.forEach(r => {
    let score = 0;
    (r.cles || []).forEach(c => {
      const cn = normaliser(c);
      if(!cn) return;
      const occ = n.split(" " + cn).length - 1;
      if(occ > 0) score += occ * (cn.includes(" ") ? 3 : 1.6);
    });
    if(score > best){ best = score; meilleur = r.id; }
  });
  return best >= 4 ? meilleur : null;
}

const SONDES = [

  {re:/\b[\w.+-]+@[\w-]+\.[a-z]{2,}\b/gi,                           quoi:"adresse électronique"},
  {re:/\b0[1-9](?:[\s.-]?\d{2}){4}\b/g,                             quoi:"numéro de téléphone"},
  {re:/\b\d{13}(?:\s?\d{2})?\b/g,                                   quoi:"numéro à 13 chiffres"},
  {re:/\b(?:SIRET|SIREN)\s?:?\s?\d{6,}/gi,                          quoi:"identifiant d'entreprise"}
];
function sonderDonnees(t){
  const trouves = [];
  SONDES.forEach(s => { s.re.lastIndex = 0; if(s.re.test(t)) trouves.push(s.quoi); });
  return trouves;
}
function anonymiser(t){
  let r = t;
  r = r.replace(/\b(M\.|Mme|Mlle|Monsieur|Madame)\s+[A-ZÉÈÀ][a-zéèêàçï]+(?:\s+[A-ZÉÈÀ][A-ZÉÈÀa-zéèêàçï]+)?/g, "$1 [NOM]");
  r = r.replace(/\b[\w.+-]+@[\w-]+\.[a-z]{2,}\b/gi, "[COURRIEL]");
  r = r.replace(/\b0[1-9](?:[\s.-]?\d{2}){4}\b/g, "[TÉLÉPHONE]");
  r = r.replace(/\b\d{13}(?:\s?\d{2})?\b/g, "[IDENTIFIANT]");
  r = r.replace(/\b(SIRET|SIREN)\s?:?\s?\d{6,}/gi, "$1 [IDENTIFIANT]");
  return r;
}

/* =========================================================================
   7. MOTEUR LOCAL — repli hors ligne, sans intelligence artificielle.
   Tout ce qui sort d'ici provient littéralement des notes importées.
   ========================================================================= */
function analyseLocale(src, ressId){
  const blocs = src.blocs || decouper(src.texte);
  const texte = src.texte;
  const forts = src.forts || [];
  const phr = phrases(texte);
  const notions = [], parCoeur = [], calculs = [], juridique = [], pieges = [], exemples = [], sigles = [];

  const vus = new Set();
  blocs.forEach(b => {
    if(b.type === "vide") return;
    const m = b.txt.match(RE_DEF) || b.txt.match(RE_DEF_VERBE);
    if(m){
      const terme = m[1].replace(/^[-•–*·>\d.)\s]+/,"")
        .replace(/^(?:les|le|la|un|une|des|du)\s+/i,"").replace(/^l['’]\s*/i,"").trim();
      const def = m[2].trim();
      const k = normaliser(terme);
      if(terme.length > 1 && terme.length < 70 && def.length > 8 && !vus.has(k)){
        vus.add(k); notions.push({terme, def, src:b.txt});
      }
    }
  });
  /* les termes mis en gras par la prof sont considérés comme saillants */
  forts.forEach(f => {
    const k = normaliser(f);
    if(vus.has(k) || f.length < 3) return;
    const ligne = blocs.find(b => b.txt.includes(f) && b.txt.length > f.length + 12);
    if(ligne){ vus.add(k); notions.push({terme:f, def:ligne.txt, src:ligne.txt, saillant:true}); }
  });

  let ms;
  const vusSig = new Set();
  const reSig1 = /\b([A-ZÉÈ]{2,6})\s*\(([^)]{4,80})\)/g;
  while((ms = reSig1.exec(texte)) !== null){
    if(!vusSig.has(ms[1])){ vusSig.add(ms[1]); sigles.push({sigle:ms[1], sens:ms[2].trim(), src:ms[0]}); }
  }
  const reSig2 = /([a-zéèêàç][^.()\n]{4,80})\s*\(([A-ZÉÈ]{2,6})\)/g;
  while((ms = reSig2.exec(texte)) !== null){
    if(!vusSig.has(ms[2])){ vusSig.add(ms[2]); sigles.push({sigle:ms[2], sens:ms[1].trim(), src:ms[0]}); }
  }

  phr.forEach(p => {
    if(RE_CHIFFRE.test(p) && parCoeur.length < 20) parCoeur.push({txt:p, src:p});
    if(RE_FORMULE.test(p) && RE_CHIFFRE.test(p) && calculs.length < 12) calculs.push({txt:p, src:p});
    if(RE_JURI.test(p) && juridique.length < 12) juridique.push({txt:p, src:p});
    if(RE_PIEGE.test(p) && pieges.length < 12) pieges.push({txt:p, src:p});
    if(RE_EXEMPLE.test(p) && exemples.length < 10) exemples.push({txt:p, src:p});
  });
  blocs.forEach(b => {
    if(b.type === "puce" && b.txt.length > 12 && b.txt.length < 260 && parCoeur.length < 26)
      parCoeur.push({txt:b.txt, src:b.txt});
  });

  /* suites d'étapes : au moins trois puces numérotées qui se suivent */
  const procedures = [];
  let courante = [];
  const cloture = () => {
    if(courante.length >= 3 && courante.length <= 10)
      procedures.push({etapes: courante.slice()});
    courante = [];
  };
  blocs.forEach(b => {
    if(b.type === "puce" && /^\s*\d{1,2}\s*[.)°]/.test(b.brut || "") && b.txt.length < 180) courante.push(b.txt);
    else cloture();
  });
  cloture();

  const titre = (blocs.find(b => b.type === "titre") || {txt:""}).txt;
  const fiche = {
    resume: phr.slice(0,2).join(" "),
    notions: notions.slice(0,20), parCoeur: parCoeur.slice(0,18), calculs: calculs.slice(0,8),
    juridique: juridique.slice(0,8), pieges: pieges.slice(0,10), exemples: exemples.slice(0,8),
    sigles: sigles.slice(0,15), ajouts: [], procedures: procedures.slice(0,3), titreDetecte: titre
  };
  return {fiche, items: itemsLocaux(fiche, ressId)};
}

function itemsLocaux(fiche, ressId){
  const items = [];
  const base = t => ({id:uid(), ressId, type:t, visee:VISEE_PAR_TYPE[t] || "memo",
    niveau: NIVEAU_PAR_TYPE[t] || 1, cree:Date.now(), origine:"local"});
  fiche.notions.forEach(d => {
    items.push(Object.assign(base("flash"), {recto:d.terme, verso:d.def, source:d.src}));
    if(d.def.length >= 40){
      items.push(Object.assign(base("ouverte"), {
        question:"Explique « " + d.terme + " » avec tes mots, sans reprendre la formulation du cours.",
        attendu:d.def, motsCles:motsCles(d.def, 6), source:d.src}));
    }
  });
  /* compréhension : mettre deux notions du cours face à face.
     Rien n'est inventé, les deux définitions viennent des notes. */
  if(fiche.notions.length >= 2){
    const n = melanger(fiche.notions).slice(0, Math.min(6, fiche.notions.length));
    for(let i = 0; i + 1 < n.length; i += 2){
      const a = n[i], b = n[i+1];
      items.push(Object.assign(base("comparer"), {
        question:"Qu'est-ce qui distingue « " + a.terme + " » de « " + b.terme + " » ?",
        attendu: a.terme + " : " + a.def + "  —  " + b.terme + " : " + b.def,
        motsCles: motsCles(a.def, 3).concat(motsCles(b.def, 3)),
        source: a.src + " — " + b.src}));
    }
  }
  (fiche.procedures || []).forEach(p => {
    items.push(Object.assign(base("ordre"), {
      question:"Remets ces étapes dans l'ordre du cours.", etapes:p.etapes, source:p.etapes.join(" → ")}));
  });
  fiche.sigles.forEach(s => items.push(Object.assign(base("flash"), {recto:s.sigle, verso:s.sens, source:s.src})));
  if(fiche.notions.length >= 4){
    fiche.notions.forEach((d,i) => {
      const autres = melanger(fiche.notions.filter((_,j) => j !== i)).slice(0,3);
      if(autres.length < 3) return;
      const opts = melanger([d.def].concat(autres.map(a => a.def))).map(o => tronquer(o, 150));
      if(new Set(opts).size !== opts.length) return;
      items.push(Object.assign(base("qcm"), {
        question:"Que désigne « " + d.terme + " » ?", options:opts,
        reponse:opts.findIndex(o => o === tronquer(d.def,150)), source:d.src}));
    });
    const lot = melanger(fiche.notions).slice(0,5);
    items.push(Object.assign(base("paires"), {
      question:"Associe chaque terme à sa définition.",
      paires: lot.map(d => [d.terme, tronquer(d.def, 110)]),
      source: lot.map(d => d.src).join(" — ")}));
  }
  fiche.parCoeur.forEach(c => {
    const m = c.txt.match(RE_CHIFFRE);
    if(!m) return;
    const val = m[1] + (m[2] ? " " + m[2] : "");
    items.push(Object.assign(base("cloze"), {
      question: c.txt.replace(m[1] + (m[0].includes(" " + m[2]) ? " " : "") + m[2], "_____"),
      reponse: val, source:c.txt}));
  });
  fiche.parCoeur.slice(0,10).forEach((c,i) => {
    const m = c.txt.match(RE_CHIFFRE);
    if(!m) return;
    const vrai = i % 2 === 0;
    let enonce = c.txt;
    if(!vrai){
      const n = parseFloat(m[1].replace(",","."));
      let faux = n < 10 ? n + 1 : Math.round(n * (Math.random() < .5 ? 1.5 : 0.5));
      if(faux === n) faux = n + 2;
      enonce = c.txt.replace(m[1], String(faux).replace(".", ","));
    }
    items.push(Object.assign(base("vf"), {
      question: enonce, reponse: vrai,
      correction: vrai ? "Énoncé conforme aux notes." : "Faux : la valeur des notes est « " + m[1] + " " + m[2] + " ».",
      source: c.txt}));
  });
  return items;
}

const API = "https://generativelanguage.googleapis.com/v1beta";

  const r = await fetch(API + "/models?key=" + encodeURIComponent(cle));

    .filter(m => !/embedding|aqa|imagen|veo|tts/i.test(m.name))
    .map(m => ({id:m.name.replace(/^models\//,""), nom:m.displayName || m.name}));
}

async function appelGemini(cle, modele, corps){

/* Second appel : compléments extérieurs, avec recherche web activée.
   On ne garde que les URL présentes dans groundingMetadata. */
async function complementsGemini(fiche, ressId, cle, modele){
  const r = RESSOURCE(ressId);
  const lacunes = (fiche.lacunes || []).slice(0,5);
  const sujets = lacunes.length ? lacunes : (fiche.notions || []).slice(0,4).map(n => n.terme);
  if(!sujets.length) return [];
  const q = [
    "Contexte : cours de " + (r ? r.nom : "commerce") + " en B.U.T. Techniques de commercialisation, France.",
    "Pour chacun des points suivants, donne une précision courte et exacte, en français, en t'appuyant sur une recherche web :",
    sujets.map((s,i) => (i+1) + ". " + s).join("\n"),
    "",
    "Trois phrases maximum par point. Pas de liste de liens dans ta réponse, pas d'URL écrite à la main.",
    "Format : une ligne par point, préfixée du numéro et d'un tiret."
  ].join("\n");
  let d;
  try{
    d = await appelGemini(cle, modele, {
      contents:[{role:"user", parts:[{text:q}]}],
      tools:[{google_search:{}}],
      generationConfig:{temperature:0.1, maxOutputTokens:2048}
    });
  }catch(e){ return []; }
  const cand = (d.candidates || [])[0];
  if(!cand) return [];
  const txt = ((cand.content && cand.content.parts) || []).map(p => p.text || "").join("");
  const gm = cand.groundingMetadata || {};
  const liens = (gm.groundingChunks || [])
    .map(c => c && c.web ? {url:c.web.uri, titre:c.web.title || c.web.uri} : null)
    .filter(Boolean);
  if(!liens.length) return [];
  return txt.split("\n").map(l => l.trim())
    .filter(l => /^\d+\s*[.)-]/.test(l) && l.length > 25)
    .slice(0, sujets.length)
    .map((l,i) => ({txt: l.replace(/^\d+\s*[.)-]\s*/,"").trim(),
      sujet: sujets[i] || "", liens: liens.slice(0,3)}));
}

async function notionsGemini(texte, ressId, cle, modele){
  const d = await appelGemini(cle, modele, {
    systemInstruction:{parts:[{text:consigneNotions(ressId)}]},
    contents:[{role:"user", parts:[{text:"NOTES DE COURS :\n\n" + texte}]}],
    generationConfig:{temperature:0.2, responseMimeType:"application/json", maxOutputTokens:6144}
  });
  const cand = (d.candidates || [])[0];
  if(!cand) throw new Error("Gemini n'a rien renvoyé. Les notes sont peut-être trop longues : coupe-les en deux.");
  const brut = ((cand.content && cand.content.parts) || []).map(p => p.text || "").join("");
  let o;
  try{ o = JSON.parse(brut.replace(/^```json\s*|```\s*$/g,"").trim()); }
  catch(e){ throw new Error("La réponse de Gemini n'était pas exploitable. Relance l'analyse."); }
  return normaliserSortieIA({fiche:o, items:[]}, ressId).fiche;
}

function normaliserSortieIA(o, ressId){
  const f = o.fiche || {};
  const tab = x => Array.isArray(x) ? x : [];
  const lst = (k, champs) => tab(f[k]).filter(x => x && x[champs[0]]).map(x => {
    const r = {}; champs.forEach(c => r[c] = x[c] || "");
    r.src = x.src || ""; if(x.incertain === true) r.incertain = true; return r;
  });
  const fiche = {
    resume: f.resume || "",
    notions: lst("notions", ["terme","def"]),
    parCoeur: lst("parCoeur", ["txt"]),
    calculs: lst("calculs", ["txt"]),
    juridique: lst("juridique", ["txt"]),
    pieges: lst("pieges", ["txt"]),
    exemples: lst("exemples", ["txt"]),
    sigles: lst("sigles", ["sigle","sens"]),
    lacunes: tab(f.lacunes).filter(x => typeof x === "string"),
    procedures: [], ajouts: []
  };
  const items = [];
  tab(o.items).forEach(it => {
    if(!it || !TYPES[it.type]) return;
    const b = {id:uid(), ressId, type:it.type, visee: VISEES[it.visee] ? it.visee : (VISEE_PAR_TYPE[it.type] || "memo"),
      niveau: (Number(it.niveau) >= 1 && Number(it.niveau) <= 4) ? Number(it.niveau) : (NIVEAU_PAR_TYPE[it.type] || 1),
      cree:Date.now(), origine:"gemini", source: it.source || "", correction: it.correction || ""};
    if(it.type === "qcm" && Array.isArray(it.options) && it.options.length >= 2){
      items.push(Object.assign(b, {question:it.question, options:it.options,
        reponse: Math.max(0, Math.min(it.options.length - 1, Number(it.reponse) || 0))}));
    } else if(it.type === "choix" && Array.isArray(it.options) && it.options.length >= 3 && it.question){
      items.push(Object.assign(b, {question:it.question, angle: ANGLES[it.angle] ? it.angle : "explication",
        options:it.options, reponse: Math.max(0, Math.min(it.options.length - 1, Number(it.reponse) || 0))}));
    } else if(it.type === "classer" && Array.isArray(it.colonnes) && it.colonnes.length === 2
              && Array.isArray(it.elements) && it.elements.length >= 4){
      const els = it.elements.filter(e => e && e.txt).map(e => ({txt:e.txt, col: Number(e.col) === 1 ? 1 : 0}));
      if(els.length >= 4 && els.some(e => e.col === 0) && els.some(e => e.col === 1))
        items.push(Object.assign(b, {question: it.question || "Classe chaque élément dans la bonne colonne.",
          colonnes: it.colonnes.map(String), elements: els}));
    } else if(it.type === "redaction" && it.question){
      items.push(Object.assign(b, {question:it.question, attendu:it.attendu || "",
        motsCles: Array.isArray(it.motsCles) && it.motsCles.length ? it.motsCles : motsCles(it.attendu || "", 6)}));
    } else if(it.type === "qcmMulti" && Array.isArray(it.options) && Array.isArray(it.reponses) && it.reponses.length){
      items.push(Object.assign(b, {question:it.question, options:it.options,
        reponses: it.reponses.map(Number).filter(n => n >= 0 && n < it.options.length)}));
    } else if(it.type === "vf" && it.question){
      items.push(Object.assign(b, {question:it.question, reponse: it.reponse === true || it.reponse === "true"}));
    } else if(it.type === "flash" && it.recto && it.verso){
      items.push(Object.assign(b, {recto:it.recto, verso:it.verso}));
    } else if(it.type === "cloze" && it.question && it.reponse){
      items.push(Object.assign(b, {question:it.question, reponse:it.reponse}));
    } else if(["ouverte","erreur","situation","comparer","pourquoi"].includes(it.type) && it.question){
      items.push(Object.assign(b, {question:it.question, attendu:it.attendu || "",
        motsCles: Array.isArray(it.motsCles) && it.motsCles.length ? it.motsCles : motsCles(it.attendu || "", 6)}));
    } else if(it.type === "ordre" && Array.isArray(it.etapes) && it.etapes.length >= 3){
      items.push(Object.assign(b, {question: it.question || "Remets ces étapes dans l'ordre.", etapes:it.etapes}));
    }
  });
  return {fiche, items};
}

   8 bis. NOTES MANUSCRITES
   Les pages photographiées sont déchiffrées par Gemini, puis relues et
   corrigées par l'étudiante avant toute analyse. Le modèle transcrit,
   il ne complète pas : ce qu'il ne lit pas devient [?].

const PAGES_MAX = 8;

/* Pour la lecture, on garde plus de définition que pour l'affichage. */
function preparerPhoto(source){
  return new Promise((ok, ko) => {
    const im = new Image();
    im.onload = () => {
      const ech = Math.min(1, 2000 / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.width * ech));
      c.height = Math.max(1, Math.round(im.height * ech));
      const g = c.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(im, 0, 0, c.width, c.height);
      ok({data: c.toDataURL("image/jpeg", 0.86), w:c.width, h:c.height});
    };
    im.onerror = () => ko(new Error("Photo illisible."));
    im.src = source;
  });
}

"Tu transcris des pages de notes de cours manuscrites, prises par une étudiante française.",

async function transcrirePhotos(pages, cle, modele){

  if(txt.length < 40) throw new Error("La transcription est vide ou trop courte. Photos peut-être trop floues.");
  return txt;

/* Le balisage léger produit par la transcription est relu comme une mise en forme. */
function depuisMarkdown(texte){
  const blocs = [], forts = new Set();
  let re;
  const reFort = /\*\*([^*]{2,90})\*\*/g;
  while((re = reFort.exec(texte)) !== null) forts.add(re[1].trim());
  texte.replace(/\r/g,"").split("\n").forEach(l => {
    const t = l.trim();
    if(!t){ blocs.push({type:"vide", txt:"", fort:[]}); return; }
    const propres = [];
    let m2; const r2 = /\*\*([^*]{2,90})\*\*/g;
    while((m2 = r2.exec(t)) !== null) propres.push(m2[1].trim());
    const nu = t.replace(/\*\*/g, "").trim();
    if(/^#{1,4}\s+/.test(t)){ blocs.push({type:"titre", txt:nu.replace(/^#{1,4}\s+/,""), brut:t, fort:propres}); return; }
    const p = nu.match(RE_PUCE);
    if(p){ blocs.push({type:"puce", txt:p[1].trim(), brut:nu, fort:propres}); return; }
    blocs.push({type:"para", txt:nu, brut:nu, fort:propres});
  });
  return {blocs, forts:[...forts], images:[], tableaux:[],
    texte: blocs.map(b => b.txt).join("\n")};
}

async function scenariosGemini(fiche, ressId, cle, modele){
  const points = [
    "POINTS DE COURS RETENUS :",
    (fiche.notions || []).map((n,i) => (i+1) + ". " + n.terme + " : " + n.def).join("\n"),
    (fiche.parCoeur || []).length ? "\nÀ SAVOIR :\n" + fiche.parCoeur.map(x => "- " + x.txt).join("\n") : "",
    (fiche.pieges || []).length ? "\nERREURS CLASSIQUES :\n" + fiche.pieges.map(x => "- " + x.txt).join("\n") : "",
    (fiche.exemples || []).length ? "\nEXEMPLES :\n" + fiche.exemples.map(x => "- " + x.txt).join("\n") : ""
  ].filter(Boolean).join("\n");
  const d = await appelGemini(cle, modele, {
    systemInstruction:{parts:[{text:consigneOral(ressId)}]},
    contents:[{role:"user", parts:[{text:points}]}],
    generationConfig:{temperature:0.4, responseMimeType:"application/json", maxOutputTokens:6144}
  });
  const cand = (d.candidates || [])[0];
  if(!cand) throw new Error("Gemini n'a rien renvoyé.");
  const brut = ((cand.content && cand.content.parts) || []).map(p => p.text || "").join("");
  let o;
  try{ o = JSON.parse(brut.replace(/^```json\s*|```\s*$/g,"").trim()); }
  catch(e){ throw new Error("Les scénarios renvoyés n'étaient pas exploitables."); }
  return normaliserScenarios(o, ressId);
}

function normaliserScenarios(o, ressId){
  const tab = x => Array.isArray(x) ? x : [];
  return tab(o.scenarios).map(s => {
    if(!s || !s.titre) return null;
    const tours = tab(s.tours).filter(t => t && t.app).map(t => ({
      app: String(t.app), attente: String(t.attente || ""),
      secondes: Math.max(20, Math.min(180, Number(t.secondes) || 60))}));
    if(tours.length < 2) return null;
    const grille = tab(s.grille).filter(g => g && g.critere)
      .map(g => ({critere:String(g.critere), aide:String(g.aide || "")}));
    if(!grille.length) return null;
    return {id:uid(), ressId, titre:String(s.titre), contexte:String(s.contexte || ""),
      role:String(s.role || ""), objectif:String(s.objectif || ""),
      tours, grille, source:String(s.source || ""), cree:Date.now()};
  }).filter(Boolean);
}

const DELAIS = {1:0, 2:2, 3:7};
function banque(b){ return b === "prep" ? S.prepProgres : S.progres; }
function prog(id, b){
  const t = banque(b);
  if(!t[id]) t[id] = {boite:1, vus:0, ok:0, ko:0, dernier:0, prochain:0, erreurConfiante:false};
  return t[id];
}
/* Journal d'activité : un compteur par jour et par banque, pour le tableau de bord. */
function noterJournal(b, juste){
  const cle = b === "prep" ? "journalPrep" : "journal";
  if(!S[cle]) S[cle] = {};
  const j = new Date().toISOString().slice(0,10);
  if(!S[cle][j]) S[cle][j] = {n:0, ok:0};
  S[cle][j].n++;
  if(juste) S[cle][j].ok++;
}
function activite(b, jours){
  const cle = b === "prep" ? "journalPrep" : "journal";
  const t = S[cle] || {}, out = [];
  for(let i = jours - 1; i >= 0; i--){
    const d = new Date(Date.now() - i * JOUR).toISOString().slice(0,10);
    out.push(Object.assign({jour:d}, t[d] || {n:0, ok:0}));
  }
  return out;
}
function majProg(id, juste, sur, b){
  const p = prog(id, b);
  noterJournal(b, juste);
  p.vus++; p.dernier = Date.now();
  if(juste){ p.ok++; p.boite = Math.min(3, p.boite + 1); if(p.ok >= p.ko) p.erreurConfiante = false; }
  else{ p.ko++; p.boite = 1; if(sur === true) p.erreurConfiante = true; }
  p.prochain = Date.now() + DELAIS[p.boite] * JOUR;
  sauver();
}

/* =========================================================================
   9 bis. MOYENNES
   Calcul pur, à partir des coefficients de la maquette et des notes saisies.
   Ce n'est pas une simulation de jury : les règles de validation et de
   compensation du B.U.T. n'ont pas pu être vérifiées, donc rien n'en est dit.
   ========================================================================= */
function notesDe(ressId){ return (S.notes || []).filter(n => n.ressId === ressId); }
function moyenneRess(ressId){
  const l = notesDe(ressId);
  if(!l.length) return null;
  return l.reduce((s,n) => s + Number(n.valeur), 0) / l.length;
}
function moyenneUE(ue, semestre){
  let cN = 0, somme = 0, cRestant = 0, cTotal = 0;
  TOUTES().forEach(r => {
    if(!r.c[ue]) return;
    if(semestre && r.s !== semestre) return;
    cTotal += r.c[ue];
    const m = moyenneRess(r.id);
    if(m === null) cRestant += r.c[ue];
    else { cN += r.c[ue]; somme += r.c[ue] * m; }
  });
  return {moyenne: cN ? somme / cN : null, coefNote:cN, coefRestant:cRestant, coefTotal:cTotal,
    somme, part: cTotal ? Math.round(cN / cTotal * 100) : 0};
}
/* Quelle moyenne faut-il sur ce qui reste pour atteindre la cible ? */
function ilFaut(ue, semestre, cible){
  const m = moyenneUE(ue, semestre);
  if(!m.coefRestant) return null;
  return (cible * m.coefTotal - m.somme) / m.coefRestant;
}
function moyenneSemestre(semestre){
  const l = [1,2,3].map(u => moyenneUE(u, semestre)).filter(x => x.moyenne !== null);
  if(!l.length) return null;
  return l.reduce((s,x) => s + x.moyenne, 0) / l.length;
}

/* =========================================================================
   9 quater. BUDGET DE TEMPS
   Durées moyennes constatées, en secondes. Volontairement généreuses :
   mieux vaut finir en avance que d'être coupée en plein exercice.
   ========================================================================= */
const DUREES = {flash:20, vf:25, qcm:35, choix:45, qcmMulti:45, cloze:35, paires:75,
  ordre:60, classer:80, ouverte:120, comparer:120, pourquoi:120, situation:150,
  erreur:150, redaction:210};
function dureeDe(it){ return DUREES[it.type] || 40; }
/* Rentabilité : ce qui pèse lourd, qui est mal su, et qui tombe bientôt. */
function rentabilite(it){
  const r = RESSOURCE(it.ressId);
  const coef = r ? coefTotal(r) : 1;
  const p = S.progres[it.id];
  const faiblesse = !p ? 1 : (p.boite === 1 ? 1 : (p.boite === 2 ? 0.6 : 0.2));
  const confiante = p && p.erreurConfiante ? 1.4 : 1;
  const du = (!p || p.prochain <= Date.now()) ? 1.3 : 0.8;
  return coef * faiblesse * confiante * du;
}
function selonLeTemps(minutes, ressId){
  let l = tousItems();
  if(ressId) l = l.filter(i => i.ressId === ressId);
  l = l.slice().sort((a,b) => (rentabilite(b) / dureeDe(b)) - (rentabilite(a) / dureeDe(a)));
  const budget = minutes * 60;
  const out = [];
  let cumul = 0;
  for(const it of l){
    const d = dureeDe(it);
    if(cumul + d > budget) continue;
    out.push(it); cumul += d;
    if(cumul >= budget - 15) break;
  }
  return {liste: melanger(out), secondes: cumul};
}

const LANGUES = {

  B:{nom:"Langue B", precision:"espagnol à Carcassonne", ress:{1:"R1.12", 2:"R2.12"}}
};

function entreesLexique(langue, semestre){
  return (S.lexique || []).filter(e =>

function itemsLexique(){

  (S.lexique || []).forEach(e => {

      consigne:"Traduis en " + (LANGUES[e.langue] || LANGUES.A).nom.toLowerCase()}));
    out.push(Object.assign({}, base, {id:"lex:" + e.id + ":depuis", recto:e.etr, verso:e.fr,
      consigne:"Traduis en français"}));
  });
  return out;
}
/* Une liste collée : une entrée par ligne, séparateur =, :, — ou tabulation. */
function lireListeLexique(txt){
  const out = [], vus = new Set();
  String(txt || "").split("\n").forEach(l => {
    const t = l.trim();
    if(!t || t.length > 220) return;
    const m = t.match(/^(.{1,90}?)\s*(?:\t|=|:|\s—\s|\s–\s|\s-\s)\s*(.{1,90}?)\s*(?:\((.{2,90})\))?$/);
    if(!m) return;
    const fr = m[1].trim(), etr = m[2].trim();
    if(!fr || !etr || fr.length < 2 || etr.length < 2) return;
    const k = normaliser(fr) + "|" + normaliser(etr);
    if(vus.has(k)) return;
    vus.add(k);
    out.push({fr, etr, exemple: (m[3] || "").trim()});
  });
  return out;
}
function ajouterLexique(liste, langue, semestre){
  const ressId = ressLangue(langue, semestre);
  const deja = new Set(entreesLexique(langue, semestre).map(e => normaliser(e.fr) + "|" + normaliser(e.etr)));
  let n = 0;
  liste.forEach(x => {
    const k = normaliser(x.fr) + "|" + normaliser(x.etr);
    if(deja.has(k)) return;
    deja.add(k);
    S.lexique.push({id:uid(), langue, semestre, ressId, fr:x.fr, etr:x.etr,
      exemple:x.exemple || "", cree:Date.now()});
    n++;
  });
  if(n) sauver();
  return n;
}
function retirerLexique(id){
  S.lexique = (S.lexique || []).filter(e => e.id !== id);
  delete S.progres["lex:" + id + ":vers"];
  delete S.progres["lex:" + id + ":depuis"];
  sauver();
}
function etatEntree(e){
  const a = S.progres["lex:" + e.id + ":vers"], b = S.progres["lex:" + e.id + ":depuis"];
  const bo = x => x ? x.boite : 0;
  return {vers:bo(a), depuis:bo(b), su: bo(a) === 3 && bo(b) === 3};
}

    (mode === "muette" ? " nb" : "");

    '<span class="meta">' + (r ? esc("coef " + coefTotal(r) + " · " + (r.h ? r.h + " h" : "SAÉ")) : "") + "</span>" +
    '<span class="code">' + esc(c.ressId || "—") + "</span>" +
    "<h1>" + esc(c.titre) + "</h1>" +
    '<div class="ue">' + esc(COMP[ue].code + " " + COMP[ue].nom) + " · semestre " + (r ? r.s : "—") +
    (mode === "muette" ? " · à compléter" : "") + "</div></div>";

  if(f.resume && mode !== "compact" && mode !== "muette") h += '<section><div class="marge">En deux mots</div><div class="corps">' + esc(f.resume) + "</div></section>";

  RUBRIQUES.forEach(rb => {
    const l = (f[rb.k] || []).filter((_,i) => !estRetire(c, rb.k + i));
    const vis = visuelsDe(rb.k);
    if(!l.length && !vis) return;
    let corps = "";
    if(rb.k === "notions"){
      let n = 0;
      corps = (f[rb.k] || []).map((x,i) => {
        if(estRetire(c, "notions" + i)) return "";
        n++;
        const inc = x.incertain ? ' <span style="font-size:8pt;color:#8A8074">(à vérifier)</span>' : "";
        const corpsN = mode === "muette"
          ? '<span class="terme">' + esc(x.terme) + '</span><span class="muet"></span><span class="muet court"></span>'
          : '<span class="terme">' + esc(x.terme) + "</span> — " + esc(x.def) + inc;
        const niv = miseEnValeur(c, "notions" + i);
        const inner = (mode !== "muette" && niv === "surligne") ? "<mark>" + corpsN + "</mark>"
          : (mode !== "muette" && niv === "cadre") ? '<div class="cadre">' + corpsN + "</div>" : corpsN;
        return '<div class="n"><span class="num">' + String(n).padStart(2,"0") + '</span><span class="txt">' + inner + "</span></div>";
      }).join("");
    } else if(rb.k === "sigles"){
      corps = (f[rb.k] || []).map((x,i) => estRetire(c, "sigles" + i) ? "" :
        '<div><span class="terme">' + esc(x.sigle) + "</span>" +
        (mode === "muette" ? '<span class="muet court"></span>' : " — " + esc(x.sens)) + "</div>").join("");
    } else {
      corps = (f[rb.k] || []).map((x,i) => {
        const ref = rb.k + i;
        if(estRetire(c, ref)) return "";
        let txt = x.txt;
        if(mode === "muette"){
          /* on efface les valeurs chiffrées : c'est ce qu'il faut savoir restituer */
          txt = txt.replace(new RegExp("\\b\\d+(?:[.,]\\d+)?\\s?(?:" + UNITES + ")?", "g"), "……");
        }
        let inner = esc(txt);
        if(rb.ex) inner = '<span class="ex">' + inner + "</span>";
        if(rb.alerte) return '<div class="alerte">' + inner + "</div>";
        return mode === "muette" ? "<div>" + inner + "</div>" : ligneImp(c, ref, inner);
      }).join("");
      if(rb.cadre && corps) corps = '<div class="cadre ' + rb.cadre + '">' + corps + "</div>";
    }
    h += section(rb.t, corps + vis);
  });

  const libres = visuelsDe("");
  if(libres) h += section("Schémas", libres);

  if((f.ajouts || []).length && mode !== "muette"){
    const corps = f.ajouts.map((a,i) => estRetire(c, "ajouts" + i) ? "" :
      '<div class="ajout"><span class="lab">Hors cours · à vérifier avec ta prof</span>' +

    h += section("Compléments", corps);
  }

  if(mode !== "compact"){
    h += section(mode === "muette" ? "À revoir" : "Mes questions",
      '<div class="lignes"><div></div><div></div><div></div><div></div></div>');

    esc("importé le " + dateFr(c.date)) + "</span></div></div>";
  $("#impression").innerHTML = h;
  window.print();
}

function imprimerErreurs(){
  const l = carnetErreurs();
  if(!l.length) return;
  const parR = {};
  l.forEach(i => (parR[i.ressId] = parR[i.ressId] || []).push(i));
  let h = '<div class="f"><div class="bandeau"></div><div class="tete"><span class="meta">' +
    l.length + " exercice" + (l.length>1?"s":"") + "</span>" +
    '<span class="code">CARNET D\'ERREURS</span><h1>Ce que je rate encore</h1></div>';
  Object.keys(parR).forEach(id => {
    const r = RESSOURCE(id);
    const corps = parR[id].map(i => {
      let rep = "";
      if(i.type === "flash") rep = i.verso;
      else if(i.type === "qcm") rep = i.options[i.reponse];
      else if(i.type === "qcmMulti") rep = (i.reponses||[]).map(n => i.options[n]).join(" ; ");
      else if(i.type === "vf") rep = i.reponse ? "Vrai" : "Faux";
      else if(i.type === "cloze") rep = i.reponse;
      else if(i.type === "ordre") rep = i.etapes.join(" → ");
      else if(i.type === "paires") rep = i.paires.map(p => p[0] + " → " + p[1]).join(" ; ");
      else rep = i.attendu || (i.motsCles || []).join(", ");
      return '<div class="n"><span class="num">·</span><span class="txt"><span class="terme">' +
        esc(i.question || i.recto || "") + "</span><br>" + esc(tronquer(rep, 240)) + "</span></div>";
    }).join("");
    h += section(r ? r.id : id, corps);
  });
  $("#impression").innerHTML = h + '<div class="pied"><span>Carnet d\'erreurs</span><span>' +
    esc(dateFr(new Date().toISOString())) + "</span></div></div>";
  window.print();
}

   11. LECTURE AUDIO ET FICHIERS
   ========================================================================= */
function lire(texte){
  if(!window.speechSynthesis){ ui.message = {titre:"Lecture indisponible", txt:"Ce navigateur ne propose pas de synthèse vocale."}; rendre(); return; }
  speechSynthesis.cancel();
  const m = new SpeechSynthesisUtterance(texte);
  m.lang = "fr-FR"; m.rate = Number(S.reglages.debitVoix) || 1;
  const v = speechSynthesis.getVoices().find(x => x.name === S.reglages.voix);
  if(v) m.voice = v;
  speechSynthesis.speak(m);
}
function texteFiche(c){
  const f = c.fiche;
  return [c.titre, f.resume,
    (f.notions||[]).map(d => d.terme + " : " + d.def).join(". "),
    (f.parCoeur||[]).map(p => p.txt).join(". ")].filter(Boolean).join(". ");
}
function scriptExterne(src){
  return new Promise((ok, ko) => {
    if(document.querySelector('script[src="' + src + '"]')) return ok();
    const s = document.createElement("script");
    s.src = src; s.onload = () => ok();
    s.onerror = () => ko(new Error("Chargement impossible : une connexion est nécessaire pour lire ce format."));
    document.head.appendChild(s);
  });
}
async function lireFichier(f){
  const nom = f.name.toLowerCase();
  if(/\.(txt|md|csv)$/.test(nom)){ const t = await f.text(); return {texte:t, blocs:decouper(t), forts:[], images:[], tableaux:[]}; }
  if(/\.docx$/.test(nom)){
    await scriptExterne("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    const buf = await f.arrayBuffer();
    const opts = {convertImage: window.mammoth.images.imgElement(async img => {
      const b64 = await img.read("base64");
      return {src: "data:" + (img.contentType || "image/png") + ";base64," + b64};
    })};
    const r = await window.mammoth.convertToHtml({arrayBuffer: buf}, opts);
    return depuisHtml(r.value || "");
  }
  if(/\.pdf$/.test(nom)){
    await chargerPdfJs();
    const buf = await f.arrayBuffer();
    ui.pdfBuf = buf.slice(0);
    const doc = await window.pdfjsLib.getDocument({data: buf}).promise;
    let t = "";
    for(let p = 1; p <= doc.numPages; p++){
      const page = await doc.getPage(p);
      const c = await page.getTextContent();
      t += c.items.map(i => i.str).join(" ") + "\n\n";
    }
    return {texte:t, blocs:decouper(t), forts:[], images:[], tableaux:[], pdfPages: doc.numPages};
  }
  throw new Error("Format non pris en charge.");
}
async function chargerPdfJs(){
  await scriptExterne("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

/* =========================================================================
   11 bis. ENREGISTREMENT
   Les prises restent en mémoire le temps de la séance : elles ne sont ni
   enregistrées sur l'appareil, ni envoyées nulle part. Si le micro est
   refusé ou indisponible, la séance continue au chronomètre seul.
   ========================================================================= */
let micro = null, enregistreur = null, morceaux = [];
function microDispo(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
async function ouvrirMicro(){
  if(!microDispo()) return false;
  if(micro) return true;
  try{ micro = await navigator.mediaDevices.getUserMedia({audio:true}); return true; }
  catch(e){ micro = null; return false; }
}
function fermerMicro(){
  try{ if(micro) micro.getTracks().forEach(t => t.stop()); }catch(e){}
  micro = null; enregistreur = null; morceaux = [];
}
function demarrerPrise(){
  if(!micro || !window.MediaRecorder) return false;
  try{
    morceaux = [];
    enregistreur = new MediaRecorder(micro);
    enregistreur.ondataavailable = e => { if(e.data && e.data.size) morceaux.push(e.data); };
    enregistreur.start();
    return true;
  }catch(e){ enregistreur = null; return false; }
}
function arreterPrise(){
  return new Promise(ok => {
    if(!enregistreur || enregistreur.state === "inactive"){ ok(null); return; }
    enregistreur.onstop = () => {
      try{
        const b = new Blob(morceaux, {type: (morceaux[0] && morceaux[0].type) || "audio/webm"});
        ok(b.size ? URL.createObjectURL(b) : null);
      }catch(e){ ok(null); }
      enregistreur = null; morceaux = [];
    };
    try{ enregistreur.stop(); }catch(e){ enregistreur = null; ok(null); }
  });
}
function direReplique(t, apres){
  if(!window.speechSynthesis){ if(apres) apres(); return; }
  speechSynthesis.cancel();
  const m = new SpeechSynthesisUtterance(t);
  m.lang = "fr-FR"; m.rate = Number(S.reglages.debitVoix) || 1;
  const v = speechSynthesis.getVoices().find(x => x.name === S.reglages.voix);
  if(v) m.voice = v;
  m.onend = () => { if(apres) apres(); };
  m.onerror = () => { if(apres) apres(); };
  speechSynthesis.speak(m);
}

   "Création et production des messages et des supports",
   "Diffusion de la campagne",
   "Analyse des indicateurs après campagne : impact, efficacité"],
  note:"Le dernier apprentissage critique visé au niveau 1 est justement d’analyser les indicateurs post campagne. La communication ne s’arrête pas à la diffusion."},

 {t:"notion", kick:"Attention au mot", titre:"Cible de communication n’est pas cible marketing",
  paras:["La cible marketing, ce sont les gens à qui l’on veut vendre. La cible de communication, ce sont les gens à qui l’on veut parler. Les deux se recoupent souvent, mais pas toujours.",
   "Une marque de jouets vend aux parents, qui paient, et parle aux enfants, qui réclament. Une marque de médicaments sans ordonnance parle parfois au pharmacien plutôt qu’au patient. Distinguer les deux est un réflexe qu’on attend de toi."],
  encart:{type:"piege", titre:"Formulation variable", texte:"Selon les manuels et les enseignants, tu rencontreras cœur de cible, cible principale, cible secondaire, relais d’opinion, prescripteurs. Les découpages diffèrent d’un cours à l’autre : retiens celui de ton prof, c’est celui qui sera évalué."}},

 {t:"notion", kick:"La carte du terrain", titre:"Médias, hors médias, médias sociaux",
  paras:["Le programme national demande d’analyser les moyens de communication commerciale en distinguant trois familles : les médias, le hors médias et les médias sociaux.",
   "Les médias correspondent à l’achat d’espace publicitaire. Le hors médias regroupe tout le reste : promotion des ventes, marketing direct, relations publiques, événementiel, imprimés sans adresse. Les médias sociaux, longtemps rangés dans l’un ou l’autre, sont aujourd’hui traités à part."],
  encart:{type:"info", titre:"Ce que tu feras en semestre 2", texte:"Cette carte sera dépliée en détail dans la ressource R2.01, Moyens de la communication commerciale. Ici, on pose le vocabulaire."}},

 {t:"notion", kick:"Le cadre légal", titre:"Le principe : pas de pratique déloyale",
  paras:["L’article L. 121-1 du code de la consommation pose l’interdiction générale : les pratiques commerciales déloyales sont interdites. Une pratique est déloyale lorsqu’elle est contraire aux exigences de la diligence professionnelle et qu’elle altère, ou est susceptible d’altérer de manière substantielle, le comportement économique du consommateur.",
   "Le texte précise que le caractère déloyal d’une pratique visant un groupe vulnérable — en raison d’une infirmité, de l’âge ou de la crédulité — s’apprécie au regard de la capacité moyenne de discernement de ce groupe."],
  encart:{type:"info", titre:"Deux branches", texte:"Le même article renvoie aux deux grandes catégories de pratiques déloyales : les pratiques trompeuses, aux articles L. 121-2 à L. 121-4, et les pratiques agressives, aux articles L. 121-6 et L. 121-7."}},

 {t:"notion", kick:"Le cadre légal", titre:"Tromper en disant, tromper en taisant",
  paras:["L’article L. 121-2 vise la tromperie par action : créer une confusion avec un signe distinctif d’un concurrent, ou reposer sur des allégations fausses ou de nature à induire en erreur portant sur l’existence, la disponibilité, la nature ou les caractéristiques essentielles du bien ou du service. Est aussi trompeuse la pratique dont la personne pour le compte de laquelle elle est mise en œuvre n’est pas clairement identifiable.",
   "L’article L. 121-3 vise la tromperie par omission : omettre, dissimuler, ou fournir de façon inintelligible, ambiguë ou à contretemps une information substantielle. Dans une invitation à l’achat mentionnant le prix, sont substantielles notamment les caractéristiques principales du bien, l’identité du professionnel, le prix toutes taxes comprises et les frais de livraison, et l’existence d’un droit de rétractation lorsque la loi le prévoit."],
  encart:{type:"piege", titre:"Le piège d’examen", texte:"Ne pas mentir ne suffit pas. Une publicité parfaitement exacte peut être trompeuse si elle tait une information substantielle. C’est exactement la distinction entre L. 121-2 et L. 121-3."}},

 {t:"quiz", kick:"Vérification", question:"Une annonce indique un prix attractif, mais les frais de livraison obligatoires n’apparaissent nulle part. Tout ce qui est écrit est exact. Que dit le code de la consommation ?",
  options:["Rien : aucune information n’est fausse",
   "C’est une pratique trompeuse par omission, car le prix toutes taxes comprises et les frais de livraison sont des informations substantielles",
   "C’est une pratique agressive"],
  bonne:1,
  expl:"L’article L. 121-3 range parmi les informations substantielles, dans une invitation à l’achat mentionnant le prix, le prix toutes taxes comprises et les frais de livraison à la charge du consommateur. Les taire rend la pratique trompeuse, même sans le moindre mensonge."},

 {t:"notion", kick:"L’autre régulation", titre:"L’ARPP, ou la profession qui se discipline elle-même",
  paras:["À côté de la loi, il existe en France une autorégulation publicitaire. L’Autorité de régulation professionnelle de la publicité est une association interprofessionnelle privée, régie par la loi de 1901, administrée par les représentants des professions publicitaires : annonceurs, agences, médias, régies et supports.",
   "Sa mission est de mener toute action en faveur d’une publicité loyale, véridique et saine, dans l’intérêt des consommateurs, du public et des professionnels. Elle assure un contrôle avant diffusion des publicités audiovisuelles, délivre des conseils sur tous les médias, et élabore des règles déontologiques appelées Recommandations."],
  encart:{type:"info", titre:"Droit dur, droit souple", texte:"L’ARPP décrit son action comme relevant du droit souple : ses règles ne remplacent pas la loi, elles la complètent et l’explicitent. Les professionnels se les donnent volontairement, au-delà des contraintes légales."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les trois instances associées", mots:[
  {m:"CEP", d:"Conseil de l’éthique publicitaire, créé en 2005. Instance de réflexion, il éclaire le conseil d’administration de l’ARPP sur les problèmes de fond, notamment éthiques."},
  {m:"CPP", d:"Conseil paritaire de la publicité. Instance de concertation, il est consulté lors de l’élaboration des Recommandations."},
  {m:"JDP", d:"Jury de déontologie publicitaire. Instance de contrôle, il traite les plaintes de toute personne physique ou morale et se prononce publiquement sur la conformité des campagnes."}],
  note:"Le CPP et le JDP ont été créés en 2008, année où l’organisme a pris le nom d’ARPP."},

 {t:"chiffres", kick:"À mémoriser", titre:"Les repères de l’autorégulation", lignes:[
  {v:"1935", l:"création, sous le nom d’Office de contrôle des annonces"},
  {v:"1953", l:"l’organisme devient Bureau de vérification de la publicité"},
  {v:"2008", l:"il prend le nom d’ARPP et se dote du CPP et du JDP"},
  {v:"28", l:"Recommandations après la refonte du Code de l’ARPP"}],
  note:"Le Code de l’ARPP a été relu et actualisé au cours des années 2015 et 2016, puis simplifié en 28 Recommandations."},

 {t:"encart", kick:"Attention, ça a changé", titre:"Les influenceurs sont désormais encadrés par la loi", type:"garde",
  texte:"Beaucoup de supports antérieurs à 2023 présentent l’influence commerciale comme une zone grise. Ce n’est plus le cas. La loi n° 2023-451 du 9 juin 2023 définit l’activité d’influence commerciale et impose, en son article 5, que toute promotion soit explicitement indiquée par la mention « Publicité » ou « Collaboration commerciale », claire, lisible et identifiable, pendant l’intégralité de la promotion. Le texte précise que l’absence d’indication de la véritable intention commerciale constitue une pratique commerciale trompeuse par omission au sens de l’article L. 121-3 du code de la consommation, et prévoit deux ans d’emprisonnement et 300 000 euros d’amende."},

 {t:"notion", kick:"La création", titre:"Le message : le fond et la forme",
  paras:["Le programme national demande de maîtriser les bases du message publicitaire, en distinguant le fond et la forme. Le fond, c’est ce qu’on dit : la promesse, l’argument, la preuve. La forme, c’est comment on le dit : couleurs, formes, contrastes, et surtout cohérence.",
   "Ce mot de cohérence revient partout. Cohérence entre le message et le brief, entre la forme et la cible, entre la campagne et le reste du mix. C’est le critère d’évaluation le plus fréquent des travaux qu’on te demandera."],
  encart:{type:"astuce", titre:"Ce que ton prof regardera", texte:"Sur un support que tu produis, une faute de cohérence coûte plus cher qu’une maladresse graphique. Une belle affiche qui parle à la mauvaise cible est une mauvaise affiche."}},

 {t:"notion", kick:"La production", titre:"Les outils imprimés que tu vas fabriquer",
  paras:["La ressource se termine sur des outils simples de communication imprimée : affiches, encarts presse, flyers, plaquettes. Le programme mentionne aussi l’imprimé sans adresse, souvent abrégé ISA, ce prospectus distribué en boîte aux lettres sans nom de destinataire.",
   "Tu ne feras pas que les analyser : l’apprentissage critique 3.3 attendu au niveau 1 est d’élaborer des supports simples. On te demandera d’en produire."],
  encart:{type:"info", titre:"Deux matières en renfort", texte:"Le traitement d’image se travaille en R1.02, Ressources et culture numériques. Le droit à l’image et le droit d’auteur se travaillent en R1.03, Environnement juridique. Ces trois matières se rejoignent dans la même SAÉ."}},

 {t:"notion", kick:"La mesure", titre:"Notoriété et image, deux choses différentes",
  paras:["Le programme demande de connaître les indicateurs de notoriété et d’image. La notoriété mesure si l’on te connaît : combien de personnes citent la marque, spontanément ou après qu’on la leur a montrée. L’image mesure ce qu’on pense de toi : quelles qualités, quelles valeurs, quelles associations d’idées.",
   "Une marque peut avoir une notoriété très forte et une image détestable. Les deux se mesurent séparément, et l’une ne dit rien de l’autre."],
  encart:{type:"piege", titre:"L’erreur classique", texte:"Confondre les deux dans une copie coûte cher, parce que c’est précisément la distinction que la question cherche à tester."}},

 {t:"quiz", kick:"Vérification", question:"Une agence conçoit une campagne. Qui a payé et pour le compte de qui le message est-il diffusé ?",
  options:["L’agence, qui se fait ensuite rembourser par le support",
   "L’annonceur, qui est le donneur d’ordre",
   "La régie, qui achète l’espace et le revend"],
  bonne:1,
  expl:"L’annonceur est l’organisation pour le compte de laquelle le message est diffusé : c’est lui qui commande et qui paie. L’agence conçoit, la régie commercialise les espaces d’un support. Ces trois rôles sont distincts et le programme national demande de les connaître."},

 {t:"notion", kick:"Ce qui t’attend", titre:"La SAÉ de communication du semestre 1",
  paras:["Cette ressource alimente une situation d’apprentissage précise : la création d’un support imprimé. Le programme national la décrit comme l’analyse des outils imprimés des concurrents d’un secteur, puis l’élaboration d’un support destiné à une cible de consommateurs, en cohérence avec la stratégie de communication et le mix de l’organisation.",
   "Sur la maquette de Carcassonne, cette SAÉ porte le numéro 1.1 et pèse 5 de coefficient dans l’UE Communiquer. Le programme national, lui, la numérote 1.03. Les deux codes désignent le même travail."],
  encart:{type:"astuce", titre:"Anticipe", texte:"Les exemples donnés par le programme national sont la plaquette d’entreprise, le concours d’affiches et l’étude d’une campagne. Commence à collecter les affiches et les flyers qui te tombent sous la main : tu auras une matière première."}},

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",
  etapes:["Quels indicateurs de notoriété et d’image exactement seront exigibles, et sous quelle formulation",
   "Quel découpage des cibles est retenu dans le cours — cœur de cible, cible principale, relais — car il varie d’un enseignant à l’autre",
