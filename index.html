<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prépa BUT TC — Préparation et révision</title>
<meta name="description" content="Préparez votre BUT Techniques de commercialisation, révisez vos cours et suivez votre progression.">
<meta property="og:title" content="Prépa BUT TC — Préparation et révision">
<meta property="og:description" content="Cours, fiches, quiz et outils de révision pour le BUT Techniques de commercialisation.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>

:root{
  /* Signalétique de rayon : fond froid, encre bleu nuit, trois couleurs de compétence
     qui servent de code couleur dans toute l'application. */
  --fond:#F3F4FB; --carte:#FFFFFF; --encre:#16173A; --encre2:#585B85; --encre3:#9497BC;
  --trait:#E0E2F2; --trait2:#EDEEF8;
  --terre:#3A2BE0; --terre-fonce:#2A1DB0; --terre-pale:#E9E7FE;
  --c1:#2F6BFF; --c1p:#E4EDFF; --c2:#00A37A; --c2p:#DFF6EF; --c3:#FF3D71; --c3p:#FFE6EC;
  --or:#F2A007; --or-pale:#FFF3DB; --or-fonce:#B26F00;
  --rouge:#F03E52; --rouge-pale:#FFE7EA;
  --ombre:0 1px 2px rgba(22,23,58,.05), 0 8px 22px rgba(58,43,224,.08);
  --ombre2:0 2px 4px rgba(22,23,58,.06), 0 16px 34px rgba(58,43,224,.12);
  --r:22px; --r2:14px; --r3:10px; --hautNav:70px;
}
/* ---- thème sombre : mêmes rôles, valeurs de nuit ---- */
body.sombre{
  --fond:#0E0F22; --carte:#191A35; --encre:#ECEDFB; --encre2:#A9ABD0; --encre3:#7577A1;
  --trait:#2A2C4E; --trait2:#222442;
  --terre:#6C5FFF; --terre-fonce:#B0A8FF; --terre-pale:#25224F;
  --c1:#5B8CFF; --c1p:#1A2648; --c2:#22C497; --c2p:#12332B; --c3:#FF6B91; --c3p:#3A1C29;
  --or:#F2A007; --or-pale:#33280F; --or-fonce:#F0B84A;
  --rouge:#FF6474; --rouge-pale:#3A1D25;
  --ombre:0 1px 2px rgba(0,0,0,.30), 0 8px 22px rgba(0,0,0,.34);
  --ombre2:0 2px 4px rgba(0,0,0,.34), 0 16px 34px rgba(0,0,0,.40);
  background-image:radial-gradient(120% 55% at 50% -10%, #1D1C4A 0%, transparent 62%);
}
body.sombre .nav{background:rgba(25,26,53,.92)}
body.sombre input,body.sombre select,body.sombre textarea{background:var(--carte);color:var(--encre);border-color:var(--trait)}
body.sombre .vign img{background:#fff}
body.sombre .puce.bon{color:var(--c2)}
@media print{ body.sombre{background:#fff;color:#000} }

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Outfit',system-ui,-apple-system,sans-serif;background:var(--fond);color:var(--encre);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  background-image:radial-gradient(120% 55% at 50% -10%, #E7E9FA 0%, transparent 62%);
  background-attachment:fixed}
h1{letter-spacing:-.035em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.15;letter-spacing:-.025em;font-weight:700}
:focus-visible{outline:2px solid var(--terre);outline-offset:2px;border-radius:6px}

.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--hautNav) + env(safe-area-inset-bottom));position:relative}
.ecran{padding:18px 16px 20px}
.enTete{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.enTete h1{font-size:30px}
.sousTitre{color:var(--encre2);font-size:14.5px;margin-bottom:18px;max-width:44ch}
.jour{background:var(--terre);border-radius:999px;padding:6px 13px;
  font-size:12px;font-weight:600;color:#fff;box-shadow:0 3px 12px rgba(58,43,224,.3);
  white-space:nowrap;flex:none;letter-spacing:.01em}
.iconeBtn{width:40px;height:40px;border-radius:13px;background:var(--carte);box-shadow:var(--ombre);
  display:grid;place-items:center;font-size:17px;flex:none;color:var(--encre2)}

.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);
  border-top:1px solid var(--trait);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:520px;margin:0 auto;display:flex;width:100%;padding:7px 10px 9px;gap:8px}
.nav button{flex:1;padding:8px 0 9px;font-size:12px;font-weight:600;color:var(--encre3);
  display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:15px;
  transition:background .2s, color .2s}
.nav button.act{color:var(--terre);background:var(--terre-pale)}
.nav .ic{font-size:19px;line-height:1}

.bloc{background:var(--carte);border-radius:var(--r);padding:15px 16px;margin-bottom:11px;box-shadow:var(--ombre)}
.bloc-t{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.point{width:10px;height:10px;border-radius:3px;flex:none}
.bloc-nom{font-size:14px;font-weight:600;min-width:0}
.bloc-meta{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--encre3);flex:none;
  font-variant-numeric:tabular-nums}

.cta{display:block;width:100%;background:var(--terre);color:#fff;border-radius:16px;padding:16px;
  text-align:center;font-weight:600;font-size:16px;letter-spacing:-.01em;
  box-shadow:0 6px 18px rgba(58,43,224,.32);margin-top:8px;transition:box-shadow .2s, transform .12s}
.cta:active{transform:translateY(2px);box-shadow:0 2px 8px rgba(58,43,224,.28)}
.cta.sec{background:var(--carte);color:var(--encre);box-shadow:var(--ombre)}
.cta[disabled]{opacity:.4;box-shadow:none}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--carte);border-radius:12px;padding:9px 14px;
  font-size:14px;font-weight:600;box-shadow:var(--ombre);color:var(--encre2)}
.btn.plein{background:var(--terre);color:#fff;box-shadow:0 4px 12px rgba(58,43,224,.28)}
.btn.mini{padding:6px 11px;font-size:13px;font-weight:500}
.btn[disabled]{opacity:.45}
.rang{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}

.jauge{height:9px;background:var(--trait2);border-radius:5px;overflow:hidden}
.jauge i{display:block;height:100%;border-radius:5px;transition:width .6s cubic-bezier(.22,.9,.3,1);
  background:linear-gradient(90deg, var(--terre) 0%, #8B4BEF 100%)}
.progLigne{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.progLigne .jauge{flex:1}
.progLigne span{font-size:12.5px;font-weight:600;color:var(--encre2);flex:none;font-variant-numeric:tabular-nums}

.lecon{min-height:100vh;display:flex;flex-direction:column;padding:14px 16px calc(var(--hautNav) + 14px);
  position:relative}
.lecon::before{content:"";position:absolute;inset:0 0 auto;height:190px;z-index:-1;
  background:radial-gradient(115% 100% at 50% 0%, var(--teinte, transparent) 0%, transparent 72%)}
.lecon.memo{--teinte:#2F6BFF26} .lecon.comp{--teinte:#FF3D7126} .lecon.lect{--teinte:#8B4BEF26}
.lecon-haut{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pts{display:flex;gap:3px;flex:1}
.pts span{height:5px;flex:1;border-radius:3px;background:var(--trait);transition:background .3s}
.pts span.f{background:var(--terre)}
.fermer{font-size:20px;color:var(--encre3);line-height:1;width:32px;height:32px;border-radius:10px;
  background:var(--carte);box-shadow:var(--ombre);display:grid;place-items:center;flex:none}
.diapo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 0 18px;animation:entre .28s ease}
/* Les animations définies plus bas étaient déclarées sans jamais servir : on les applique.
   Toutes portent sur transform et opacity, donc fluides sur téléphone, et la règle
   prefers-reduced-motion plus bas les neutralise si le système le demande. */
.carteAct,.bloc,.outil,.ligneUE{animation:surgit .3s cubic-bezier(.2,.8,.3,1) both}
.ecran .carteAct:nth-of-type(2),.ecran .bloc:nth-of-type(2),.ecran .outil:nth-of-type(2){animation-delay:.04s}
.ecran .carteAct:nth-of-type(3),.ecran .bloc:nth-of-type(3),.ecran .outil:nth-of-type(3){animation-delay:.08s}
.ecran .carteAct:nth-of-type(4),.ecran .bloc:nth-of-type(4),.ecran .outil:nth-of-type(4){animation-delay:.12s}
.ecran .carteAct:nth-of-type(5),.ecran .bloc:nth-of-type(5),.ecran .outil:nth-of-type(5){animation-delay:.16s}
.grandAnneau{animation:entre .35s cubic-bezier(.2,.8,.3,1) both}
.diapo{animation:entre .28s cubic-bezier(.2,.8,.3,1) both}
.verdict.ok{animation:pulseOk .34s cubic-bezier(.3,1.2,.4,1)}
.verdict.ko{animation:secoue .34s ease-in-out}
.opt.juste{animation:pulseOk .3s cubic-bezier(.3,1.2,.4,1)}
.jauge i{transition:width .6s cubic-bezier(.2,.8,.3,1)}
.activite .j i{transform-origin:bottom;animation:monte .45s cubic-bezier(.2,.9,.3,1) both}
.pts span.f{animation:pulseOk .3s cubic-bezier(.3,1.2,.4,1)}
.puce,.btn,.opt,.carteAct,.outil{transition:transform .12s ease, background .15s ease}
.puce:active,.btn:active,.outil:active{transform:scale(.95)}
.attente{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-2px;
  border:2px solid var(--trait2);border-top-color:var(--c2);animation:tourne .7s linear infinite}
.coche path{stroke-dasharray:22;stroke-dashoffset:22;animation:traceCoche .4s ease-out .1s forwards}

@keyframes entre{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kick{font-size:13px;font-weight:700;letter-spacing:-.01em;color:var(--encre);margin-bottom:10px;
  display:flex;align-items:center;gap:8px}
.kick::after{content:"";flex:1;height:1px;background:var(--trait)}
.diapo h2{font-size:27px;margin-bottom:14px;letter-spacing:-.035em}
.diapo h3{font-size:21px;margin-bottom:12px;letter-spacing:-.03em}
.diapo p{font-size:15.5px;line-height:1.6;color:#3A3C63;margin-bottom:12px}
.diapo p strong{font-weight:600;color:var(--encre)}
.encart{border-radius:16px;padding:14px 16px;margin-top:8px;font-size:14.5px;line-height:1.5}
.encart b.et{display:block;font-size:12px;letter-spacing:-.01em;margin-bottom:5px;font-weight:700}
.encart.astuce{background:var(--or-pale)} .encart.astuce b.et{color:var(--or-fonce)}
.encart.piege{background:var(--rouge-pale)} .encart.piege b.et{color:var(--rouge)}
.encart.garde{background:var(--c1p)} .encart.garde b.et{color:var(--c1)}
.encart.info{background:var(--terre-pale)} .encart.info b.et{color:var(--terre-fonce)}
.vocab{list-style:none}
.vocab li{background:var(--carte);border-radius:15px;padding:13px 15px;margin-bottom:9px;font-size:14.5px;
  box-shadow:var(--ombre);line-height:1.45}
.vocab b{display:block;font-size:14px;margin-bottom:2px}
.vocab span{color:var(--encre2)}
.etapes{list-style:none;counter-reset:e}
.etapes li{counter-increment:e;display:flex;gap:11px;align-items:flex-start;margin-bottom:9px;font-size:14.5px;line-height:1.4}
.etapes li::before{content:counter(e);flex:none;width:26px;height:26px;border-radius:9px;background:var(--terre);
  color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.chiffres{list-style:none}
.chiffres li{display:flex;gap:11px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--trait);font-size:14.5px}
.chiffres li:last-child{border:none}
.chiffres b{font-size:19px;font-weight:700;color:var(--terre);flex:none;min-width:72px;letter-spacing:-.03em}
.sources{list-style:none;font-size:13px}
.sources li{padding:9px 0;border-bottom:1px solid var(--trait);color:var(--encre2);line-height:1.4}
.sources li:last-child{border:none}
.sources b{display:block;color:var(--encre);font-size:13.5px;font-weight:600}
.sources a{color:var(--terre);word-break:break-all;font-size:12px;text-decoration:none;font-weight:500}

.opt{display:block;width:100%;text-align:left;background:var(--carte);border:2px solid var(--trait);
  border-radius:16px;padding:14px 15px;margin-bottom:10px;font-size:15px;line-height:1.4;box-shadow:var(--ombre)}
.opt.pris{border-color:var(--terre);background:var(--terre-pale)}
.opt.juste{border-color:var(--c2);background:var(--c2p)}
.opt.faux{border-color:var(--rouge);background:var(--rouge-pale)}
.verdict{border-radius:18px;padding:15px 16px;margin:14px 0;font-size:14.5px;line-height:1.5;overflow:hidden}
.verdict.ok{background:var(--c2p);color:#08543F} .verdict.ko{background:var(--rouge-pale);color:#8E1626}
.verdict b{display:block;margin-bottom:3px;font-size:16px;letter-spacing:-.015em}
.champ{display:block;font-size:13px;font-weight:600;color:var(--encre2);margin:0 0 6px}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{
  width:100%;padding:12px 13px;border:1.5px solid var(--trait);border-radius:var(--r2);background:var(--carte)}
textarea{min-height:150px;resize:vertical;line-height:1.5}
.duo{display:grid;gap:11px;grid-template-columns:1fr 1fr}
.puce{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;background:var(--carte);
  font-size:12.5px;font-weight:600;box-shadow:var(--ombre);color:var(--encre2);transition:background .18s, color .18s}
.puce.on{background:var(--terre);color:#fff;box-shadow:0 4px 12px rgba(58,43,224,.26)}
.puce.mono{font-size:11.5px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.liste-puces{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.avis{border-radius:var(--r2);padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.5;background:var(--or-pale)}
.avis.info{background:var(--terre-pale)} .avis.err{background:var(--rouge-pale)}
.avis b{display:block;margin-bottom:3px}
.vide{text-align:center;padding:38px 16px;color:var(--encre2)}
.vide .em{font-size:34px;margin-bottom:10px}
.vide h3{font-size:17px;margin-bottom:6px;color:var(--encre)}
.carteAct{display:flex;align-items:center;gap:13px;background:var(--carte);border-radius:var(--r);padding:15px 16px;
  margin-bottom:10px;box-shadow:var(--ombre);width:100%;text-align:left;transition:box-shadow .2s, transform .12s}
.carteAct:active{transform:scale(.985);box-shadow:var(--ombre2)}
.carteAct .ic{width:44px;height:44px;border-radius:14px;background:var(--terre-pale);color:var(--terre);
  display:grid;place-items:center;font-size:19px;flex:none}
.carteAct .tx{flex:1;min-width:0}
.carteAct .tx b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.015em}
.carteAct .tx small{font-size:12.5px;color:var(--encre2)}
.carteAct .fl{color:var(--encre3);font-size:18px}
.tableau{width:100%;border-collapse:collapse;font-size:14px}
.tableau th,.tableau td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--trait)}
.tableau th{font-size:12px;color:var(--encre3);font-weight:600;letter-spacing:-.005em}
.tableau td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.chrono{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:var(--terre);
  background:var(--terre-pale);padding:4px 9px;border-radius:8px}
.src{font-size:11.5px;color:var(--encre3);border-bottom:1px dotted var(--trait);font-variant-numeric:tabular-nums}
.srcTxt{display:none;font-size:13.5px;color:var(--encre2);background:var(--trait2);padding:10px 12px;
  border-radius:10px;margin:8px 0;font-style:italic;line-height:1.45}
.srcTxt.ouvert{display:block}
.semaine{border-left:2px solid var(--trait);padding:0 0 15px 14px;position:relative}
.semaine::before{content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--terre)}
.semaine .quand{font-size:12px;color:var(--terre);font-weight:600}

.depli{background:var(--carte);border-radius:var(--r2);margin-bottom:8px;box-shadow:var(--ombre);overflow:hidden}
.depli>summary{padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;list-style:none;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.depli>summary::-webkit-details-marker{display:none}
.depli>summary::after{content:"›";color:var(--encre3);font-size:17px;transform:rotate(90deg)}
.depli[open]>summary::after{transform:rotate(-90deg)}
.depli .corps{padding:0 14px 12px;font-size:13.5px;color:var(--encre2);line-height:1.5}
.depli .corps li{margin:0 0 7px 16px}

/* ---- reformulations ---- */
.reform{background:var(--terre-pale);border-radius:11px;padding:9px 11px;margin-top:8px;
  font-size:13.5px;line-height:1.45;color:var(--encre)}
.reform .et{display:block;font-size:11px;font-weight:700;color:var(--terre);margin-bottom:3px}
.horsCours{background:var(--c1p);border-left:3px solid var(--c1);padding:10px 12px;border-radius:0;margin:8px 0;font-size:13.5px;line-height:1.45}
.horsCours .et{display:block;font-size:11.5px;color:var(--c1);font-weight:700;margin-bottom:4px}
.triLigne{display:flex;gap:10px;align-items:flex-start;background:var(--carte);border-radius:var(--r2);
  padding:11px 13px;margin-bottom:8px;box-shadow:var(--ombre)}
.triLigne input[type=checkbox]{width:19px;height:19px;flex:none;margin-top:2px;accent-color:var(--terre)}
.triLigne .tx{flex:1;min-width:0;font-size:14px;line-height:1.4}
.triLigne select{width:auto;padding:5px 8px;font-size:12px;flex:none}

.vign{background:var(--carte);border-radius:var(--r2);padding:11px 12px;margin-bottom:9px;box-shadow:var(--ombre)}
.vign img{width:100%;height:auto;border-radius:8px;border:1px solid var(--trait);display:block;background:#fff}
.vign .tabWrap{overflow-x:auto;border:1px solid var(--trait);border-radius:8px}
.vign .tabWrap table{font-size:12.5px;min-width:100%}
.vign .tabWrap td,.vign .tabWrap th{border:1px solid var(--trait);padding:5px 7px;white-space:nowrap}
.vign .tabWrap th{background:var(--trait2);font-weight:600}
.vign .barre{display:flex;gap:7px;align-items:center;margin-top:9px;flex-wrap:wrap}
.vign .barre input[type=text]{flex:1;min-width:120px;padding:7px 9px;font-size:13px}
.vign .barre select{width:auto;padding:7px 9px;font-size:12.5px}
.pdfZone{position:relative;background:var(--carte);border-radius:var(--r2);box-shadow:var(--ombre);
  overflow:hidden;margin-bottom:12px;touch-action:none}
.pdfZone canvas{display:block;width:100%;height:auto}
.pdfZone .cadreSel{position:absolute;border:2px solid var(--terre);background:rgba(217,96,60,.14);
  pointer-events:none;border-radius:2px}
/* ---- tableau de bord ---- */
.anneaux{display:flex;gap:10px;justify-content:center;margin:4px 0 16px;flex-wrap:wrap}
.anneau{display:flex;flex-direction:column;align-items:center;gap:5px}
.anneau svg{display:block}
.anneau .lab{font-size:11.5px;color:var(--encre2);text-align:center;max-width:96px;line-height:1.25}
.anneau .val{font-weight:700}
.grandAnneau{display:flex;align-items:center;gap:18px;border-radius:26px;
  padding:20px 22px;margin-bottom:14px;color:#fff;
  background:linear-gradient(135deg, #3A2BE0 0%, #5B3BF0 48%, #8B4BEF 100%);
  box-shadow:0 12px 30px rgba(58,43,224,.3)}
.grandAnneau .chiffres{flex:1;min-width:0}
.grandAnneau .chiffres b{display:block;font-size:26px;line-height:1.05;letter-spacing:-.03em;font-weight:700}
.grandAnneau .chiffres small{display:block;font-size:12.5px;color:rgba(255,255,255,.82);margin-top:3px}
.grandAnneau svg circle:first-child{stroke:rgba(255,255,255,.24)}
.grandAnneau svg text{fill:#fff !important}
.boites{display:flex;gap:6px;margin-bottom:6px}
.boites .b{flex:1;border-radius:8px;padding:9px 6px;text-align:center}
.boites .b b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em}
.boites .b small{font-size:10.5px;display:block;margin-top:1px}
.boites .b1{background:var(--rouge-pale);color:var(--rouge)}
.boites .b2{background:var(--or-pale);color:var(--or-fonce)}
.boites .b3{background:var(--c2p);color:#08543F}
.activite{display:flex;align-items:flex-end;gap:3px;height:64px;margin:6px 0 4px}
.activite .j{flex:1;background:var(--trait2);border-radius:3px 3px 0 0;position:relative;min-height:3px}
.activite .j i{position:absolute;left:0;right:0;bottom:0;background:var(--terre);border-radius:3px 3px 0 0;display:block}
.activite .j.vide{background:var(--trait2)}
.legJours{display:flex;justify-content:space-between;font-size:11px;color:var(--encre3);margin-bottom:14px}
.ligneMat{display:flex;align-items:center;gap:12px;background:var(--carte);border-radius:16px;
  padding:12px 14px;margin-bottom:8px;box-shadow:var(--ombre);position:relative;overflow:hidden}
.ligneMat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--trait)}
.ligneMat.u1::before{background:var(--c1)} .ligneMat.u2::before{background:var(--c2)}
.ligneMat.u3::before{background:var(--c3)}
.ligneMat .tx{flex:1;min-width:0}
.ligneMat .tx b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.ligneMat .tx small{display:block;font-size:12px;color:var(--encre2);line-height:1.35}
.ligneMat .btn{flex:none}
/* ---- aperçus de thèmes de fiche ---- */
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.theme{background:var(--carte);border-radius:11px;padding:6px 6px 8px;box-shadow:var(--ombre);
  border:2px solid transparent;transition:transform .12s}
.theme:active{transform:scale(.95)}
.theme.on{border-color:var(--terre)}
.theme .apercu{border-radius:6px;overflow:hidden;border:1px solid var(--trait);background:#fff;
  height:52px;display:block;position:relative}
.theme .apercu i{display:block;height:5px}
.theme .apercu u{display:block;height:4px;margin:5px 6px 0;border-radius:2px;text-decoration:none}
.theme .apercu s{display:block;height:11px;margin:5px 6px 0;border-radius:3px;text-decoration:none}
.theme .nom{display:block;font-size:10.5px;color:var(--encre2);text-align:center;margin-top:5px}
.legSeg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:11.5px;
  color:var(--encre2);margin:-8px 0 16px}
.legSeg span{display:inline-flex;align-items:center;gap:5px}
.legSeg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.grilleOutils{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.outil{position:relative;background:var(--carte);border-radius:18px;padding:13px 6px 11px;
  box-shadow:var(--ombre);display:flex;flex-direction:column;align-items:center;gap:7px;min-height:82px;
  justify-content:center;transition:transform .12s, box-shadow .2s}
.outil:active{transform:scale(.95);box-shadow:var(--ombre2)}
.outil .ic{font-size:18px;line-height:1;width:34px;height:34px;border-radius:11px;
  background:var(--terre-pale);color:var(--terre);display:grid;place-items:center}
.outil .nom{font-size:11.5px;color:var(--encre2);text-align:center;line-height:1.2;font-weight:500}
.outil .pastille{position:absolute;top:7px;right:9px;background:var(--terre);color:#fff;
  font-size:10.5px;font-weight:700;min-width:18px;height:18px;
  border-radius:9px;display:grid;place-items:center;padding:0 4px}
.choixGros{display:flex;gap:10px;margin-bottom:14px}
.choixGros button{flex:1;background:var(--carte);border-radius:var(--r);padding:18px 12px;box-shadow:var(--ombre);
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.choixGros .ic{font-size:24px;line-height:1}
.choixGros b{font-size:15px}
.choixGros small{font-size:12px;color:var(--encre2);line-height:1.3}
.boite{font-size:11.5px;font-weight:700;width:23px;height:23px;
  border-radius:7px;display:grid;place-items:center;flex:none;background:var(--trait2);color:var(--encre3)}
.boite.b1{background:var(--rouge-pale);color:var(--rouge)}
.boite.b2{background:var(--or-pale);color:var(--or-fonce)}
.boite.b3{background:var(--c2p);color:#08543F}
.pages{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:4px}
.page{position:relative;flex:none;width:88px}
.page img{width:88px;height:118px;object-fit:cover;border-radius:10px;border:1px solid var(--trait);
  background:#fff;display:block}
.page .ret{position:absolute;top:-5px;right:-5px;width:22px;height:22px;border-radius:50%;
  background:var(--rouge);color:#fff;font-size:14px;line-height:1;display:grid;place-items:center;box-shadow:var(--ombre)}
.page .num{position:absolute;bottom:5px;left:5px;background:rgba(36,28,22,.72);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:10px;padding:1px 5px;border-radius:5px}
.classeLigne{display:flex;gap:7px;align-items:center;background:var(--carte);border-radius:var(--r2);
  padding:10px 12px;margin-bottom:8px;box-shadow:var(--ombre);flex-wrap:wrap}
.classeLigne .tx{flex:1;min-width:110px;font-size:14.5px;line-height:1.35}
.classeLigne .puce.bon,.liste-puces .puce.bon{background:var(--c2p);color:#08543F;box-shadow:inset 0 0 0 2px var(--c2)}
.classeLigne .puce.mauvais,.liste-puces .puce.mauvais{background:var(--rouge-pale);color:var(--rouge);box-shadow:inset 0 0 0 1.5px var(--rouge)}
.niv{display:flex;gap:10px;align-items:center;background:var(--carte);border-radius:var(--r);padding:13px 14px;
  margin-bottom:10px;box-shadow:var(--ombre);width:100%;text-align:left}
.niv .rond{width:36px;height:36px;border-radius:12px;background:var(--trait2);display:grid;place-items:center;
  font-size:15px;font-weight:700;color:var(--encre2);flex:none}
.niv.ouvert .rond{background:var(--terre);color:#fff}
.niv.acquis .rond{background:var(--c2p);color:#08543F}
.niv .tx{flex:1;min-width:0}
.niv .tx b{display:block;font-size:15px}
.niv .tx small{font-size:12.5px;color:var(--encre2)}
.niv[disabled]{opacity:.5}

.visManquant{border:1px dashed var(--trait);border-radius:var(--r2);padding:16px;text-align:center;
  font-size:13px;color:var(--encre3);margin:10px 0}
.schema{margin:10px 0;overflow-x:auto;background:var(--carte);border:1px solid var(--trait);
  border-radius:var(--r2);padding:12px 10px;text-align:center}
.schema svg{max-width:100%;height:auto}
.schema figcaption{font-size:13px;color:var(--encre2);margin-top:8px;line-height:1.4;text-align:left}
#impression{display:none}

  .f.nb mark{background:none;border-bottom:1.5pt solid #241C16}
  .f.nb .alerte{border-left-color:#241C16}
  .f.nb .ajout{border-left-color:#241C16}
  .f.nb .ajout .lab,.f.nb .ajout a{color:#241C16}
  /* ---- thèmes : seules les couleurs et les fonds changent ---- */
  .f{--acc:#D9603C; --acc2:#B14526; --chaud:#FAEDE7; --chaudT:#E8B9A6;

/* ---- animations ---- */
@keyframes surgit{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pulseOk{0%{transform:scale(1)}35%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes secoue{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
  40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes traceCoche{to{stroke-dashoffset:0}}
@keyframes monte{from{transform:scaleY(.2);opacity:.4}to{transform:scaleY(1);opacity:1}}
@keyframes tourne{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.verdict{animation:surgit .26s ease both}
.verdict.ok{animation:surgit .26s ease both, pulseOk .45s ease .18s}
.verdict.ko{animation:surgit .2s ease both, secoue .4s ease .1s}
.verdict .marque{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  float:left;margin:0 11px 4px 0}
.verdict.ok .marque{background:var(--c2)}
.verdict.ko .marque{background:var(--rouge)}
.verdict .marque svg{width:19px;height:19px}
.verdict .marque path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:36;stroke-dashoffset:36;animation:traceCoche .4s ease .2s forwards}
.opt{transition:transform .12s, border-color .18s, background .18s}
.opt.juste{animation:pulseOk .45s ease}
.opt.faux{animation:secoue .38s ease}
.jauge i{transform-origin:left}
.activite .j i{animation:monte .5s ease both}
.anneau svg circle:nth-child(2),.anneau svg circle:nth-child(3),
.grandAnneau svg circle:nth-child(2),.grandAnneau svg circle:nth-child(3){
  transition:stroke-dasharray .7s cubic-bezier(.22,.9,.3,1)}
.cta:not([disabled]):active{transform:translateY(2px)}
.carteAct,.outil,.ligneMat{animation:surgit .22s ease both}
.occupe{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.45);
  border-top-color:#fff;border-radius:50%;animation:tourne .7s linear infinite;vertical-align:-2px;margin-right:7px}
/* ---- prise en main : tutos guidés ---- */
.tutoB{position:fixed;left:50%;transform:translateX(-50%);z-index:60;
  bottom:calc(var(--hautNav) + 8px + env(safe-area-inset-bottom));width:min(500px, calc(100% - 20px));
  background:var(--encre);color:var(--fond);border-radius:18px;padding:13px 15px 12px;
  box-shadow:0 14px 40px rgba(0,0,0,.35)}
.tutoB .tutoH{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;
  font-size:11.5px;font-weight:700;letter-spacing:.02em;opacity:.8}
.tutoB .tutoN{font-variant-numeric:tabular-nums}
.tutoB .tutoTxt{font-size:15px;line-height:1.45;margin:0}
.tutoB .tutoAlerte{margin:8px 0 0;font-size:13.5px;background:var(--or);color:#2A1D00;border-radius:10px;padding:7px 10px}
.tutoB .tutoBtns{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tutoB button{border:0;border-radius:11px;padding:9px 13px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  background:rgba(127,127,127,.22);color:inherit}
.tutoB button.fort{background:var(--or);color:#2A1D00}
.tutoB button.quitter{margin-left:auto;background:transparent;text-decoration:underline;opacity:.8}
body.enTuto .app{padding-bottom:calc(var(--hautNav) + 230px + env(safe-area-inset-bottom))}
.tutoCible{outline:3px solid var(--or) !important;outline-offset:3px;position:relative;z-index:5;
  animation:tutoHalo 1.3s ease-in-out infinite}
@keyframes tutoHalo{0%,100%{box-shadow:0 0 0 0 rgba(242,160,7,.55)}50%{box-shadow:0 0 0 9px rgba(242,160,7,0)}}
.bandeauTuto{display:inline-block;font-size:11px;font-weight:700;background:var(--or);color:#2A1D00;
  border-radius:999px;padding:3px 9px;margin-bottom:8px}
.guideFiche{background:var(--carte);border-radius:var(--r2);box-shadow:var(--ombre);padding:13px 15px;margin-bottom:10px}
.guideFiche h3{font-size:15.5px;margin-bottom:4px;letter-spacing:-.01em}
.guideFiche p{font-size:14px;color:var(--encre2);margin:0 0 6px}
.guideFiche ol{margin:4px 0 8px 20px;font-size:14px;color:var(--encre2)}
.guideFiche .piege{font-size:13px;color:var(--rouge);margin-top:4px}
.nouveautes li{margin:0 0 5px 18px;font-size:14px}
.icones{display:flex;gap:8px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

:root{--font-sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;--font-mono:"Space Grotesk",ui-monospace,monospace}

  --primary: oklch(0.57 0.225 285);
  --primary-foreground: oklch(0.99 0.004 270);
  --secondary: oklch(0.955 0.016 280);
  --secondary-foreground: oklch(0.3 0.06 282);
  --muted: oklch(0.955 0.012 275);
  --muted-foreground: oklch(0.53 0.04 278);
  --accent: oklch(0.93 0.055 285);
  --accent-foreground: oklch(0.42 0.19 285);
  --destructive: oklch(0.63 0.22 18);
  --destructive-foreground: oklch(0.99 0.004 270);
  --border: oklch(0.92 0.015 280);
  --input: oklch(0.92 0.015 280);
  --ring: oklch(0.57 0.225 285);

  /* Legacy variable bridge — vibrant palette */
  --fond: var(--background);
  --carte: var(--card);
  --encre: var(--foreground);
  --encre2: var(--muted-foreground);
  --encre3: oklch(0.64 0.03 278);
  --trait: var(--border);
  --trait2: oklch(0.93 0.015 280);
  --terre: var(--primary);
  --terre-fonce: oklch(0.47 0.23 288);
  --terre-pale: oklch(0.95 0.04 285);
  --c1: oklch(0.6 0.21 262);
  --c1p: oklch(0.95 0.045 262);
  --c2: oklch(0.68 0.16 165);
  --c2p: oklch(0.95 0.05 165);
  --c3: oklch(0.66 0.21 15);
  --c3p: oklch(0.95 0.045 15);
  --or: oklch(0.79 0.16 78);
  --or-pale: oklch(0.96 0.055 82);
  --or-fonce: oklch(0.56 0.14 68);
  --rouge: oklch(0.63 0.22 18);
  --rouge-pale: oklch(0.955 0.04 18);
  --ombre: 0 2px 4px oklch(0.24 0.05 278 / 0.05), 0 10px 28px oklch(0.24 0.05 278 / 0.07);
  --ombre2: 0 6px 12px oklch(0.24 0.05 278 / 0.09), 0 22px 48px oklch(0.24 0.05 278 / 0.13);
  --r: 24px;
  --r2: 18px;
  --r3: 14px;
}

body.sombre {
  --background: oklch(0.18 0.03 282);
  --foreground: oklch(0.96 0.008 275);
  --card: oklch(0.235 0.035 283);
  --card-foreground: oklch(0.96 0.008 275);
  --popover: oklch(0.235 0.035 283);
  --popover-foreground: oklch(0.96 0.008 275);
  --primary: oklch(0.72 0.18 288);
  --primary-foreground: oklch(0.18 0.03 282);
  --secondary: oklch(0.3 0.04 283);
  --secondary-foreground: oklch(0.95 0.01 275);
  --muted: oklch(0.28 0.03 283);
  --muted-foreground: oklch(0.75 0.03 278);
  --accent: oklch(0.34 0.07 285);
  --accent-foreground: oklch(0.95 0.01 275);
  --destructive: oklch(0.72 0.18 18);
  --destructive-foreground: oklch(0.99 0.004 270);
  --border: oklch(0.34 0.04 283);
  --input: oklch(0.34 0.04 283);
  --ring: oklch(0.72 0.18 288);
  --fond: var(--background);
  --carte: var(--card);
  --encre: var(--foreground);
  --encre2: var(--muted-foreground);
  --encre3: oklch(0.66 0.035 278);
  --trait: var(--border);
  --trait2: oklch(0.3 0.03 283);
  --terre: var(--primary);
  --terre-fonce: oklch(0.8 0.14 288);
  --terre-pale: oklch(0.31 0.08 286);
  --c1: oklch(0.74 0.15 262);
  --c1p: oklch(0.3 0.07 262);
  --c2: oklch(0.76 0.14 165);
  --c2p: oklch(0.29 0.06 165);
  --c3: oklch(0.74 0.17 15);
  --c3p: oklch(0.3 0.07 15);
  --or: oklch(0.82 0.15 80);
  --or-pale: oklch(0.31 0.06 80);
  --rouge-pale: oklch(0.31 0.07 18);
  --ombre: 0 2px 5px oklch(0 0 0 / 0.3), 0 12px 30px oklch(0 0 0 / 0.32);
  --ombre2: 0 6px 14px oklch(0 0 0 / 0.35), 0 26px 54px oklch(0 0 0 / 0.42);
  background-image: none;
}

@layer base {
  * { border-color: var(--border); }
  html { background: var(--background); }
  body {
    min-width: 320px;
    background: var(--background);
    color: var(--foreground);
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
    letter-spacing: -0.005em;
  }
  button, input, select, textarea {
    font-family: inherit;
    letter-spacing: -0.005em;
  }
  h1, h2, h3, .enTete h1, .diapo h2 { letter-spacing: -0.035em; }
}

body,
body button, body input, body select, body textarea {
  font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  letter-spacing: -0.005em;
}

/* ======================================================================
   Shell
   ====================================================================== */
.app-shell { min-height: 100vh; }
.desktop-sidebar { display: none; }
.legacy-stage {
  min-width: 0;
  background:
    radial-gradient(90rem 32rem at 8% -12%, color-mix(in oklab, var(--terre) 16%, transparent), transparent 62%),
    radial-gradient(70rem 26rem at 96% -6%, color-mix(in oklab, var(--c2) 13%, transparent), transparent 60%),
    var(--fond);
}
.app {
  width: 100%;
  max-width: 1180px;
  min-height: 100vh;
  margin: 0 auto;
  padding-bottom: calc(var(--hautNav) + 26px + env(safe-area-inset-bottom));
}
.ecran { max-width: 1180px; margin-inline: auto; padding: 26px 18px 34px; }

/* ======================================================================
   Typography
   ====================================================================== */
.enTete { align-items: center; margin-bottom: 22px; }
.enTete h1 { font-size: 32px; font-weight: 800; line-height: 1.05; }
.sousTitre { max-width: 62ch; margin-bottom: 20px; color: var(--encre2); font-size: 15px; line-height: 1.6; }
.kick {
  margin-top: 34px !important;
  margin-bottom: 14px;
  color: var(--encre2);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.kick::after { background: color-mix(in oklab, var(--trait) 80%, transparent); }

/* ======================================================================
   Surfaces — soft, rounded, shadow driven (no hard borders)
   ====================================================================== */
.bloc, .carteAct, .outil, .ligneMat, .guideFiche, .depli, .niv, .triLigne, .vign,
.choixGros button, .vocab li, .anneau {
  border: 1px solid color-mix(in oklab, var(--trait) 55%, transparent);
  border-radius: var(--r);
  background: var(--carte);
  box-shadow: 0 1px 2px oklch(0.24 0.05 278 / 0.04), 0 12px 30px oklch(0.24 0.05 278 / 0.06);
  transition: transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s ease, border-color .18s ease;
}
.bloc, .carteAct, .ligneMat { padding: 20px 22px; }
.bloc:hover, .carteAct:hover, .outil:hover, .ligneMat:hover, .choixGros button:hover {
  border-color: color-mix(in oklab, var(--terre) 45%, transparent);
  box-shadow: var(--ombre2);
  transform: translateY(-3px);
}
.carteAct:active, .outil:active, .ligneMat:active { transform: translateY(0) scale(.985); }

.resource-grid, .sheet-grid, .activity-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
  margin-bottom: 22px;
}
.resource-grid .ligneMat, .sheet-grid .bloc, .activity-grid .carteAct {
  width: 100% !important;
  min-width: 0;
  height: 100%;
  margin: 0;
}

/* Matter cards — colour coded per UE, progression first */
.resource-grid .ligneMat {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  min-height: 118px;
  align-content: center;
  gap: 14px;
  overflow: hidden;
  padding-top: 24px;
}
.ligneMat::before { inset: 0 0 auto 0; width: 100%; height: 6px; border-radius: 0; }
.ligneMat.u1 { background: linear-gradient(180deg, color-mix(in oklab, var(--c1p) 60%, var(--carte)), var(--carte) 58%); }
.ligneMat.u2 { background: linear-gradient(180deg, color-mix(in oklab, var(--c2p) 60%, var(--carte)), var(--carte) 58%); }
.ligneMat.u3 { background: linear-gradient(180deg, color-mix(in oklab, var(--c3p) 60%, var(--carte)), var(--carte) 58%); }
.ligneMat .tx b { font-size: 15.5px; font-weight: 750; line-height: 1.35; }
.ligneMat .tx small { margin-top: 4px; font-size: 12.5px; line-height: 1.45; }
.sheet-grid .bloc { padding: 24px; }

/* ======================================================================
   Progress — the hero of the interface
   ====================================================================== */
.grandAnneau {
  position: relative;
  overflow: hidden;
  min-height: 178px;
  padding: 30px 34px;
  border: 0;
  border-radius: var(--r);
  background: linear-gradient(130deg, var(--terre-fonce) 0%, var(--terre) 52%, color-mix(in oklab, var(--c1) 76%, var(--terre)) 100%);
  box-shadow: 0 20px 48px color-mix(in oklab, var(--terre) 30%, transparent);
  color: #fff;
}
.grandAnneau::after {
  content: "";
  position: absolute;
  top: -55%;
  right: -12%;
  width: 58%;
  height: 210%;
  border-radius: 50%;
  background: radial-gradient(circle, rgb(255 255 255 / 0.16), transparent 68%);
  pointer-events: none;
}
.grandAnneau .chiffres b { color: #fff; font-size: 38px; font-weight: 800; letter-spacing: -0.04em; }
.anneau svg text, .ligneMat svg text { font-family: "Plus Jakarta Sans", sans-serif !important; font-weight: 800 !important; }
.grandAnneau svg text { display: none; }
.grandAnneau svg circle:first-child { stroke: rgb(255 255 255 / 0.28); }
.grandAnneau .chiffres small { font-size: 13.5px; opacity: .88; }

.jauge {
  height: 14px;
  border-radius: 999px;
  background: color-mix(in oklab, var(--trait2) 88%, transparent);
  box-shadow: inset 0 1px 2px oklch(0.24 0.05 278 / 0.08);
}
.jauge i {
  border-radius: 999px;
  background: linear-gradient(90deg, var(--terre), color-mix(in oklab, var(--c1) 70%, var(--terre)));
  box-shadow: 0 1px 0 rgb(255 255 255 / 0.35) inset;
}
.progLigne { gap: 14px; margin-bottom: 22px; font-weight: 650; }

.anneaux {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 0 0 26px;
}
.anneau {
  min-width: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 18px 12px;
}
.anneau .lab { max-width: none; font-size: 12px; font-weight: 600; text-align: center; }
.anneau .val { font-weight: 800; }

.activite {
  height: 92px;
  gap: 6px;
  padding: 16px 18px 0;
  border: 1px solid color-mix(in oklab, var(--trait) 55%, transparent);
  border-bottom: 0;
  border-radius: var(--r) var(--r) 0 0;
  background: var(--carte);
}
.activite .j { border-radius: 999px; background: color-mix(in oklab, var(--trait2) 80%, transparent); }
.activite .j i { border-radius: 999px; background: linear-gradient(180deg, color-mix(in oklab, var(--c1) 80%, var(--terre)), var(--terre)); }
.legJours {
  padding: 8px 18px 14px;
  border: 1px solid color-mix(in oklab, var(--trait) 55%, transparent);
  border-top: 0;
  border-radius: 0 0 var(--r) var(--r);
  background: var(--carte);
}

/* ======================================================================
   Buttons — tactile, pressable
   ====================================================================== */
.cta {
  display: block;
  width: 100%;
  min-height: 58px;
  margin-top: 16px;
  border: 0;
  border-radius: 18px;
  background: linear-gradient(180deg, color-mix(in oklab, var(--terre) 88%, #fff 12%), var(--terre));
  color: #fff;
  box-shadow: 0 5px 0 var(--terre-fonce), 0 14px 26px color-mix(in oklab, var(--terre) 26%, transparent);
  font-size: 15px;
  font-weight: 750;
  transition: transform .12s ease, box-shadow .12s ease, filter .18s ease;
}
.cta:hover { filter: brightness(1.05); }
.cta:not([disabled]):active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 var(--terre-fonce), 0 6px 14px color-mix(in oklab, var(--terre) 22%, transparent);
}
.cta.sec {
  background: var(--carte);
  color: var(--encre);
  box-shadow: 0 4px 0 color-mix(in oklab, var(--trait) 90%, transparent), 0 10px 22px oklch(0.24 0.05 278 / 0.07);
}
.cta.sec:not([disabled]):active { box-shadow: 0 1px 0 var(--trait); }

.btn, .iconeBtn, .fermer {
  min-height: 42px;
  border: 1px solid color-mix(in oklab, var(--trait) 70%, transparent);
  border-radius: 14px;
  background: var(--carte);
  font-weight: 650;
  transition: transform .15s ease, background .15s ease, border-color .15s ease;
}
.btn:hover, .iconeBtn:hover, .fermer:hover {
  border-color: color-mix(in oklab, var(--terre) 55%, transparent);
  background: var(--terre-pale);
  color: var(--terre-fonce);
}
.btn:active, .iconeBtn:active { transform: scale(.94); }

.puce {
  min-height: 38px;
  border: 1px solid color-mix(in oklab, var(--trait) 70%, transparent);
  border-radius: 999px;
  padding: 8px 15px;
  font-weight: 620;
}
.puce.on { border-color: transparent; background: var(--terre-pale); color: var(--terre-fonce); box-shadow: none; }
.liste-puces { gap: 9px; margin-bottom: 24px; }

/* ======================================================================
   Quiz — big tappable answers with clear feedback
   ====================================================================== */
.opt {
  min-height: 66px;
  padding: 18px 20px;
  border: 2px solid color-mix(in oklab, var(--trait) 80%, transparent);
  border-radius: 18px;
  background: var(--carte);
  box-shadow: 0 3px 0 color-mix(in oklab, var(--trait) 85%, transparent);
  font-weight: 620;
  line-height: 1.5;
  transition: transform .12s ease, border-color .15s ease, background .15s ease;
}
.opt:hover:not(.juste):not(.faux) { border-color: var(--terre); background: var(--terre-pale); }
.opt:active:not(.juste):not(.faux) { transform: translateY(3px); box-shadow: none; }
.opt.juste {
  border-color: var(--c2);
  background: color-mix(in oklab, var(--c2p) 82%, var(--carte));
  box-shadow: 0 3px 0 color-mix(in oklab, var(--c2) 55%, transparent);
}
.opt.faux {
  border-color: var(--rouge);
  background: color-mix(in oklab, var(--rouge-pale) 82%, var(--carte));
  box-shadow: 0 3px 0 color-mix(in oklab, var(--rouge) 45%, transparent);
}
.choixGros button { min-height: 76px; font-weight: 700; }

/* ======================================================================
   Tools grid
   ====================================================================== */
.grilleOutils { gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.outil {
  min-height: 124px;
  justify-content: center;
  gap: 11px;
  padding: 20px 10px 16px;
  border-radius: var(--r2);
}
.outil .ic {
  width: 50px;
  height: 50px;
  border-radius: 17px;
  background: linear-gradient(160deg, var(--terre-pale), color-mix(in oklab, var(--c1p) 70%, var(--carte)));
  font-size: 22px;
}
.outil .nom { color: var(--encre); font-size: 12.5px; font-weight: 650; }
.outil .pastille { top: 10px; right: 10px; border-radius: 999px; font-weight: 700; }

/* ======================================================================
   Callouts and study sheets
   ====================================================================== */
.avis {
  padding: 18px 20px;
  border: 0;
  border-left: 5px solid var(--or);
  border-radius: 18px;
  background: color-mix(in oklab, var(--or-pale) 78%, var(--carte));
  line-height: 1.6;
}
.avis.info { border-left-color: var(--terre); background: color-mix(in oklab, var(--terre-pale) 78%, var(--carte)); }
.avis.err { border-left-color: var(--rouge); background: color-mix(in oklab, var(--rouge-pale) 78%, var(--carte)); }

.lecon { max-width: 980px; }
.lecon::before { height: 280px; opacity: .55; }
.diapo { width: 100%; max-width: 780px; margin-inline: auto; }
.diapo h2 { font-size: 34px; font-weight: 800; line-height: 1.15; }
.diapo p { color: var(--encre2); font-size: 16.5px; line-height: 1.78; }
.vocab { gap: 12px; }
.vocab li { padding: 18px 20px; border-radius: var(--r2); }

/* ======================================================================
   Mobile dock
   ====================================================================== */
.nav {
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  left: 12px;
  border: 1px solid color-mix(in oklab, var(--trait) 60%, transparent);
  border-radius: 24px;
  background: color-mix(in oklab, var(--carte) 86%, transparent);
  backdrop-filter: blur(20px) saturate(1.5);
  box-shadow: 0 10px 34px oklch(0.24 0.05 278 / 0.16);
}
body.sombre .nav { background: color-mix(in oklab, var(--carte) 84%, transparent); }
.nav .in { max-width: 560px; padding: 8px; gap: 4px; }
.nav button {
  border-radius: 18px;
  padding: 9px 0 8px;
  font-size: 11.5px;
  font-weight: 650;
  transition: background .18s ease, color .18s ease, transform .18s ease;
}
.nav button.act { background: var(--terre-pale); color: var(--terre-fonce); transform: translateY(-2px); }
.nav .ic { font-size: 20px; }

/* ======================================================================
   Sidebar (desktop)
   ====================================================================== */
@media (min-width: 720px) {
  .ecran { padding: 40px 34px 48px; }
  .resource-grid, .sheet-grid, .activity-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grilleOutils { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .choixGros { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .vocab { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .vocab li { margin-bottom: 0; }
  .pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  .page, .page img { width: 100%; }
  .page img { height: 150px; }
  .anneaux { gap: 14px; }
}

@media (min-width: 1024px) {
  :root { --hautNav: 0px; }
  .app-shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); }
  .desktop-sidebar {
    position: sticky;
    top: 0;
    display: flex;
    height: 100vh;
    flex-direction: column;
    border-right: 1px solid color-mix(in oklab, var(--trait) 60%, transparent);
    background: var(--carte);
    padding: 26px 18px 22px;
  }
  .brand-lockup { display: flex; min-width: 0; align-items: center; gap: 12px; margin-bottom: 34px; padding: 0 6px; }
  .brand-mark {
    display: grid;
    width: 46px;
    height: 46px;
    flex: none;
    place-items: center;
    border-radius: 16px;
    background: linear-gradient(140deg, var(--terre-fonce), var(--terre));
    color: #fff;
    box-shadow: 0 8px 20px color-mix(in oklab, var(--terre) 32%, transparent);
  }
  .brand-copy { display: flex; min-width: 0; flex-direction: column; }
  .brand-copy strong { font-size: 16.5px; font-weight: 800; letter-spacing: -0.03em; }
  .brand-copy small { color: var(--encre3); font-size: 12px; }
  .sidebar-section-label {
    padding: 0 12px 8px;
    color: var(--encre3);
    font: 700 10.5px/1 var(--font-mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .sidebar-nav, .sidebar-secondary { display: flex; flex-direction: column; gap: 6px; }
  .sidebar-link {
    width: 100%;
    height: 48px;
    justify-content: flex-start;
    border-radius: 16px;
    padding: 0 14px;
    font-weight: 650;
  }
  .sidebar-link:hover { background: var(--terre-pale); color: var(--terre-fonce); }
  .sidebar-link.is-active {
    background: linear-gradient(120deg, var(--terre-fonce), var(--terre));
    color: #fff;
    box-shadow: 0 8px 20px color-mix(in oklab, var(--terre) 28%, transparent);
  }
  .sidebar-link.is-active:hover { background: linear-gradient(120deg, var(--terre-fonce), var(--terre)); color: #fff; }
  .sidebar-secondary { margin-top: auto; }
  .offline-note {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin-top: 18px;
    border-radius: 16px;
    background: color-mix(in oklab, var(--c2p) 60%, var(--carte));
    padding: 13px 14px;
    color: var(--encre2);
    font-size: 11.5px;
    line-height: 1.45;
  }
  .offline-note span { width: 8px; height: 8px; flex: none; margin-top: 4px; border-radius: 50%; background: var(--c2); }
  .legacy-stage { min-height: 100vh; }
  .app { max-width: none; padding-bottom: 0; }
  .nav { display: none; }
  .ecran { padding: 56px clamp(38px, 5vw, 76px) 76px; }
  .enTete h1 { font-size: 42px; }
  .resource-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sheet-grid, .activity-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grilleOutils { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .grandAnneau { max-width: none; }
  .anneaux { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lecon { min-height: 100vh; max-width: 860px; margin: 0 auto; padding: 40px 48px; }
  .diapo { justify-content: flex-start; padding-top: 48px; }
  .pdfZone { max-width: 860px; }
}

@media (min-width: 1480px) {
  .resource-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ecran { max-width: 1280px; }
}

@media (max-width: 1023px) {
  .app { padding-bottom: calc(112px + env(safe-area-inset-bottom)); }
  body.enTuto .app { padding-bottom: calc(112px + 230px + env(safe-area-inset-bottom)); }
}

@media (max-width: 719px) {

];

const GLYPHS = {
  "◈": "graduation-cap",
  "◆": "compass",
  "◇": "dumbbell",
  "◉": "headphones",
  "◍": "mic",
  "◎": "lightbulb",

  "⌕": "search",

  "?": "circle-question-mark",

  "‹": "chevron-left",
  "›": "chevron-right",
};

function normalize(text) {
  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/['’]/g, " ");
}

function pick(label, glyph) {
  const l = normalize(label);
  for (const [re, name] of RULES) if (re.test(l)) return name;
  const g = GLYPHS[glyph.trim()];
  return g ?? null;
}

function paint(el, name) {
  const svg = LEGACY_ICONS[name];
  if (!svg) return;
  el.dataset["luc"] = name;
  el.innerHTML = svg;
}

function modernizeIcons(root) {
  root.querySelectorAll(".ic").forEach((ic) => {
    if (ic.dataset["luc"]) return;
    const host = ic.closest("button, a, div");
    const label =
      host?.querySelector(".nom")?.textContent ??
      host?.querySelector(".tx b")?.textContent ??
      host?.textContent ??
      "";
    const name = pick(label, ic.textContent ?? "");
    if (name) paint(ic, name);
  });

  root.querySelectorAll(".fl").forEach((fl) => {
    if (!fl.dataset["luc"]) paint(fl, "chevron-right");
  });

  root.querySelectorAll(".iconeBtn").forEach((btn) => {
    if (btn.dataset["luc"]) return;
    const name = pick(btn.getAttribute("aria-label") ?? "", btn.textContent ?? "");
    if (name) paint(btn, name);
  });
}

(function(){
  var app=document.getElementById("app"), nav=document.getElementById("nav");
  document.querySelectorAll("[data-side-ic]").forEach(function(el){
    var n=LEGACY_ICONS[el.getAttribute("data-side-ic")]; if(n) el.innerHTML=n;
  });
  function emit(action,data){
    var b=document.createElement("button"); b.dataset.act=action;
    Object.keys(data||{}).forEach(function(k){ b.dataset[k]=data[k]; });
    document.body.appendChild(b); b.click(); b.remove();
  }
  document.querySelectorAll("[data-side-tab]").forEach(function(b){
    b.addEventListener("click",function(){ emit("nav",{tab:b.getAttribute("data-side-tab")}); });
  });
  document.querySelectorAll("[data-side-ecran]").forEach(function(b){
    b.addEventListener("click",function(){ emit("ecran",{e:b.getAttribute("data-side-ecran")}); });
  });
  function syncTab(){
    var act=nav.querySelector("button.act"); if(!act) return;
    var t=act.dataset.tab;
    document.querySelectorAll("[data-side-tab]").forEach(function(b){
      b.classList.toggle("is-active", b.getAttribute("data-side-tab")===t);
    });
  }
  function groupCards(sel, cls){
    var cards=Array.prototype.slice.call(app.querySelectorAll(sel)).filter(function(c){
      return !(c.parentElement && c.parentElement.classList.contains(cls));

  const u = urlPour(b);
  if(!u){ ui.message = {type:"err", titre:"Téléchargement impossible", txt:"Ce navigateur refuse de créer le fichier."}; rendre(); return; }
  a.href = u; a.download = nom;
  document.body.appendChild(a); a.click();
  setTimeout(() => { libererUrl(a.href); a.remove(); }, 400);
}

/* =========================================================================
   4 bis. STOCKAGE DES IMAGES
   Les schémas ne tiennent pas dans le stockage local : ils vont dans une
   base IndexedDB séparée. Si elle est indisponible, on retombe sur une
   réserve en mémoire, qui ne survit pas à la fermeture de l'onglet.
   ========================================================================= */
const BDD = "buttc_visuels", MAGASIN = "img";
let bddPromesse = null, replisImg = {}, bddOk = true;
function bdd(){
  if(bddPromesse) return bddPromesse;
  bddPromesse = new Promise((ok, ko) => {
    if(!window.indexedDB){ bddOk = false; return ko(new Error("IndexedDB indisponible")); }
    const r = indexedDB.open(BDD, 1);
    r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains(MAGASIN)) r.result.createObjectStore(MAGASIN); };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => { bddOk = false; ko(r.error || new Error("Ouverture impossible")); };
  });
  return bddPromesse;
}
function tx(mode, fn){
  return bdd().then(db => new Promise((ok, ko) => {
    const t = db.transaction(MAGASIN, mode);
    const req = fn(t.objectStore(MAGASIN));
    t.oncomplete = () => ok(req ? req.result : undefined);
    t.onerror = () => ko(t.error);
  }));
}
async function poserImage(id, dataUrl){
  try{ await tx("readwrite", s => s.put(dataUrl, id)); }
  catch(e){ bddOk = false; replisImg[id] = dataUrl; }
}
async function prendreImage(id){
  if(replisImg[id]) return replisImg[id];
  try{ return await tx("readonly", s => s.get(id)); }
  catch(e){ return null; }
}
async function retirerImage(id){
  delete replisImg[id];
  try{ await tx("readwrite", s => s.delete(id)); }catch(e){}
}
async function toutesImages(ids){
  const out = {};
  for(const id of ids){ const v = await prendreImage(id); if(v) out[id] = v; }
  return out;
}

/* Réduction : au plus 1400 px de large, JPEG de qualité 0,78.
   Un schéma de cours pèse alors une centaine de kilo-octets. */
const LARGEUR_MAX = 1400;
function reduireImage(source){
  return new Promise((ok, ko) => {
    const im = new Image();
    im.onload = () => {
      const ech = Math.min(1, LARGEUR_MAX / im.width);
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.width * ech));
      c.height = Math.max(1, Math.round(im.height * ech));
      const g = c.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(im, 0, 0, c.width, c.height);
      ok({data: c.toDataURL("image/jpeg", 0.78), w: c.width, h: c.height});
    };
    im.onerror = () => ko(new Error("Image illisible."));
    im.src = source;
  });
}
function poidsData(d){ return Math.round((String(d||"").length * 3 / 4) / 1024); }

/* =========================================================================
   4 ter. TABLEAUX
   Un tableau importé est reconstruit cellule par cellule à partir du DOM :
   seuls le texte et la structure sont conservés, jamais le balisage d'origine.
   ========================================================================= */
function assainirTableau(el){
  const lignes = [];
  el.querySelectorAll("tr").forEach(tr => {
    const cells = [];
    tr.querySelectorAll("td,th").forEach(td => {
      cells.push({t: td.tagName.toLowerCase() === "th",
        txt: (td.textContent || "").replace(/\s+/g," ").trim()});
    });
    if(cells.some(c => c.txt)) lignes.push(cells);
  });
  if(lignes.length < 2) return null;
  const cols = Math.max.apply(null, lignes.map(l => l.length));
  if(cols < 2) return null;
  return {lignes, cols};
}
function tableauHtml(t, classe){
  return '<table class="' + (classe || "tableau") + '"><tbody>' + t.lignes.map(l =>
    "<tr>" + l.map(c => "<" + (c.t ? "th" : "td") + ">" + esc(c.txt) + "</" + (c.t ? "th" : "td") + ">").join("") + "</tr>"
  ).join("") + "</tbody></table>";
}

/* =========================================================================
   5. LECTURE DU COURS
   Les prises de notes sont fragmentaires : les seuils sont volontairement
   bas, et la mise en forme d'origine (titres, gras, listes) est conservée
   parce qu'elle dit déjà ce qui est important.
   ========================================================================= */
const UNITES = "%|€|k€|M€|mois|ans?|jours?|semaines?|heures?|h|min|km|m|kg|g|L|ml|pts?|points?|ECTS|/20|/10";
const RE_CHIFFRE = new RegExp("(?:^|[\\s(])(\\d+(?:[.,]\\d+)?)\\s?(" + UNITES + ")(?![a-zA-Zéèà])", "");
const RE_FORMULE = /(=|\btaux\b|\bmarge\b|\bcoefficient\b|\bratio\b|\bseuil\b|\bcalcul)/i;
const RE_JURI = /(article [LRD]\.?\s?\d|code (?:de la consommation|de commerce|du travail|civil)|loi (?:n°\s?)?\d|décret|règlement \(UE\)|RGPD|directive)/i;
const RE_PIEGE = /\b(attention|jamais|ne (?:doit|peut|faut) (?:pas|jamais)|interdit|obligatoire|piège|erreur|à ne pas confondre|contrairement à|nuance|sauf)\b/i;
const RE_EXEMPLE = /\b(par exemple|ex\s?:|exemple\s?:|cas de|illustration)\b/i;
const RE_DEF = /^(.{2,70}?)\s*(?::|\s[—–-]\s)\s*(.{12,})$/;
const RE_DEF_VERBE = /^(.{2,60}?)\s+(?:est|sont|désigne|désignent|correspond à|correspondent à|se définit comme|consiste à|permet de)\s+(.{10,})$/i;
const RE_PUCE = /^\s*(?:[-•–*·>]|\d{1,2}\s*[.)°]|[a-h]\s*[.)]|[IVX]{1,4}\s*[.)])\s+(.{2,})$/;

function decouper(texte){
  const lignes = texte.replace(/\r/g,"").split("\n").map(l => l.replace(/\s+$/,""));
  const blocs = [];
  lignes.forEach(l => {
    const t = l.trim();
    if(!t){ blocs.push({type:"vide", txt:"", fort:[]}); return; }
    const p = t.match(RE_PUCE);
    if(p){ blocs.push({type:"puce", txt:p[1].trim(), brut:t, fort:[]}); return; }
    const estTitre = t.length < 85 && !/[.;:!?]$/.test(t) &&
      /^[A-ZÉÈÀÇ0-9]/.test(t) && t.split(" ").length <= 12 && !RE_DEF.test(t);
    blocs.push({type: estTitre ? "titre" : "para", txt:t, fort:[]});
  });
  return blocs;
}

/* Conversion du HTML issu de mammoth : on récupère la hiérarchie, le gras,
   les images intégrées et les tableaux. */
function depuisHtml(html){
  const doc = new DOMParser().parseFromString("<div>" + html + "</div>", "text/html");
  const blocs = [];
  const forts = new Set();
  const images = [], tableaux = [];
  doc.querySelectorAll("img").forEach(im => {
    const s = im.getAttribute("src") || "";
    if(/^data:image\//.test(s)) images.push(s);
  });
  doc.querySelectorAll("table").forEach(tb => {
    const t = assainirTableau(tb);
    if(t) tableaux.push(t);
    tb.remove();
  });
  doc.querySelectorAll("strong,b,em,u,mark").forEach(e => {
    const t = (e.textContent || "").trim();
    if(t.length > 2 && t.length < 90) forts.add(t);
  });
  doc.querySelectorAll("h1,h2,h3,h4,p,li").forEach(e => {
    const t = (e.textContent || "").replace(/\s+/g," ").trim();
    if(!t) return;
    const n = e.tagName.toLowerCase();
    const type = /^h[1-4]$/.test(n) ? "titre" : (n === "li" ? "puce" : "para");
    const propres = [];
    e.querySelectorAll("strong,b,em,u,mark").forEach(x => {
      const s = (x.textContent || "").trim();
      if(s.length > 2 && s.length < 90) propres.push(s);
    });
    blocs.push({type, txt:t, brut:t, fort:propres, niveau: /^h([1-4])$/.test(n) ? Number(n[1]) : 0});
  });
  return {blocs, forts:[...forts], images, tableaux, texte: blocs.map(b => b.txt).join("\n")};
}

function phrases(texte){
  return texte.replace(/\s+/g," ")
    .split(/(?<=[.!?;])\s+(?=[A-ZÉÈÀÇ0-9«"])/)
    .map(p => p.trim()).filter(p => p.length > 15 && p.length < 400);
}
function detecterRessource(texte){
  const n = " " + normaliser(texte) + " ";
  let meilleur = null, best = 0;
  RESS.forEach(r => {
    let score = 0;
    (r.cles || []).forEach(c => {
      const cn = normaliser(c);
      if(!cn) return;
      const occ = n.split(" " + cn).length - 1;
      if(occ > 0) score += occ * (cn.includes(" ") ? 3 : 1.6);
    });
    if(score > best){ best = score; meilleur = r.id; }
  });
  return best >= 4 ? meilleur : null;
}

/* =========================================================================
   6. GARDE-FOU DONNÉES PERSONNELLES
   ========================================================================= */
const SONDES = [
  {re:/\b(?:M\.|Mme|Mlle|Monsieur|Madame)\s+[A-ZÉÈÀ][a-zéèêàçï]+/g, quoi:"nom précédé d'une civilité"},
  {re:/\b[\w.+-]+@[\w-]+\.[a-z]{2,}\b/gi,                           quoi:"adresse électronique"},
  {re:/\b0[1-9](?:[\s.-]?\d{2}){4}\b/g,                             quoi:"numéro de téléphone"},
  {re:/\b\d{13}(?:\s?\d{2})?\b/g,                                   quoi:"numéro à 13 chiffres"},
  {re:/\b(?:SIRET|SIREN)\s?:?\s?\d{6,}/gi,                          quoi:"identifiant d'entreprise"}
];
function sonderDonnees(t){
  const trouves = [];
  SONDES.forEach(s => { s.re.lastIndex = 0; if(s.re.test(t)) trouves.push(s.quoi); });
  return trouves;
}
function anonymiser(t){
  let r = t;
  r = r.replace(/\b(M\.|Mme|Mlle|Monsieur|Madame)\s+[A-ZÉÈÀ][a-zéèêàçï]+(?:\s+[A-ZÉÈÀ][A-ZÉÈÀa-zéèêàçï]+)?/g, "$1 [NOM]");
  r = r.replace(/\b[\w.+-]+@[\w-]+\.[a-z]{2,}\b/gi, "[COURRIEL]");
  r = r.replace(/\b0[1-9](?:[\s.-]?\d{2}){4}\b/g, "[TÉLÉPHONE]");
  r = r.replace(/\b\d{13}(?:\s?\d{2})?\b/g, "[IDENTIFIANT]");
  r = r.replace(/\b(SIRET|SIREN)\s?:?\s?\d{6,}/gi, "$1 [IDENTIFIANT]");
  return r;
}

/* =========================================================================
   7. MOTEUR LOCAL — repli hors ligne, sans intelligence artificielle.
   Tout ce qui sort d'ici provient littéralement des notes importées.
   ========================================================================= */
function analyseLocale(src, ressId){
  const blocs = src.blocs || decouper(src.texte);
  const texte = src.texte;
  const forts = src.forts || [];
  const phr = phrases(texte);
  const notions = [], parCoeur = [], calculs = [], juridique = [], pieges = [], exemples = [], sigles = [];

  const vus = new Set();
  blocs.forEach(b => {
    if(b.type === "vide") return;
    const m = b.txt.match(RE_DEF) || b.txt.match(RE_DEF_VERBE);
    if(m){
      const terme = m[1].replace(/^[-•–*·>\d.)\s]+/,"")
        .replace(/^(?:les|le|la|un|une|des|du)\s+/i,"").replace(/^l['’]\s*/i,"").trim();
      const def = m[2].trim();
      const k = normaliser(terme);
      if(terme.length > 1 && terme.length < 70 && def.length > 8 && !vus.has(k)){
        vus.add(k); notions.push({terme, def, src:b.txt});
      }
    }
  });
  /* les termes mis en gras par la prof sont considérés comme saillants */
  forts.forEach(f => {
    const k = normaliser(f);
    if(vus.has(k) || f.length < 3) return;
    const ligne = blocs.find(b => b.txt.includes(f) && b.txt.length > f.length + 12);
    if(ligne){ vus.add(k); notions.push({terme:f, def:ligne.txt, src:ligne.txt, saillant:true}); }
  });

  let ms;
  const vusSig = new Set();
  const reSig1 = /\b([A-ZÉÈ]{2,6})\s*\(([^)]{4,80})\)/g;
  while((ms = reSig1.exec(texte)) !== null){
    if(!vusSig.has(ms[1])){ vusSig.add(ms[1]); sigles.push({sigle:ms[1], sens:ms[2].trim(), src:ms[0]}); }
  }
  const reSig2 = /([a-zéèêàç][^.()\n]{4,80})\s*\(([A-ZÉÈ]{2,6})\)/g;
  while((ms = reSig2.exec(texte)) !== null){
    if(!vusSig.has(ms[2])){ vusSig.add(ms[2]); sigles.push({sigle:ms[2], sens:ms[1].trim(), src:ms[0]}); }
  }

  phr.forEach(p => {
    if(RE_CHIFFRE.test(p) && parCoeur.length < 20) parCoeur.push({txt:p, src:p});
    if(RE_FORMULE.test(p) && RE_CHIFFRE.test(p) && calculs.length < 12) calculs.push({txt:p, src:p});
    if(RE_JURI.test(p) && juridique.length < 12) juridique.push({txt:p, src:p});
    if(RE_PIEGE.test(p) && pieges.length < 12) pieges.push({txt:p, src:p});
    if(RE_EXEMPLE.test(p) && exemples.length < 10) exemples.push({txt:p, src:p});
  });
  blocs.forEach(b => {
    if(b.type === "puce" && b.txt.length > 12 && b.txt.length < 260 && parCoeur.length < 26)
      parCoeur.push({txt:b.txt, src:b.txt});
  });

  /* suites d'étapes : au moins trois puces numérotées qui se suivent */
  const procedures = [];
  let courante = [];
  const cloture = () => {
    if(courante.length >= 3 && courante.length <= 10)
      procedures.push({etapes: courante.slice()});
    courante = [];
  };
  blocs.forEach(b => {
    if(b.type === "puce" && /^\s*\d{1,2}\s*[.)°]/.test(b.brut || "") && b.txt.length < 180) courante.push(b.txt);
    else cloture();
  });
  cloture();

  const titre = (blocs.find(b => b.type === "titre") || {txt:""}).txt;
  const fiche = {
    resume: phr.slice(0,2).join(" "),
    notions: notions.slice(0,20), parCoeur: parCoeur.slice(0,18), calculs: calculs.slice(0,8),
    juridique: juridique.slice(0,8), pieges: pieges.slice(0,10), exemples: exemples.slice(0,8),
    sigles: sigles.slice(0,15), ajouts: [], procedures: procedures.slice(0,3), titreDetecte: titre
  };
  return {fiche, items: itemsLocaux(fiche, ressId)};
}

function itemsLocaux(fiche, ressId){
  const items = [];
  const base = t => ({id:uid(), ressId, type:t, visee:VISEE_PAR_TYPE[t] || "memo",
    niveau: NIVEAU_PAR_TYPE[t] || 1, cree:Date.now(), origine:"local"});
  fiche.notions.forEach(d => {
    items.push(Object.assign(base("flash"), {recto:d.terme, verso:d.def, source:d.src}));
  });
  /* compréhension : mettre deux notions du cours face à face.
     Rien n'est inventé, les deux définitions viennent des notes. */
  /* Repérer l'intrus : trois associations exactes du cours, une fausse.
     Les quatre énoncés sortent des notes, seul l'appariement est erroné. */
  if(fiche.notions.length >= 4){
    const lots = melanger(fiche.notions);
    for(let k = 0; k + 3 < lots.length && k < 8; k += 4){
      const q = lots.slice(k, k + 4);
      const faux = tronquer(q[0].terme + " : " + q[1].def, 150);
      const opts = melanger([faux].concat(q.slice(1).map(d => tronquer(d.terme + " : " + d.def, 150))));
      if(new Set(opts).size !== opts.length) continue;
      items.push(Object.assign(base("choix"), {
        angle:"erreur",
        question:"Laquelle de ces associations est fausse ?",
        options: opts, reponse: opts.indexOf(faux),
        correction: q[0].terme + " désigne en réalité : " + q[0].def,
        source: q[0].src + " — " + q[1].src}));
    }
  }

  /* Distinguer deux notions : on fait ranger des fragments de leurs définitions
     dans la bonne colonne, plutôt que de faire rédiger. */
  if(fiche.notions.length >= 2){
    const n = melanger(fiche.notions).slice(0, Math.min(6, fiche.notions.length));
    for(let i = 0; i + 1 < n.length; i += 2){
      const a = n[i], b = n[i+1];
      const bouts = t => String(t).split(/[,;]|\bet\b/).map(x => x.trim())
        .filter(x => x.length > 12 && x.length < 90).slice(0,3);
      const ea = bouts(a.def), eb = bouts(b.def);
      if(ea.length < 2 || eb.length < 2) continue;
      items.push(Object.assign(base("classer"), {
        question:"Range chaque élément du côté de la bonne notion.",
        colonnes:[a.terme, b.terme],
        elements: ea.map(t => ({txt:t, col:0})).concat(eb.map(t => ({txt:t, col:1}))),
        correction: a.terme + " : " + a.def + " — " + b.terme + " : " + b.def,
        source: a.src + " — " + b.src}));
    }
  }
  (fiche.procedures || []).forEach(p => {
    items.push(Object.assign(base("ordre"), {
      question:"Remets ces étapes dans l'ordre du cours.", etapes:p.etapes, source:p.etapes.join(" → ")}));
  });
  fiche.sigles.forEach(s => items.push(Object.assign(base("flash"), {recto:s.sigle, verso:s.sens, source:s.src})));
  if(fiche.notions.length >= 4){
    fiche.notions.forEach((d,i) => {
      const autres = melanger(fiche.notions.filter((_,j) => j !== i)).slice(0,3);
      if(autres.length < 3) return;
      const opts = melanger([d.def].concat(autres.map(a => a.def))).map(o => tronquer(o, 150));
      if(new Set(opts).size !== opts.length) return;
      items.push(Object.assign(base("qcm"), {
        question:"Que désigne « " + d.terme + " » ?", options:opts,
        reponse:opts.findIndex(o => o === tronquer(d.def,150)), source:d.src}));
    });
    const lot = melanger(fiche.notions).slice(0,5);
    items.push(Object.assign(base("paires"), {
      question:"Associe chaque terme à sa définition.",
      paires: lot.map(d => [d.terme, tronquer(d.def, 110)]),
      source: lot.map(d => d.src).join(" — ")}));
  }
  /* Un chiffre à retrouver devient un choix entre quatre valeurs plausibles,
     plutôt qu'un champ à taper. */
  const chiffres = fiche.parCoeur.filter(c => RE_CHIFFRE.test(c.txt));
  chiffres.forEach((c,k) => {
    const m = c.txt.match(RE_CHIFFRE);
    if(!m) return;
    const val = m[1] + (m[2] ? " " + m[2] : "");
    if(k < 2){
      items.push(Object.assign(base("cloze"), {
        question: c.txt.replace(m[1] + (m[0].includes(" " + m[2]) ? " " : "") + m[2], "_____"),
        reponse: val, source:c.txt}));
      return;
    }
    const n0 = parseFloat(m[1].replace(",", "."));
    const faux = [n0 * 2, n0 / 2, n0 + (n0 < 10 ? 1 : 10)]
      .map(x => (Math.round(x * 100) / 100)).filter(x => x !== n0 && x > 0);
    if(faux.length < 3) return;
    const opts = melanger([val].concat(faux.map(x => String(x).replace(".", ",") + (m[2] ? " " + m[2] : ""))));
    items.push(Object.assign(base("qcm"), {
      question: c.txt.replace(m[1] + (m[0].includes(" " + m[2]) ? " " : "") + m[2], "…………"),
      options: opts, reponse: opts.indexOf(val),
      correction:"Valeur exacte du cours : " + val + ".", source:c.txt}));
  });
  fiche.parCoeur.slice(0,10).forEach((c,i) => {
    const m = c.txt.match(RE_CHIFFRE);
    if(!m) return;
    const vrai = i % 2 === 0;
    let enonce = c.txt;
    if(!vrai){
      const n = parseFloat(m[1].replace(",","."));
      let faux = n < 10 ? n + 1 : Math.round(n * (Math.random() < .5 ? 1.5 : 0.5));
      if(faux === n) faux = n + 2;
      enonce = c.txt.replace(m[1], String(faux).replace(".", ","));
    }
    items.push(Object.assign(base("vf"), {
      question: enonce, reponse: vrai,
      correction: vrai ? "Énoncé conforme aux notes." : "Faux : la valeur des notes est « " + m[1] + " " + m[2] + " ».",
      source: c.txt}));
  });
  return items;
}

/* =========================================================================
   8. MOTEUR GEMINI — deux appels distincts.
   Le premier travaille uniquement sur les notes. Le second, facultatif,
   active la recherche Google de Gemini : les liens retenus proviennent
   des métadonnées renvoyées par l'API, jamais du texte du modèle.
   ========================================================================= */
const API = "https://generativelanguage.googleapis.com/v1beta";

async function listerModeles(cle){
  const r = await fetch(API + "/models", {headers:{"x-goog-api-key": cle}});
  if(!r.ok) throw new Error("La clé a été refusée (code " + r.status + ").");
  const d = await r.json();
  return (d.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
    .filter(m => !/embedding|aqa|imagen|veo|tts/i.test(m.name))
    .map(m => ({id:m.name.replace(/^models\//,""), nom:m.displayName || m.name}));
}

/* La fiche validée, mise à plat pour être transmise au modèle. */
function ficheEnTexteBUT(f){
  const l = [];
  if(f.resume) l.push("Résumé : " + f.resume);
  const bloc = (t, arr, fn) => { if(arr && arr.length){ l.push("", t.toUpperCase()); arr.forEach(x => l.push("- " + fn(x))); } };
  bloc("Notions", f.notions, x => x.terme + " : " + x.def);
  bloc("Sigles", f.sigles, x => x.sigle + " : " + x.sens);
  bloc("À savoir par cœur", f.parCoeur, x => x.txt);
  bloc("Formules et calculs", f.calculs, x => x.txt);
  bloc("Cadre juridique", f.juridique, x => x.txt);
  bloc("Erreurs classiques", f.pieges, x => x.txt);
  bloc("Exemples", f.exemples, x => x.txt);
  (f.procedures || []).forEach(p => { l.push("", "SUITE D'ÉTAPES"); (p.etapes||[]).forEach((e,i) => l.push((i+1) + ". " + e)); });
  return l.join("\n");
}
