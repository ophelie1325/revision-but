async function schemaGemini(fiche, ressId, type, cle, modele){
  const d = await appelGemini(cle, modele, {
    systemInstruction:{parts:[{text:consigneSchema(ressId, type)}]},
    contents:[{role:"user", parts:[{text:"FICHE VALIDÉE :\n\n" + ficheEnTexteBUT(fiche)}]}],
    generationConfig:{temperature:0.3, responseMimeType:"application/json", maxOutputTokens:3072}
  });
  const cand = (d.candidates || [])[0];
  if(!cand) throw new Error("Rien n'est revenu.");
  const brut = ((cand.content && cand.content.parts) || []).map(x => x.text || "").join("");
  let o; try{ o = JSON.parse(brut.replace(/^```json\s*|```\s*$/g,"").trim()); }
  catch(e){ throw new Error("La réponse n'était pas exploitable. Relance."); }
  const code = nettoyerMermaid(String(o.code || ""));
  if(!code) throw new Error(o.note ? String(o.note) : "Aucun schéma n'a pu être construit sur cette fiche.");
  return {titre:String(o.titre || "Schéma"), code, note:String(o.note || "")};
}
/* Les ponctuations fermantes dans un libellé cassent le rendu : on les neutralise
   avant même d'essayer, plutôt que d'afficher une erreur de syntaxe. */
function nettoyerMermaid(code){
  let c = code.replace(/^```[a-z]*\s*|```\s*$/g, "").trim();
  c = c.replace(/\[([^\]\n]*)\]/g, (m, t) => "[" + t.replace(/[()\[\]{}"]/g, ",") + "]");
  c = c.replace(/\{([^}\n]*)\}/g, (m, t) => "{" + t.replace(/[()\[\]{}"]/g, ",") + "}");
  return c;
}
/* Mermaid n'est chargé qu'au moment où un schéma doit être rendu. */
let mermaidPret = false;
async function chargerMermaid(){
  if(mermaidPret) return;
  await scriptExterne("https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js");
  if(!window.mermaid) throw new Error("Mermaid n'a pas pu être chargé : une connexion est nécessaire la première fois.");
  window.mermaid.initialize({startOnLoad:false, securityLevel:"strict", theme:"base",
    fontFamily:"Outfit, system-ui, sans-serif",
    themeVariables:{
      primaryColor:"#FAEDE7", primaryTextColor:"#2A1F1A", primaryBorderColor:"#D9603C",
      lineColor:"#8A7F76", secondaryColor:"#FBF1DC", tertiaryColor:"#F7F3EE",
      fontSize:"14px"}});
  mermaidPret = true;
}
const SVG_SCHEMA = {};
async function rendreSchema(id, code){
  await chargerMermaid();
  const r = await window.mermaid.render("mmd-" + id.replace(/[^\w-]/g,""), code);
  SVG_SCHEMA[id] = r.svg;
  return r.svg;
}
async function prechargerSchemas(c){
  const l = (c.schemas || []).filter(x => !SVG_SCHEMA[x.id] && !x.erreur);
  if(!l.length) return;
  for(const x of l){
    try{ await rendreSchema(x.id, x.code); }
    catch(e){ x.erreur = String(e && e.message || e).slice(0, 160); }
  }
  sauver(); rendre();
}


/* Diagnostic de la clé, étape par étape : chacune dit ce qui bloque et comment
   le corriger, plutôt qu'un seul message d'échec global. */
async function testerCle(){
  const r = S.reglages;
  const et = [];
  const pousser = (nom, etat, detail) => { et.push({nom, etat, detail}); ui.testCle = {etapes:et.slice(), fini:false}; rendre(); };

  if(!r.cleGemini){
    ui.testCle = {etapes:[{nom:"Clé renseignée", etat:"ko", detail:"Aucune clé n'est saisie. Colle la clé obtenue sur Google AI Studio dans le champ ci-dessus."}], fini:true};
    rendre(); return;
  }
  const cle = r.cleGemini.trim();
  if(cle !== r.cleGemini){ S.reglages.cleGemini = cle; sauver(); }

  // étape 1 : forme de la clé
  if(/\s/.test(cle)) pousser("Forme de la clé", "ko", "La clé contient un espace ou un retour à la ligne. Recopie-la sans rien autour.");
  else if(cle.length < 20) pousser("Forme de la clé", "ko", "La clé paraît incomplète (" + cle.length + " caractères). Recopie-la en entier depuis Google AI Studio.");
  else pousser("Forme de la clé", "ok", cle.length + " caractères, aucun espace parasite.");

  // étape 2 : la clé est-elle acceptée
  let modeles = null;
  try{
    modeles = await listerModeles(cle);
    pousser("Clé acceptée par Google", "ok", modeles.length + " modèles accessibles avec cette clé.");
    S.reglages.modeles = modeles; sauver();
  }catch(e){
    const m = String(e.message || e);
    let aide = "Réponse inattendue du serveur.";
    if(/Failed to fetch|NetworkError|Load failed/i.test(m))
      aide = "Aucune réponse du serveur. Causes possibles : pas de connexion, réseau d'établissement qui bloque le domaine, ou extension de navigateur qui filtre les requêtes.";
    else if(/ 401|\(code 401\)/.test(m)) aide = "Clé refusée : elle est invalide ou révoquée. Crée une nouvelle clé sur Google AI Studio.";
    else if(/ 400|\(code 400\)/.test(m)) aide = "Clé refusée : elle est invalide, révoquée, ou recopiée partiellement. Régénère-la sur Google AI Studio.";
    else if(/ 403|\(code 403\)/.test(m)) aide = "Clé reconnue mais interdite d'usage ici : restriction par site ou par adresse IP dans la console Google, ou API Generative Language non activée sur le projet.";
    else if(/ 429|\(code 429\)/.test(m)) aide = "Quota atteint pour cette clé. Attends la réinitialisation ou change de projet.";
    pousser("Clé acceptée par Google", "ko", aide + " (" + m + ")");
    ui.testCle.fini = true; rendre(); return;
  }

  // étape 3 : le modèle choisi existe-t-il
  let modele = r.modele;
  if(!modele){
    const pref = modeles.find(x => /flash/i.test(x.id) && !/lite|preview|exp/i.test(x.id)) || modeles.find(x => /flash/i.test(x.id)) || modeles[0];
    if(pref){ modele = S.reglages.modele = pref.id; sauver(); }
  }
  if(!modele){ pousser("Modèle sélectionné", "ko", "Aucun modèle disponible pour cette clé."); ui.testCle.fini = true; rendre(); return; }
  if(!modeles.some(x => x.id === modele)){
    pousser("Modèle sélectionné", "ko", "Le modèle « " + modele + " » n'est pas accessible avec cette clé. Choisis-en un autre dans la liste.");
    ui.testCle.fini = true; rendre(); return;
  }
  pousser("Modèle sélectionné", "ok", modele);

  // étape 4 : une vraie génération, au format attendu par l'application
  try{
    const d = await appelGemini(cle, modele, {
      contents:[{role:"user", parts:[{text:"Réponds uniquement par ce JSON, sans rien autour : {\"test\":\"ok\"}"}]}],
      generationConfig:{temperature:0, responseMimeType:"application/json", maxOutputTokens:64}
    });
    const cand = (d.candidates || [])[0];
    const brut = cand ? ((cand.content && cand.content.parts || []).map(x => x.text || "").join("")) : "";
    if(!cand) pousser("Génération d'une réponse", "ko", "Le modèle n'a rien renvoyé. Réessaie, ou change de modèle.");
    else if(cand.finishReason && cand.finishReason !== "STOP")
      pousser("Génération d'une réponse", "ko", "Réponse interrompue (" + cand.finishReason + "). Sur un vrai cours, découpe le texte en deux.");
    else{
      let o = null; try{ o = JSON.parse(brut.replace(/^```json\s*|```\s*$/g, "").trim()); }catch(e){}
      if(o && o.test === "ok") pousser("Génération d'une réponse", "ok", "Réponse reçue et lisible au format JSON.");
      else pousser("Génération d'une réponse", "ko", "Réponse reçue mais illisible : " + tronquer(brut, 90));
    }
  }catch(e){
    pousser("Génération d'une réponse", "ko", String(e.message || e));
  }

  // étape 5 : la synthèse vocale, qui se facture et s'autorise à part
  if(r.modeleVoix){
    try{
      const l = await modelesVoix(cle);
      if(l.some(x => x.id === r.modeleVoix)) pousser("Modèle vocal", "ok", r.modeleVoix);
      else pousser("Modèle vocal", "ko", "Le modèle vocal choisi n'est plus accessible. Recharge la liste.");
    }catch(e){ pousser("Modèle vocal", "ko", "Liste des voix inaccessible : " + String(e.message || e)); }
  }
  ui.testCle.fini = true; rendre();
}

/* Délai maximal par appel. Sans cela, une requête qui reste en attente bloque
   l'application sans aucun message : l'écran semble figé indéfiniment, et
   l'utilisateur croit que le bouton ne répond pas. */
const DELAI_APPEL = 120000;
let annulation = null;
function annulerAppel(){
  if(annulation){ try{ annulation.abort(); }catch(e){} annulation = null; }
}
async function appelGemini(cle, modele, corps){
  const ctrl = (typeof AbortController === "function") ? new AbortController() : null;
  annulation = ctrl;
  const minuterie = ctrl ? setTimeout(() => { try{ ctrl.abort(); }catch(e){} }, DELAI_APPEL) : null;
  let r;
  try{
    r = await fetch(API + "/models/" + encodeURIComponent(modele) + ":generateContent",
      {method:"POST", headers:{"Content-Type":"application/json", "x-goog-api-key": cle}, body:JSON.stringify(corps),
       signal: ctrl ? ctrl.signal : undefined});
  }catch(e){
    if(e && (e.name === "AbortError" || /abort/i.test(e.message || "")))
      throw new Error("Pas de réponse au bout de " + Math.round(DELAI_APPEL/1000) + " secondes. Vérifie la connexion, ou découpe le cours en deux.");
    throw new Error("La requête n'a pas abouti : " + (e && e.message ? e.message : "réseau indisponible") + ".");
  }finally{
    if(minuterie) clearTimeout(minuterie);
    annulation = null;
  }
  if(!r.ok){
    let d = ""; try{ d = (await r.json()).error.message; }catch(e){}
    if(r.status === 401) throw new Error("Clé refusée (401) : elle est invalide ou révoquée. Crée une nouvelle clé sur Google AI Studio.");
    if(r.status === 429) throw new Error("Quota Google atteint (429). Attends une minute, ou repasse en mode local.");
    if(r.status === 403) throw new Error("Clé refusée pour cet usage (403) : restriction par site ou par adresse IP dans la console Google, ou API non activée.");
    throw new Error("Gemini a renvoyé une erreur " + r.status + (d ? " : " + d : "") + ".");
  }
  const d = await r.json();
  const cand = (d.candidates || [])[0];
  if(cand && cand.finishReason === "MAX_TOKENS")
    throw new Error("La réponse a été coupée avant la fin : le texte envoyé est trop gros. Découpe-le en deux.");
  if(cand && (cand.finishReason === "SAFETY" || cand.finishReason === "PROHIBITED_CONTENT"))
    throw new Error("Le modèle a refusé de traiter ce passage. Réessaie sur une autre partie du cours.");
  return d;
}


/* Second appel : compléments extérieurs, avec recherche web activée.
   On ne garde que les URL présentes dans groundingMetadata. */
async function complementsGemini(fiche, ressId, cle, modele){
  const r = RESSOURCE(ressId);
  const lacunes = (fiche.lacunes || []).slice(0,5);
  const sujets = lacunes.length ? lacunes : (fiche.notions || []).slice(0,4).map(n => n.terme);
  if(!sujets.length) return [];
  const q = [
    "Contexte : cours de " + (r ? r.nom : "commerce") + " en B.U.T. Techniques de commercialisation, France.",
    "Pour chacun des points suivants, donne une précision courte et exacte, en français, en t'appuyant sur une recherche web :",
    sujets.map((s,i) => (i+1) + ". " + s).join("\n"),
    "",
    "Trois phrases maximum par point. Pas de liste de liens dans ta réponse, pas d'URL écrite à la main.",
    "Format : une ligne par point, préfixée du numéro et d'un tiret."
  ].join("\n");
  let d;
  try{
    d = await appelGemini(cle, modele, {
      contents:[{role:"user", parts:[{text:q}]}],
      tools:[{google_search:{}}],
      generationConfig:{temperature:0.1, maxOutputTokens:2048}
    });
  }catch(e){ return []; }
  const cand = (d.candidates || [])[0];
  if(!cand) return [];
  const txt = ((cand.content && cand.content.parts) || []).map(p => p.text || "").join("");
  const gm = cand.groundingMetadata || {};
  const liens = (gm.groundingChunks || [])
    .map(c => c && c.web ? {url:c.web.uri, titre:c.web.title || c.web.uri} : null)
    .filter(Boolean);
  if(!liens.length) return [];
  return txt.split("\n").map(l => l.trim())
    .filter(l => /^\d+\s*[.)-]/.test(l) && l.length > 25)
    .slice(0, sujets.length)
    .map((l,i) => ({txt: l.replace(/^\d+\s*[.)-]\s*/,"").trim(),
      sujet: sujets[i] || "", liens: liens.slice(0,3)}));
}

/* Un cours long ne tient pas dans un seul appel : on le coupe aux paragraphes,
   on releve chaque morceau separement, puis on reunit en dedoublonnant. */
function decouperTexte(t, max){
  if(t.length <= max) return [t];
  const blocs = t.split(/\n\s*\n/);
  const out = []; let cur = "";
  blocs.forEach(b => {
    if((cur + "\n\n" + b).length > max && cur){ out.push(cur); cur = b; }
    else cur = cur ? cur + "\n\n" + b : b;
  });
  if(cur) out.push(cur);
  return out.flatMap(x => {
    if(x.length <= max) return [x];
    const morceaux = [];
    for(let i = 0; i < x.length; i += max) morceaux.push(x.slice(i, i + max));
    return morceaux;
  });
}
function fusionnerFiches(liste){
  const f = {resume:"", notions:[], parCoeur:[], calculs:[], juridique:[], pieges:[],
    exemples:[], sigles:[], lacunes:[], procedures:[], ajouts:[]};
  const cles = ["notions","parCoeur","calculs","juridique","pieges","exemples","sigles"];
  const vus = {}; cles.forEach(k => vus[k] = new Set());
  const vusL = new Set();
  liste.forEach(r => {
    if(!f.resume && r.resume) f.resume = r.resume;
    cles.forEach(k => (r[k] || []).forEach(x => {
      const c = normaliser(x.terme || x.sigle || x.txt || "");
      if(c && !vus[k].has(c)){ vus[k].add(c); f[k].push(x); }
    }));
    (r.lacunes || []).forEach(x => { const c = normaliser(x);
      if(c && !vusL.has(c)){ vusL.add(c); f.lacunes.push(x); } });
    (r.procedures || []).forEach(x => f.procedures.push(x));
  });
  return f;
}
const MAX_MORCEAU = 18000;
async function notionsGemini(texte, ressId, cle, modele, avancement){
  const morceaux = decouperTexte(texte, MAX_MORCEAU);
  const fiches = [];
  for(let k = 0; k < morceaux.length; k++){
    if(avancement) avancement(k + 1, morceaux.length);
    const d = await appelGemini(cle, modele, {
      systemInstruction:{parts:[{text:consigneNotions(ressId)}]},
      contents:[{role:"user", parts:[{text:"NOTES DE COURS :\n\n" + morceaux[k]}]}],
      generationConfig:{temperature:0.2, responseMimeType:"application/json", maxOutputTokens:6144}
    });
    const cand = (d.candidates || [])[0];
    if(!cand) throw new Error("Gemini n'a rien renvoyé sur le passage " + (k+1) + ". Coupe les notes en deux.");
    const brut = ((cand.content && cand.content.parts) || []).map(p => p.text || "").join("");
    let o;
    try{ o = JSON.parse(brut.replace(/^```json\s*|```\s*$/g,"").trim()); }
    catch(e){ throw new Error("La réponse de Gemini n'était pas exploitable sur le passage " + (k+1) + ". Relance l'analyse."); }
    fiches.push(normaliserSortieIA({fiche:o, items:[]}, ressId).fiche);
  }
  return fiches.length === 1 ? fiches[0] : fusionnerFiches(fiches);
}

function normaliserSortieIA(o, ressId){
  const f = o.fiche || {};
  const tab = x => Array.isArray(x) ? x : [];
  const lst = (k, champs) => tab(f[k]).filter(x => x && x[champs[0]]).map(x => {
    const r = {}; champs.forEach(c => r[c] = x[c] || "");
    r.src = x.src || ""; if(x.incertain === true) r.incertain = true; return r;
  });
  const fiche = {
    resume: f.resume || "",
    notions: lst("notions", ["terme","def"]),
    parCoeur: lst("parCoeur", ["txt"]),
    calculs: lst("calculs", ["txt"]),
    juridique: lst("juridique", ["txt"]),
    pieges: lst("pieges", ["txt"]),
    exemples: lst("exemples", ["txt"]),
    sigles: lst("sigles", ["sigle","sens"]),
    lacunes: tab(f.lacunes).filter(x => typeof x === "string"),
    procedures: [], ajouts: []
  };
  const items = [];
  tab(o.items).forEach(it => {
    if(!it || !TYPES[it.type]) return;
    const b = {id:uid(), ressId, type:it.type, visee: VISEES[it.visee] ? it.visee : (VISEE_PAR_TYPE[it.type] || "memo"),
      niveau: (Number(it.niveau) >= 1 && Number(it.niveau) <= 4) ? Number(it.niveau) : (NIVEAU_PAR_TYPE[it.type] || 1),
      cree:Date.now(), origine:"gemini", source: it.source || "", correction: it.correction || ""};
    if(it.type === "qcm" && Array.isArray(it.options) && it.options.length >= 2){
      items.push(Object.assign(b, {question:it.question, options:it.options,
        reponse: Math.max(0, Math.min(it.options.length - 1, Number(it.reponse) || 0))}));
    } else if(it.type === "choix" && Array.isArray(it.options) && it.options.length >= 3 && it.question){
      items.push(Object.assign(b, {question:it.question, angle: ANGLES[it.angle] ? it.angle : "explication",
        options:it.options, reponse: Math.max(0, Math.min(it.options.length - 1, Number(it.reponse) || 0))}));
    } else if(it.type === "classer" && Array.isArray(it.colonnes) && it.colonnes.length === 2
              && Array.isArray(it.elements) && it.elements.length >= 4){
      const els = it.elements.filter(e => e && e.txt).map(e => ({txt:e.txt, col: Number(e.col) === 1 ? 1 : 0}));
      if(els.length >= 4 && els.some(e => e.col === 0) && els.some(e => e.col === 1))
        items.push(Object.assign(b, {question: it.question || "Classe chaque élément dans la bonne colonne.",
          colonnes: it.colonnes.map(String), elements: els}));
    } else if(it.type === "redaction" && it.question){
      items.push(Object.assign(b, {question:it.question, attendu:it.attendu || "",
        motsCles: Array.isArray(it.motsCles) && it.motsCles.length ? it.motsCles : motsCles(it.attendu || "", 6)}));
    } else if(it.type === "qcmMulti" && Array.isArray(it.options) && Array.isArray(it.reponses) && it.reponses.length){
      items.push(Object.assign(b, {question:it.question, options:it.options,
        reponses: it.reponses.map(Number).filter(n => n >= 0 && n < it.options.length)}));
    } else if(it.type === "vf" && it.question){
      items.push(Object.assign(b, {question:it.question, reponse: it.reponse === true || it.reponse === "true"}));
    } else if(it.type === "flash" && it.recto && it.verso){
      items.push(Object.assign(b, {recto:it.recto, verso:it.verso}));
    } else if(it.type === "cloze" && it.question && it.reponse){
      items.push(Object.assign(b, {question:it.question, reponse:it.reponse}));
    } else if(["ouverte","erreur","situation","comparer","pourquoi"].includes(it.type) && it.question){
      /* Types hérités : on les convertit en rédaction, seul format écrit encore admis,
         et seulement si le quota d'exercices à taper n'est pas déjà atteint. */
      if(items.filter(x => x.type === "redaction").length >= 1) return;
      items.push(Object.assign(b, {type:"redaction", niveau:4, visee:"comprehension",
        question:it.question, attendu:it.attendu || "",
        motsCles: Array.isArray(it.motsCles) && it.motsCles.length ? it.motsCles : motsCles(it.attendu || "", 6)}));
    } else if(it.type === "ordre" && Array.isArray(it.etapes) && it.etapes.length >= 3){
      items.push(Object.assign(b, {question: it.question || "Remets ces étapes dans l'ordre.", etapes:it.etapes}));
    }
  });
  /* Garde-fou : les exercices à taper ne peuvent pas dépasser un dixième du lot.
     Mieux vaut moins d'exercices que trop de saisie au clavier. */
  const cloze = [], red = [], reste = [];
  items.forEach(i => {
    if(i.type === "cloze") cloze.push(i);
    else if(i.type === "redaction") red.push(i);
    else reste.push(i);
  });
  /* Priorité au texte à trous de compréhension, qui porte le niveau 3,
     puis à la rédaction, qui porte le niveau 4. Les trous de mémorisation passent après. */
  const place = Math.min(3, Math.max(2, Math.round(reste.length / 9)));
  const rang = cloze.filter(i => viseeDe(i) === "comprehension")
    .concat(red.slice(0, 1))
    .concat(cloze.filter(i => viseeDe(i) !== "comprehension"));
  return {fiche, items: reste.concat(rang.slice(0, place))};
}

   Les pages photographiées sont déchiffrées par Gemini, puis relues et

const PAGES_MAX = 8;

/* Pour la lecture, on garde plus de définition que pour l'affichage. */
function preparerPhoto(source){
  return new Promise((ok, ko) => {
    const im = new Image();
    im.onload = () => {
      const ech = Math.min(1, 2000 / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.width * ech));
      c.height = Math.max(1, Math.round(im.height * ech));
      const g = c.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(im, 0, 0, c.width, c.height);
      ok({data: c.toDataURL("image/jpeg", 0.86), w:c.width, h:c.height});
    };
    im.onerror = () => ko(new Error("Photo illisible."));
    im.src = source;
  });
}

function consigneTranscription(){

"Tu transcris des pages de notes de cours manuscrites, prises par une étudiante française.",
"",
"RÈGLES ABSOLUES :",

"2. Un mot que tu ne parviens pas à lire devient [?]. Un passage entier illisible devient [passage illisible].",
"3. Ne devine jamais un chiffre, une date ou un nom propre : dans le doute, mets [?].",
"4. Conserve la structure : un titre devient une ligne commençant par « # », un élément de liste une ligne commençant par « - ».",
"5. Ce qui est souligné, surligné, encadré ou écrit en plus gros est entouré de doubles astérisques, comme **ceci**.",
"6. Restitue les pages dans l'ordre où elles te sont données, séparées par une ligne vide.",

  ].join("\n");
}

/* Prépare un lot de pages et l'ajoute à celles qui attendent le déchiffrage.
   Sert à l'appareil photo, à la galerie, et à l'aperçu d'un document Pages. */
async function poserPhotos(fichiers){
  const reste = PAGES_MAX - ui.photos.length;
  if(reste <= 0){
    ui.message = {titre:"Trop de pages", txt:"Huit pages au maximum par déchiffrage. Fais-en plusieurs lots."};
    rendre(); return 0;
  }
  ui.message = {type:"info", titre:"Préparation des pages", txt:"Un instant…"}; rendre();
  let ajoutees = 0, refusees = 0;
  for(const f of fichiers.slice(0, reste)){
    try{
      const lu = await new Promise((ok, ko) => {
        const fr = new FileReader();
        fr.onload = () => ok(fr.result); fr.onerror = () => ko(new Error("x"));
        fr.readAsDataURL(f);
      });
      ui.photos.push(await preparerPhoto(lu)); ajoutees++;
    }catch(e){ refusees++; }
  }
  ui.ecran = "import"; ui.tab = "rev";
  ui.message = {type:"info", titre:"Pages ajoutées",
    txt: ajoutees + " page" + (ajoutees>1?"s":"") + " prête" + (ajoutees>1?"s":"") +
      (refusees ? ", " + refusees + " refusée" + (refusees>1?"s":"") : "") +
      (fichiers.length > reste ? ". Les suivantes attendront le prochain lot." : "") +
      ". Lance le déchiffrage, puis relis le texte avant d'analyser."};
  rendre();
  return ajoutees;
}

async function transcrirePhotos(pages, cle, modele){
  const parts = pages.map(p => ({inlineData:{mimeType:"image/jpeg", data: p.data.split(",")[1]}}));
  parts.push({text:"Transcris ces " + pages.length + " page" + (pages.length > 1 ? "s" : "") + "."});
  const d = await appelGemini(cle, modele, {
    systemInstruction:{parts:[{text:consigneTranscription()}]},
    contents:[{role:"user", parts}],
    generationConfig:{temperature:0.1, maxOutputTokens:8192}
  });
  const cand = (d.candidates || [])[0];
  if(!cand) throw new Error("Rien n'est revenu. Essaie avec moins de pages à la fois.");
  const txt = ((cand.content && cand.content.parts) || []).map(p => p.text || "").join("").trim();
  if(txt.length < 40) throw new Error("La transcription est vide ou trop courte. Photos peut-être trop floues.");
  return txt;
}

/* Le balisage léger produit par la transcription est relu comme une mise en forme. */
function depuisMarkdown(texte){
  const blocs = [], forts = new Set();
  let re;
  const reFort = /\*\*([^*]{2,90})\*\*/g;
  while((re = reFort.exec(texte)) !== null) forts.add(re[1].trim());
  texte.replace(/\r/g,"").split("\n").forEach(l => {
    const t = l.trim();
    if(!t){ blocs.push({type:"vide", txt:"", fort:[]}); return; }
    const propres = [];
    let m2; const r2 = /\*\*([^*]{2,90})\*\*/g;
    while((m2 = r2.exec(t)) !== null) propres.push(m2[1].trim());
    const nu = t.replace(/\*\*/g, "").trim();
    if(/^#{1,4}\s+/.test(t)){ blocs.push({type:"titre", txt:nu.replace(/^#{1,4}\s+/,""), brut:t, fort:propres}); return; }
    const p = nu.match(RE_PUCE);
    if(p){ blocs.push({type:"puce", txt:p[1].trim(), brut:nu, fort:propres}); return; }
    blocs.push({type:"para", txt:nu, brut:nu, fort:propres});
  });
  return {blocs, forts:[...forts], images:[], tableaux:[],
    texte: blocs.map(b => b.txt).join("\n")};
}

function normaliserScenarios(o, ressId){
  const tab = x => Array.isArray(x) ? x : [];
  return tab(o.scenarios).map(s => {
    if(!s || !s.titre) return null;
    const tours = tab(s.tours).filter(t => t && t.app).map(t => ({
      app: String(t.app), attente: String(t.attente || ""),
      secondes: Math.max(20, Math.min(180, Number(t.secondes) || 60))}));
    if(tours.length < 2) return null;
    const grille = tab(s.grille).filter(g => g && g.critere)
      .map(g => ({critere:String(g.critere), aide:String(g.aide || "")}));
    if(!grille.length) return null;
    return {id:uid(), ressId, titre:String(s.titre), contexte:String(s.contexte || ""),
      role:String(s.role || ""), objectif:String(s.objectif || ""),
      tours, grille, source:String(s.source || ""), cree:Date.now()};
  }).filter(Boolean);
}

function matierePodcast(source){
  if(source.kind === "cours"){
    const c = S.cours.find(x => x.id === source.id);
    if(!c) return null;
    const f = ficheRetenue(c);
    const bl = (t, l) => l.length ? "\n" + t + "\n" + l.join("\n") : "";
    return {ressId:c.ressId, titre:c.titre, texte:
      (f.resume ? f.resume + "\n" : "") +
      bl("NOTIONS :", (f.notions||[]).map(x => {

        if(x.reform && (x.reform.simple || x.reform.tres))
          t += "\n  [dit plus simplement : " + (x.reform.tres || x.reform.simple) + "]";
        return t;
      })) +
      bl("À SAVOIR :", (f.parCoeur||[]).map(x => "- " + x.txt)) +
      bl("FORMULES :", (f.calculs||[]).map(x => "- " + x.txt)) +
      bl("CADRE JURIDIQUE :", (f.juridique||[]).map(x => "- " + x.txt)) +
      bl("ERREURS CLASSIQUES :", (f.pieges||[]).map(x => "- " + x.txt)) +
      bl("EXEMPLES :", (f.exemples||[]).map(x => "- " + x.txt)) +
      bl("SIGLES :", (f.sigles||[]).map(x => "- " + x.sigle + " : " + x.sens))};
  }
  const L = LECONS[source.id];
  if(!L) return null;
  const morceaux = [];
  L.diapos.forEach(d => {
    if(d.t === "sources" || d.t === "quiz") return;
    if(d.titre) morceaux.push("## " + d.titre);
    if(d.texte) morceaux.push(d.texte);
    if(d.paras) morceaux.push(d.paras.join(" "));
    if(d.mots) d.mots.forEach(m => morceaux.push("- " + m.m + " : " + m.d));

    if(d.note) morceaux.push(d.note);
  });
  return {ressId:L.ressId, titre:L.titre, texte:morceaux.join("\n")};
}

function base64VersOctets(b64){
  const bin = atob(b64);
  const o = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i);
  return o;
}
/* L'API renvoie du son brut : on lui ajoute l'en-tête d'un fichier WAV. */
function wavDepuisPcm(pcm, taux){
  const n = pcm.length, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const txt = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  txt(0, "RIFF"); v.setUint32(4, 36 + n, true); txt(8, "WAVE");
  txt(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, taux, true); v.setUint32(28, taux * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  txt(36, "data"); v.setUint32(40, n, true);
  new Uint8Array(buf, 44).set(pcm);
  return new Blob([buf], {type:"audio/wav"});
}
/* Découpe en segments courts, sur des fins de phrase, pour rester sous les limites. */
function segmenter(texte, max){
  const out = [];
  let courant = "";
  String(texte || "").split(/(?<=[.!?])\s+/).forEach(p => {
    if((courant + " " + p).trim().length > (max || 1400) && courant){ out.push(courant.trim()); courant = p; }
    else courant += " " + p;
  });
  if(courant.trim()) out.push(courant.trim());
  return out;
}
async function synthetiser(texte, cle, modele, voix, avance){
  const seg = segmenter(texte, 1400);
  const blocs = [];
  let taux = 24000;
  for(let i = 0; i < seg.length; i++){
    if(avance) avance(i + 1, seg.length);
    const corps = {
      contents:[{role:"user", parts:[{text: seg[i]}]}],
      generationConfig:{responseModalities:["AUDIO"]}
    };
    if(voix) corps.generationConfig.speechConfig =
      {voiceConfig:{prebuiltVoiceConfig:{voiceName: voix}}};
    const d = await appelGemini(cle, modele, corps);
    const cand = (d.candidates || [])[0];
    const part = cand && cand.content && (cand.content.parts || [])
      .find(p => p.inlineData && p.inlineData.data);
    if(!part) throw new Error("Aucun son renvoyé pour le passage " + (i + 1) + ".");
    const mt = part.inlineData.mimeType || "";
    const m = mt.match(/rate=(\d+)/);
    if(m) taux = Number(m[1]);
    blocs.push(base64VersOctets(part.inlineData.data));
  }
  const total = blocs.reduce((s, b) => s + b.length, 0);
  const tout = new Uint8Array(total);
  let o = 0;
  blocs.forEach(b => { tout.set(b, o); o += b.length; });
  return {blob: wavDepuisPcm(tout, taux), secondes: Math.round(total / 2 / taux)};
}

/* Journal d'activité : un compteur par jour et par banque, pour le tableau de bord. */
function noterJournal(b, juste){
  const cle = b === "prep" ? "journalPrep" : "journal";
  if(!S[cle]) S[cle] = {};
  const j = new Date().toISOString().slice(0,10);
  if(!S[cle][j]) S[cle][j] = {n:0, ok:0};
  S[cle][j].n++;

}
function activite(b, jours){
  const cle = b === "prep" ? "journalPrep" : "journal";
  const t = S[cle] || {}, out = [];
  for(let i = jours - 1; i >= 0; i--){
    const d = new Date(Date.now() - i * JOUR).toISOString().slice(0,10);
    out.push(Object.assign({jour:d}, t[d] || {n:0, ok:0}));
  }
  return out;
}
function majProg(id, juste, sur, b){
  const p = prog(id, b);
  noterJournal(b, juste);
  p.vus++; p.dernier = Date.now();
  if(juste){ p.ok++; p.boite = Math.min(3, p.boite + 1); if(p.ok >= p.ko) p.erreurConfiante = false; }
  else{ p.ko++; p.boite = 1; if(sur === true) p.erreurConfiante = true; }
  p.prochain = Date.now() + DELAIS[p.boite] * JOUR;
  sauver();
}

/* =========================================================================
   9 bis. MOYENNES
   Calcul pur, à partir des coefficients de la maquette et des notes saisies.
   Ce n'est pas une simulation de jury : les règles de validation et de
   compensation du B.U.T. n'ont pas pu être vérifiées, donc rien n'en est dit.
   ========================================================================= */
function notesDe(ressId){ return (S.notes || []).filter(n => n.ressId === ressId); }
function moyenneRess(ressId){
  const l = notesDe(ressId);
  if(!l.length) return null;
  return l.reduce((s,n) => s + Number(n.valeur), 0) / l.length;
}
function moyenneUE(ue, semestre){
  let cN = 0, somme = 0, cRestant = 0, cTotal = 0;
  TOUTES().forEach(r => {
    if(!r.c[ue]) return;
    if(semestre && r.s !== semestre) return;
    cTotal += r.c[ue];
    const m = moyenneRess(r.id);
    if(m === null) cRestant += r.c[ue];
    else { cN += r.c[ue]; somme += r.c[ue] * m; }
  });
  return {moyenne: cN ? somme / cN : null, coefNote:cN, coefRestant:cRestant, coefTotal:cTotal,
    somme, part: cTotal ? Math.round(cN / cTotal * 100) : 0};
}
/* Quelle moyenne faut-il sur ce qui reste pour atteindre la cible ? */
function ilFaut(ue, semestre, cible){
  const m = moyenneUE(ue, semestre);
  if(!m.coefRestant) return null;
  return (cible * m.coefTotal - m.somme) / m.coefRestant;
}
function moyenneSemestre(semestre){
  const l = [1,2,3].map(u => moyenneUE(u, semestre)).filter(x => x.moyenne !== null);
  if(!l.length) return null;
  return l.reduce((s,x) => s + x.moyenne, 0) / l.length;
}

   9 quater. BUDGET DE TEMPS
   Durées moyennes constatées, en secondes. Volontairement généreuses :
   mieux vaut finir en avance que d'être coupée en plein exercice.
   ========================================================================= */
const DUREES = {flash:20, vf:25, qcm:35, choix:45, qcmMulti:45, cloze:35, paires:75,
  ordre:60, classer:80, ouverte:120, comparer:120, pourquoi:120, situation:150,
  erreur:150, redaction:210};
function dureeDe(it){ return DUREES[it.type] || 40; }
/* Rentabilité : ce qui pèse lourd, qui est mal su, et qui tombe bientôt. */
function rentabilite(it){
  const r = RESSOURCE(it.ressId);
  const coef = r ? coefTotal(r) : 1;
  const p = S.progres[it.id];
  const faiblesse = !p ? 1 : (p.boite === 1 ? 1 : (p.boite === 2 ? 0.6 : 0.2));
  const confiante = p && p.erreurConfiante ? 1.4 : 1;
  const du = (!p || p.prochain <= Date.now()) ? 1.3 : 0.8;
  return coef * faiblesse * confiante * du;
}
function selonLeTemps(minutes, ressId){
  let l = tousItems();
  if(ressId) l = l.filter(i => i.ressId === ressId);
  l = l.slice().sort((a,b) => (rentabilite(b) / dureeDe(b)) - (rentabilite(a) / dureeDe(a)));
  const budget = minutes * 60;
  const out = [];
  let cumul = 0;
  for(const it of l){
    const d = dureeDe(it);
    if(cumul + d > budget) continue;
    out.push(it); cumul += d;
    if(cumul >= budget - 15) break;
  }
  return {liste: melanger(out), secondes: cumul};
}

/* Une liste collée : une entrée par ligne, séparateur =, :, — ou tabulation. */
function lireListeLexique(txt){
  const out = [], vus = new Set();
  String(txt || "").split("\n").forEach(l => {
    const t = l.trim();
    if(!t || t.length > 220) return;
    const m = t.match(/^(.{1,90}?)\s*(?:\t|=|:|\s—\s|\s–\s|\s-\s)\s*(.{1,90}?)\s*(?:\((.{2,90})\))?$/);
    if(!m) return;
    const fr = m[1].trim(), etr = m[2].trim();
    if(!fr || !etr || fr.length < 2 || etr.length < 2) return;
    const k = normaliser(fr) + "|" + normaliser(etr);
    if(vus.has(k)) return;
    vus.add(k);
    out.push({fr, etr, exemple: (m[3] || "").trim()});
  });
  return out;
}
function ajouterLexique(liste, langue, semestre){
  const ressId = ressLangue(langue, semestre);
  const deja = new Set(entreesLexique(langue, semestre).map(e => normaliser(e.fr) + "|" + normaliser(e.etr)));
  let n = 0;
  liste.forEach(x => {
    const k = normaliser(x.fr) + "|" + normaliser(x.etr);
    if(deja.has(k)) return;
    deja.add(k);
    S.lexique.push({id:uid(), langue, semestre, ressId, fr:x.fr, etr:x.etr,
      exemple:x.exemple || "", cree:Date.now()});
    n++;
  });
  if(n) sauver();
  return n;
}
function retirerLexique(id){
  S.lexique = (S.lexique || []).filter(e => e.id !== id);
  delete S.progres["lex:" + id + ":vers"];
  delete S.progres["lex:" + id + ":depuis"];
  sauver();
}
function etatEntree(e){
  const a = S.progres["lex:" + e.id + ":vers"], b = S.progres["lex:" + e.id + ":depuis"];
  const bo = x => x ? x.boite : 0;
  return {vers:bo(a), depuis:bo(b), su: bo(a) === 3 && bo(b) === 3};
}

const RUBRIQUES = [
  {k:"notions",  t:"Notions",            liste:false},
  {k:"parCoeur", t:"À savoir par cœur",  liste:true, cadre:"chaud"},
  {k:"calculs",  t:"Formules et calculs",liste:true, cadre:"chaud"},

  {k:"sigles",   t:"Sigles",             liste:false}
];

function cleTri(c){ if(!c.tri) c.tri = {off:{}, fort:{}}; return c.tri; }
function estRetire(c, ref){ return !!cleTri(c).off[ref]; }
function miseEnValeur(c, ref){ return cleTri(c).fort[ref] || "normal"; }

function ligneImp(c, ref, corps){
  if(estRetire(c, ref)) return "";
  const n = miseEnValeur(c, ref);
  if(n === "surligne") return "<div><mark>" + corps + "</mark></div>";
  if(n === "cadre") return '<div class="cadre">' + corps + "</div>";
  return "<div>" + corps + "</div>";
}
function section(titre, corps){
  return corps ? '<section><div class="marge">' + esc(titre) + '</div><div class="corps">' + corps + "</div></section>" : "";
}

/* Flashcards à découper : huit cartes par page, en deux colonnes.
   La page verso inverse l'ordre des colonnes pour que chaque dos
   tombe en face de son recto après une impression recto-verso. */
function cartesDuCours(c){
  const f = c.fiche, l = [];
  (f.notions || []).forEach((x,i) => { if(!estRetire(c, "notions" + i)) l.push({r:x.terme, v:x.def, et:"notion"}); });
  (f.sigles || []).forEach((x,i) => { if(!estRetire(c, "sigles" + i)) l.push({r:x.sigle, v:x.sens, et:"sigle"}); });
  (f.calculs || []).forEach((x,i) => { if(!estRetire(c, "calculs" + i)) l.push({r:"Formule", v:x.txt, et:"calcul"}); });
  return l;
}
function imprimerCartes(id){
  const c = S.cours.find(x => x.id === id); if(!c) return;
  const l = cartesDuCours(c);
  if(!l.length){
    ui.message = {titre:"Aucune carte à imprimer", txt:"Il faut au moins une notion ou un sigle retenu."};
    rendre(); return;
  }
  const PAR_PAGE = 8;
  const vide = '<div class="carte vide"></div>';
  const th = S.reglages.themeFiche ? " t-" + S.reglages.themeFiche : "";
  let h = '<div class="f' + th + '" style="padding:0">';
  for(let p = 0; p < l.length; p += PAR_PAGE){
    const lot = l.slice(p, p + PAR_PAGE);
    /* recto : ordre normal */
    h += '<div class="cartes">' + lot.map(x =>
      '<div class="carte"><span class="et">' + esc(x.et) + '</span><span class="r">' +
      esc(tronquer(x.r, 90)) + "</span></div>").join("") +
      Array(PAR_PAGE - lot.length).fill(vide).join("") + "</div>";
    /* verso : colonnes inversées deux à deux */
    const dos = [];
    for(let i = 0; i < PAR_PAGE; i += 2){
      dos.push(lot[i+1] || null);
      dos.push(lot[i] || null);
    }
    h += '<div class="cartes">' + dos.map(x => x
      ? '<div class="carte"><span class="v">' + esc(tronquer(x.v, 300)) + "</span></div>"
      : vide).join("") + "</div>";
  }
  $("#impression").innerHTML = h + "</div>";
  window.print();
}

/* Fiche téléphone : la même matière, découpée en écrans, une idée par écran. */
function ecransLecture(c){
  const f = c.fiche, e = [];
  const pris = (k,i) => !estRetire(c, k + i);
  if(f.resume) e.push({kick:"En deux mots", titre:c.titre, texte:f.resume});
  (f.notions || []).forEach((x,i) => { if(pris("notions",i))
    e.push({kick:"Notion " + String(e.length).padStart(2,"0"), titre:x.terme, texte:x.def,
      src:x.src, incertain:x.incertain}); });
  const groupe = (k, kick, get) => {
    const l = (f[k] || []).filter((_,i) => pris(k,i));
    if(l.length) e.push({kick, titre:kick, liste:l.map(get)});
  };
  groupe("parCoeur", "À savoir par cœur", x => x.txt);
  groupe("calculs", "Formules et calculs", x => x.txt);
  groupe("juridique", "Cadre juridique", x => x.txt);
  groupe("pieges", "Erreurs classiques", x => x.txt);
  groupe("exemples", "Exemples", x => x.txt);
  groupe("sigles", "Sigles", x => x.sigle + " — " + x.sens);
  if((f.lacunes || []).length) e.push({kick:"À demander en TD", titre:"Questions à poser", liste:f.lacunes});
  return e;
}
function ecranLire(){
  const c = S.cours.find(x => x.id === ui.fiche);
  if(!c){ ui.ecran = "fiches"; return ecranFiches(); }
  const e = ecransLecture(c);
  if(!e.length){ ui.ecran = "fiche"; return ecranFiche(); }
  const i = Math.min(Math.max(0, ui.lirePos || 0), e.length - 1);
  const d = e[i];
  let h = '<div class="lecon"><div class="lecon-haut">' +
    '<button class="fermer" data-act="ecran" data-e="fiche" aria-label="Fermer">×</button>' +
    '<div class="pts">' + e.map((_,k) => '<span class="' + (k <= i ? "f" : "") + '"></span>').join("") + "</div>" +
    '<span class="src">' + (i+1) + "/" + e.length + '</span></div><div class="diapo">';
  h += '<p class="kick">' + esc(d.kick) + "</p>";
  if(d.liste){
    h += "<h3>" + esc(d.titre) + '</h3><ul class="vocab">' +
      d.liste.map(x => "<li><span>" + esc(x) + "</span></li>").join("") + "</ul>";
  } else {
    h += "<h3>" + esc(d.titre) + "</h3><p>" + esc(d.texte) + "</p>";
    if(d.incertain) h += encartHtml({type:"piege", titre:"À vérifier",
      texte:"Ce point a été reconstitué à partir d'un fragment peu lisible de tes notes."});
    if(d.src) h += '<button class="src" data-act="src" data-cible="srcL">Voir tes notes</button>' +
      '<div class="srcTxt" id="srcL">« ' + esc(tronquer(d.src, 300)) + " »</div>";
  }
  h += "</div>";
  h += '<div style="display:flex;gap:9px;align-items:center">' +
    (i > 0 ? '<button class="btn" data-act="lire-prec">Retour</button>' : "") +
    '<button class="cta" style="flex:1;margin-top:0" data-act="' + (i === e.length - 1 ? "ecran" : "lire-suiv") + '"' +
    (i === e.length - 1 ? ' data-e="fiche"' : "") + ">" +
    (i === e.length - 1 ? "Terminer" : "Continuer") + "</button></div>";
  return h + "</div>";
}

async function imprimerFiche(id, mode){
  const c = S.cours.find(x => x.id === id); if(!c) return;
  const r = RESSOURCE(c.ressId), f = c.fiche;
  const visuels = (c.visuels || []).filter((v,i) => !estRetire(c, "visuels" + i));
  const imgs = await toutesImages(visuels.filter(v => v.kind === "image").map(v => v.id));
  const rendVisuel = v => {
    if(v.kind === "tableau"){
      return "<figure>" + tableauHtml(v.table, "imp") +
        (v.legende ? "<figcaption>" + esc(v.legende) + "</figcaption>" : "") + "</figure>";
    }
    const d = imgs[v.id];
    if(!d) return "";
    return '<figure><img src="' + d + '" alt="' + esc(v.legende || "schéma du cours") + '">' +
      (v.legende ? "<figcaption>" + esc(v.legende) + "</figcaption>" : "") + "</figure>";
  };
  const visuelsDe = cle => visuels.filter(v => v.ancre === cle).map(rendVisuel).join("");

  const th = S.reglages.themeFiche ? " t-" + S.reglages.themeFiche : "";
  const cls = "f" + th + (mode === "nb" ? " nb" : "") + (mode === "compact" ? " compact" : "");
  const ue = r ? ueDominante(r) : 1;
  let h = '<div class="' + cls + '"><div class="bandeau"></div><div class="tete">' +
    '<span class="meta">' + (r ? esc("coef " + coefTotal(r) + " · " + (r.h ? r.h + " h" : "SAÉ")) : "") + "</span>" +
    '<span class="code">' + esc(c.ressId || "—") + "</span>" +
    "<h1>" + esc(c.titre) + "</h1>" +
    '<div class="ue">' + esc(COMP[ue].code + " " + COMP[ue].nom) + " · semestre " + (r ? r.s : "—") +
    (mode === "muette" ? " · à compléter" : "") + "</div></div>";

  if(f.resume && mode !== "compact" && mode !== "muette") h += '<section><div class="marge">En deux mots</div><div class="corps">' + esc(f.resume) + "</div></section>";

  RUBRIQUES.forEach(rb => {
    const l = (f[rb.k] || []).filter((_,i) => !estRetire(c, rb.k + i));
    const vis = visuelsDe(rb.k);
    if(!l.length && !vis) return;
    let corps = "";
    if(rb.k === "notions"){
      let n = 0;
      corps = (f[rb.k] || []).map((x,i) => {
        if(estRetire(c, "notions" + i)) return "";
        n++;
        const inc = x.incertain ? ' <span style="font-size:8pt;color:#8A8074">(à vérifier)</span>' : "";
        const nv = S.reglages.reformImprimee || "";
        const ref = (nv && x.reform && x.reform[nv]) ? x.reform[nv] : "";
        const corpsN = mode === "muette"
          ? '<span class="terme">' + esc(x.terme) + '</span><span class="muet"></span><span class="muet court"></span>'
          : (ref
             ? '<div class="deux"><div><span class="terme">' + esc(x.terme) + "</span> — " + esc(x.def) + inc + "</div>" +
               '<div class="autreDit"><span class="lab">' + esc(NIVEAUX_REFORM[nv].nom) + "</span>" + esc(ref) + "</div></div>"
             : '<span class="terme">' + esc(x.terme) + "</span> — " + esc(x.def) + inc);
        const niv = miseEnValeur(c, "notions" + i);
        const inner = (mode !== "muette" && niv === "surligne") ? "<mark>" + corpsN + "</mark>"
          : (mode !== "muette" && niv === "cadre") ? '<div class="cadre">' + corpsN + "</div>" : corpsN;
        return '<div class="n"><span class="num">' + String(n).padStart(2,"0") + '</span><span class="txt">' + inner + "</span></div>";
      }).join("");
    } else if(rb.k === "sigles"){
      corps = (f[rb.k] || []).map((x,i) => estRetire(c, "sigles" + i) ? "" :
        '<div><span class="terme">' + esc(x.sigle) + "</span>" +
        (mode === "muette" ? '<span class="muet court"></span>' : " — " + esc(x.sens)) + "</div>").join("");
    } else {
      corps = (f[rb.k] || []).map((x,i) => {
        const ref = rb.k + i;
        if(estRetire(c, ref)) return "";
        let txt = x.txt;
        if(mode === "muette"){
          /* on efface les valeurs chiffrées : c'est ce qu'il faut savoir restituer */
          txt = txt.replace(new RegExp("\\b\\d+(?:[.,]\\d+)?\\s?(?:" + UNITES + ")?", "g"), "……");
        }
        let inner = esc(txt);
        if(rb.ex) inner = '<span class="ex">' + inner + "</span>";
        if(rb.alerte) return '<div class="alerte">' + inner + "</div>";
        return mode === "muette" ? "<div>" + inner + "</div>" : ligneImp(c, ref, inner);
      }).join("");
      if(rb.cadre && corps) corps = '<div class="cadre ' + rb.cadre + '">' + corps + "</div>";
    }
    h += section(rb.t, corps + vis);
  });

  const libres = visuelsDe("");
  if(libres) h += section("Schémas", libres);

  if((f.ajouts || []).length && mode !== "muette"){
    const corps = f.ajouts.map((a,i) => estRetire(c, "ajouts" + i) ? "" :
      '<div class="ajout"><span class="lab">Hors cours · à vérifier avec ta prof</span>' +
      esc(a.txt) + "<br>" + (a.liens || []).map(x => '<a>' + esc(tronquer(x.url, 70)) + "</a>").join("<br>") + "</div>").join("");
    h += section("Compléments", corps);
  }

  if(mode !== "compact"){
    h += section(mode === "muette" ? "À revoir" : "Mes questions",
      '<div class="lignes"><div></div><div></div><div></div><div></div></div>');
  }
  h += '<div class="pied"><span>' + esc(c.titre ? tronquer(c.titre, 46) : "") + "</span><span>" +
    esc("importé le " + dateFr(c.date)) + "</span></div></div>";
  $("#impression").innerHTML = h;
  window.print();
}

function imprimerErreurs(){
  const l = carnetErreurs();
  if(!l.length) return;
  const parR = {};
  l.forEach(i => (parR[i.ressId] = parR[i.ressId] || []).push(i));
  let h = '<div class="f"><div class="bandeau"></div><div class="tete"><span class="meta">' +
    l.length + " exercice" + (l.length>1?"s":"") + "</span>" +
    '<span class="code">CARNET D\'ERREURS</span><h1>Ce que je rate encore</h1></div>';
  Object.keys(parR).forEach(id => {
    const r = RESSOURCE(id);
    const corps = parR[id].map(i => {
      let rep = "";
      if(i.type === "flash") rep = i.verso;
      else if(i.type === "qcm") rep = i.options[i.reponse];
      else if(i.type === "qcmMulti") rep = (i.reponses||[]).map(n => i.options[n]).join(" ; ");
      else if(i.type === "vf") rep = i.reponse ? "Vrai" : "Faux";
      else if(i.type === "cloze") rep = i.reponse;
      else if(i.type === "ordre") rep = i.etapes.join(" → ");
      else if(i.type === "paires") rep = i.paires.map(p => p[0] + " → " + p[1]).join(" ; ");
      else rep = i.attendu || (i.motsCles || []).join(", ");
      return '<div class="n"><span class="num">·</span><span class="txt"><span class="terme">' +
        esc(i.question || i.recto || "") + "</span><br>" + esc(tronquer(rep, 240)) + "</span></div>";
    }).join("");
    h += section(r ? r.id : id, corps);
  });
  $("#impression").innerHTML = h + '<div class="pied"><span>Carnet d\'erreurs</span><span>' +
    esc(dateFr(new Date().toISOString())) + "</span></div></div>";
  window.print();
}

function lire(texte){
  if(!window.speechSynthesis){ ui.message = {titre:"Lecture indisponible", txt:"Ce navigateur ne propose pas de synthèse vocale."}; rendre(); return; }
  speechSynthesis.cancel();
  const m = new SpeechSynthesisUtterance(texte);
  m.lang = "fr-FR"; m.rate = Number(S.reglages.debitVoix) || 1;
  const v = speechSynthesis.getVoices().find(x => x.name === S.reglages.voix);
  if(v) m.voice = v;
  speechSynthesis.speak(m);
}
function texteFiche(c){
  const f = c.fiche;
  return [c.titre, f.resume,
    (f.notions||[]).map(d => d.terme + " : " + d.def).join(". "),
    (f.parCoeur||[]).map(p => p.txt).join(". ")].filter(Boolean).join(". ");
}
function scriptExterne(src){
  return new Promise((ok, ko) => {
    if(document.querySelector('script[src="' + src + '"]')) return ok();
    const s = document.createElement("script");
    s.src = src; s.onload = () => ok();
    s.onerror = () => ko(new Error("Chargement impossible : une connexion est nécessaire pour lire ce format."));
    document.head.appendChild(s);
  });
}
/* =========================================================================
   LECTURE D'UNE ARCHIVE — sans bibliothèque
   Un .pages, comme un .docx, est un dossier compressé. Le navigateur sait
   décompresser depuis iOS 16.4 ; en deçà, on le dit plutôt que d'échouer.
   ========================================================================= */
function litZip(){ return typeof DecompressionStream === "function" && typeof ReadableStream === "function"; }
async function ouvrirZip(buf){
  const vue = new DataView(buf), oct = new Uint8Array(buf);
  // on lit le catalogue de fin, plus fiable que de parcourir les en-têtes locaux
  let fin = -1;
  for(let i = oct.length - 22; i >= Math.max(0, oct.length - 66000); i--){
    if(vue.getUint32(i, true) === 0x06054b50){ fin = i; break; }
  }
  if(fin < 0) throw new Error("Ce fichier n'est pas une archive lisible.");
  const nb = vue.getUint16(fin + 10, true);
  let p = vue.getUint32(fin + 16, true);
  const entrees = [];
  for(let k = 0; k < nb && p + 46 <= oct.length; k++){
    if(vue.getUint32(p, true) !== 0x02014b50) break;
    const methode = vue.getUint16(p + 10, true);
    const tailleC = vue.getUint32(p + 20, true);
    const tailleD = vue.getUint32(p + 24, true);
    const lNom = vue.getUint16(p + 28, true);
    const lExtra = vue.getUint16(p + 30, true);
    const lComm = vue.getUint16(p + 32, true);
    const debutLocal = vue.getUint32(p + 42, true);
    const nom = new TextDecoder().decode(oct.subarray(p + 46, p + 46 + lNom));
    entrees.push({nom, methode, tailleC, tailleD, debutLocal});
    p += 46 + lNom + lExtra + lComm;
  }
  const extraire = async e => {
    const lNom = vue.getUint16(e.debutLocal + 26, true);
    const lExtra = vue.getUint16(e.debutLocal + 28, true);
    const deb = e.debutLocal + 30 + lNom + lExtra;
    const brut = oct.subarray(deb, deb + e.tailleC);
    if(e.methode === 0) return brut;
    if(e.methode !== 8) throw new Error("Compression non prise en charge dans cette archive.");
    if(!litZip()) throw new Error("Ce navigateur est trop ancien pour ouvrir ce format. Mets iOS à jour, ou exporte le document en PDF.");
    // on alimente le flux directement, sans dépendre de Blob.stream, absent des navigateurs anciens
    const source = new ReadableStream({start(c){ c.enqueue(brut.slice(0)); c.close(); }});
    const flux = source.pipeThrough(new DecompressionStream("deflate-raw"));
    const lecteur = flux.getReader();
    const bouts = []; let total = 0;
    for(;;){
      const {value, done} = await lecteur.read();
      if(done) break;
      bouts.push(value); total += value.length;
    }
    const out = new Uint8Array(total); let o = 0;
    bouts.forEach(b => { out.set(b, o); o += b.length; });
    return out;
  };
  return {entrees, extraire};
}

/* Un .pages moderne range son contenu dans un format binaire propriétaire,
   illisible de l'extérieur. On passe donc par l'aperçu que le document embarque
   presque toujours : d'abord un PDF, sinon le XML des anciennes versions,
   sinon les images d'aperçu, qui se transcrivent comme une photo. */
async function lirePages(f){
  const zip = await ouvrirZip(await f.arrayBuffer());
  const trouve = re => zip.entrees.find(e => re.test(e.nom) && e.tailleD > 0);

  const pdf = trouve(/(^|\/)(QuickLook\/)?Preview\.pdf$/i) || trouve(/\.pdf$/i);
  if(pdf){
    const oct = await zip.extraire(pdf);
    await chargerPdfJs();
    const doc = await window.pdfjsLib.getDocument({data: oct.slice(0).buffer}).promise;
    let t = "";
    for(let n = 1; n <= doc.numPages; n++){
      const page = await doc.getPage(n);
      t += (await page.getTextContent()).items.map(i => i.str).join(" ") + "\n\n";
    }
    if(t.trim().length > 120)
      return {texte:t, blocs:decouper(t), forts:[], images:[], tableaux:[],
        avis:"Lu depuis l'aperçu PDF inclus dans le document Pages."};
  }

  const xml = trouve(/(^|\/)index\.xml$/i);
  if(xml){
    const brut = new TextDecoder().decode(await zip.extraire(xml));
    const lignes = [];
    // on tente l'arbre XML ; un espace de noms manquant le fait echouer, d'ou le repli
    try{
      const doc = new DOMParser().parseFromString(brut, "application/xml");
      if(!doc.querySelector("parsererror")){
        doc.querySelectorAll("*").forEach(n => {
          if(!/(^|:)p$|(^|:)text-body$/.test(n.nodeName)) return;
          const t = (n.textContent || "").replace(/\s+/g, " ").trim();
          if(t && !lignes.includes(t)) lignes.push(t);
        });
      }
    }catch(e){}
    if(!lignes.length){
      let m; const re = /<(?:[\w-]+:)?p\b[^>]*>([\s\S]*?)<\/(?:[\w-]+:)?p>/g;
      while((m = re.exec(brut)) !== null){
        const t = m[1].replace(/<[^>]*>/g, " ").replace(/&[a-z]+;|&#\d+;/g, " ").replace(/\s+/g, " ").trim();
        if(t && !lignes.includes(t)) lignes.push(t);
      }
    }
    const t = lignes.join("\n");
    if(t.length > 120)
      return {texte:t, blocs:decouper(t), forts:[], images:[], tableaux:[],
        avis:"Lu depuis le format des anciennes versions de Pages."};
  }

  // dernier recours : les images d'aperçu, transcrites comme une photo
  const apercus = zip.entrees
    .filter(e => /preview[^/]*\.(jpe?g|png)$/i.test(e.nom) && e.tailleD > 8000)
    .sort((a,b) => b.tailleD - a.tailleD).slice(0, 4);
  if(apercus.length){
    const fichiers = [];
    for(const a of apercus){
      const oct = await zip.extraire(a);
      fichiers.push(new File([oct], a.nom.split("/").pop(), {type: /png$/i.test(a.nom) ? "image/png" : "image/jpeg"}));
    }
    return {pagesImages:fichiers,
      avis:"Ce document Pages ne livre pas son texte : seul son aperçu est lisible, soit " +
        fichiers.length + " image" + (fichiers.length>1?"s":"") + ". L'aperçu ne couvre souvent que la première page. " +
        "Pour tout récupérer, exporte depuis Pages en PDF ou en Word : Partager, puis Exporter."};
  }
  throw new Error("Ce document Pages ne contient aucun aperçu lisible. Depuis Pages, fais Partager puis Exporter, et choisis PDF ou Word.");
}

/* Un document de cours contient surtout des logos, des filets et des en-têtes.
   On écarte ce qui ne peut pas être un schéma : trop petit, trop allongé,
   ou répété à l'identique d'une page à l'autre. */
const IMG_MIN = 200, IMG_RATIO_MAX = 4;
function mesurerImages(srcs){
  return Promise.all(srcs.map(src => new Promise(ok => {
    const im = new Image();
    let fini = false;
    const rendu = (w, h) => { if(fini) return; fini = true; ok({src, w, h, taille:src.length}); };
    im.onload = () => rendu(im.naturalWidth || 0, im.naturalHeight || 0);
    // image illisible : on la garde plutôt que de perdre un schéma
    im.onerror = () => rendu(IMG_MIN, IMG_MIN);
    setTimeout(() => rendu(IMG_MIN, IMG_MIN), 4000);
    im.src = src;
  })));
}
function trierImages(liste){
  const gardees = [], rejets = {petite:0, allongee:0, repetee:0};
  const vues = new Map();
  liste.forEach(im => {
    const grand = Math.max(im.w, im.h), petit = Math.min(im.w, im.h);
    if(grand < IMG_MIN){ rejets.petite++; return; }
    if(petit > 0 && grand / petit > IMG_RATIO_MAX){ rejets.allongee++; return; }
    const empreinte = im.taille + "x" + im.w + "x" + im.h;
    vues.set(empreinte, (vues.get(empreinte) || 0) + 1);
    gardees.push(Object.assign({empreinte}, im));
  });
  // une image qui revient plusieurs fois à l'identique est un logo, pas un schéma
  const finales = gardees.filter(im => {
    if(vues.get(im.empreinte) > 1){ rejets.repetee++; return false; }
    return true;
  });
  return {images:finales, rejets, total:liste.length};
}
function resumeTri(t){
  const r = t.rejets, n = r.petite + r.allongee + r.repetee;
  if(!n) return "";
  const d = [];
  if(r.petite) d.push(r.petite + " trop petite" + (r.petite>1?"s":""));
  if(r.allongee) d.push(r.allongee + " en bandeau");
  if(r.repetee) d.push(r.repetee + " répétée" + (r.repetee>1?"s":"") + " sur plusieurs pages");
  return n + " image" + (n>1?"s":"") + " écartée" + (n>1?"s":"") + " (" + d.join(", ") + ") : logos et filets de mise en page.";
}

async function lireFichier(f){
  const nom = f.name.toLowerCase();
  if(/\.(txt|md|csv)$/.test(nom)){ const t = await f.text(); return {texte:t, blocs:decouper(t), forts:[], images:[], tableaux:[]}; }
  if(/\.docx$/.test(nom)){
    await scriptExterne("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    const buf = await f.arrayBuffer();
    const opts = {convertImage: window.mammoth.images.imgElement(async img => {
      const b64 = await img.read("base64");
      return {src: "data:" + (img.contentType || "image/png") + ";base64," + b64};
    })};
    const r = await window.mammoth.convertToHtml({arrayBuffer: buf}, opts);
    const src = depuisHtml(r.value || "");
    if(src.images.length){
      const tri = trierImages(await mesurerImages(src.images));
      src.images = tri.images.map(x => x.src);
      const res = resumeTri(tri);
      if(res) src.avis = res;
    }
    return src;
  }
  if(/\.pages$/.test(nom)) return await lirePages(f);
  if(/\.(jpe?g|png|heic|webp)$/.test(nom))
    return {pagesImages:[f], avis:"Image à transcrire : le texte sera déchiffré, puis tu le reliras avant analyse."};
  if(/\.pdf$/.test(nom)){
    await chargerPdfJs();
    const buf = await f.arrayBuffer();
    ui.pdfBuf = buf.slice(0);
    const doc = await window.pdfjsLib.getDocument({data: buf}).promise;
    let t = "";
    for(let p = 1; p <= doc.numPages; p++){
      const page = await doc.getPage(p);
      const c = await page.getTextContent();
      t += c.items.map(i => i.str).join(" ") + "\n\n";
    }
    return {texte:t, blocs:decouper(t), forts:[], images:[], tableaux:[], pdfPages: doc.numPages};
  }
  throw new Error("Format non pris en charge. Accepte : .txt, .md, .csv, .docx, .pdf, .pages, et les images JPG ou PNG.");
}
async function chargerPdfJs(){
  await scriptExterne("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

/* =========================================================================
   11 bis. ENREGISTREMENT
   Les prises restent en mémoire le temps de la séance : elles ne sont ni
   enregistrées sur l'appareil, ni envoyées nulle part. Si le micro est
   refusé ou indisponible, la séance continue au chronomètre seul.
   ========================================================================= */
let micro = null, enregistreur = null, morceaux = [];
function microDispo(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
async function ouvrirMicro(){
  if(!microDispo()) return false;
  if(micro) return true;
  try{ micro = await navigator.mediaDevices.getUserMedia({audio:true}); return true; }
  catch(e){ micro = null; return false; }
}
function fermerMicro(){
  try{ if(micro) micro.getTracks().forEach(t => t.stop()); }catch(e){}
  micro = null; enregistreur = null; morceaux = [];
}
function demarrerPrise(){
  if(!micro || !window.MediaRecorder) return false;
  try{
    morceaux = [];
    enregistreur = new MediaRecorder(micro);
    enregistreur.ondataavailable = e => { if(e.data && e.data.size) morceaux.push(e.data); };
    enregistreur.start();
    return true;
  }catch(e){ enregistreur = null; return false; }
}
function arreterPrise(){
  return new Promise(ok => {
    if(!enregistreur || enregistreur.state === "inactive"){ ok(null); return; }
    enregistreur.onstop = () => {
      try{
        const b = new Blob(morceaux, {type: (morceaux[0] && morceaux[0].type) || "audio/webm"});
        ok(b.size ? urlPour(b) : null);
      }catch(e){ ok(null); }
      enregistreur = null; morceaux = [];
    };
    try{ enregistreur.stop(); }catch(e){ enregistreur = null; ok(null); }
  });
}
function direReplique(t, apres){
  if(!window.speechSynthesis){ if(apres) apres(); return; }
  speechSynthesis.cancel();
  const m = new SpeechSynthesisUtterance(t);
  m.lang = "fr-FR"; m.rate = Number(S.reglages.debitVoix) || 1;
  const v = speechSynthesis.getVoices().find(x => x.name === S.reglages.voix);
  if(v) m.voice = v;
  m.onend = () => { if(apres) apres(); };
  m.onerror = () => { if(apres) apres(); };
  speechSynthesis.speak(m);
}

 {t:"notion", kick:"La carte du terrain", titre:"Médias, hors médias, médias sociaux",
  paras:["Le programme national demande d’analyser les moyens de communication commerciale en distinguant trois familles : les médias, le hors médias et les médias sociaux.",
   "Les médias correspondent à l’achat d’espace publicitaire. Le hors médias regroupe tout le reste : promotion des ventes, marketing direct, relations publiques, événementiel, imprimés sans adresse. Les médias sociaux, longtemps rangés dans l’un ou l’autre, sont aujourd’hui traités à part."],
  encart:{type:"info", titre:"Ce que tu feras en semestre 2", texte:"Cette carte sera dépliée en détail dans la ressource R2.01, Moyens de la communication commerciale. Ici, on pose le vocabulaire."}},

 {t:"notion", kick:"Le cadre légal", titre:"Le principe : pas de pratique déloyale",
  paras:["L’article L. 121-1 du code de la consommation pose l’interdiction générale : les pratiques commerciales déloyales sont interdites. Une pratique est déloyale lorsqu’elle est contraire aux exigences de la diligence professionnelle et qu’elle altère, ou est susceptible d’altérer de manière substantielle, le comportement économique du consommateur.",
   "Le texte précise que le caractère déloyal d’une pratique visant un groupe vulnérable — en raison d’une infirmité, de l’âge ou de la crédulité — s’apprécie au regard de la capacité moyenne de discernement de ce groupe."],
  encart:{type:"info", titre:"Deux branches", texte:"Le même article renvoie aux deux grandes catégories de pratiques déloyales : les pratiques trompeuses, aux articles L. 121-2 à L. 121-4, et les pratiques agressives, aux articles L. 121-6 et L. 121-7."}},

 {t:"notion", kick:"Le cadre légal", titre:"Tromper en disant, tromper en taisant",
  paras:["L’article L. 121-2 vise la tromperie par action : créer une confusion avec un signe distinctif d’un concurrent, ou reposer sur des allégations fausses ou de nature à induire en erreur portant sur l’existence, la disponibilité, la nature ou les caractéristiques essentielles du bien ou du service. Est aussi trompeuse la pratique dont la personne pour le compte de laquelle elle est mise en œuvre n’est pas clairement identifiable.",
   "L’article L. 121-3 vise la tromperie par omission : omettre, dissimuler, ou fournir de façon inintelligible, ambiguë ou à contretemps une information substantielle. Dans une invitation à l’achat mentionnant le prix, sont substantielles notamment les caractéristiques principales du bien, l’identité du professionnel, le prix toutes taxes comprises et les frais de livraison, et l’existence d’un droit de rétractation lorsque la loi le prévoit."],
  encart:{type:"piege", titre:"Le piège d’examen", texte:"Ne pas mentir ne suffit pas. Une publicité parfaitement exacte peut être trompeuse si elle tait une information substantielle. C’est exactement la distinction entre L. 121-2 et L. 121-3."}},

 {t:"quiz", kick:"Vérification", question:"Une annonce indique un prix attractif, mais les frais de livraison obligatoires n’apparaissent nulle part. Tout ce qui est écrit est exact. Que dit le code de la consommation ?",
  options:["Rien : aucune information n’est fausse",
   "C’est une pratique trompeuse par omission, car le prix toutes taxes comprises et les frais de livraison sont des informations substantielles",
   "C’est une pratique agressive"],
  bonne:1,
  expl:"L’article L. 121-3 range parmi les informations substantielles, dans une invitation à l’achat mentionnant le prix, le prix toutes taxes comprises et les frais de livraison à la charge du consommateur. Les taire rend la pratique trompeuse, même sans le moindre mensonge."},

 {t:"notion", kick:"L’autre régulation", titre:"L’ARPP, ou la profession qui se discipline elle-même",
  paras:["À côté de la loi, il existe en France une autorégulation publicitaire. L’Autorité de régulation professionnelle de la publicité est une association interprofessionnelle privée, régie par la loi de 1901, administrée par les représentants des professions publicitaires : annonceurs, agences, médias, régies et supports.",
   "Sa mission est de mener toute action en faveur d’une publicité loyale, véridique et saine, dans l’intérêt des consommateurs, du public et des professionnels. Elle assure un contrôle avant diffusion des publicités audiovisuelles, délivre des conseils sur tous les médias, et élabore des règles déontologiques appelées Recommandations."],
  encart:{type:"info", titre:"Droit dur, droit souple", texte:"L’ARPP décrit son action comme relevant du droit souple : ses règles ne remplacent pas la loi, elles la complètent et l’explicitent. Les professionnels se les donnent volontairement, au-delà des contraintes légales."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les trois instances associées", mots:[
  {m:"CEP", d:"Conseil de l’éthique publicitaire, créé en 2005. Instance de réflexion, il éclaire le conseil d’administration de l’ARPP sur les problèmes de fond, notamment éthiques."},
  {m:"CPP", d:"Conseil paritaire de la publicité. Instance de concertation, il est consulté lors de l’élaboration des Recommandations."},
  {m:"JDP", d:"Jury de déontologie publicitaire. Instance de contrôle, il traite les plaintes de toute personne physique ou morale et se prononce publiquement sur la conformité des campagnes."}],
  note:"Le CPP et le JDP ont été créés en 2008, année où l’organisme a pris le nom d’ARPP."},

 {t:"chiffres", kick:"À mémoriser", titre:"Les repères de l’autorégulation", lignes:[
  {v:"1935", l:"création, sous le nom d’Office de contrôle des annonces"},
  {v:"1953", l:"l’organisme devient Bureau de vérification de la publicité"},
  {v:"2008", l:"il prend le nom d’ARPP et se dote du CPP et du JDP"},
  {v:"28", l:"Recommandations après la refonte du Code de l’ARPP"}],
  note:"Le Code de l’ARPP a été relu et actualisé au cours des années 2015 et 2016, puis simplifié en 28 Recommandations."},

 {t:"encart", kick:"Attention, ça a changé", titre:"Les influenceurs sont désormais encadrés par la loi", type:"garde",
  texte:"Beaucoup de supports antérieurs à 2023 présentent l’influence commerciale comme une zone grise. Ce n’est plus le cas. La loi n° 2023-451 du 9 juin 2023 définit l’activité d’influence commerciale et impose, en son article 5, que toute promotion soit explicitement indiquée par la mention « Publicité » ou « Collaboration commerciale », claire, lisible et identifiable, pendant l’intégralité de la promotion. Le texte précise que l’absence d’indication de la véritable intention commerciale constitue une pratique commerciale trompeuse par omission au sens de l’article L. 121-3 du code de la consommation, et prévoit deux ans d’emprisonnement et 300 000 euros d’amende."},

 {t:"notion", kick:"La création", titre:"Le message : le fond et la forme",
  paras:["Le programme national demande de maîtriser les bases du message publicitaire, en distinguant le fond et la forme. Le fond, c’est ce qu’on dit : la promesse, l’argument, la preuve. La forme, c’est comment on le dit : couleurs, formes, contrastes, et surtout cohérence.",
   "Ce mot de cohérence revient partout. Cohérence entre le message et le brief, entre la forme et la cible, entre la campagne et le reste du mix. C’est le critère d’évaluation le plus fréquent des travaux qu’on te demandera."],
  encart:{type:"astuce", titre:"Ce que ton prof regardera", texte:"Sur un support que tu produis, une faute de cohérence coûte plus cher qu’une maladresse graphique. Une belle affiche qui parle à la mauvaise cible est une mauvaise affiche."}},

 {t:"notion", kick:"La production", titre:"Les outils imprimés que tu vas fabriquer",
  paras:["La ressource se termine sur des outils simples de communication imprimée : affiches, encarts presse, flyers, plaquettes. Le programme mentionne aussi l’imprimé sans adresse, souvent abrégé ISA, ce prospectus distribué en boîte aux lettres sans nom de destinataire.",
   "Tu ne feras pas que les analyser : l’apprentissage critique 3.3 attendu au niveau 1 est d’élaborer des supports simples. On te demandera d’en produire."],
  encart:{type:"info", titre:"Deux matières en renfort", texte:"Le traitement d’image se travaille en R1.13, Ressources et culture numériques. Le droit à l’image et le droit d’auteur se travaillent en R1.06, Environnement juridique. Ces trois matières se rejoignent dans la même SAÉ."}},

 {t:"notion", kick:"La mesure", titre:"Notoriété et image, deux choses différentes",
  paras:["Le programme demande de connaître les indicateurs de notoriété et d’image. La notoriété mesure si l’on te connaît : combien de personnes citent la marque, spontanément ou après qu’on la leur a montrée. L’image mesure ce qu’on pense de toi : quelles qualités, quelles valeurs, quelles associations d’idées.",
   "Une marque peut avoir une notoriété très forte et une image détestable. Les deux se mesurent séparément, et l’une ne dit rien de l’autre."],
  encart:{type:"piege", titre:"L’erreur classique", texte:"Confondre les deux dans une copie coûte cher, parce que c’est précisément la distinction que la question cherche à tester."}},

 {t:"quiz", kick:"Vérification", question:"Une agence conçoit une campagne. Qui a payé et pour le compte de qui le message est-il diffusé ?",
  options:["L’agence, qui se fait ensuite rembourser par le support",
   "L’annonceur, qui est le donneur d’ordre",
   "La régie, qui achète l’espace et le revend"],
  bonne:1,
  expl:"L’annonceur est l’organisation pour le compte de laquelle le message est diffusé : c’est lui qui commande et qui paie. L’agence conçoit, la régie commercialise les espaces d’un support. Ces trois rôles sont distincts et le programme national demande de les connaître."},

 {t:"notion", kick:"Ce qui t’attend", titre:"La SAÉ de communication du semestre 1",
  paras:["Cette ressource alimente une situation d’apprentissage précise : la création d’un support imprimé. Le programme national la décrit comme l’analyse des outils imprimés des concurrents d’un secteur, puis l’élaboration d’un support destiné à une cible de consommateurs, en cohérence avec la stratégie de communication et le mix de l’organisation.",
   "Sur la maquette de Carcassonne, cette SAÉ porte le numéro 1.1 et pèse 5 de coefficient dans l’UE Communiquer. Le programme national, lui, la numérote 1.03. Les deux codes désignent le même travail."],
  encart:{type:"astuce", titre:"Anticipe", texte:"Les exemples donnés par le programme national sont la plaquette d’entreprise, le concours d’affiches et l’étude d’une campagne. Commence à collecter les affiches et les flyers qui te tombent sous la main : tu auras une matière première."}},

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",
  etapes:["Quels indicateurs de notoriété et d’image exactement seront exigibles, et sous quelle formulation",
   "Quel découpage des cibles est retenu dans le cours — cœur de cible, cible principale, relais — car il varie d’un enseignant à l’autre",
   "Quel logiciel sera utilisé pour produire les supports imprimés, et s’il faut l’installer avant"],
  note:"Poser ces questions le premier jour n’est pas de la flatterie : ce sont exactement les points sur lesquels les cours diffèrent, et donc ceux qu’il faut caler tôt."},

 {type:"qcm","visee":"memo","question":"Pour une pratique visant un groupe vulnérable, au regard de quoi l’article L. 121-1 apprécie-t-il son caractère déloyal ?","options":["Du consommateur le plus averti","De l’avis du Jury de déontologie publicitaire","Du chiffre d’affaires réalisé","De la capacité moyenne de discernement de ce groupe"],"reponse":3,"correction":"Quand la pratique vise un groupe vulnérable en raison d’une infirmité, de l’âge ou de la crédulité, le texte retient la capacité moyenne de discernement de ce groupe.","source":"Code de la consommation, article L. 121-1","diapo":7},
 {type:"paires","visee":"memo","question":"Associe chaque nom à ce qu’il désigne.","paires":[["CEP","Instance de réflexion, créée en 2005"],["CPP","Instance de concertation, consultée sur les Recommandations"],["JDP","Instance de contrôle, qui traite les plaintes"],["Office de contrôle des annonces","Nom de l’organisme à sa création, en 1935"],["Bureau de vérification de la publicité","Nom pris par l’organisme en 1953"]],"source":"ARPP, rôles et missions ; Institut national de la consommation","diapo":11},
 {type:"classer","visee":"comprehension","niveau":2,"question":"Range chaque pratique selon qu’elle trompe en disant (L. 121-2) ou en taisant (L. 121-3).","colonnes":["Tromper en disant","Tromper en taisant"],"elements":[{"txt":"Créer une confusion avec le signe distinctif d’un concurrent","col":0},{"txt":"Dissimuler une information substantielle","col":1},{"txt":"Affirmer à tort qu’un produit est disponible","col":0},{"txt":"Fournir une information substantielle de façon ambiguë","col":1},{"txt":"Allégation trompeuse sur les caractéristiques essentielles du bien","col":0},{"txt":"Donner une information substantielle à contretemps","col":1},{"txt":"Une allégation fausse sur l’existence du bien","col":0},{"txt":"Taire les frais de livraison dans une annonce avec prix","col":1}],"correction":"L. 121-2 vise la tromperie par action : confusion avec un concurrent, allégations fausses ou de nature à induire en erreur ; L. 121-3 vise l’omission, la dissimulation ou l’information inintelligible, ambiguë ou à contretemps.","source":"Code de la consommation, articles L. 121-2 et L. 121-3","diapo":8},
 {type:"classer","visee":"comprehension","niveau":2,"question":"Range chaque mesure du côté de la notoriété ou du côté de l’image.","colonnes":["Notoriété","Image"],"elements":[{"txt":"Savoir si l’on connaît la marque","col":0},{"txt":"Les qualités associées à la marque","col":1},{"txt":"Le nombre de personnes qui citent la marque spontanément","col":0},{"txt":"Les valeurs qu’on prête à la marque","col":1},{"txt":"Le nombre de personnes qui la reconnaissent quand on la leur montre","col":0},{"txt":"Les associations d’idées qu’elle évoque","col":1},{"txt":"Ce que l’on pense de la marque","col":1}],"correction":"La notoriété mesure si l’on te connaît ; l’image mesure ce qu’on pense de toi. Les deux se mesurent séparément.","source":"Fiche Ressource R1.03, indicateurs de notoriété et d’image","diapo":16},
 {type:"choix","visee":"comprehension","niveau":1,"angle":"situation","question":"Une marque de jouets diffuse une publicité pensée pour les enfants, alors que ce sont les parents qui paient. Comment l’analyser ?","options":["Les enfants sont à la fois la cible marketing et la cible de communication","Les parents sont la cible marketing, les enfants la cible de communication","Les enfants sont la cible marketing, les parents la cible de communication","La marque a commis une erreur de ciblage"],"reponse":1,"correction":"La marque vend aux parents, qui paient, et parle aux enfants, qui réclament : cible marketing et cible de communication ne se confondent pas.","source":"Fiche Ressource R1.03, cibles de communication","diapo":5},
 {type:"choix","visee":"comprehension","niveau":1,"angle":"situation","question":"Pour la SAÉ, tu produis une affiche très réussie graphiquement, mais qui parle à une autre cible que celle du brief. Comment sera-t-elle jugée ?","options":["Positivement, car la qualité graphique est le premier critère évalué","Positivement, dès lors qu’elle respecte la loi et le format demandé","Sévèrement : la cohérence compte plus que la réussite graphique","Sans conséquence, la cible n’étant pas un critère d’évaluation"],"reponse":2,"correction":"La cohérence est le critère d’évaluation le plus fréquent : une belle affiche qui parle à la mauvaise cible est une mauvaise affiche.","source":"Fiche Ressource R1.03, bases du message publicitaire","diapo":14},
 {type:"choix","visee":"comprehension","niveau":1,"angle":"explication","question":"Pourquoi l’ARPP décrit-elle son action comme relevant du droit souple ?","options":["Parce que ses règles complètent la loi sans la remplacer, et sont adoptées volontairement","Parce qu’elle peut prononcer des peines d’emprisonnement contre les annonceurs","Parce que ses règles s’appliquent uniquement aux particuliers, pas aux entreprises","Parce qu’elle est une autorité administrative dont les règles remplacent la loi"],"reponse":0,"correction":"Les règles de l’ARPP complètent et explicitent la loi, au-delà des contraintes légales, sans s’y substituer.","source":"ARPP, rôles et missions","diapo":10},
 {type:"choix","visee":"comprehension","niveau":1,"angle":"situation","question":"Un support de cours daté de 2021 présente l’influence commerciale comme une zone grise, sans règle spécifique. Que faut-il en penser ?","options":["Il reste à jour, car seule l’ARPP encadre les influenceurs, par ses Recommandations","Il est dépassé : la loi du 9 juin 2023 définit et encadre l’influence commerciale","Il est exact pour les influenceurs, mais pas pour les marques qui les rémunèrent","Il est exact tant que la collaboration n’est pas rémunérée en argent"],"reponse":1,"correction":"Depuis la loi n° 2023-451 du 9 juin 2023, l’activité d’influence commerciale est définie par la loi et toute promotion doit être signalée.","source":"Loi n° 2023-451 du 9 juin 2023, article 5","diapo":13},
 {type:"choix","visee":"comprehension","niveau":1,"angle":"justification","question":"Pourquoi un influenceur qui omet la mention « Publicité » peut-il être visé par l’article L. 121-3 du code de la consommation ?","options":["Parce que l’influence non signalée est une pratique agressive au sens du code","Parce que la loi interdit toute promotion de produits sur les réseaux sociaux depuis 2023","Parce que la loi de 2023 qualifie ce silence de pratique trompeuse par omission","Parce que l’ARPP a le pouvoir de le condamner à une amende"],"reponse":2,"correction":"L’article 5 de la loi du 9 juin 2023 renvoie explicitement à l’article L. 121-3 : taire la véritable intention commerciale, c’est tromper par omission.","source":"Loi n° 2023-451 du 9 juin 2023, article 5","diapo":13},
 {type:"ordre","visee":"comprehension","niveau":2,"question":"Remets dans l’ordre chronologique l’histoire de l’autorégulation publicitaire.","etapes":["Création de l’Office de contrôle des annonces","L’organisme devient Bureau de vérification de la publicité","Création du Conseil de l’éthique publicitaire","L’organisme prend le nom d’ARPP et se dote du CPP et du JDP","Relecture et actualisation du Code de l’ARPP"],"correction":"1935, 1953, 2005, 2008, puis 2015-2016 pour la refonte du Code en 28 Recommandations.","source":"Institut national de la consommation, historique de l’ARPP ; ARPP, rôles et missions","diapo":12},
