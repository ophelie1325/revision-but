/* ---- R1.03 Environnement juridique de l'entreprise — vérifiée le 7 septembre 2026 ---- */
"R1.06": {titre:"Environnement juridique de l'entreprise", ressId:"R1.06", duree:"17 min", diapos:[
 {t:"intro", kick:"R1.06 · avant le premier cours", titre:"Le droit n'est pas là pour t'embêter, il est là pour te protéger",
  texte:"C'est la matière que les étudiants de TC redoutent le plus, souvent parce qu'ils l'abordent comme une liste de règles à subir. Prends-la autrement : à chaque fois que tu vendras, communiqueras ou signeras quelque chose, le droit dira qui est responsable si ça tourne mal. Savoir ça, c'est savoir où tu mets les pieds."},

 {t:"notion", kick:"Le programme", titre:"Ce qui sera réellement abordé",
  paras:["Le programme national fixe deux objectifs. Le premier : identifier les différents acteurs civils et commerciaux, ainsi que l'origine des réglementations, pour mesurer les risques et sécuriser les actions entreprises. Le second : respecter les obligations légales dans la réalisation de documents de communication commerciale.",
   "Le contenu annonce l'environnement juridique et judiciaire, les acteurs du monde des affaires — c'est-à-dire les personnes —, les biens et le patrimoine, la responsabilité civile, les moyens de preuve, puis des éléments de propriété intellectuelle avec les droits d'auteur et la charte graphique, et enfin le droit à l'image."],
  encart:{type:"info", titre:"Les cinq mots clés du programme", texte:"Réglementation, responsabilité, preuves, propriété intellectuelle, droit à l'image. Si tu retiens l'organisation du cours autour de ces cinq mots, tu ne seras jamais perdue."}},

 {t:"notion", kick:"Le lien avec le reste", titre:"Cette matière ne vit pas seule",
  paras:["Le programme national rattache R1.06 à deux compétences : Marketing, pour analyser l'environnement d'une entreprise, et Communication commerciale, pour élaborer des supports simples dans le respect de la loi.",
   "Concrètement, elle alimente deux situations d'apprentissage du semestre : celle de marketing, où l'on analyse l'environnement juridique d'une organisation, et celle de communication, où l'on produit un support imprimé. C'est dans la seconde que le droit à l'image et le droit d'auteur deviennent très concrets."],
  encart:{type:"astuce", titre:"À Carcassonne", texte:"La matière pèse 0,5 dans l'UE Marketer et 1 dans l'UE Communiquer, pour 18 heures. Le coefficient est plus lourd du côté communication : ce n'est pas un hasard."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les acteurs, c'est-à-dire les personnes", mots:[
  {m:"Personne physique", d:"Un être humain. Il a des droits dès sa naissance et jusqu'à sa mort."},
  {m:"Personne morale", d:"Un groupement auquel le droit reconnaît une existence propre : une société, une association. Elle a son nom, son siège, son patrimoine, distincts de ceux de ses membres."},
  {m:"Patrimoine", d:"L'ensemble des droits et des obligations d'une personne, son actif et son passif. Chaque personne en a un, et un seul par principe."},
  {m:"Capacité", d:"L'aptitude à être titulaire de droits et à les exercer soi-même. Un mineur a des droits mais ne peut pas tous les exercer seul."}],
  note:"Le programme national désigne cette partie sous l'expression « les acteurs du monde des affaires (les personnes) ». C'est le point de départ de tout : avant de savoir qui doit quoi, il faut savoir qui est qui."},

 {t:"notion", kick:"L'idée à comprendre", titre:"Pourquoi la personne morale change tout",
  paras:["Quand une société commet une faute, c'est la société qui répond, sur son patrimoine à elle. Ses associés ne sont pas confondus avec elle. C'est toute l'utilité de la personnalité morale, et c'est la première chose qu'on te demandera de savoir manier.",
   "En commerce, cela veut dire que tu ne signes pas avec un individu mais avec une entité. Savoir qui est juridiquement engagé, et qui a le pouvoir de signer pour elle, est une question que tu te poseras toute ta carrière."],
  encart:{type:"piege", titre:"Erreur classique", texte:"Confondre l'entreprise et son dirigeant. Le gérant qui signe un contrat au nom de la société n'engage pas son patrimoine personnel — sauf exceptions que le cours détaillera."}},

 {t:"notion", kick:"Le cœur de la matière", titre:"La responsabilité civile en une phrase",
  paras:["L'article 1240 du code civil pose le principe : tout fait quelconque de l'homme, qui cause à autrui un dommage, oblige celui par la faute duquel il est arrivé à le réparer.",
   "L'article suivant, 1241, élargit : chacun est responsable du dommage qu'il a causé non seulement par son fait, mais encore par sa négligence ou par son imprudence. Autrement dit, on n'a pas besoin d'avoir voulu nuire pour devoir réparer."],
  encart:{type:"info", titre:"Le mot juste", texte:"On parle de responsabilité extracontractuelle quand il n'y a pas de contrat entre les parties. Quand il y en a un, on est en responsabilité contractuelle. Le cours distinguera les deux régimes."}},

 {t:"etapes", kick:"La mécanique", titre:"Les trois conditions à réunir",
  etapes:["Une faute, ou un fait générateur imputable à quelqu'un",
   "Un dommage, c'est-à-dire un préjudice subi par la victime",
   "Un lien de causalité entre les deux : c'est bien cette faute qui a causé ce dommage"],
  note:"Ces trois éléments sont ceux qu'on te demandera d'identifier dans un cas pratique. L'ordre importe peu, mais l'oubli d'un seul fait tomber le raisonnement."},

 {t:"notion", kick:"Réparer, pas punir", titre:"Ce que vise la responsabilité civile",
  paras:["La responsabilité civile ne punit pas : elle répare. Son but est de replacer la victime dans la situation où elle se serait trouvée sans le dommage. C'est ce qui la distingue de la responsabilité pénale, qui sanctionne au nom de la société.",
   "Un même fait peut déclencher les deux. Une publicité mensongère peut valoir des sanctions pénales au titre des pratiques commerciales trompeuses, et une condamnation civile à indemniser le concurrent lésé."],
  encart:{type:"astuce", titre:"Le pont avec R1.03", texte:"Tu as vu en communication commerciale les articles L. 121-1 et suivants du code de la consommation. Les deux matières se répondent : l'une décrit l'interdit, l'autre explique qui paie."}},

 {t:"quiz", kick:"Vérification", question:"Un salarié oublie de vérifier une information dans une plaquette commerciale. L'erreur cause un préjudice à un client. Le salarié n'avait aucune intention de nuire. Que dit le code civil ?",
  options:["Sans intention de nuire, il n'y a pas de responsabilité",
   "La responsabilité peut être engagée : l'article 1241 vise le dommage causé par négligence ou par imprudence",
   "Seul le client peut être tenu responsable de ne pas avoir vérifié"],
  bonne:1,
  expl:"L'article 1241 du code civil est explicite : chacun est responsable du dommage causé non seulement par son fait, mais encore par sa négligence ou son imprudence. L'intention n'est pas une condition."},

 {t:"notion", kick:"Sans preuve, pas de droit", titre:"Qui doit prouver quoi",
  paras:["L'article 1353 du code civil fixe la règle : celui qui réclame l'exécution d'une obligation doit la prouver. Et réciproquement, celui qui se prétend libéré doit justifier le paiement ou le fait qui a produit l'extinction de son obligation.",
   "Traduit en langage commercial : si tu affirmes qu'un client te doit de l'argent, c'est à toi de le démontrer. S'il affirme avoir payé, c'est à lui de le prouver. La charge de la preuve se déplace au fil du débat."],
  encart:{type:"piege", titre:"La leçon professionnelle", texte:"Un accord oral vaut, mais il ne se prouve pas. C'est pour ça que le commerce écrit tout : devis, bons de commande, conditions générales, courriels de confirmation. Ce réflexe se prend maintenant."}},

 {t:"notion", kick:"Ce que tu produiras", titre:"Propriété intellectuelle : tu ne prends pas ce qui traîne",
  paras:["Le programme prévoit des éléments de propriété intellectuelle, avec les droits d'auteur et la charte graphique. La règle de fond est simple à formuler : une création ne devient pas libre parce qu'elle est accessible. Une image trouvée sur internet a un auteur, et cet auteur a des droits.",
   "Dans la SAÉ de communication, on te demandera de choisir des illustrations dans le respect du droit. Ce n'est pas une consigne de forme : c'est un critère d'évaluation, et le programme national le mentionne explicitement."],
  encart:{type:"astuce", titre:"Prends l'habitude tout de suite", texte:"Note la provenance et la licence de chaque image que tu utilises, dès le premier devoir. Reconstituer ça après coup est un enfer, et tu en auras besoin pour ton portfolio."}},

 {t:"notion", kick:"Ce que tu produiras", titre:"Le droit à l'image, l'autre autorisation",
  paras:["Le droit d'auteur protège celui qui a créé l'image. Le droit à l'image protège celui qui est sur l'image. Ce sont deux autorisations différentes, et il faut souvent les deux.",
   "Photographier une personne identifiable pour un support commercial suppose son accord. Le programme national inscrit le droit à l'image parmi les contenus de cette ressource, en lien direct avec la production de supports de communication."],
  encart:{type:"piege", titre:"Le piège du devoir", texte:"Utiliser une photo de camarades pour une affiche de SAÉ sans leur demander. C'est exactement le genre de détail qui coûte des points, et le prof le sait."}},

 {t:"chiffres", kick:"À mémoriser", titre:"Les quatre articles à connaître", lignes:[
  {v:"1240", l:"code civil · la faute qui cause un dommage oblige à réparer"},
  {v:"1241", l:"code civil · la négligence et l'imprudence engagent aussi"},
  {v:"1353", l:"code civil · qui réclame doit prouver"},
  {v:"L. 121-1", l:"code de la consommation · interdiction des pratiques déloyales"}],
  note:"Les trois premiers ont été renumérotés par l'ordonnance du 10 février 2016. Les anciens articles 1382, 1383 et 1315 désignent les mêmes règles : si un manuel ancien te parle de l'article 1382, il parle de l'actuel 1240."},

 {t:"encart", kick:"Attention, ça a changé", titre:"Les vieux numéros d'articles circulent encore", type:"garde",
  texte:"Beaucoup d'annales, de fiches et de vidéos antérieures à 2016 citent l'article 1382 du code civil pour la responsabilité civile et l'article 1315 pour la charge de la preuve. L'ordonnance n° 2016-131 du 10 février 2016, qui a réformé le droit des contrats, du régime général et de la preuve des obligations, les a renumérotés : 1382 est devenu 1240, 1383 est devenu 1241, et 1315 est devenu 1353. Le contenu de la règle n'a pas changé, mais citer l'ancien numéro dans une copie te fera perdre des points."},

 {t:"vocab", kick:"Le vocabulaire", titre:"Trois mots qu'on va te faire distinguer", mots:[
  {m:"Faute", d:"Le manquement à une obligation, ou le comportement qu'une personne raisonnable n'aurait pas eu."},
  {m:"Dommage", d:"Le préjudice effectivement subi. Sans dommage, pas de responsabilité civile, même en cas de faute."},
  {m:"Lien de causalité", d:"Le rapport de cause à effet entre la faute et le dommage. C'est souvent le point le plus discuté d'un cas pratique."}]},

 {t:"quiz", kick:"Vérification", question:"Tu affirmes qu'un fournisseur ne t'a jamais livré la commande que tu as payée. Il soutient l'avoir livrée. Qui doit prouver quoi ?",
  options:["C'est à toi de prouver la non-livraison, puisque c'est toi qui te plains",
   "C'est au fournisseur de justifier le fait qui a éteint son obligation, puisqu'il se prétend libéré",
   "Aucun des deux : le juge tranche à son appréciation"],
  bonne:1,
  expl:"L'article 1353 fonctionne en deux temps. Tu prouves l'existence de l'obligation, ici la commande payée. Lui, qui se prétend libéré, doit justifier le fait qui a éteint cette obligation, ici la livraison."},

 {t:"notion", kick:"L'organisation", titre:"Où se règlent les litiges",
  paras:["Le programme annonce l'environnement juridique et judiciaire. Tu verras donc comment s'organisent les juridictions, et notamment la distinction entre les litiges entre commerçants et les litiges impliquant des particuliers, qui ne relèvent pas des mêmes tribunaux.",
   "Je ne détaille pas ici la carte des juridictions et leurs seuils de compétence : ces règles évoluent, et je ne les ai pas vérifiées article par article. C'est exactement le genre de point qu'il faut prendre en cours, à jour."],
  encart:{type:"info", titre:"Honnêteté", texte:"Quand cette application n'a pas pu vérifier quelque chose, elle le dit plutôt que d'approximer. Note la question et pose-la."}},

 {t:"notion", kick:"La méthode", titre:"Le cas pratique, l'exercice roi",
  paras:["En droit, on ne te demandera presque jamais de réciter. On te donnera une situation et on te demandera de la qualifier : quels sont les faits, quelle règle s'applique, qu'en conclut-on.",
   "La forme attendue est toujours la même : rappeler la règle, l'appliquer aux faits, conclure. Beaucoup d'étudiants perdent des points en donnant la bonne conclusion sans avoir énoncé la règle. La conclusion seule ne vaut rien."],
  encart:{type:"astuce", titre:"L'entraînement gratuit", texte:"Prends n'importe quel litige commercial dans l'actualité et essaie de repérer la faute, le dommage et le lien de causalité. Dix minutes par semaine suffisent à prendre le réflexe."}},

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",
  etapes:["Quels codes seront autorisés en évaluation, et dans quelle édition",
   "Quelle méthode de cas pratique est attendue, et sous quel formalisme exact",
   "Quelles sources sont acceptées pour justifier l'usage d'une image dans la SAÉ de communication"],
  note:"La troisième question a l'air anodine. Elle t'évitera de refaire un support entier trois jours avant le rendu."},

 {type:"qcmMulti","visee":"memo","question":"Lesquels de ces termes font partie des cinq mots clés du programme de cette ressource ?","options":["Réglementation","Fiscalité","Preuves","Droit du travail","Droit à l'image"],"reponses":[0,2,4],"correction":"Les cinq mots clés sont : réglementation, responsabilité, preuves, propriété intellectuelle, droit à l'image. La fiscalité et le droit du travail n'en font pas partie.","source":"Programme national R1.06, mots clés","diapo":1},

 {type:"qcm","visee":"memo","question":"Quel est le but de la responsabilité civile ?","options":["Punir l'auteur du dommage au nom de toute la société","Sanctionner uniquement l'intention de nuire","Interdire les pratiques commerciales déloyales","Replacer la victime dans la situation d'avant le dommage"],"reponse":3,"correction":"La responsabilité civile répare, elle ne punit pas. C'est la responsabilité pénale qui sanctionne au nom de la société.","source":"Distinction responsabilité civile et pénale","diapo":7},

 {type:"classer","visee":"comprehension","niveau":2,"question":"Range chaque élément du côté de la personne physique ou de la personne morale.","colonnes":["Personne physique","Personne morale"],"elements":[{"txt":"Un être humain","col":0},{"txt":"Une association","col":1},{"txt":"A des droits dès sa naissance","col":0},{"txt":"Une société","col":1},{"txt":"A un siège distinct de celui de ses membres","col":1},{"txt":"Un mineur, qui ne peut pas exercer seul tous ses droits","col":0},{"txt":"Le gérant, pris à titre personnel","col":0}],"correction":"La personne physique est un être humain ; la personne morale est un groupement doté d'une existence propre, avec son nom, son siège et son patrimoine.","source":"Les acteurs du monde des affaires, programme national R1.06","diapo":3},
 {type:"choix","visee":"comprehension","niveau":1,"angle":"reformulation","question":"Que veut dire « celui qui se prétend libéré doit justifier le paiement » ?","options":["Celui qui réclame une somme n'a jamais rien à prouver","Le paiement est présumé dès que le débiteur l'affirme","Celui qui affirme avoir déjà payé doit le démontrer","C'est au juge de rechercher lui-même la preuve du paiement"],"reponse":2,"correction":"L'article 1353 fait peser la preuve de l'extinction de l'obligation sur celui qui dit en être libéré : s'il affirme avoir payé, c'est à lui de le prouver.","source":"Code civil, article 1353","diapo":9},
 {type:"choix","visee":"comprehension","niveau":1,"angle":"explication","question":"Pourquoi la personnalité morale est-elle si utile ?","options":["Parce qu'elle permet aux associés d'échapper à toute règle de droit","Parce qu'elle rend le dirigeant personnellement responsable de chaque contrat","Parce qu'elle dispense la société de prouver ses créances","Parce que la société répond de ses fautes sur son propre patrimoine"],"reponse":3,"correction":"Quand une société commet une faute, c'est elle qui répond, sur son patrimoine à elle : ses associés ne sont pas confondus avec elle.","source":"Les acteurs du monde des affaires, programme national R1.06","diapo":4},
 {type:"choix","visee":"comprehension","niveau":2,"angle":"situation","question":"En stage, tu reçois un bon de commande signé par le gérant d'une société cliente, au nom de cette société. Qui est engagé ?","options":["Le gérant à titre personnel, puisque c'est lui qui a signé le bon","La société ; le gérant n'engage pas son patrimoine personnel, sauf exceptions","Les associés, chacun sur son patrimoine personnel","Le gérant et la société, chacun pour moitié de la commande"],"reponse":1,"correction":"On ne signe pas avec un individu mais avec une entité : le gérant qui signe au nom de la société n'engage pas son patrimoine personnel, sauf exceptions que le cours détaillera.","source":"Les acteurs du monde des affaires, programme national R1.06","diapo":4},
 {type:"choix","visee":"comprehension","niveau":2,"angle":"justification","question":"Une entreprise commet une faute, mais personne n'en subit le moindre préjudice. Pourquoi sa responsabilité civile n'est-elle pas engagée ?","options":["Parce que la faute n'était pas intentionnelle et reste donc sans effet","Parce qu'il manque le dommage, l'une des trois conditions requises","Parce qu'une entreprise ne peut jamais engager sa responsabilité civile","Parce qu'aucun contrat ne la liait à une éventuelle victime"],"reponse":1,"correction":"Faute, dommage et lien de causalité doivent être réunis. Sans dommage, pas de responsabilité civile, même en cas de faute.","source":"Vocabulaire de la responsabilité civile","diapo":14},
 {type:"choix","visee":"comprehension","niveau":2,"angle":"erreur","question":"Dans une copie, une étudiante fonde la responsabilité civile sur « l'article 1382 du code civil », trouvé dans une vieille fiche. Quelle est l'erreur ?","options":["La règle de responsabilité civile a été supprimée en 2016","L'article 1382 concerne en réalité la charge de la preuve","L'article 1382 relève du code de la consommation, pas du code civil","Le numéro est périmé : la même règle figure désormais à l'article 1240"],"reponse":3,"correction":"L'ordonnance du 10 février 2016 a renuméroté 1382 en 1240. Le contenu n'a pas changé, mais citer l'ancien numéro fait perdre des points.","source":"Ordonnance n° 2016-131 du 10 février 2016","diapo":13},
 {type:"ordre","visee":"comprehension","niveau":2,"question":"Ton fournisseur dit t'avoir livré la commande que tu as payée ; toi, tu soutiens le contraire. Remets dans l'ordre le déroulement de la preuve.","etapes":["Tu réclames l'exécution de la commande","Tu prouves l'existence de l'obligation : la commande payée","Le fournisseur, qui se prétend libéré, justifie la livraison"],"correction":"L'article 1353 fonctionne en deux temps : celui qui réclame prouve l'obligation, puis celui qui se prétend libéré justifie le fait qui l'a éteinte.","source":"Code civil, article 1353","diapo":15},
 {type:"cloze","visee":"memo","question":"La responsabilité civile ne punit pas : elle _____.","reponse":"répare","options":["sanctionne","répare","réprime","dissuade"],"correction":"Son but est de replacer la victime dans la situation où elle se serait trouvée sans le dommage.","source":"Distinction responsabilité civile et pénale","diapo":7},

/* ---- R1.01 Fondamentaux du marketing et comportement du consommateur — vérifiée le 7 septembre 2026 ---- */
"R1.01": {titre:"Fondamentaux du marketing et comportement du consommateur", ressId:"R1.01", duree:"19 min", diapos:[
 {t:"intro", kick:"R1.01 · avant le premier cours", titre:"La matière la plus lourde de ton semestre",
  texte:"Trente-cinq heures, coefficient 2,5, et le programme national ne la rattache qu'à une seule compétence : Marketer. C'est la matière la plus volumineuse du semestre 1, loin devant les autres. Ce que tu y apprendras servira dans presque tous tes autres cours, et dans deux SAÉ sur trois."},

 {t:"notion", kick:"Le programme", titre:"Six choses qu'on attend de toi",
  paras:["Le programme national énonce six contributions attendues : utiliser le vocabulaire approprié de la démarche marketing, appréhender l'état d'esprit et la démarche marketing fondée sur les besoins, identifier les étapes de la démarche marketing, analyser correctement le marché dans lequel se situe une offre simple, analyser le comportement du consommateur et les facteurs clés de son processus de décision, et connaître et utiliser les méthodes de segmentation, les stratégies de ciblage et de positionnement.",
   "Remarque le mot qui revient : analyser. On ne te demandera pas de réciter des définitions, mais de t'en servir sur un cas."],
  encart:{type:"info", titre:"L'expression à retenir", texte:"« L'état d'esprit et la démarche marketing fondée sur les besoins ». C'est la phrase du programme, et c'est le fil de toute la matière : on part de ce que veulent les gens, pas de ce qu'on sait fabriquer."}},

 {t:"notion", kick:"Le programme", titre:"Le contenu, dans l'ordre où il sera probablement traité",
  paras:["Le programme liste sept blocs : la démarche marketing et son champ d'application ; l'identification des acteurs de l'offre, de la demande et des facteurs d'influence d'un marché ; l'analyse de l'influence des acteurs sur le marché ; la connaissance du comportement du consommateur et de ses attentes ; l'identification des cibles et des critères de segmentation ; l'identification des positionnements ; enfin le choix d'une cible et du positionnement lié.",
   "L'ordre n'est pas anodin : on va du général au particulier. D'abord le marché, ensuite les gens qui le composent, enfin la décision de s'adresser à certains d'entre eux d'une certaine manière."],
  encart:{type:"astuce", titre:"Utilise ce plan", texte:"Note ces sept blocs sur la première page de ton cahier. À chaque séance, coche celui que tu viens de voir. Tu sauras toujours où tu en es."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les mots du programme", mots:[
  {m:"Démarche marketing", d:"L'enchaînement des étapes qui va de l'analyse d'un marché au choix d'une offre. Premier mot clé de la fiche officielle."},
  {m:"Analyse de marché", d:"L'étude des acteurs de l'offre, de la demande et des facteurs qui influencent le marché."},
  {m:"Comportement du consommateur", d:"L'étude de ce qui explique et déclenche la décision d'achat."},
  {m:"Segmentation", d:"Le découpage d'un marché en groupes selon des critères."},
  {m:"Ciblage", d:"Le choix du ou des groupes auxquels on décide de s'adresser."},
  {m:"Positionnement", d:"La place que l'on veut occuper dans l'esprit de la cible, par rapport aux concurrents."}],
  note:"Ces six termes sont exactement les mots clés de la fiche officielle. Si tu ne devais retenir qu'une diapositive de cette leçon, ce serait celle-là."},

 {t:"encart", kick:"Le saviez-vous", titre:"En français, on dit mercatique", type:"info",
  texte:"La Commission d'enrichissement de la langue française, placée sous l'autorité du Premier ministre et dont les termes sont publiés au Journal officiel, recommande officiellement « mercatique » pour marketing. L'emploi des termes publiés au Journal officiel s'impose à l'administration, mais pas aux entreprises. Tu croiseras donc « mercatique » dans des documents publics et des sujets d'examen anciens, et « marketing » partout ailleurs. Les deux désignent la même chose."},

 {t:"etapes", kick:"La démarche", titre:"L'enchaînement que le cours suivra",
  etapes:["Analyser le marché : qui offre, qui demande, qu'est-ce qui influence",
   "Comprendre le comportement du consommateur et son processus de décision",
   "Découper le marché en segments selon des critères pertinents",
   "Choisir la ou les cibles auxquelles s'adresser",
   "Définir le positionnement de l'offre pour cette cible",
   "En déduire une offre cohérente"],
  note:"Cette suite est déduite de l'ordre du contenu officiel et des trois apprentissages critiques visés. La formulation exacte des étapes varie selon les enseignants : celle de ton cours fera foi."},

 {t:"notion", kick:"Le marché", titre:"Trois choses à regarder",
  paras:["Le programme demande d'identifier les acteurs de l'offre, ceux de la demande, et les facteurs d'influence d'un marché. Puis d'analyser l'influence de ces acteurs sur le marché.",
   "L'offre, ce sont les entreprises qui vendent : concurrents directs, indirects, nouveaux entrants. La demande, ce sont ceux qui achètent ou pourraient acheter. Les facteurs d'influence, c'est tout ce qui pèse sans être ni l'un ni l'autre : réglementation, technologie, démographie, tendances."],
  encart:{type:"astuce", titre:"Le lien avec R1.09", texte:"Les outils de diagnostic comme le SWOT, le PESTEL ou les forces de Porter sont introduits dans la ressource Rôle et organisation de l'entreprise sur son marché. Les deux matières se répondent, et la SAÉ marketing mobilise les deux."}},

 {t:"notion", kick:"Le consommateur", titre:"Ce que le programme annonce précisément",
  paras:["Sur le comportement du consommateur, la fiche officielle est inhabituellement détaillée. Elle annonce quatre choses : la notion de besoins, la modélisation du comportement du consommateur, les facteurs explicatifs du comportement, et le processus de décision avec ses variables clés.",
   "Autrement dit, on ne te demandera pas seulement de constater qu'un client achète. On te demandera d'expliquer pourquoi, à partir d'un modèle."],
  encart:{type:"piege", titre:"Là où je m'arrête", texte:"Quels modèles précisément, la fiche ne le dit pas. Les manuels en proposent plusieurs, et le choix appartient à ton enseignant. Je ne vais pas t'en inventer un : note la question et pose-la."}},

 {t:"notion", kick:"Le consommateur", titre:"Rationnel et irrationnel à la fois",
  paras:["Un point fait consensus et mérite d'être connu avant d'arriver : le consommateur n'est pas un calculateur parfait. L'Office québécois de la langue française, dans sa fiche terminologique sur le comportement du consommateur, décrit un comportement d'achat qui comprend à la fois des motifs, de nature rationnelle, et des motivations, qui relèvent de l'irrationnel.",
   "La même fiche indique que l'entreprise analyse les facteurs individuels, comme la personnalité et le style de vie, et les facteurs d'environnement, comme les variables sociodémographiques et économiques."],
  encart:{type:"info", titre:"Statut de cette information", texte:"Cette source est une base terminologique publique, sérieuse, mais ce n'est pas ton programme. C'est la direction que prendra probablement le cours, pas une certitude sur sa formulation."}},

 {t:"quiz", kick:"Vérification", question:"Le programme national annonce « l'état d'esprit et la démarche marketing fondée sur les besoins ». Qu'est-ce que cela implique concrètement ?",
  options:["Qu'on part du produit qu'on sait fabriquer et qu'on cherche à qui le vendre",
   "Qu'on part de ce que veulent les gens pour concevoir l'offre",
   "Qu'on s'aligne systématiquement sur le concurrent le plus performant"],
  bonne:1,
  expl:"C'est le renversement fondateur de la démarche marketing, et le programme le formule explicitement : la démarche est fondée sur les besoins. Partir du produit est précisément ce qu'elle remplace."},

 {t:"notion", kick:"Découper", titre:"La segmentation, et ses critères",
  paras:["Le programme demande d'identifier les cibles d'un marché et les critères de segmentation. Segmenter, c'est découper un marché en groupes suffisamment homogènes à l'intérieur, et suffisamment différents entre eux, pour qu'il vaille la peine de les traiter séparément.",
   "Tout l'art tient dans le choix du critère. Découper selon l'âge, le revenu, le lieu de vie, les habitudes d'achat ou les attentes ne donne pas les mêmes groupes, et donc pas les mêmes décisions."],
  encart:{type:"astuce", titre:"L'exercice à faire dès maintenant", texte:"Prends un rayon de supermarché et demande-toi selon quel critère les fabricants ont découpé leur clientèle. Les yaourts et les shampoings sont des cas d'école."}},

 {t:"notion", kick:"Choisir", titre:"Le ciblage, une décision qui exclut",
  paras:["Une fois le marché découpé, il faut choisir. Cibler, c'est décider à quels segments on s'adresse — et donc auxquels on renonce.",
   "C'est le point que les débutants ratent le plus souvent : vouloir parler à tout le monde. Le troisième apprentissage critique du programme est explicite, il s'agit de choisir une cible et un positionnement en fonction de la segmentation du marché. Choisir, c'est renoncer."],
  encart:{type:"piege", titre:"En évaluation", texte:"Une copie qui cible « tout le monde, de 15 à 75 ans » est une copie qui n'a pas ciblé. C'est une faute de raisonnement, pas un manque de précision."}},

 {t:"notion", kick:"Se situer", titre:"Le positionnement, dans la tête du client",
  paras:["Le positionnement est la place que l'offre occupe dans l'esprit de la cible, par rapport aux offres concurrentes. Le programme demande d'identifier les positionnements, puis de choisir une cible et le positionnement lié.",
   "Retiens les deux derniers mots : le positionnement lié. Il n'existe pas de bon positionnement dans l'absolu, seulement un positionnement cohérent avec la cible retenue et avec ce que font les concurrents."],
  encart:{type:"info", titre:"Ce que ça deviendra", texte:"Au semestre 2, la ressource Marketing mix - 1 partira de ce positionnement pour construire l'offre : produit, prix, distribution, communication. Tout ce que tu vois ici en est le socle."}},

 {t:"encart", kick:"Le piège numéro un", titre:"Trois mots, trois opérations différentes", type:"piege",
  texte:"Segmenter, c'est découper le marché en groupes. Cibler, c'est choisir les groupes auxquels on s'adresse. Positionner, c'est décider de la place que l'offre occupera dans l'esprit de ces gens-là. Les trois se suivent dans cet ordre et ne sont jamais interchangeables. C'est la confusion la plus fréquente en première année, et c'est aussi la question la plus fréquente en évaluation."},

 {t:"notion", kick:"L'évaluation", titre:"Les trois choses sur lesquelles tu seras jugée",
  paras:["Le programme rattache cette ressource à trois apprentissages critiques, et ce sont eux qui seront évalués. Analyser l'environnement d'une entreprise en repérant et appréciant les sources d'informations, avec leur fiabilité et leur pertinence. Mettre en œuvre une étude de marché dans un environnement simple. Choisir une cible et un positionnement en fonction de la segmentation du marché.",
   "Le premier mérite un arrêt : on n'attend pas seulement que tu trouves de l'information, mais que tu juges sa fiabilité. Citer un blog et un rapport de l'INSEE sur le même plan est une faute."],
  encart:{type:"astuce", titre:"Réflexe à prendre", texte:"Pour chaque chiffre que tu utiliseras cette année, note d'où il vient et de quand il date. Ce réflexe est évalué dès le premier semestre."}},

 {t:"notion", kick:"Ce qui t'attend", titre:"La SAÉ marketing du semestre 1",
  paras:["Cette ressource alimente la SAÉ intitulée « Marketing : positionnement d'une offre simple sur un marché », que le programme décrit aussi comme situer une offre simple sur un marché. L'objectif est d'analyser le contexte de marché d'une offre commerciale simple et le comportement d'achat du client vis-à-vis de cette offre.",
   "Le programme présente la problématique professionnelle ainsi : identifier les opportunités et les menaces dans l'environnement d'une organisation, point d'étape préalable nécessaire à toute action sur un marché."],
  encart:{type:"info", titre:"Deux numérotations", texte:"Le programme national l'appelle SAÉ 1.01. La maquette de Carcassonne l'appelle SAÉ 1.2 et lui donne le coefficient 6, le plus élevé de tout ton semestre. C'est le même travail."}},

 {t:"chiffres", kick:"À mémoriser", titre:"Les repères de cette matière", lignes:[

  {v:"3", l:"apprentissages critiques évalués : analyser, étudier, choisir"},
  {v:"2", l:"SAÉ alimentées : marketing et vente"}],
  note:"Sur la maquette de Carcassonne, la SAÉ marketing associée pèse en plus un coefficient 6. Additionnés, la ressource et sa SAÉ représentent à eux seuls plus de la moitié de l'UE Marketer."},

 {t:"quiz", kick:"Vérification", question:"Tu as découpé le marché des jus de fruits selon les habitudes de consommation, puis tu as décidé de t'adresser aux familles avec enfants. Que te reste-t-il à faire dans la démarche du programme ?",
  options:["Rien, la démarche est terminée",
   "Définir le positionnement lié à cette cible, par rapport aux concurrents",
   "Recommencer la segmentation avec un autre critère"],
  bonne:1,
  expl:"Le contenu officiel se termine par « choix d'une cible et du positionnement lié ». Tu as segmenté, tu as ciblé ; il reste à décider quelle place ton offre occupera dans l'esprit de cette cible face aux concurrents."},

 {t:"notion", kick:"Honnêteté", titre:"Ce que cette leçon ne peut pas te donner",
  paras:["Le droit se cite : un article, une date, un texte. Le marketing, non. Les modèles du comportement du consommateur, les typologies de besoins, les grilles de segmentation sont des constructions de manuels, et il n'existe pas de version officielle qui s'imposerait.",
   "Cette leçon te donne donc le plan exact du cours, tiré du programme national, et le vocabulaire que tu vas rencontrer. Elle ne te donne pas les modèles eux-mêmes, parce qu'ils dépendront de ton enseignant et que je ne veux pas t'en faire apprendre un qui ne serait pas le sien."],
  encart:{type:"garde", titre:"Comment reconnaître un bon complément", texte:"Si tu cherches par toi-même, préfère les sources qui disent d'où elles tiennent ce qu'elles avancent. Une fiche sans auteur ni date, sur un site de partage de devoirs, ne vaut rien pour réviser."}},

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",

  note:"La troisième question vaut de l'or : le premier apprentissage critique porte explicitement sur la fiabilité des sources, et c'est là que se perdent le plus de points."},

 {t:"chiffres", kick:"Récapitulatif", titre:"Ce qu'il faut retenir", lignes:[

/* ---- R1.02 Fondamentaux de la vente — vérifiée le 7 septembre 2026 ---- */
"R1.02": {titre:"Fondamentaux de la vente", ressId:"R1.02", duree:"19 min", diapos:[
 {t:"intro", kick:"R1.02 · avant le premier cours", titre:"La matière où tu vas parler, pas écouter",
  texte:"Vingt-quatre heures, dont vingt de travaux pratiques. Autrement dit : plus de quatre-vingts pour cent du temps se passera en jeux de rôle, en simulations d'appels et en exercices, pas en cours magistral. C'est la matière la plus exigeante physiquement du semestre, et celle où arriver préparée change tout."},

 {t:"chiffres", kick:"Le poids", titre:"Ce que disent les chiffres", lignes:[
  {v:"24 h", l:"dont 20 heures de travaux pratiques, fixées nationalement"},
  {v:"coef 3", l:"dans l'UE2 Vendre, le coefficient le plus élevé des matières du semestre"},
  {v:"4", l:"apprentissages critiques évalués"},
  {v:"coef 6", l:"pour la SAÉ de prospection qui en découle, sur ta maquette"}],
  note:"La ressource et sa SAÉ pèsent ensemble 9 sur les 14 points de coefficient de l'UE Vendre au semestre 1."},

 {t:"notion", kick:"Le programme", titre:"Trois choses qu'on attend de toi",
  paras:["Le programme national énonce trois contributions : découvrir l'univers de la vente et le métier de commercial ; connaître les étapes de l'entretien de vente, savoir les identifier, savoir préparer et réaliser les premières étapes ; appréhender la démarche, les outils et les techniques de prospection.",
   "Note la précision de la deuxième : on ne te demandera pas de mener un entretien complet cette année, mais d'en préparer et d'en réaliser les premières étapes. Le reste viendra au semestre 2, dans Prospection et négociation."],
  encart:{type:"info", titre:"Progression", texte:"Le programme est explicite : « étapes 1 et 2 de l'entretien de vente ». On ne t'évaluera pas cette année sur le traitement des objections ni sur la conclusion."}},

 {t:"notion", kick:"Le programme", titre:"Le contenu en trois parties",
  paras:["Le programme organise la matière en trois ensembles. D'abord les métiers commerciaux, avec la déontologie et l'éthique dans la relation commerciale. Ensuite les fondamentaux de la négociation commerciale. Enfin les bases de la prospection commerciale.",
   "L'éthique n'est pas un supplément : elle figure dans le contenu officiel, et la composante essentielle de la compétence Vendre mentionne explicitement « une démarche éthique »."],
  encart:{type:"astuce", titre:"Ce que ça veut dire", texte:"On ne t'apprendra pas à vendre à tout prix. On t'apprendra à vendre en respectant l'interlocuteur, et ce point est évalué."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les quatre mots clés officiels", mots:[
  {m:"Plan de découverte", d:"La trame de questions préparée à l'avance pour comprendre la situation et les besoins du client. Premier mot clé de la fiche."},
  {m:"Prospection", d:"L'ensemble des démarches pour trouver de nouveaux clients."},
  {m:"Phoning", d:"La prospection par téléphone. Le programme y consacre une partie entière, avec jeux de rôle."},
  {m:"Qualification de fichier", d:"Le travail qui consiste à vérifier, compléter et trier une liste de prospects pour la rendre utilisable."}],
  note:"Ces quatre termes sont exactement les mots clés de la fiche officielle. Ce sont eux qui structureront ton évaluation."},

 {t:"notion", kick:"La préparation", titre:"Maîtriser l'information avant d'ouvrir la bouche",
  paras:["Le premier point du contenu sur la négociation est de maîtriser l'information : sur l'entreprise, sur l'environnement, sur la concurrence, sur le produit. Vient ensuite l'établissement des objectifs de l'entretien.",
   "L'ordre compte. Un commercial qui improvise se fait renvoyer en trois minutes. Ce que le cours va marteler, c'est que la vente se joue largement avant le rendez-vous."],
  encart:{type:"piege", titre:"L'erreur de débutante", texte:"Croire que la vente est une affaire de tchatche. Le programme place la maîtrise de l'information et la fixation d'objectifs avant toute technique de parole."}},

 {t:"notion", kick:"Le cœur du cours", titre:"Le plan de découverte, et la façon de questionner",
  paras:["Le programme détaille ce point plus que tout autre. Construire un plan de découverte suppose de mener un questionnement en utilisant des questions ouvertes, fermées, alternatives et de rebond ; de pratiquer l'écoute active ; de savoir reformuler ; de savoir repérer les besoins du client et identifier son profil.",
   "Quatre types de questions, trois savoir-faire. C'est la liste exacte du texte officiel, et elle te servira de grille de révision."],
  encart:{type:"astuce", titre:"Entraînement gratuit", texte:"Dans une conversation ordinaire, essaie de poser trois questions ouvertes d'affilée sans donner ton avis. C'est beaucoup plus dur qu'il n'y paraît, et c'est exactement la compétence visée."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les quatre types de questions du programme", mots:[
  {m:"Question ouverte", d:"Elle appelle une réponse développée. Elle sert à faire parler et à découvrir."},
  {m:"Question fermée", d:"Elle appelle oui, non, ou une donnée précise. Elle sert à vérifier et à cadrer."},
  {m:"Question alternative", d:"Elle propose un choix entre deux options. Elle sert à faire avancer sans laisser la porte ouverte au refus."},
  {m:"Question de rebond", d:"Elle repart d'un mot que l'interlocuteur vient d'employer pour l'approfondir."}],
  note:"Ces quatre types sont nommés tels quels dans le contenu officiel. Leur usage précis, en revanche, dépendra de la méthode de ton enseignant."},

 {t:"notion", kick:"Le sigle à connaître", titre:"SONCAS, cité par le programme",
  paras:["Le contenu officiel mentionne explicitement le SONCAS, en précisant « entre autres », pour identifier le profil du client. C'est donc une méthode que tu rencontreras, mais le programme laisse la porte ouverte à d'autres grilles.",
   "Je ne détaille pas ici ce que recouvre chaque lettre : les formulations varient d'un manuel à l'autre, et je n'ai pas de source qui fasse autorité. Ce que tu peux retenir dès maintenant, c'est qu'il s'agit d'une grille de lecture des motivations d'achat, et que ton cours en donnera la version qui compte pour toi."],
  encart:{type:"garde", titre:"Ce que je ne t'invente pas", texte:"Tu trouveras en ligne des versions différentes du SONCAS, parfois enrichies d'une septième lettre. Attends le cours plutôt que d'apprendre une version qui ne sera pas la sienne."}},

 {t:"quiz", kick:"Vérification", question:"Un prospect te dit : « le budget est un peu serré cette année ». Quelle question de rebond poses-tu ?",
  options:["Vous voulez dire que vous n'avez pas les moyens ?",
   "Serré, c'est-à-dire ? Sur quelle enveloppe travaillez-vous ?",
   "Est-ce que le prix est votre seul critère ?"],
  bonne:1,
  expl:"La question de rebond repart d'un mot que l'interlocuteur vient d'employer — ici « serré » — pour l'approfondir. La première reformule en dur et braque ; la troisième est fermée et change de sujet."},

 {t:"notion", kick:"La prospection", titre:"Pourquoi on prospecte",
  paras:["Le programme demande de comprendre les enjeux de la prospection commerciale, et il les énumère : générer des contacts et récupérer des contacts perdus, conquérir de nouvelles cibles, orienter son développement commercial, s'adapter aux technologies.",
   "Autrement dit, prospecter n'est pas seulement chercher des clients quand on n'en a plus. C'est une activité continue qui oriente le développement de l'entreprise."],
  encart:{type:"info", titre:"Les outils cités", texte:"Le programme nomme quatre outils traditionnels : les visites, les salons, le mailing et le téléphone. Ce sont ceux sur lesquels tu seras évaluée cette année."}},

 {t:"etapes", kick:"La prospection", titre:"La démarche que le cours suivra",
  etapes:["Créer ou qualifier un fichier de prospection",
   "Préparer la démarche : plan d'appel, objectifs, outils de suivi",
   "Mener l'opération de phoning en construisant un guide d'entretien téléphonique",
   "Analyser les résultats à l'aide d'indicateurs"],
  note:"Ces quatre temps sont déduits du contenu officiel et de la fiche de la SAÉ associée, qui demande un fichier qualifié, un plan d'appel, des outils de suivi et des indicateurs de performance."},

 {t:"notion", kick:"Le sigle à connaître", titre:"Le GET, guide d'entretien téléphonique",
  paras:["Le programme demande de mener une démarche de prospection téléphonique, ce qui inclut de gérer la relation commerciale par téléphone, de mener une opération de phoning, de construire un GET et d'analyser les résultats.",
   "Le GET est le guide d'entretien téléphonique : la trame écrite qu'on suit au téléphone. Ce n'est pas un texte à réciter, mais une structure qui prévoit l'accroche, les questions, les réponses aux objections courantes et la prise de rendez-vous."],
  encart:{type:"astuce", titre:"Bonne nouvelle", texte:"Le programme prévoit explicitement des jeux de rôle de phoning. Personne ne te lâchera au téléphone sans t'avoir fait répéter."}},

 {t:"notion", kick:"L'évaluation", titre:"Les quatre apprentissages critiques",
  paras:["Le programme rattache quatre apprentissages critiques à cette ressource. Préparer un plan de découverte qui permette de profiler le client et découvrir ses besoins. Évaluer la performance commerciale au moyen d'indicateurs. Recourir aux techniques adaptées à la démarche de prospection. Recourir aux codes d'expression spécifiques et professionnels.",
   "Le deuxième surprend souvent : on t'évaluera aussi sur ta capacité à mesurer ce que tu as fait. Combien d'appels, combien de refus, combien de rendez-vous obtenus, et qu'en conclus-tu."],
  encart:{type:"piege", titre:"À ne pas négliger", texte:"Le quatrième apprentissage porte sur les codes d'expression professionnels. Le registre de langue, le vouvoiement, la formule d'accroche : ça se travaille et ça s'évalue."}},

 {t:"notion", kick:"Ce qui t'attend", titre:"La SAÉ de prospection",
  paras:["Cette ressource alimente la SAÉ que le programme intitule « Vente : démarche de prospection », dont l'objectif est de préparer et réaliser une démarche complète de prospection téléphonique.",
   "Les livrables attendus, tels que décrits par le programme, sont un fichier de prospects qualifiés, un plan d'appel, des tableaux de reporting ou outils de suivi, des indicateurs de performance, et un oral de simulation ou des appels réels."],
  encart:{type:"info", titre:"Deux numérotations", texte:"SAÉ 1.02 au national, SAÉ 1.3 sur ta maquette de Carcassonne, coefficient 6. C'est le même travail."}},

 {t:"notion", kick:"L'astuce du programme", titre:"Prospecter pour ton propre stage",
  paras:["Le programme donne quatre exemples de mise en œuvre de cette SAÉ. L'un d'eux est de mener la démarche de prospection dans le cadre de la recherche de stage, en travail individuel.",
   "Si ton IUT retient cet exemple, l'exercice sert deux fois : tu es évaluée, et tu trouves ton stage. Autant t'y prendre sérieusement dès le premier jour."],
  encart:{type:"astuce", titre:"À faire dès maintenant", texte:"Commence à noter les entreprises du bassin carcassonnais et audois qui pourraient t'intéresser. Un fichier de prospection commence toujours par une liste brute."}},

 {t:"quiz", kick:"Vérification", question:"Le programme fixe 24 heures pour cette matière, dont 20 de travaux pratiques. Qu'est-ce que cela t'apprend sur la façon dont elle sera évaluée ?",
  options:["Que ce sera surtout un contrôle écrit de connaissances",
   "Que l'essentiel se jouera en situation : jeux de rôle, simulations d'appels, productions",
   "Que la matière est secondaire puisqu'il y a peu de cours magistral"],
  bonne:1,
  expl:"Vingt heures de TP sur vingt-quatre, c'est plus de quatre-vingts pour cent du temps. Le programme prévoit explicitement des jeux de rôle pour l'entretien comme pour le phoning."},

 {t:"encart", kick:"Attention", titre:"Le démarchage téléphonique est de plus en plus encadré", type:"garde",
  texte:"La prospection par téléphone auprès des particuliers fait l'objet d'une réglementation qui s'est durcie ces dernières années, et qui a continué d'évoluer. Je ne te donne pas ici l'état exact du droit applicable : je n'ai pas vérifié les règles en vigueur à la date de ta rentrée, et une information périmée sur ce sujet serait pire que pas d'information du tout. C'est une question à poser dès la première séance de prospection, et elle fera bonne impression."},

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",
  etapes:["Quelle version du SONCAS est retenue dans le cours, et faut-il la connaître par cœur",
   "Quels indicateurs de performance seront exigés dans le bilan de prospection",
   "Quelles règles s'appliquent au démarchage téléphonique pour la SAÉ, et vers quel type de cible"],
  note:"La troisième est celle qui te distinguera : peu d'étudiants pensent au cadre légal avant qu'on leur en parle."},

 {t:"chiffres", kick:"Récapitulatif", titre:"Ce qu'il faut retenir", lignes:[
  {v:"4", l:"mots clés officiels : plan de découverte, prospection, phoning, fichier"},

  {v:"1 et 2", l:"les seules étapes de l'entretien évaluées cette année"},
  {v:"4", l:"outils de prospection cités : visites, salons, mailing, téléphone"}]},

 {type:"choix","visee":"comprehension","niveau":1,"angle":"situation","question":"En ligne, tu trouves une version du SONCAS à sept lettres, différente de celle d'un autre site. Que te conseille la leçon ?","options":["Apprendre la version la plus longue, elle est plus complète","Apprendre les deux pour être tranquille","Retenir la version la plus citée sur les réseaux","Attendre le cours pour apprendre la version retenue par ton enseignant"],"reponse":3,"correction":"Le programme cite le SONCAS « entre autres » sans en fixer le contenu, et les formulations varient d'un manuel à l'autre : c'est la version de ton cours qui compte.","source":"Fiche Ressource R1.02, contenu","diapo":8},

/* ---- R1.09 Rôle et organisation de l'entreprise sur son marché — vérifiée le 7 septembre 2026 ---- */
"R1.09": {titre:"Rôle et organisation de l'entreprise sur son marché", ressId:"R1.09", duree:"16 min", diapos:[
 {t:"intro", kick:"R1.09 · avant le premier cours", titre:"Douze heures pour apprendre à radiographier une entreprise",
  texte:"C'est une des matières les plus courtes du semestre, mais elle te donne les outils que tu utiliseras partout : l'organigramme pour comprendre qui décide, le PESTEL pour lire l'environnement, le SWOT pour poser un diagnostic. Ces trois-là reviendront dans presque toutes tes SAÉ, jusqu'en troisième année."},

 {t:"notion", kick:"Le programme", titre:"Six objectifs annoncés",
  paras:["Le programme national attend de toi que tu saches identifier une entreprise et son marché, comprendre sa structure organisationnelle, comprendre sa finalité sociale et sociétale, comprendre les interactions entre l'entreprise et son environnement macroéconomique, identifier les concurrents et comprendre le positionnement de l'entreprise par rapport à eux, et aborder le diagnostic stratégique.",
   "Le dernier est présenté comme une introduction. On ne te demandera pas de maîtriser le diagnostic stratégique cette année, mais d'en connaître les outils de base."],
  encart:{type:"info", titre:"La finalité sociale et sociétale", texte:"Elle figure noir sur blanc dans les objectifs. Une entreprise n'est pas seulement une machine à produire du profit, et cette dimension fait partie du programme dès la première année."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les quatre mots clés officiels", mots:[
  {m:"Organigramme", d:"La représentation de la structure d'une organisation : qui dépend de qui, quelles sont les fonctions."},
  {m:"Concurrents", d:"Les entreprises qui répondent au même besoin. Le programme distingue la concurrence directe de l'indirecte."},
  {m:"SWOT", d:"Outil de diagnostic qui croise les forces et faiblesses internes avec les opportunités et menaces externes."},
  {m:"PESTEL", d:"Grille d'analyse de l'environnement d'une organisation, sous six angles."}],
  note:"Ce sont les quatre mots clés de la fiche officielle. Les deux derniers sont des acronymes que tu verras dans toutes tes matières."},

 {t:"notion", kick:"Le point de départ", titre:"Identifier une entreprise et son marché",
  paras:["Le premier objectif du programme paraît anodin : identifier une entreprise et son marché. Il ne l'est pas. Avant toute analyse, il faut savoir de quoi on parle exactement : quelle entité juridique, quelle activité, sur quel périmètre géographique, pour quels clients.",
   "Une enseigne connue peut recouvrir une franchise indépendante, une filiale d'un grand groupe ou une société familiale. Ce ne sont pas les mêmes entreprises, elles n'ont ni les mêmes marges de manœuvre ni les mêmes concurrents."],
  encart:{type:"astuce", titre:"Le réflexe", texte:"Avant d'analyser, délimite. Quelle entreprise, quel marché, quelle zone, quelle période. Une analyse sans périmètre défini ne veut rien dire."}},

 {t:"notion", kick:"L'organisation", titre:"À quoi sert vraiment un organigramme",
  paras:["Un organigramme répond à trois questions : quelles sont les fonctions de l'entreprise, comment elles sont regroupées, et qui rend des comptes à qui. Le programme traite en parallèle le rôle du manager.",
   "Ce n'est pas de la décoration administrative. La forme d'une structure explique la vitesse des décisions, les conflits entre services, et le fait que la personne à qui tu parles ait ou non le pouvoir de dire oui."],
  encart:{type:"info", titre:"Le lien commercial", texte:"En vente, savoir qui décide et qui influence est décisif. Ce que tu apprends ici te servira directement en rendez-vous professionnel."}},

 {t:"notion", kick:"L\'organisation", titre:"Cinq types de structures au programme",
  paras:["Le contenu officiel énumère précisément les structures que tu étudieras : structure simple, fonctionnelle, divisionnelle, matricielle, et par projet. Le rôle du manager est traité en parallèle.",
   "Savoir lire un organigramme n'est pas un exercice scolaire. En stage, c'est ce qui te dira à qui t'adresser, qui décide d'un budget, et pourquoi telle demande met trois semaines à remonter."],
  encart:{type:"astuce", titre:"À faire pendant ton stage", texte:"Demande l'organigramme dès le premier jour. Peu de stagiaires y pensent, et ceux qui le font comprennent l'entreprise deux fois plus vite."}},

 {t:"notion", kick:"La raison d'être", titre:"La finalité sociale et sociétale",
  paras:["Le programme demande de comprendre la finalité sociale et sociétale d'une entreprise. C'est un objectif à part entière, au même niveau que la structure ou la concurrence.",
   "Concrètement : quel rôle l'entreprise joue-t-elle au-delà de son chiffre d'affaires. Emploi local, effet sur l'environnement, relations avec ses fournisseurs, utilité de ce qu'elle produit. Le référentiel de compétences le confirme, puisque l'une des composantes essentielles de la compétence Marketing est d'adopter une posture citoyenne, éthique et écologique."],
  encart:{type:"info", titre:"Ce n'est pas décoratif", texte:"Cette dimension apparaît dans le référentiel national comme une composante essentielle de la compétence, donc comme un critère d'évaluation."}},

 {t:"notion", kick:"L'environnement", titre:"Ce que veut dire macroéconomique",
  paras:["Le programme demande de comprendre les interactions entre une entreprise et son environnement macroéconomique. Macro, par opposition à micro : il ne s'agit pas des clients et des concurrents immédiats, mais du contexte général.",
   "Inflation, taux d'intérêt, chômage, démographie, réglementation, évolutions technologiques. Ces éléments s'imposent à l'entreprise, qui ne peut ni les choisir ni les modifier, mais qui doit les anticiper."],
  encart:{type:"astuce", titre:"Le pont avec R1.05", texte:"La ressource Environnement économique de l'entreprise traite ces notions en profondeur. Ici, tu apprends surtout à les relier à une entreprise précise."}},

 {t:"notion", kick:"L'environnement", titre:"Le PESTEL, une grille en six angles",
  paras:["Le PESTEL est nommé dans le contenu officiel et dans les mots clés. C'est une grille qui structure l'analyse de l'environnement d'une organisation en six dimensions, dont l'acronyme reprend les initiales.",
   "Je ne déroule pas ici les six termes : selon les manuels, la lettre E désigne l'économique ou l'écologique, et l'ordre des dimensions varie. Ton cours donnera la version qui compte pour toi, et c'est celle-là qu'il faudra restituer."],
  encart:{type:"garde", titre:"Pourquoi je m'arrête là", texte:"Tu trouveras en ligne plusieurs déclinaisons du PESTEL, parfois contradictoires sur une ou deux lettres. Apprendre la mauvaise version coûterait plus cher que d'attendre le premier cours."}},

 {t:"notion", kick:"La concurrence", titre:"L'avantage concurrentiel, la question qui fâche",
  paras:["Le contenu officiel cite l'avantage concurrentiel. La question qu'il pose est simple et redoutable : pourquoi un client choisirait-il cette entreprise plutôt qu'une autre ?",
   "Les réponses molles — la qualité, le service, le sérieux — ne valent rien, parce que tous les concurrents les revendiquent. Un avantage concurrentiel n'existe que s'il est réel, perceptible par le client, et difficile à copier."],
  encart:{type:"piege", titre:"À éviter en copie", texte:"Écrire que l'avantage de l'entreprise est « la qualité de ses produits » sans rien démontrer. Demande-toi toujours : par rapport à qui, et comment le client s'en aperçoit-il ?"}},

 {t:"notion", kick:"La concurrence", titre:"Directe, indirecte, et avantage concurrentiel",
  paras:["Le contenu officiel mentionne la concurrence directe et indirecte, ainsi que l'avantage concurrentiel. La distinction est simple à poser : un concurrent direct propose la même réponse au même besoin, un concurrent indirect propose une réponse différente au même besoin.",
   "Un cinéma a pour concurrents directs les autres cinémas, et pour concurrents indirects les plateformes de streaming, les bowlings, les restaurants — tout ce qui occupe une soirée."],
  encart:{type:"piege", titre:"Le piège classique", texte:"Ne lister que les concurrents directs dans une analyse de marché. C'est le reproche le plus fréquent sur les premiers dossiers de SAÉ."}},

 {t:"quiz", kick:"Vérification", question:"Tu analyses le marché d'une salle d'escalade. Lequel de ces acteurs est un concurrent indirect ?",
  options:["Une autre salle d'escalade à trois kilomètres",
   "Une salle de fitness qui capte le même budget loisir sportif",
   "Le fabricant des prises d'escalade"],
  bonne:1,
  expl:"Le concurrent indirect répond au même besoin autrement. La salle de fitness ne propose pas d'escalade mais capte le même besoin et le même budget. Le fabricant de prises est un fournisseur, pas un concurrent."},

 {t:"notion", kick:"Le diagnostic", titre:"Le SWOT, quatre cases et deux pièges",
  paras:["Le SWOT croise deux dimensions : ce qui est interne à l'organisation, ses forces et ses faiblesses, et ce qui lui est externe, les opportunités et les menaces.",
   "Le premier piège est de confondre les deux axes : un concurrent puissant est une menace externe, pas une faiblesse interne. Le second est de produire une liste sans conclusion : un SWOT n'est pas un inventaire, c'est un raisonnement qui doit déboucher sur une décision."],
  encart:{type:"astuce", titre:"Le test à s'appliquer", texte:"Pour chaque élément que tu places, demande-toi : est-ce que l'entreprise peut agir dessus directement ? Si oui, c'est interne. Sinon, c'est externe."}},

 {t:"notion", kick:"Le lien avec le reste", titre:"Où ces outils te resserviront",
  paras:["Le programme rattache cette ressource à deux apprentissages critiques, tous deux issus de la compétence Marketing : analyser l'environnement d'une entreprise en repérant et appréciant les sources d'informations, et mettre en œuvre une étude de marché dans un environnement simple.",
   "Ce sont exactement les deux apprentissages visés par la ressource Fondamentaux du marketing. Les deux matières travaillent la même compétence sous deux angles, et se retrouvent dans la même SAÉ."],
  encart:{type:"info", titre:"Attention à l'équilibre", texte:"Douze heures seulement, mais un coefficient 1 en UE Marketer et un rôle central dans la SAÉ marketing à coefficient 6. Le rapport temps passé sur points marqués est excellent."}},

 {t:"notion", kick:"Ce qui t'attend", titre:"La SAÉ marketing, encore",
  paras:["Cette ressource alimente la SAÉ « Marketing : positionnement d'une offre simple sur un marché ». Le programme précise ce qu'elle y apporte : les fonctions de l'entreprise, ses interactions, et le diagnostic stratégique en introduction, avec le SWOT, les forces de Porter et le PESTEL.",
   "C'est la seule mention des forces de Porter dans les documents que j'ai consultés pour la première année, et elle apparaît dans la description de la SAÉ, pas dans la fiche de la ressource. Attends-toi à la croiser sans qu'elle soit centrale."],
  encart:{type:"astuce", titre:"Prépare le terrain", texte:"Choisis dès maintenant une entreprise locale que tu connais et essaie d'en dessiner l'organigramme approximatif. Tu verras tout de suite les questions que ça soulève."}},

 {t:"quiz", kick:"Vérification", question:"Dans un SWOT, où places-tu « l'arrivée d'un nouveau concurrent sur la zone » ?",
  options:["Dans les faiblesses, car cela affaiblit l'entreprise",
   "Dans les menaces, car c'est un élément externe sur lequel l'entreprise n'a pas de prise directe",
   "Dans les opportunités, car cela stimule le marché"],
  bonne:1,
  expl:"Le SWOT sépare l'interne de l'externe. L'entreprise ne décide pas de l'arrivée d'un concurrent : c'est une menace externe. Une faiblesse serait un élément qui lui appartient, comme un manque de personnel formé."},

 {t:"notion", kick:"La méthode", titre:"Un outil n'est pas une réponse",
  paras:["SWOT, PESTEL, avantage concurrentiel : ces grilles servent à organiser une réflexion, pas à la remplacer. Rempli mécaniquement, un tableau ne dit rien.",
   "Ce qu'on attend de toi, c'est la conclusion : après avoir regardé l'entreprise sous ces angles, qu'est-ce que tu en déduis ? Quelle décision cela suggère-t-il ? Le programme parle d'introduction au diagnostic stratégique, et un diagnostic débouche toujours sur quelque chose."],
  encart:{type:"astuce", titre:"La phrase qui sauve une copie", texte:"« Il en résulte que… ». Termine toujours une analyse par cette formule, et force-toi à la compléter. Si tu n'y arrives pas, c'est que l'analyse n'est pas finie."}},

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",
  etapes:["Quelle version du PESTEL est retenue, notamment ce que désigne chaque lettre",
   "Le SWOT doit-il déboucher sur des préconisations, ou seulement sur un constat",
   "Quel niveau de détail est attendu sur les cinq types de structures organisationnelles"],
  note:"La deuxième question est celle qui fait la différence entre un bon et un mauvais dossier de SAÉ."},

 {t:"chiffres", kick:"Récapitulatif", titre:"Ce qu'il faut retenir", lignes:[
  {v:"12 h", l:"volume national, une des matières les plus courtes du semestre"},
  {v:"coef 1", l:"en UE1 Marketer, et dans elle seule"},
  {v:"5", l:"types de structures : simple, fonctionnelle, divisionnelle, matricielle, par projet"},

 {type:"classer","visee":"comprehension","niveau":2,"question":"Range chaque élément selon qu'il relève de l'environnement macroéconomique ou de l'environnement immédiat de l'entreprise.","colonnes":["Macroéconomique","Clients, concurrents"],"elements":[{"txt":"L'inflation","col":0},{"txt":"Les clients de l'entreprise","col":1},{"txt":"Les taux d'intérêt","col":0},{"txt":"Les concurrents immédiats","col":1},{"txt":"La démographie","col":0},{"txt":"Les évolutions technologiques","col":0},{"txt":"Le chômage","col":0}],"correction":"Macro, par opposition à micro : le contexte général s'impose à l'entreprise, tandis que clients et concurrents immédiats forment son environnement proche.","source":"Fiche Ressource R1.09, objectifs","diapo":7},

 {type:"choix","visee":"comprehension","niveau":1,"angle":"explication","question":"Pourquoi écrire que l'avantage d'une entreprise est « la qualité de ses produits » ne vaut rien en copie ?","options":["Parce que la qualité n'est jamais un argument commercial recevable","Parce que le programme interdit de parler de qualité dans une copie","Parce que tous les concurrents la revendiquent : elle ne distingue rien","Parce que la qualité relève du PESTEL et non de la concurrence"],"reponse":2,"correction":"Il faut se demander : par rapport à qui, et comment le client s'en aperçoit-il ?","source":"Fiche Ressource R1.09, contenu","diapo":9},

/* ---- R1.04 Études marketing - 1 — vérifiée le 7 septembre 2026 ---- */
"R1.04": {titre:"Études marketing - 1", ressId:"R1.04", duree:"17 min", diapos:[
 {t:"intro", kick:"R1.04 · avant le premier cours", titre:"Apprendre à savoir, plutôt qu'à croire",
  texte:"Toute la première année de marketing repose sur une question : d'où tiens-tu ce que tu affirmes ? Cette matière t'apprend à aller chercher l'information, à juger si elle vaut quelque chose, et à en produire toi-même quand elle n'existe pas. C'est la matière la plus méthodologique du semestre, et celle qui sauve les dossiers de SAÉ."},

 {t:"notion", kick:"Le programme", titre:"Trois choses qu'on attend de toi",
  paras:["Le programme national énonce trois contributions : connaître les typologies d'étude et construire une méthodologie d'étude sous forme de cahier des charges ; mener une recherche et une analyse documentaire à l'aide de sources correctement sélectionnées ; construire un questionnaire.",
   "Trois savoir-faire, trois moments différents du métier. Cadrer une étude, chercher ce qui existe déjà, fabriquer de la donnée nouvelle."],
  encart:{type:"info", titre:"Deux compétences", texte:"Le programme rattache cette ressource à deux compétences : Conduire les actions marketing et Communiquer l'offre commerciale. C'est rare en première année, et cela dit son caractère transversal."}},

 {t:"notion", kick:"Le programme", titre:"Le contenu en six points",
  paras:["Le contenu officiel liste : la typologie des études de marché ; le cahier des charges ; l'analyse et la recherche documentaire, avec le repérage des sources d'information, la collecte et le traitement ; les types de sondage ; l'élaboration du questionnaire ; enfin le plan de sondage, la population et l'échantillonnage.",
   "L'ordre raconte une démarche : on décide ce qu'on cherche, on regarde ce qui existe, puis seulement on va sur le terrain."],
  encart:{type:"astuce", titre:"Le réflexe professionnel", texte:"On ne lance jamais une enquête avant d'avoir épuisé ce qui existe déjà. Une étude documentaire coûte quelques heures ; une enquête terrain coûte des semaines."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les mots à connaître avant d'entrer", mots:[
  {m:"Étude documentaire", d:"L'exploitation d'informations qui existent déjà, produites par d'autres."},
  {m:"Cahier des charges", d:"Le document qui cadre l'étude : ce qu'on cherche, pourquoi, avec quels moyens et quels délais."},
  {m:"Population", d:"L'ensemble des personnes ou des unités sur lesquelles porte l'étude."},
  {m:"Échantillon", d:"La partie de cette population que l'on interroge réellement."},
  {m:"Plan de sondage", d:"La méthode par laquelle on choisit qui compose l'échantillon."},
  {m:"Questionnaire", d:"L'outil de collecte, dont la construction fait l'objet d'un point entier du programme."}],
  note:"Ces termes viennent tous du contenu officiel de la fiche. Ils reviendront au semestre 2 dans Études marketing - 2."},

 {t:"notion", kick:"Cadrer", titre:"Quel type d'étude pour quelle question",
  paras:["Le premier point du contenu officiel est la typologie des études de marché. Toutes les questions ne se traitent pas de la même façon : certaines demandent de compter, d'autres de comprendre.",
   "Compter combien de personnes achètent un produit, c'est une question de mesure. Comprendre pourquoi elles l'achètent, c'est une question d'explication. Les méthodes diffèrent, les échantillons aussi, et le temps nécessaire n'a rien à voir."],
  encart:{type:"garde", titre:"Les noms varient", texte:"Selon les manuels, ces familles portent des appellations différentes. Je ne t'en impose aucune : ton cours donnera la typologie qui sera évaluée."}},

 {t:"notion", kick:"Cadrer", titre:"Le cahier des charges, l'étape qu'on saute à tort",
  paras:["Avant de chercher quoi que ce soit, il faut écrire ce qu'on cherche. Le cahier des charges pose le problème, l'objectif, le périmètre, le budget et le délai.",
   "C'est l'étape que les étudiants sautent le plus souvent, et c'est celle qui explique la moitié des dossiers ratés : sans question de départ claire, on collecte au hasard et on ne sait plus quoi conclure."],
  encart:{type:"piege", titre:"Le symptôme", texte:"Si tu n'arrives pas à dire en une phrase ce que ton étude doit permettre de décider, ton cahier des charges n'est pas écrit."}},

 {t:"notion", kick:"Chercher", titre:"Repérer, collecter, traiter",
  paras:["Le programme décompose la recherche documentaire en trois temps : repérage des sources d'information, collecte, traitement. Et il précise que les sources doivent être correctement sélectionnées.",
   "Le mot correctement n'est pas décoratif. L'apprentissage critique visé demande d'apprécier la fiabilité et la pertinence des sources. On te jugera autant sur ce que tu écartes que sur ce que tu retiens."],
  encart:{type:"astuce", titre:"Trois questions par source", texte:"Qui l'a produite ? Quand ? Pour quoi faire ? Une source sans auteur, sans date ou financée par une partie prenante ne se jette pas forcément, mais elle se cite avec précaution."}},

 {t:"notion", kick:"Chercher", titre:"Où chercher, concrètement",
  paras:["Pour un marché français, l'Institut national de la statistique et des études économiques publie des données publiques, gratuites et datées : consommation des ménages, démographie, revenus, indices de prix. C'est le type de source que tes enseignants attendront.",
   "À côté, les organisations professionnelles, les études sectorielles et la presse spécialisée complètent le tableau. Le principe reste le même : préférer ce qui indique sa méthode et sa date."],
  encart:{type:"info", titre:"Statut de ce conseil", texte:"Le programme ne nomme aucune source précise. Celles-ci sont des exemples cohérents avec l'exigence de fiabilité, pas une liste officielle."}},

 {t:"quiz", kick:"Vérification", question:"Pour une étude sur le marché du vélo électrique, tu trouves un article de blog non daté et une publication de l'INSEE de 2024. Que fais-tu ?",
  options:["Les deux se valent, tu cites les deux sans distinction",
   "Tu privilégies la source datée et identifiable, et tu ne retiens le blog que si tu peux vérifier ce qu'il avance",
   "Tu écartes systématiquement tout ce qui n'est pas officiel"],
  bonne:1,
  expl:"Le programme demande des sources correctement sélectionnées et l'apprentissage critique porte sur la fiabilité et la pertinence. Ce n'est pas une interdiction, c'est une hiérarchie et une justification."},

 {t:"notion", kick:"Produire", titre:"Quand l'information n'existe pas",
  paras:["Si la recherche documentaire ne répond pas à la question, on produit la donnée soi-même. C'est là qu'interviennent les types de sondage, le questionnaire et l'échantillonnage.",
   "Le programme sépare bien deux choses : le plan de sondage, qui décide qui l'on interroge, et le questionnaire, qui décide ce qu'on leur demande. Les deux se ratent indépendamment."],
  encart:{type:"piege", titre:"L'erreur fondatrice", texte:"Interroger vingt camarades de promotion et en conclure quelque chose sur le marché français. L'échantillon détermine ce que les résultats permettent de dire — et ici, presque rien."}},

 {t:"notion", kick:"Produire", titre:"Population, échantillon, plan de sondage",
  paras:["La population est l'ensemble sur lequel porte l'étude. L'échantillon en est la partie interrogée. Le plan de sondage est la méthode qui décide de la composition de cet échantillon.",
   "Ces trois notions sont nommées telles quelles dans le contenu officiel, et elles s'enchaînent : on définit d'abord la population, on choisit ensuite une méthode, on obtient enfin un échantillon."],
  encart:{type:"astuce", titre:"La question à se poser", texte:"À qui mes résultats s'appliquent-ils ? La réponse dépend entièrement de la population que tu as définie au départ."}},

 {t:"notion", kick:"Produire", titre:"Construire un questionnaire",
  paras:["Le programme en fait un point à part entière. Construire un questionnaire, ce n'est pas aligner des questions : c'est décider de l'ordre, du type de chaque question, et de la façon dont les réponses seront exploitables.",
   "Une question mal posée produit une réponse inutilisable, et on ne s'en aperçoit qu'au dépouillement, quand il est trop tard."],
  encart:{type:"info", titre:"Le lien avec R1.07", texte:"Le dépouillement et l'analyse chiffrée relèvent des Techniques quantitatives. Les deux matières se rejoignent dans la même SAÉ."}},

 {t:"quiz", kick:"Vérification", question:"Quelle différence entre la population et l'échantillon ?",
  options:["Aucune, ce sont deux mots pour la même chose",
   "La population est l'ensemble étudié, l'échantillon est la partie réellement interrogée",
   "L'échantillon est plus large que la population"],
  bonne:1,
  expl:"Le contenu officiel nomme les deux séparément, avec le plan de sondage qui fait le lien. Confondre les deux rend impossible toute conclusion sur la portée des résultats."},

 {t:"notion", kick:"Ce qui t'attend", titre:"La SAÉ marketing, côté méthode",
  paras:["Cette ressource alimente la SAÉ « Marketing : positionnement d'une offre simple sur un marché ». Le programme précise son apport : réaliser une étude de marché documentaire dans un environnement simple.",
   "Le mot documentaire est important. Pour cette première SAÉ, on attend surtout que tu exploites correctement ce qui existe, pas que tu montes une enquête terrain."],
  encart:{type:"astuce", titre:"Anticipe", texte:"Choisis un marché qui t'intéresse et essaie dès maintenant de trouver trois sources fiables dessus. Tu verras vite ce qui existe et ce qui manque."}},

 {t:"notion", kick:"L'évaluation", titre:"Deux apprentissages critiques",
  paras:["Le programme rattache cette ressource à deux apprentissages critiques : analyser l'environnement d'une entreprise en repérant et appréciant les sources d'informations, et mettre en œuvre une étude de marché dans un environnement simple.",
   "Ce sont les mêmes que ceux visés par Fondamentaux du marketing et par Rôle et organisation de l'entreprise. Trois matières convergent vers les mêmes attendus : c'est le signe qu'ils comptent."],
  encart:{type:"info", titre:"Bonne nouvelle", texte:"Ce que tu travailles ici te sert dans trois matières à la fois. Le temps investi rapporte trois fois."}},

 {t:"etapes", kick:"La démarche", titre:"L'enchaînement du cours",
  etapes:["Écrire le cahier des charges de l'étude",
   "Identifier la typologie d'étude adaptée",
   "Mener la recherche documentaire : repérer, collecter, traiter",
   "Si nécessaire, définir la population et le plan de sondage",
   "Construire le questionnaire",
   "Exploiter les résultats"],
  note:"Ordre déduit du contenu officiel. La formulation exacte des étapes dépendra de ton enseignant."},

 {t:"encart", kick:"Attention", titre:"Interroger des gens, c'est traiter des données personnelles", type:"garde",
  texte:"Dès que ton questionnaire recueille un nom, une adresse électronique, un âge précis ou tout autre élément permettant d'identifier quelqu'un, tu traites des données personnelles, et le règlement européen s'applique. Le programme de première année n'aborde pas ce point dans cette ressource, mais tes enseignants y seront attentifs. La règle la plus simple à retenir : ne collecte que ce dont tu as besoin, dis à quoi ça sert, et ne conserve rien au-delà de l'étude."},

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",
  etapes:["Quelle typologie d'études est retenue dans le cours, et sous quels noms",
   "Quel niveau d'exigence sur les sources dans le dossier de SAÉ : combien, de quel type",
   "Un questionnaire terrain est-il attendu au semestre 1, ou seulement du documentaire"],
  note:"La troisième détermine complètement ta charge de travail. Pose-la tôt."},
