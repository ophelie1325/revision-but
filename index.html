function etapeTuto(){ const t = TUTO.actif; return t ? t.P.etapes[t.i] : null; }
function lancerTuto(id){
  const P = PARCOURS_TUTO.find(p => p.id === id);
  if(!P) return;
  if(TUTO.actif) quitterTuto(true);
  // la visite compte comme vue, sur les vraies données
  if(!S.guideVu){ S.guideVu = true; sauver(); }
  clearInterval(minuteur);
  TUTO.actif = {P, i:0, S0:S, ui0:Object.assign({}, ui), fetch0:window.fetch, tel0:telecharger,
    exporte:false, horsCible:false, defiler:true};
  S = etatDemo(P);
  Object.assign(ui, {session:null, brouillon:null, importTexte:"", importTitre:"", importRess:"", importSrc:null,
    message:null, testCle:null, lecon:null, fiche:null, quizRep:null, avisRGPD:null, rgpdIgnore:false,
    photos:[], requete:"", occupe:false, etape:""});
  window.fetch = fetchDemo;
  telecharger = (nom) => {
    if(TUTO.actif) TUTO.actif.exporte = true;
    ui.message = {type:"info", titre:"Export simulé", txt:"En vrai, le fichier « " + nom + " » serait enregistré sur ton appareil."};
    rendre();
  };
  document.body.classList.add("enTuto");
  ui.tab = P.depart[0]; ui.ecran = P.depart[1];
  entrerEtape();
  rendre(); window.scrollTo(0,0);
}
function entrerEtape(){
  const t = TUTO.actif; if(!t) return;
  t.horsCible = false; t.defiler = true;
  const e = etapeTuto();
  if(e && e.avant) try{ e.avant(); }catch(err){}
}
function quitterTuto(silence){
  const t = TUTO.actif; if(!t) return;
  clearInterval(minuteur);
  S = t.S0; window.fetch = t.fetch0; telecharger = t.tel0;
  Object.keys(ui).forEach(k => { if(!(k in t.ui0)) delete ui[k]; });
  Object.assign(ui, t.ui0);
  ui.session = null;
  TUTO.actif = null;
  document.body.classList.remove("enTuto");
  afficherBandeauTuto();
  if(!silence){
    ui.ecran = "guide";
    ui.message = {type:"info", titre:"Tuto terminé", txt:"Tu retrouves ta vraie application et tes données, intactes."};
    rendre(); window.scrollTo(0,0);
  }
}
function etapeSuivante(){
  const t = TUTO.actif; if(!t) return;
  if(t.i >= t.P.etapes.length - 1){ quitterTuto(); return; }
  t.i++; entrerEtape(); rendre();
}
/* Appelée après chaque affichage et chaque saisie : l'étape est-elle accomplie ? */
function suivreTuto(){
  const t = TUTO.actif; if(!t || TUTO.enCours) return;
  TUTO.enCours = true;
  let avance = false;
  try{
    let n = 0, e = etapeTuto();
    while(e && e.quand && n < 6){
      let ok = false; try{ ok = !!e.quand(); }catch(err){}
      if(!ok) break;
      if(t.i >= t.P.etapes.length - 1) break;
      t.i++; n++; entrerEtape(); avance = true; e = etapeTuto();
    }
  } finally { TUTO.enCours = false; }
  if(avance) setTimeout(() => { if(TUTO.actif) rendre(); }, 0);
  afficherBandeauTuto(); entourerCible();
}
function entourerCible(){
  document.querySelectorAll(".tutoCible").forEach(x => x.classList.remove("tutoCible"));
  const t = TUTO.actif, e = etapeTuto();
  if(!t || !e || !e.cible) return;
  const l = Array.from(document.querySelectorAll(e.cible)).filter(x => !x.disabled || !e.quand);
  const cibles = e.tous ? l : l.slice(0, 1);
  cibles.forEach(x => x.classList.add("tutoCible"));
  if(cibles[0] && t.defiler && typeof cibles[0].scrollIntoView === "function"){
    t.defiler = false;
    try{ cibles[0].scrollIntoView({block:"center", behavior:"smooth"}); }catch(err){}
  }
}
function cibleVisible(){
  const e = etapeTuto();
  return !e || !e.cible || !!document.querySelector(e.cible);
}
function afficherBandeauTuto(){
  let b = document.getElementById("tuto");
  const t = TUTO.actif;
  if(!t){ if(b) b.remove(); return; }
  if(!b){ b = document.createElement("div"); b.id = "tuto"; b.className = "tutoB"; b.setAttribute("role", "status");
    document.body.appendChild(b); }
  const e = etapeTuto();
  const txt = typeof e.txt === "function" ? e.txt() : e.txt;
  const perdu = e.cible && e.quand && !cibleVisible();
  let h = '<div class="tutoH"><span>TUTO · ' + esc(t.P.titre.toUpperCase()) + '</span><span class="tutoN">' +
    (t.i + 1) + " / " + t.P.etapes.length + '</span></div><p class="tutoTxt">' + esc(txt) + "</p>";
  if(t.horsCible) h += '<p class="tutoAlerte">Ce n\'est pas ce bouton-là. Cherche celui qui est entouré en jaune.</p>';
  else if(perdu) h += '<p class="tutoAlerte">Le bouton à toucher n\'est pas sur cet écran.</p>';
  h += '<div class="tutoBtns">';
  if(e.action) h += '<button class="fort" data-tuto="action">' + esc(e.action.lib) + "</button>";
  if(e.fin) h += '<button class="fort" data-tuto="fin">Terminer</button>';
  else if(!e.quand) h += '<button class="fort" data-tuto="suivant">Continuer</button>';
  if(perdu || t.horsCible) h += '<button data-tuto="ramener">Me ramener</button>';
  if(!e.fin && e.quand) h += '<button data-tuto="passer">Passer l\'étape</button>';
  h += '<button class="quitter" data-tuto="quitter">Quitter</button></div>';
  b.innerHTML = h;
}
function ramenerTuto(){
  const t = TUTO.actif, e = etapeTuto(); if(!t || !e) return;
  if(e.ecran){ ui.session = null; clearInterval(minuteur); ui.tab = e.ecran[0]; ui.ecran = e.ecran[1]; }
  t.horsCible = false; t.defiler = true;
  rendre();
}
function passerEtapeTuto(){
  const t = TUTO.actif; if(!t) return;
  const e = etapeTuto();
  // passer une étape doit laisser l'écran dans l'état attendu par la suivante
  if(e && e.ecran && !cibleVisible()){ ui.tab = e.ecran[0]; ui.ecran = e.ecran[1]; }
  etapeSuivante();
}

}

async function transcrire(){
  if(!ui.photos.length) return;
  if(!S.reglages.cleGemini || !S.reglages.modele){
    ui.message = {type:"err", titre:"Clé manquante", txt:"Renseigne la clé et le modèle dans les réglages."};
    rendre(); return;
  }
  ui.occupe = true; ui.etape = "Déchiffrage des pages…"; ui.message = null; rendre();
  let txt;
  try{
    txt = await transcrirePhotos(ui.photos, S.reglages.cleGemini, S.reglages.modele);
  }catch(e){
    ui.occupe = false; ui.etape = "";
    ui.message = {type:"err", titre:"Déchiffrage impossible", txt:e.message}; rendre(); return;
  }
  ui.occupe = false; ui.etape = "";
  ui.importSrc = depuisMarkdown(txt);
  ui.importTexte = ui.importSrc.texte;
  ui.transcrit = true;
  ui.illisibles = compterIllisibles(txt);
  if(!ui.importRess){ const d = detecterRessource(ui.importTexte); if(d) ui.importRess = d; }
  const al = sonderDonnees(ui.importTexte);
  ui.avisRGPD = al.length ? al : null; ui.rgpdIgnore = false;
  ui.message = {titre:"À relire avant d'analyser",
    txt: ui.importTexte.length + " caractères déchiffrés" +
      (ui.illisibles ? ", dont " + ui.illisibles + " passage" + (ui.illisibles>1?"s":"") + " que le modèle n'a pas su lire" : "") +
      ". Corrige le texte ci-dessous, puis lance l'analyse."};
  rendre(); window.scrollTo(0,0);
}

async function analyser(){
  const texte = (ui.importTexte||"").trim();
  if(texte.length < 120){
    ui.message = {titre:"Texte trop court", txt:"Quelques paragraphes au minimum pour produire une fiche utile."};
    rendre(); return;
  }
  const al = sonderDonnees(texte);
  if(al.length && !ui.rgpdIgnore){ ui.avisRGPD = al; rendre(); return; }
  const ressId = ui.importRess || detecterRessource(texte);
  if(!ressId){
    ui.message = {titre:"Ressource à préciser", txt:"Elle n'a pas pu être déduite du texte : choisis-la dans la liste."};
    rendre(); return;
  }
  ui.occupe = true; ui.etape = "Lecture des notes…"; ui.message = null;
  ui.importRess = ressId;
  rendre();
  const src = (ui.importSrc && ui.importSrc.texte === texte) ? ui.importSrc
    : {texte, blocs:decouper(texte), forts:[]};
  let fiche, origine = S.reglages.moteur;
  try{
    if(origine === "gemini"){
      if(!S.reglages.cleGemini || !S.reglages.modele)
        throw new Error("Renseigne la clé et le modèle dans les réglages, ou repasse en mode local.");
      ui.etape = "Lecture du cours par Gemini…"; rendre();
      fiche = await notionsGemini(texte, ressId, S.reglages.cleGemini, S.reglages.modele,
        (k, n) => { ui.etape = n > 1 ? "Lecture du passage " + k + " sur " + n + "…" : "Analyse en cours…"; rendre(); });
      if(S.reglages.complements){
        ui.etape = "Recherche des compléments…"; rendre();
        try{ fiche.ajouts = await complementsGemini(fiche, ressId, S.reglages.cleGemini, S.reglages.modele); }
        catch(e){ fiche.ajouts = []; }
      }
    } else fiche = analyseLocale(src, ressId).fiche;
  }catch(e){
    ui.occupe = false; ui.etape = "";
    ui.message = {type:"err", titre:"Analyse interrompue", txt:e.message}; rendre(); return;
  }
  const nPoints = ["notions","parCoeur","calculs","juridique","pieges","exemples","sigles"]
    .reduce((s,k) => s + (fiche[k] || []).length, 0);
  if(!nPoints){
    ui.occupe = false; ui.etape = "";
    ui.message = {titre:"Rien n'a pu être tiré de ce texte",
      txt:"Des notes structurées — titres, listes, définitions, chiffres — donnent de bien meilleurs résultats."};
    rendre(); return;
  }
  const r = RESSOURCE(ressId);
  const titre = (ui.importTitre||"").trim() || fiche.titreDetecte || (r ? r.nom : "Cours");
  const c = {id:uid(), titre, ressId, date:new Date().toISOString(), origine, fiche,
    items:[], texte, tri:{off:{}, fort:{}}, visuels:[]};

  /* schémas et tableaux repris du document, s'il y en avait */
  if(src.tableaux && src.tableaux.length){
    src.tableaux.slice(0,12).forEach((t,i) => {
      c.visuels.push({id:uid(), kind:"tableau", legende:"Tableau " + (i+1), ancre:"", table:t});
    });
  }
  if(src.images && src.images.length){
    ui.etape = "Enregistrement des schémas…"; rendre();
    for(let i = 0; i < Math.min(src.images.length, 20); i++){
      try{
        const red = await reduireImage(src.images[i]);
        const vid = uid();
        await poserImage(vid, red.data);
        c.visuels.push({id:vid, kind:"image", legende:"Schéma " + (i+1), ancre:"",
          w:red.w, h:red.h, ko:poidsData(red.data)});
      }catch(e){}
    }
  }

  /* rien n'est enregistré tant que l'association n'est pas confirmée */
  ui.brouillon = c;
  ui.occupe = false; ui.etape = "";
  ui.ecran = "valider"; ui.tab = "rev";
  ui.message = null;
  rendre(); window.scrollTo(0,0);
}

function compteVisees(items){
  const n = {memo:0, comprehension:0};
  (items || []).forEach(i => n[viseeDe(i)]++);
  return n;
}

/* La fiche réduite aux seuls points que l'étudiante a gardés. */
function ficheRetenue(c){
  const t = cleTri(c), f = c.fiche, out = {};
  ["notions","parCoeur","calculs","juridique","pieges","exemples","sigles"].forEach(k => {
    out[k] = (f[k] || []).filter((_,i) => !t.off[k + i]);
  });
  out.resume = f.resume; out.lacunes = f.lacunes || []; out.ajouts = f.ajouts || [];
  return out;
}
function comptePoints(f){
  return ["notions","parCoeur","calculs","juridique","pieges","exemples","sigles"]
    .reduce((s,k) => s + (f[k] || []).length, 0);
}

async function creerExercices(){
  const c = ui.brouillon; if(!c) return;
  const ress = ui.importRess || c.ressId;
  const retenue = ficheRetenue(c);
  if(!comptePoints(retenue)){
    ui.message = {type:"err", titre:"Aucun point retenu", txt:"Coche au moins un point avant de créer les exercices."};
    rendre(); return;
  }
  ui.occupe = true; ui.etape = "Fabrication des exercices…"; ui.message = null; rendre();
  let items = [];
  try{
    if(c.origine === "gemini"){
      items = await exercicesGemini(retenue, ress, S.reglages.cleGemini, S.reglages.modele);
    } else {
      items = itemsLocaux(Object.assign({procedures: c.fiche.procedures || []}, retenue), ress);
    }
  }catch(e){
    ui.occupe = false; ui.etape = "";
    ui.message = {type:"err", titre:"Création interrompue", txt:e.message}; rendre(); return;
  }
  ui.occupe = false; ui.etape = "";
  if(!items.length){
    ui.message = {titre:"Aucun exercice n'a pu être fabriqué",
      txt:"Les points retenus sont peut-être trop courts. Garde-en davantage, ou relance."};
    rendre(); return;
  }
  c.items = items.map(i => Object.assign(i, {ressId: ress}));
  c.ressId = ress;
  c.titre = (ui.importTitre || "").trim() || c.titre;
  S.cours.push(c); sauver();
  ui.brouillon = null;
  ui.importTexte = ""; ui.importTitre = ""; ui.importRess = ""; ui.importSrc = null;
  ui.photos = []; ui.transcrit = false; ui.illisibles = 0;
  ui.avisRGPD = null; ui.rgpdIgnore = false;
  ui.fiche = c.id; ui.ecran = "fiche";
  const v = compteVisees(c.items), nAj = (c.fiche.ajouts || []).length, nVis = c.visuels.length;
  ui.message = {type:"info", titre:"Fiche enregistrée",
    txt: v.memo + " exercices de mémorisation, " + v.comprehension + " de compréhension"
      + (nVis ? ", " + nVis + " visuel" + (nVis>1?"s":"") : "")
      + (nAj ? ", " + nAj + " complément hors cours à vérifier" : "") + "."};
  rendre(); window.scrollTo(0,0);
}

async function jeterBrouillon(){
  const c = ui.brouillon; if(!c) return;
  for(const v of (c.visuels || [])) if(v.kind === "image") await retirerImage(v.id);
  ui.brouillon = null; ui.ecran = "import"; ui.tab = "rev";
  ui.message = {titre:"Analyse abandonnée", txt:"Rien n'a été enregistré. Corrige et relance."};
  rendre();
}

    case "nav":
      ui.session = null; clearInterval(minuteur);
      if(ui.oral){ clearInterval(chronoOral); fermerMicro(); ui.oral = null; }
      aller(el.dataset.tab, "accueil"); break;

    case "theme": S.reglages.theme = el.dataset.v; sauver(); rendre(); break;
    case "tuto": lancerTuto(el.dataset.t); break;

    case "guide-montrer": montrerGuide(Number(el.dataset.s), Number(el.dataset.f)); break;
    case "aller-diapo": {
      ui.lecon = el.dataset.l;
      const p = progLecon(ui.lecon);
      p.index = Math.max(0, Math.min(Number(el.dataset.i) || 0, LECONS[ui.lecon].diapos.length - 1));
      ui.quizRep = null; ui.tab = "prep"; ui.ecran = "lecon"; sauver(); rendre(); window.scrollTo(0,0); break;
    }
    case "aller-fiche": ui.tab = "rev"; ui.fiche = el.dataset.id; ui.ecran = "fiche"; rendre(); window.scrollTo(0,0); break;
    case "filtre": ui.filtreUE = el.dataset.ue; rendre(); break;
    case "src": { const c = document.getElementById(el.dataset.cible); if(c) c.classList.toggle("ouvert"); break; }

    case "ouvrir-lecon": {
      ui.lecon = el.dataset.l;
      const p = progLecon(ui.lecon);
      if(p.termine) p.index = 0;
      ui.quizRep = null; ui.ecran = "lecon"; sauver(); rendre(); window.scrollTo(0,0); break;
    }
    case "fermer-lecon": ui.ecran = "accueil"; ui.quizRep = null; rendre(); break;
    case "quiz": {
      const p = progLecon(ui.lecon);
      const d = LECONS[ui.lecon].diapos[p.index];
      ui.quizRep = Number(el.dataset.k); ui.motQuiz = undefined;
      p.quiz[p.index] = ui.quizRep === d.bonne;
      sauver(); rendre(); break;
    }
    case "diapo-suiv": {
      const p = progLecon(ui.lecon), L = LECONS[ui.lecon];
      if(p.index >= L.diapos.length - 1){
        p.termine = true; p.index = L.diapos.length - 1; sauver();
        ui.quizRep = null;
        if(L.ressId && (L.exos || []).length){ ui.ecran = "finLecon"; }
        else {
          ui.ecran = "accueil";
          ui.message = {type:"info", titre:"Leçon terminée", txt:L.titre + " — tu peux la reprendre quand tu veux."};
        }
      } else { p.index++; ui.quizRep = null; sauver(); }
      rendre(); window.scrollTo(0,0); break;
    }
    case "diapo-prec": { const p = progLecon(ui.lecon); if(p.index > 0) p.index--; ui.quizRep = null; sauver(); rendre(); window.scrollTo(0,0); break; }

    case "ouvrir-fiche": ui.fiche = el.dataset.id; ui.ecran = "fiche"; rendre(); window.scrollTo(0,0); break;
    case "ecran-schemas": { ui.fiche = el.dataset.id || ui.fiche; ui.ecran = "schemas"; ui.codeOuvert = "";

    case "suppr-schema": { const c = S.cours.find(x => x.id === el.dataset.c);

        c.schemas = schemasDe(c).filter(y => y.id !== el.dataset.s);

    case "ouvrir-visuels": {

    case "vis-suppr": {

    }

    case "supprimer":
      if(confirm("Supprimer ce cours, sa fiche et ses exercices ?")){
        const c = S.cours.find(x => x.id === el.dataset.id);
        if(c){
          c.items.forEach(i => delete S.progres[i.id]);
          for(const v of (c.visuels || [])) if(v.kind === "image") await retirerImage(v.id);
        }
        S.cours = S.cours.filter(x => x.id !== el.dataset.id);
        sauver(); ui.ecran = "fiches"; rendre();
      } break;
    case "lire-suiv": ui.lirePos = (ui.lirePos || 0) + 1; rendre(); window.scrollTo(0,0); break;
    case "lire-prec": ui.lirePos = Math.max(0, (ui.lirePos || 0) - 1); rendre(); window.scrollTo(0,0); break;
    case "ouvrir-lire": ui.fiche = el.dataset.id || ui.fiche; ui.lirePos = 0; ui.ecran = "lire";
      ui.tab = "rev"; rendre(); window.scrollTo(0,0); break;
    case "imprimer-cartes": imprimerCartes(el.dataset.id); break;
    case "photo-retirer": ui.photos.splice(Number(el.dataset.i), 1); rendre(); break;
    case "transcrire": await transcrire(); break;
    case "analyser": await analyser(); break;
    case "fam-prep": ui.famPrep = el.dataset.v; rendre(); window.scrollTo(0,0); break;
    case "pod-duree": ui.podDuree = el.dataset.v; rendre(); break;
    case "pod-niveau": ui.podNiveau = el.dataset.v; rendre(); break;
    case "pod-faire": await podcastFaire(); break;
    case "pod-revoix": await podcastRevoix(); break;
    case "pod-essai": await podcastEssai(); break;
    case "pod-telecharger": {
      const p = ui.podcast;
      if(!p || !p.blob) break;
      const a = document.createElement("a");
      a.href = p.url;
      a.download = "podcast-" + normaliser(p.titre || "revision").replace(/\s+/g, "-").slice(0, 40) + ".wav";
      document.body.appendChild(a); a.click();
      setTimeout(() => a.remove(), 400);
      break;
    }
    case "charger-voix": {
      if(!S.reglages.cleGemini){ ui.message = {titre:"Clé manquante", txt:"Colle d'abord ta clé Google AI Studio."}; rendre(); break; }
      el.textContent = "Chargement…";
      try{
        const m = await modelesVoix(S.reglages.cleGemini);
        S.reglages.modelesVoix = m;
        if(!S.reglages.modeleVoix && m.length) S.reglages.modeleVoix = m[0].id;
        sauver();
        ui.message = m.length ? {type:"info", titre:"Modèles vocaux chargés", txt:m.length + " disponible" + (m.length>1?"s":"") + "."}
          : {titre:"Aucun modèle vocal", txt:"Ta clé ne donne pas accès à la synthèse vocale. Le podcast restera indisponible."};
      }catch(err){ ui.message = {type:"err", titre:"Clé refusée", txt:err.message}; }
      rendre(); break;
    }
    case "oral-ouvrir": await ouvrirOral(el.dataset.id); break;
    case "oral-creer": await creerOral(); break;
    case "oral-suppr-ress":
      if(confirm("Retirer toutes les mises en situation de cette matière ?")){
        const ids = (S.oral || []).filter(s => s.ressId === el.dataset.id).map(s => s.id);
        S.oral = (S.oral || []).filter(s => s.ressId !== el.dataset.id);
        S.oralPassages = (S.oralPassages || []).filter(p => ids.indexOf(p.scenarioId) < 0);
        sauver(); rendre();
      } break;
    case "oral-demarrer": tourSuivantOral(); break;
    case "oral-rejouer": direReplique(ui.oral.scenario.tours[ui.oral.tour].app); break;
    case "oral-parler": {
      const o = ui.oral;
      if(window.speechSynthesis) speechSynthesis.cancel();
      if(o.micro) demarrerPrise();
      o.phase = "parle"; o.debutTour = Date.now();
      rendre(); break;
    }
    case "oral-fini": await finirTourOral(); break;
    case "oral-critere": break;
    case "oral-terminer": terminerOral(); break;
    case "oral-quitter": quitterOral(); break;
    case "semestre": ui.semestre = Number(el.dataset.s); rendre(); break;
    case "langue": ui.langue = el.dataset.v; rendre(); break;
    case "lex-coller": ui.lexColler = !ui.lexColler; rendre(); break;
    case "lex-ajouter": {
      const fr = (ui.lexFr || "").trim(), etr = (ui.lexEtr || "").trim();
      if(fr.length < 2 || etr.length < 2){
        ui.message = {titre:"Entrée incomplète", txt:"Il faut les deux colonnes."}; rendre(); break;
      }
      const n = ajouterLexique([{fr, etr, exemple:(ui.lexEx || "").trim()}], ui.langue || "A", ui.semestre || 1);
      ui.lexFr = ""; ui.lexEtr = ""; ui.lexEx = "";
      ui.message = n ? {type:"info", titre:"Ajouté", txt:"Ce mot te sera demandé dans les deux sens."}
        : {titre:"Déjà présent", txt:"Cette entrée figure déjà dans ce lexique."};
      rendre(); break;
    }
    case "lex-importer": {
      const liste = lireListeLexique(ui.lexTexte);
      if(!liste.length){
        ui.message = {type:"err", titre:"Aucune entrée reconnue",
          txt:"Une ligne par mot, avec un séparateur : égal, deux-points, tiret ou tabulation."};
        rendre(); break;
      }
      const n = ajouterLexique(liste, ui.langue || "A", ui.semestre || 1);
      ui.lexTexte = ""; ui.lexColler = false;
      ui.message = {type:"info", titre:"Liste importée",
        txt: n + " entrée" + (n>1?"s":"") + " ajoutée" + (n>1?"s":"") +
          (liste.length - n ? ", " + (liste.length - n) + " déjà présente" + (liste.length-n>1?"s":"") : "") + "."};
      rendre(); break;
    }
    case "lex-suppr":
      if(confirm("Retirer ce mot du lexique ?")){ retirerLexique(el.dataset.id); rendre(); }
      break;
    case "note-ajouter": {
      const v = parseFloat(String(ui.noteVal).replace(",", "."));
      if(!ui.noteRess){ ui.message = {titre:"Matière manquante", txt:"Choisis la matière concernée."}; rendre(); break; }
      if(isNaN(v) || v < 0 || v > 20){ ui.message = {titre:"Note invalide", txt:"Une note entre 0 et 20."}; rendre(); break; }
      S.notes.push({id:uid(), ressId:ui.noteRess, libelle:(ui.noteLib||"").trim(), valeur:v, date:new Date().toISOString()});
      sauver();
      const r = RESSOURCE(ui.noteRess);
      if(r) ui.semestre = r.s;
      ui.noteLib = ""; ui.noteVal = "";
      ui.message = {type:"info", titre:"Note enregistrée", txt:"Les moyennes sont recalculées."};
      rendre(); break;
    }
    case "note-suppr":
      S.notes = S.notes.filter(x => x.id !== el.dataset.id); sauver(); rendre(); break;
    case "sae-statut": suiviSae(el.dataset.id).statut = el.dataset.v; sauver(); rendre(); break;
    case "sae-livrable-suppr": {
      const su = suiviSae(el.dataset.id);
      su.livrables.splice(Number(el.dataset.i), 1); sauver(); rendre(); break;
    }
    case "imprimer-questions": imprimerQuestions(); break;
    case "points-tout": {
      const c = ui.brouillon; if(!c) break;
      const t = cleTri(c);
      if(el.dataset.v === "1") t.off = {};
      else ["notions","parCoeur","calculs","juridique","pieges","exemples","sigles"].forEach(k =>
        (c.fiche[k] || []).forEach((_,i) => t.off[k + i] = true));
      rendre(); break;
    }
    case "valider-import": await creerExercices(); break;
    case "jeter-import":
      if(confirm("Jeter cette analyse ? Rien ne sera conservé.")) await jeterBrouillon();
      break;
    case "anonymiser": ui.importTexte = anonymiser(ui.importTexte); ui.avisRGPD = null; ui.rgpdIgnore = true;
      ui.message = {type:"info", titre:"Texte anonymisé", txt:"Relis-le avant de lancer l'analyse."}; rendre(); break;
    case "rgpd-ignorer": ui.rgpdIgnore = true; ui.avisRGPD = null; rendre(); break;

    case "session-prep": lancerSessionPrep(el.dataset.source, el.dataset.lecon); break;
    case "session": lancerSession(el.dataset.source,
      el.dataset.ress || el.dataset.niveau || el.dataset.mn, el.dataset.id); break;
    case "choix": {
      const it = s.liste[s.i];
      if(it.type === "qcmMulti"){ const k = Number(el.dataset.k); s.choix = s.choix || [];
        s.choix = s.choix.includes(k) ? s.choix.filter(x => x !== k) : s.choix.concat([k]); }
      else if(it.type === "vf") s.choix = el.dataset.v === "true";
      else s.choix = Number(el.dataset.k);
      rendre(); break;
    }
    case "classer": s.assoc[Number(el.dataset.i)] = el.dataset.col; rendre(); break;
    case "sur": s.sur = el.dataset.v === "1"; rendre(); break;
    case "monter": { const p = Number(el.dataset.p); const t = s.ordre[p-1]; s.ordre[p-1] = s.ordre[p]; s.ordre[p] = t; rendre(); break; }
    case "descendre": { const p = Number(el.dataset.p); const t = s.ordre[p+1]; s.ordre[p+1] = s.ordre[p]; s.ordre[p] = t; rendre(); break; }
    case "valider": await valider(); break;
    case "passer": if(s.mode === "examen") s.resultats.push({id:s.liste[s.i].id, ressId:s.liste[s.i].ressId, juste:false}); suivant(); break;
    case "auto": { const it = s.liste[s.i], j = el.dataset.v === "1";
      majProg(it.id, j, s.sur, s.banque); s.resultats.push({id:it.id, ressId:it.ressId, juste:j}); suivant(); break; }
    case "suivant": suivant(); break;
    case "quitter-session": terminerSession(); break;
    case "lancer-examen": {
      const nb = Math.max(10, Math.min(60, Number(document.getElementById("e-nb").value) || 20));
      const mn = Math.max(5, Math.min(180, Number(document.getElementById("e-min").value) || 30));
      ui.resultat = null; ouvrirSession(composerExamen(nb), "examen", mn*60); break;
    }

    case "moteur": S.reglages.moteur = el.dataset.v; sauver(); rendre(); break;
    case "complements": S.reglages.complements = !S.reglages.complements; sauver(); rendre(); break;
    case "tester-cle": ui.testCle = {etapes:[], fini:false}; rendre(); await testerCle(); break;
    case "annuler-appel": annulerAppel(); break;
    case "charger-modeles": {
      if(!S.reglages.cleGemini){ ui.message = {titre:"Clé manquante", txt:"Colle d'abord ta clé Google AI Studio."}; rendre(); break; }
      el.textContent = "Chargement…";
      try{
        const m = await listerModeles(S.reglages.cleGemini);
        S.reglages.modeles = m;
        if(!S.reglages.modele && m.length){
          const pref = m.find(x => /flash/i.test(x.id) && !/lite|preview|exp/i.test(x.id)) || m.find(x => /flash/i.test(x.id)) || m[0];
          S.reglages.modele = pref.id;
        }
        sauver(); ui.message = {type:"info", titre:"Modèles chargés", txt:m.length + " modèles disponibles."};
      }catch(err){ ui.message = {type:"err", titre:"Clé refusée", txt:err.message}; }
      rendre(); break;
    }
    case "exporter": telecharger("prepa-but-tc-" + new Date().toISOString().slice(0,10) + ".json", JSON.stringify(S, null, 1)); break;
    case "exporter-tout": {
      el.textContent = "Préparation…";
      const ids = S.cours.flatMap(c => (c.visuels||[]).filter(v => v.kind === "image").map(v => v.id));
      const images = await toutesImages(ids);
      const paquet = Object.assign({}, S, {images});
      const poids = Math.round(JSON.stringify(paquet).length / 1024);
      telecharger("prepa-but-tc-complet-" + new Date().toISOString().slice(0,10) + ".json", JSON.stringify(paquet));
      ui.message = {type:"info", titre:"Sauvegarde complète",
        txt: Object.keys(images).length + " image" + (Object.keys(images).length>1?"s":"") + " incluse" +
          (Object.keys(images).length>1?"s":"") + ", environ " + poids + " Ko."};
      rendre(); break;
    }
    case "tout-effacer":
      if(confirm("Effacer tes cours, fiches, exercices, schémas, notes et résultats ? La progression de la leçon est conservée.")){
        for(const c of S.cours) for(const v of (c.visuels || [])) if(v.kind === "image") await retirerImage(v.id);
        const prep = S.prep, pp = S.prepProgres, regl = S.reglages;
        S = etatVierge(); S.prep = prep; S.prepProgres = pp; S.reglages = regl;
        sauver(); ui.fiche = null; ui.vignettes = {}; aller("rev", "accueil");
      } break;
  }
});

document.addEventListener("change", async e => {
  const t = e.target;
  if(t.id === "i-fic" && t.files[0]){
    const f = t.files[0];
    ui.message = {type:"info", titre:"Lecture du fichier", txt:f.name}; rendre();
    try{
      const src = await lireFichier(f);
      if(src.pagesImages){
        // pas de texte a lire : ces images passent par le dechiffrage, comme une photo
        await poserPhotos(src.pagesImages);
        ui.message = {type:"info", titre:"À déchiffrer", txt:src.avis};
        rendre(); t.value = ""; return;
      }
      ui.importSrc = src; ui.importTexte = src.texte;
      if(!ui.importTitre) ui.importTitre = f.name.replace(/\.[^.]+$/,"");
      if(!ui.importRess) ui.importRess = detecterRessource(src.texte) || "";
      const al = sonderDonnees(src.texte);
      ui.avisRGPD = al.length ? al : null; ui.rgpdIgnore = false;
      ui.message = {type:"info", titre:"Fichier lu",
        txt: (src.avis ? src.avis + " " : "") +
          src.texte.length + " caractères" + (src.forts.length ? " · " + src.forts.length + " termes en gras repérés" : "") +
          (ui.importRess ? " · ressource proposée : " + ui.importRess : "") + "."};
    }catch(err){ ui.message = {type:"err", titre:"Lecture impossible", txt:err.message}; }
    t.value = ""; rendre(); return;
  }
  if(t.id === "i-json" && t.files[0]){
    try{
      const o = JSON.parse(await t.files[0].text());
      if(!o || !Array.isArray(o.cours)) throw new Error("Ce fichier ne contient pas de sauvegarde.");
      if(confirm("Remplacer les données actuelles ?")){
        const images = o.images || {};
        delete o.images;
        S = Object.assign(etatVierge(), o); sauver();
        let n = 0;
        for(const k of Object.keys(images)){ await poserImage(k, images[k]); n++; }
        ui.fiche = null; aller("rev","accueil");
        if(n) ui.message = {type:"info", titre:"Sauvegarde restaurée", txt:n + " image" + (n>1?"s":"") + " rétablie" + (n>1?"s":"") + "."};
        rendre();
      }
    }catch(err){ ui.message = {type:"err", titre:"Import impossible", txt:err.message}; rendre(); }
    return;
  }
  if((t.id === "i-photo" || t.id === "i-galerie") && t.files.length){
    await poserPhotos(Array.from(t.files));
    t.value = ""; return;
  }
  if(t.id === "v-img" && t.files[0]){
    const c = S.cours.find(x => x.id === ui.fiche);
    if(!c) return;
    try{
      const lu = await new Promise((ok,ko) => {
        const fr = new FileReader();
        fr.onload = () => ok(fr.result); fr.onerror = () => ko(new Error("Lecture impossible."));
        fr.readAsDataURL(t.files[0]);
      });
      const red = await reduireImage(lu);
      const vid = uid();
      await poserImage(vid, red.data);
      c.visuels = c.visuels || [];
      c.visuels.push({id:vid, kind:"image", legende:t.files[0].name.replace(/\.[^.]+$/,""), ancre:"",
        w:red.w, h:red.h, ko:poidsData(red.data)});
      sauver(); await chargerVignettes(c);
      ui.message = {type:"info", titre:"Image ajoutée", txt:"Donne-lui une légende et choisis son emplacement."};
    }catch(err){ ui.message = {type:"err", titre:"Image refusée", txt:err.message}; }
    rendre(); return;
  }
  if((t.id === "d-pdf" || t.id === "d-pdf2") && t.files[0]){
    try{
      ui.pdfBuf = await t.files[0].arrayBuffer();
      ui.pdfPage = 1; ui.sel = null; ui.pdfRecharge = true; pdfDoc = null;
      ui.ecran = "decoupe"; ui.tab = "rev";
      ui.message = {type:"info", titre:"PDF chargé", txt:t.files[0].name};
    }catch(err){ ui.message = {type:"err", titre:"Lecture impossible", txt:err.message}; }
    rendre(); return;
  }
  const act = t.closest("[data-act]");
  if(act && act.dataset.act === "assoc"){ ui.session.assoc[Number(act.dataset.i)] = t.value; return; }
  if(act && act.dataset.act === "sae-echeance"){
    suiviSae(act.dataset.id).echeance = t.value; sauver(); rendre(); return;
  }
  if(act && act.dataset.act === "sae-livrable"){
    const su = suiviSae(act.dataset.id);
    const x = su.livrables[Number(act.dataset.i)];
    if(x){ x.fait = t.checked; sauver(); }
    return;
  }
  if(act && act.dataset.act === "sae-nouveau"){
    const txt = (t.value || "").trim();
    if(txt){
      suiviSae(act.dataset.id).livrables.push({txt, fait:false});
      sauver(); t.value = ""; rendre();
    }
    return;
  }
  if(act && act.dataset.act === "oral-critere"){
    if(!ui.oral) return;
    ui.oral.coches[Number(act.dataset.i)] = t.checked;
    rendre(); return;
  }
  if(act && act.dataset.act === "question-posee"){
    if(t.checked) S.questions[act.dataset.cle] = true; else delete S.questions[act.dataset.cle];
    sauver(); rendre(); return;
  }
  if(act && (act.dataset.act === "vis-legende" || act.dataset.act === "vis-ancre")){
    const c = S.cours.find(x => x.id === ui.fiche); if(!c) return;
    const v = (c.visuels || [])[Number(act.dataset.i)]; if(!v) return;
    if(act.dataset.act === "vis-legende") v.legende = t.value; else v.ancre = t.value;
    sauver(); return;
  }
  if(act && act.dataset.act === "tri-off"){
    const c = ui.brouillon || S.cours.find(x => x.id === ui.fiche); if(!c) return;
    const tri = cleTri(c);
    if(t.checked) delete tri.off[act.dataset.ref]; else tri.off[act.dataset.ref] = true;
    if(ui.brouillon) rendre(); else sauver();
    return;
  }
  if(act && act.dataset.act === "tri-fort"){
    const c = S.cours.find(x => x.id === ui.fiche); if(!c) return;
    cleTri(c).fort[act.dataset.ref] = t.value; sauver(); return;
  }
  const b = t.dataset.bind;
  if(!b || b === "requete") return;
  if(b in ui){
    ui[b] = t.value;
    if(b === "importTexte"){
      const al = sonderDonnees(t.value);
      ui.avisRGPD = al.length ? al : null;
      if(!ui.importRess){ const d = detecterRessource(t.value); if(d) ui.importRess = d; }
      rendre();
    }
    if(b === "importRess" && ui.ecran === "valider") rendre();
  } else {
    S.reglages[b] = t.value; sauver();
    if(["dateExamen","dateRentree","voix","debitVoix"].includes(b)) rendre();
  }
});
document.addEventListener("input", e => {
  const b = e.target.dataset.bind;
  if(b === "requete"){
    ui.requete = e.target.value;
    clearTimeout(window.__rech);
    window.__rech = setTimeout(() => {
      const c0 = document.getElementById("q-txt");
      const pos = c0 ? c0.selectionStart : null;
      rendre();
      const c = document.getElementById("q-txt");
      if(c){ c.focus(); if(pos !== null) try{ c.setSelectionRange(pos, pos); }catch(err){} }
    }, 260);
    return;
  }
  if(["importTexte","importTitre","noteLib","noteVal","lexFr","lexEtr","lexEx","lexTexte","podScript","nouveauTitre","codeSchema"].includes(b))
    ui[b] = e.target.value;
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.id === "rep" && e.target.tagName === "INPUT"){ e.preventDefault(); valider(); }
  const act = e.target.closest && e.target.closest('[data-act="sae-nouveau"]');
  if(e.key === "Enter" && act){
    e.preventDefault();
    const txt = (e.target.value || "").trim();
    if(txt){ suiviSae(act.dataset.id).livrables.push({txt, fait:false}); sauver(); e.target.value = ""; rendre(); }
  }
});
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if(ui.ecran === "reglages") rendre(); };
try{
  const mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
  const suivre = () => { if((S.reglages.theme || "auto") === "auto") appliquerTheme(); };
  if(mq && mq.addEventListener) mq.addEventListener("change", suivre);
  else if(mq && mq.addListener) mq.addListener(suivre);
}catch(e){}

/* ---- tutos : bandeau, gestes attendus, gestes refusés ---- */
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("#tuto [data-tuto]");
  if(!b || !TUTO.actif) return;
  const et = etapeTuto();
  switch(b.dataset.tuto){
    case "suivant": etapeSuivante(); break;
    case "fin": quitterTuto(); break;
    case "quitter": quitterTuto(); break;
    case "passer": passerEtapeTuto(); break;
    case "ramener": ramenerTuto(); break;
    case "action": if(et && et.action) et.action.faire(); break;
  }
});
// pendant un tuto, seul le geste demandé passe ; le reste est expliqué, pas exécuté
document.addEventListener("click", e => {
  const t = TUTO.actif; if(!t) return;
  if(e.target.closest("#tuto")) return;
  if(/^(INPUT|SELECT|TEXTAREA|OPTION)$/.test(e.target.tagName)) return;
  const el = e.target.closest("[data-act], label[for], a[href]");
  if(!el) return;
  const et = etapeTuto();
  if(et && et.cible && et.quand && el.closest(".tutoCible")) return;
  e.preventDefault(); e.stopImmediatePropagation();
  t.horsCible = true; afficherBandeauTuto();
}, true);
["input","change"].forEach(ev => document.addEventListener(ev, () => {
  if(TUTO.actif) setTimeout(suivreTuto, 30);
}));

charger();
if(!S.prep) S.prep = {};
rendre();

</script>
