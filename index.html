/* ---- R1.14 Expression, communication et culture - 1 — vérifiée le 7 septembre 2026 ---- */
"R1.14": {titre:"Expression, communication et culture - 1", ressId:"R1.14", duree:"16 min", diapos:[
 {t:"intro", kick:"R1.14 · avant le premier cours", titre:"S'informer et informer, de manière critique",
  texte:"Le programme résume la matière en deux verbes : s'informer et informer de manière critique, et communiquer de manière adaptée aux situations. Ce n'est pas un cours de français au sens scolaire. C'est un entraînement à ne pas se faire avoir par une information, et à écrire des documents que des professionnels liront."},

 {t:"notion", kick:"Le programme", titre:"Deux objectifs, deux moitiés de cours",
  paras:["Le programme énonce deux contributions : s'informer et informer de manière critique, et communiquer de manière adaptée aux situations.",
   "Le contenu suit ce découpage. Une première moitié sur la recherche documentaire, la fiabilité des sources et l'esprit critique. Une seconde sur la communication professionnelle : les écrits, l'image, les normes de présentation."],
  encart:{type:"info", titre:"Une ressource transversale", texte:"Trois compétences, les trois SAÉ, plus le portfolio. Comme les techniques quantitatives et le numérique, cette matière est partout."}},

 {t:"notion", kick:"S'informer", titre:"Recherche documentaire et normes bibliographiques",
  paras:["Le contenu cite l'initiation à la recherche documentaire, en donnant pour exemples le recours à l'environnement numérique de travail, aux bases de données et aux normes bibliographiques.",
   "Les normes bibliographiques ne sont pas un caprice académique. Citer correctement permet à un lecteur de retrouver ta source, et te protège contre l'accusation de plagiat."],
  encart:{type:"astuce", titre:"À faire dès le premier dossier", texte:"Note la référence complète de chaque source au moment où tu la consultes. Reconstituer une bibliographie après coup prend trois fois plus de temps."}},

 {t:"notion", kick:"S'informer", titre:"Fiabilité, pertinence, et le mot qui fâche",
  paras:["Le programme demande l'étude de la fiabilité et de la pertinence des informations et des sources choisies. Il cite explicitement deux termes : les fausses informations et le plagiat.",
   "Il précise aussi les types de sources à examiner : médias grand public et spécialisés, internet."],
  encart:{type:"piege", titre:"Le plagiat", texte:"Ce n'est pas seulement recopier sans citer. Reformuler l'idée de quelqu'un sans le mentionner en est aussi. La règle est simple : si l'idée n'est pas de toi, dis d'où elle vient."}},

 {t:"notion", kick:"S'informer", titre:"Esprit critique et culture générale",
  paras:["Le troisième point demande le développement de l'esprit critique et de la culture générale, en privilégiant les sujets d'actualité socio-économique, géopolitique et culturelle.",
   "Pour un commercial, ce n'est pas un ornement. Comprendre le contexte dans lequel évolue un client, savoir de quoi on parle en rendez-vous, être capable de tenir une conversation informée : c'est du métier."],
  encart:{type:"astuce", titre:"L'habitude à prendre", texte:"Quinze minutes d'actualité économique par jour, sur une source sérieuse. Sur trois ans, l'écart avec ceux qui ne le font pas devient énorme."}},

 {t:"quiz", kick:"Vérification", question:"Tu reformules avec tes mots l'analyse d'un auteur, sans le citer. Que dit le programme ?",
  options:["C'est correct, puisque les mots sont les tiens",
   "C'est du plagiat : le programme cite explicitement le plagiat parmi les points à étudier, et l'idée reste celle d'un autre",
   "Cela dépend de la longueur du passage"],
  bonne:1,
  expl:"Le plagiat ne porte pas seulement sur les mots mais sur les idées. Le contenu officiel place le plagiat dans l'étude de la fiabilité des sources et de l'usage de l'information."},

 {t:"notion", kick:"Communiquer", titre:"La sémiologie, pour communiquer par l'image",
  paras:["Le contenu annonce le développement des savoirs et savoir-faire en sémiologie afin de communiquer par l'image, avec pour exemples le flyer, l'affiche et le support d'exposé.",
   "La sémiologie est l'étude des signes et de la façon dont ils produisent du sens. Appliquée à une affiche : pourquoi cette couleur, ce cadrage, ce regard vers l'objectif produisent-ils tel effet."],
  encart:{type:"info", titre:"Le pont avec la SAÉ", texte:"C'est exactement ce qu'il faut pour la SAÉ de communication commerciale, où tu produiras un support imprimé. Ici on apprend à lire l'image, ailleurs on apprend à la fabriquer."}},

 {t:"notion", kick:"S'informer", titre:"Distinguer les types de sources",
  paras:["Le contenu cite les sources à examiner : médias grand public et spécialisés, internet. Chacun a sa logique propre.",
   "Un média grand public simplifie pour toucher large ; un média spécialisé suppose des connaissances mais entre dans le détail. Aucun n'est meilleur en soi : tout dépend de ce que tu cherches et de ce que tu comptes en faire."],
  encart:{type:"astuce", titre:"La question à se poser", texte:"Qui parle, à qui, et pour quoi faire ? Trois questions qui suffisent à situer presque n'importe quelle source."}},

 {t:"notion", kick:"Communiquer", titre:"Les outils de présentation cités",
  paras:["Le programme cite les logiciels de carte heuristique, de diaporama et d'infographie parmi les outils de présentation à mobiliser.",
   "On retrouve la carte heuristique en conduite de projet, le diaporama en ressources numériques. Les matières se recoupent volontairement."],
  encart:{type:"astuce", titre:"Ce que ça t'évite", texte:"Trois matières t'enseignent le même outil sous trois angles. Ne les traite pas comme trois apprentissages séparés."}},

 {t:"notion", kick:"Communiquer", titre:"Lire les écritures professionnelles",
  paras:["Le contenu demande l'analyse et la compréhension des écritures professionnelles, à travers les textes de la presse généraliste ou spécialisée.",
   "Avant d'écrire comme un professionnel, on apprend à repérer comment les professionnels écrivent : structure d'un article, hiérarchie de l'information, choix du registre."],
  encart:{type:"info", titre:"Le lien avec l'actualité", texte:"C'est aussi le support du travail sur l'esprit critique : les mêmes textes servent aux deux moitiés du cours."}},

 {t:"notion", kick:"Communiquer", titre:"Les documents que tu vas produire",
  paras:["Le programme liste, à titre indicatif : revue de presse, dossier, plaquette de présentation, rapport simple, note, courrier, courriel.",
   "Chacun a ses codes. Une note n'est pas un courriel, un rapport n'est pas un dossier. Ce que le programme appelle communiquer de manière adaptée aux situations, c'est précisément savoir choisir le bon format."],
  encart:{type:"piege", titre:"L'erreur de format", texte:"Rendre un dossier là où une note d'une page était attendue n'est pas du zèle : c'est une réponse inadaptée à la situation, et c'est évalué comme telle."}},

 {t:"notion", kick:"La forme", titre:"Typographie, orthographe, syntaxe",
  paras:["Le dernier point du contenu porte sur la compréhension et le respect des normes de présentation écrites : typographie, orthographe et syntaxe.",
   "En commerce, un document fautif ne fait pas seulement mauvais effet : il jette un doute sur le sérieux de tout ce qu'il contient. Un devis avec trois fautes fait douter du chiffrage."],
  encart:{type:"astuce", titre:"À Carcassonne", texte:"La fiche de l'IUT mentionne le logiciel Voltaire et un module d'accompagnement en français. Si l'orthographe est un point faible, c'est le moment de le traiter."}},

 {t:"quiz", kick:"Vérification", question:"Ton enseignant demande une note d'une page. Tu rends un dossier de quinze pages très documenté. Que va-t-il constater ?",
  options:["Un travail supérieur aux attentes",
   "Une communication inadaptée à la situation, ce que le programme évalue précisément",
   "Un problème de gestion du temps uniquement"],
  bonne:1,
  expl:"Le deuxième objectif du programme est de communiquer de manière adaptée aux situations. Choisir le bon format fait partie de la compétence, et une note se caractérise par sa brièveté."},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les formats à distinguer", mots:[
  {m:"Note", d:"Un document court, factuel, qui informe ou propose une décision. Une page au maximum."},
  {m:"Rapport", d:"Un document structuré qui rend compte d'un travail et débouche sur des conclusions."},
  {m:"Revue de presse", d:"Une sélection commentée d'articles sur un sujet, avec ses sources."},
  {m:"Plaquette de présentation", d:"Un support de communication soigné, destiné à un lecteur extérieur."}],
  note:"Ces quatre formats figurent dans la liste indicative du programme, avec le dossier, le courrier et le courriel."},

 {t:"notion", kick:"Communiquer", titre:"Adapter, c'est choisir le registre",
  paras:["Communiquer de manière adaptée aux situations ne concerne pas que le format. Le registre de langue compte autant : un courriel à un enseignant, un courrier à une entreprise et un message à un camarade de groupe ne s'écrivent pas pareil.",
   "Le programme range cette exigence avec les normes de présentation écrites. La forme n'est pas séparable du fond dans un écrit professionnel."],
  encart:{type:"piege", titre:"L'erreur fréquente", texte:"Écrire à une entreprise comme on écrit un message personnel. C'est le premier filtre, souvent inconscient, du recruteur qui te lit."}},

 {t:"notion", kick:"L'évaluation", titre:"Une matière évaluée partout",
  paras:["Trois compétences, trois SAÉ, plus le portfolio. Chaque livrable que tu produiras cette année passe par cette matière : sa structure, son registre, sa présentation, ses sources.",
   "Autrement dit, même si le cours lui-même est peu évalué en tant que tel, son effet se voit dans toutes les autres notes."],
  encart:{type:"info", titre:"À Carcassonne", texte:"La matière pèse 0,5 en UE Marketer, 1 en UE Vendre et 0,5 en UE Communiquer, pour vingt heures."}},

 {t:"encart", kick:"Attention", titre:"L'esprit critique s'applique aussi aux outils d'aide à la rédaction", type:"garde",
  texte:"Le programme demande d'étudier la fiabilité des informations et de développer l'esprit critique. Cette exigence vaut pour toutes les sources, y compris les outils qui rédigent ou résument à ta place. Un texte produit sans vérification peut contenir des affirmations fausses, des sources inventées ou des références qui n'existent pas — et c'est toi qui signes. Vérifie chaque fait et chaque référence avant de les reprendre à ton compte. Sur les règles applicables dans ta formation, demande à ton IUT : elles varient d'un établissement à l'autre et je ne les connais pas."},

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",
  etapes:["Quelle norme bibliographique est exigée dans les dossiers",
   "Quels formats d'écrits professionnels seront évalués au semestre 1",
   "Quelles règles s'appliquent aux outils d'aide à la rédaction dans les travaux rendus"],
  note:"La première évite de refaire une bibliographie entière, la troisième évite un malentendu qui peut coûter cher."},

 {t:"chiffres", kick:"Récapitulatif", titre:"Ce qu'il faut retenir", lignes:[
  {v:"20 h", l:"volume national"},
  {v:"2", l:"objectifs : s'informer de manière critique, communiquer de manière adaptée"},

  {v:"3", l:"compétences, 3 SAÉ, plus le portfolio"}]},

/* ---- R1.15 Projet personnel et professionnel - 1 — vérifiée le 7 septembre 2026 ---- */
"R1.15": {titre:"Projet personnel et professionnel - 1", ressId:"R1.15", duree:"15 min", diapos:[
 {t:"intro", kick:"R1.15 · avant le premier cours", titre:"La matière qui parle de toi",
  texte:"Quatorze heures pour répondre à trois questions : comment fonctionne ma formation, quels métiers elle mène, et lequel me correspond. Beaucoup d'étudiants la traitent par-dessus la jambe. C'est pourtant elle qui décide de ton parcours en deuxième année et de ta recherche de stage."},

 {t:"notion", kick:"Le programme", titre:"Six objectifs, très concrets",
  paras:["Le programme énonce que le projet personnel et professionnel permet à l'étudiant : d'avoir une compréhension exhaustive du référentiel de compétences de la formation et des éléments le structurant ; de faire le lien entre les niveaux de compétences ciblés, les SAÉ et les ressources de chaque semestre ; de découvrir les métiers associés à la spécialité et les environnements professionnels correspondants ; de se positionner sur un des parcours de la spécialité ; de mobiliser les techniques de recrutement pour une recherche de stage ou d'alternance ; et d'engager une réflexion sur la connaissance de soi.",
   "Le premier objectif est inattendu et utile : comprendre comment fonctionne sa propre formation."],
  encart:{type:"info", titre:"Ce que tu as déjà fait", texte:"La leçon « Comprendre le BUT » de cette application couvre précisément le premier objectif. Tu as pris de l'avance."}},

 {t:"notion", kick:"S'approprier la formation", titre:"Comprendre le référentiel, pour de bon",
  paras:["Le programme demande de s'approprier les compétences de la formation et d'identifier les blocs de compétences, puis de référencer ces compétences et de les associer à la réalité du terrain.",
   "Autrement dit : savoir dire ce que Marketer, Vendre et Communiquer signifient concrètement, et reconnaître ces compétences dans une situation professionnelle réelle."],
  encart:{type:"astuce", titre:"L'exercice de base", texte:"Devant n'importe quelle offre de stage, demande-toi laquelle des trois compétences elle mobilise principalement. C'est exactement ce que le PPP entraîne."}},

 {t:"notion", kick:"Se connaître", titre:"La démarche réflexive et introspective",
  paras:["Le contenu demande de développer une démarche réflexive et introspective, pour découvrir ses valeurs, ses qualités, ses motivations, ses savoirs, savoir-être et savoir-faire, au travers de son expérience et de ses centres d'intérêt.",
   "Le mot réflexif est technique : il désigne la capacité à interroger et analyser sa propre expérience. Le programme précise d'ailleurs « s'initier à la démarche réflexive : savoir interroger et analyser son expérience »."],
  encart:{type:"piege", titre:"Ce que ce n'est pas", texte:"Ce n'est pas de la psychologie et ce n'est pas un test de personnalité. C'est un exercice d'analyse : qu'est-ce que j'ai fait, comment, avec quel résultat, qu'est-ce que j'en tire."}},

 {t:"notion", kick:"Se projeter", titre:"La démarche prospective",
  paras:["Le contenu demande aussi de placer l'étudiant dans une démarche prospective en termes d'avenir, de souhaits et de motivation vis-à-vis d'un projet d'études ou professionnel.",
   "Réflexif regarde en arrière, prospectif regarde en avant. Les deux se répondent : on ne construit un projet crédible qu'à partir de ce qu'on sait de soi."],
  encart:{type:"info", titre:"Le calendrier", texte:"Le choix du parcours se fait au semestre 3. Le travail commencé ici en est la préparation directe."}},

 {t:"quiz", kick:"Vérification", question:"Que signifie « démarche réflexive » dans le programme ?",
  options:["Réfléchir longuement avant de décider",
   "Savoir interroger et analyser sa propre expérience",
   "Suivre un test d'orientation"],
  bonne:1,
  expl:"Le contenu officiel est explicite : « s'initier à la démarche réflexive : savoir interroger et analyser son expérience »."},

 {t:"notion", kick:"S'approprier la formation", titre:"Relier compétences, SAÉ et ressources",
  paras:["Le deuxième objectif demande de faire le lien entre les niveaux de compétences ciblés, les SAÉ et les ressources au programme de chaque semestre.",
   "C'est ce qui transforme une liste de matières en un ensemble cohérent : comprendre pourquoi telle ressource existe, à quelle SAÉ elle sert, et quelle compétence elle construit."],
  encart:{type:"astuce", titre:"Tu peux le faire tout de suite", texte:"Chaque leçon de cette application indique la compétence visée et les SAÉ alimentées. Le travail est déjà à moitié fait."}},

 {t:"notion", kick:"Les métiers", titre:"Découvrir ce vers quoi ça mène",
  paras:["Le troisième objectif porte sur la découverte des métiers associés à la spécialité et des environnements professionnels correspondants.",
   "Techniques de commercialisation ne mène pas à un métier mais à une famille de métiers : vente, marketing, communication commerciale, distribution, relation client, achats, commerce international. Chacun a ses réalités quotidiennes, très différentes."],
  encart:{type:"astuce", titre:"Le meilleur moyen de savoir", texte:"Parler à quelqu'un qui fait le métier. Un échange de vingt minutes en apprend plus que trois heures de fiches métiers."}},

 {t:"notion", kick:"Le parcours", titre:"Se positionner en connaissance de cause",
  paras:["Le quatrième objectif est de se positionner sur un des parcours de la spécialité lorsque ces parcours sont proposés en seconde année.",
   "À Carcassonne, deux parcours sont ouverts : marketing digital, e-business et entrepreneuriat, et marketing et management du point de vente. Les trois autres existent ailleurs."],
  encart:{type:"info", titre:"Dans cette application", texte:"L'onglet Préparation contient une fiche par parcours, avec les compétences ajoutées, les matières spécifiques et, pour ceux qui ne sont pas à Carcassonne, la liste des IUT où les suivre."}},

 {t:"notion", kick:"Le stage", titre:"Les techniques de recrutement",
  paras:["Le cinquième objectif est de mobiliser les techniques de recrutement dans le cadre d'une recherche de stage ou d'un contrat d'alternance.",
   "Curriculum vitae, lettre de motivation, entretien, présentation de soi : ce sont des techniques qui s'apprennent et se travaillent, pas des qualités innées."],
  encart:{type:"astuce", titre:"Le calendrier serré", texte:"Le stage de première année a lieu au semestre 2. La recherche commence donc pendant le semestre 1. Ne t'y prends pas au dernier moment."}},

 {t:"notion", kick:"Le lien", titre:"Le PPP se nourrit de tout le reste",
  paras:["La ressource est rattachée aux trois compétences, aux trois SAÉ et au portfolio. Ce n'est pas un cours isolé : c'est le fil qui relie tout le reste.",
   "Chaque SAÉ te fait vivre une situation professionnelle. Le PPP te demande d'en tirer quelque chose sur toi : ce que tu as aimé, ce que tu as réussi, ce qui t'a coûté."],
  encart:{type:"info", titre:"Le portfolio", texte:"C'est le document où cette réflexion s'écrit et s'accumule sur trois ans. Le PPP en est le moteur."}},

 {t:"quiz", kick:"Vérification", question:"À quel moment le choix du parcours de spécialisation intervient-il ?",
  options:["Dès l'inscription en première année",
   "Au semestre 3, en deuxième année",
   "À la fin de la troisième année"],
  bonne:1,
  expl:"Le programme prévoit que l'étudiant se positionne sur un parcours lorsque ceux-ci sont proposés en seconde année. Le PPP de première année sert précisément à préparer ce choix."},

 {t:"etapes", kick:"La démarche", titre:"Ce que le semestre va enchaîner",
  etapes:["Comprendre le référentiel de compétences de la formation",
   "Faire le lien entre compétences, SAÉ et ressources",
   "Engager la réflexion sur soi : valeurs, qualités, motivations",
   "Découvrir les métiers et les environnements professionnels",
   "Travailler les techniques de recrutement",
   "Commencer à se positionner sur un parcours"],
  note:"Ordre déduit de la présentation des objectifs officiels. La progression réelle dépendra de ton enseignant."},

 {t:"notion", kick:"Se connaître", titre:"Savoirs, savoir-faire, savoir-être",
  paras:["Le contenu cite explicitement trois registres à explorer : les savoirs, les savoir-faire et les savoir-être, aux côtés des valeurs, des qualités et des motivations.",
   "Les savoirs sont ce que tu connais, les savoir-faire ce que tu sais exécuter, les savoir-être la manière dont tu te comportes en situation. Un recruteur s'intéresse aux trois, et souvent surtout au dernier."],
  encart:{type:"info", titre:"Pourquoi c'est utile", texte:"Un entretien de stage ne teste presque jamais tes connaissances. Il teste comment tu réagis, comment tu écoutes, comment tu expliques."}},

 {t:"notion", kick:"La méthode", titre:"Pourquoi ça paraît vague, et comment y remédier",
  paras:["Le PPP a mauvaise réputation parce qu'on y demande de parler de soi sans grille précise. La parade est de toujours partir du concret : une expérience, un travail rendu, une situation vécue.",
   "Plutôt que « je suis quelqu'un d'organisé », écris ce que tu as organisé, comment, et ce qui a marché ou non. C'est ce qu'on appelle analyser son expérience."],
  encart:{type:"astuce", titre:"La règle qui sauve", texte:"Jamais d'affirmation sur toi sans un exemple derrière. C'est aussi ce qui fera la différence en entretien de stage."}},

 {t:"notion", kick:"À faire dès maintenant", titre:"Constituer sa matière première",
  paras:["Le PPP se nourrit de traces. Un travail dont tu es fière, un retour d'enseignant, une difficulté surmontée, une rencontre professionnelle.",
   "Ceux qui gardent ces traces au fil de l'eau écrivent leur portfolio en quelques heures. Ceux qui ne les gardent pas passent un week-end à essayer de se souvenir."],
  encart:{type:"astuce", titre:"Le geste concret", texte:"Un dossier, un fichier par mois, trois lignes à chaque fois : ce que j'ai fait, ce que j'en ai appris. C'est tout."}},

 {t:"encart", kick:"Attention", titre:"Un projet professionnel n'est pas un engagement définitif", type:"garde",
  texte:"Le PPP demande de se projeter, et beaucoup d'étudiants s'en inquiètent : comment décider à dix-huit ans de ce qu'on fera de sa vie ? Ce n'est pas ce qu'on te demande. Le programme parle de démarche prospective, de souhaits et de motivation, pas de décision irrévocable. Un projet se formule, s'éprouve au contact du terrain, et se révise. Ce qui est évalué, c'est la qualité de la réflexion, pas la justesse de la prédiction. Changer d'avis après un stage n'est pas un échec du PPP : c'est exactement ce à quoi il sert."},

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",
  etapes:["Quels livrables de PPP seront évalués au semestre 1",
   "Le portfolio est-il commencé dès ce semestre, et sous quel format",
   "L'IUT organise-t-il des rencontres avec des professionnels ou des anciens"],
  note:"La troisième ouvre souvent des portes que personne ne pense à demander."},

/* Anneau à trois segments : jamais fait, fait sans être acquis, acquis.
   Le fond gris porte le premier état. */
function anneau3(c, taille, centre){
  const t = Math.max(1, c.total);
  const r = (taille - 9) / 2, circ = 2 * Math.PI * r;
  const seg = (n, coul, debut) => {
    const l = circ * n / t;
    if(l <= 0) return "";
    return '<circle cx="' + taille/2 + '" cy="' + taille/2 + '" r="' + r + '" fill="none" stroke="' + coul +
      '" stroke-width="7" stroke-dasharray="' + l.toFixed(1) + " " + (circ - l).toFixed(1) +
      '" stroke-dashoffset="' + (-circ * debut / t).toFixed(1) + '" ' +
      'transform="rotate(-90 ' + taille/2 + " " + taille/2 + ')"></circle>';
  };
  const val = centre !== undefined ? centre : (c.total ? Math.round(c.acquis / c.total * 100) + "%" : "\u2014");
  return '<svg width="' + taille + '" height="' + taille + '" viewBox="0 0 ' + taille + ' ' + taille +
    '" role="img" aria-label="' + c.acquis + " acquis, " + c.encours + " en cours, " + c.jamais + ' jamais faits">' +
    '<circle cx="' + taille/2 + '" cy="' + taille/2 + '" r="' + r + '" fill="none" stroke="var(--trait2)" stroke-width="7"></circle>' +
    seg(c.acquis, "var(--c2)", 0) +
    seg(c.encours, "var(--rouge)", c.acquis) +
    '<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" ' +
    'font-family="Outfit, sans-serif" font-size="' + Math.round(taille/3.4) + '" font-weight="700" ' +
    'letter-spacing="-0.5" ' +
    'fill="var(--encre)">' + esc(String(val)) + "</text></svg>";
}

    '<span><i style="background:var(--trait2)"></i>jamais fait</span></div>';
}
/* Couverture d'une matière : combien d'exercices existent, et dans quel état. */
function couverture(ressId, banque){
  const l = (banque === "prep" ? itemsPrep() : tousItems()).filter(i => i.ressId === ressId);
  const t = banque === "prep" ? S.prepProgres : S.progres;
  let jamais = 0, encours = 0, acquis = 0;
  l.forEach(i => {
    const p = t[i.id];
    if(!p || !p.vus) jamais++;
    else if(p.boite === 3) acquis++;
    else encours++;
  });
  return {total:l.length, jamais, encours, acquis,
    part: l.length ? Math.round(acquis / l.length * 100) : 0,
    cours: banque === "prep" ? 0 : S.cours.filter(c => c.ressId === ressId).length};
}
/* Ce qui pèse lourd et qui n'est pas su passe devant. */
function priorite(r, banque){
  return coefTotal(r) * (1 - couverture(r.id, banque).part / 100);
}
function ligneMatiere(r, banque){
  const c = couverture(r.id, banque);
  const coef = String(coefTotal(r)).replace(".", ",");
  const etatChiffre = c.acquis + " acquis · " + c.encours + " à reprendre · " + c.jamais + " jamais faits";
  let etat = "", bouton = "";
  if(banque === "prep"){
    const L = LECONS[r.id], p = L ? progLecon(r.id) : null;
    if(!L) etat = "leçon à venir";
    else if(!p.termine) etat = p.index > 0 ? "leçon commencée · écran " + (p.index + 1) + " sur " + L.diapos.length : "leçon à lire";
    else etat = etatChiffre;
    if(L && p.termine && c.total)
      bouton = '<button class="btn mini" data-act="session-prep" data-source="prep-lecon" data-lecon="' + esc(r.id) + '">Exercices</button>';
    else if(L) bouton = '<button class="btn mini" data-act="ouvrir-lecon" data-l="' + esc(r.id) + '">Lire</button>';
  } else {
    etat = c.cours ? etatChiffre : "aucun cours importé";
    bouton = c.total ? '<button class="btn mini" data-act="session" data-source="ress" data-ress="' + esc(r.id) + '">Réviser</button>'
                     : '<button class="btn mini" data-act="ecran" data-e="import">Importer</button>';
  }
  return '<div class="ligneMat u' + ueDominante(r) + '">' + anneau3(c, 46) +
    '<span class="tx"><b>' + esc(r.id + " · " + tronquer(r.nom, 26)) + "</b><small>" + esc(etat) + "</small>" +
    '<small style="color:var(--encre3)">coefficient ' + coef + (r.h ? " · " + r.h + " h" : "") + "</small></span>" +
    bouton + "</div>";
}

function ecranExercicesPrep(){
  const total = itemsPrep().length;
  let h = '<div class="ecran">' + retour("accueil", "M'entraîner");
  if(!total){
    return h + '<div class="vide"><div class="em">◇</div><h3>Aucun exercice pour l\'instant</h3>' +
      "<p>Les exercices d'une matière apparaissent une fois sa leçon terminée.</p></div></div>";
  }
  const fam = ui.famPrep || "";
  const memo = itemsPrep().filter(i => viseeDe(i) === "memo");
  const comp = itemsPrep().filter(i => viseeDe(i) === "comprehension");

  if(!fam){
    h += '<p class="sousTitre">Deux façons de travailler, à ne pas mélanger. Choisis d\'abord laquelle.</p>';
    h += '<div class="choixGros">' +
      '<button data-act="fam-prep" data-v="memo"><span class="ic">▪</span><b>Mémoriser</b>' +
      '<small>Restituer une définition, un chiffre, une liste</small>' +
      '<span class="puce mono">' + memo.length + " exercices</span></button>" +
      '<button data-act="fam-prep" data-v="comprehension"><span class="ic">◎</span><b>Comprendre</b>' +
      '<small>Expliquer, distinguer, justifier, appliquer</small>' +
      '<span class="puce mono">' + comp.length + " exercices</span></button></div>";
    const dus = itemsDusPrep().length, err = erreursPrep().length;
    h += '<p class="kick" style="margin-top:16px">Ou reprendre directement</p>';
    h += carteSession("↻", "À revoir aujourd'hui", dus + " exercice" + (dus>1?"s":"") + " à échéance", "prep-dus", dus);
    h += carteSession("✎", "Ce que je rate", err ? err + " en attente" : "rien en attente", "prep-erreurs", err);
    return h + "</div>";
  }

  const l = fam === "memo" ? memo : comp;
  h += '<div class="liste-puces">' +
    '<button class="puce' + (fam==="memo"?" on":"") + '" data-act="fam-prep" data-v="memo">Mémoriser</button>' +
    '<button class="puce' + (fam==="comprehension"?" on":"") + '" data-act="fam-prep" data-v="comprehension">Comprendre</button>' +
    '<button class="puce" data-act="fam-prep" data-v="">Revenir au choix</button></div>';

  if(fam === "memo"){
    const t = itemsDusPrep().filter(i => viseeDe(i) === "memo").length;
    h += '<p class="sousTitre">Restituer ce qui doit être su par cœur. ' + DELAIS_TXT + "</p>";
    h += carteSession("↻", "À revoir aujourd'hui", t + " exercice" + (t>1?"s":""), "prep-dus-memo", t);
    h += carteSession("▪", "Tout reprendre", l.length + " exercices de mémorisation", "prep-memo", l.length);
    h += '<p class="kick" style="margin-top:16px">Par matière</p>';
    RESS.filter(r => r.s === 1).forEach(r => {
      const n = l.filter(i => i.ressId === r.id).length;
      if(!n) return;
      const c = couverture(r.id, "prep"), ue = ueDominante(r);
      h += '<div class="ligneMat">' + anneau3(c, 42) +
        '<span class="tx"><b>' + esc(r.id + " · " + tronquer(r.nom, 26)) + "</b><small>" + n + " en mémorisation</small></span>" +
        '<button class="btn mini" data-act="session-prep" data-source="prep-lecon" data-lecon="' + esc(r.id) + '">Réviser</button></div>';
    });
    return h + "</div>";
  }

  h += '<p class="sousTitre">Quatre étapes, de la plus simple à la plus exigeante. ' +
    "Rien ne t'empêche de sauter, mais l'ordre est là pour une raison.</p>";
  [1,2,3,4].forEach(n => {
    const li = l.filter(i => niveauDe(i) === n);
    const t = S.prepProgres;
    let jamais = 0, encours = 0, acquis = 0;
    li.forEach(i => { const p = t[i.id];
      if(!p || !p.vus) jamais++; else if(p.boite === 3) acquis++; else encours++; });
    h += '<div class="ligneMat">' + anneau3({total:li.length, jamais, encours, acquis}, 46, li.length ? undefined : "—") +
      '<span class="tx"><b>' + n + ". " + esc(NIVEAUX[n].nom) + "</b><small>" + esc(NIVEAUX[n].desc) + "</small>" +
      '<small style="color:var(--encre3)">' + (li.length ? li.length + " exercices" : "aucun exercice") + "</small></span>" +
      (li.length ? '<button class="btn mini" data-act="session-prep" data-source="prep-niveau" data-lecon="' + n + '">Faire</button>' : "") +
      "</div>";
  });
  h += '<div class="avis" style="margin-top:14px"><b>Le niveau 4 est corrigé par l\'intelligence artificielle</b>' +
    "Ta réponse rédigée est relue et notée sur 3. Sans clé Gemini, la correction se limite aux mots attendus, " +
    "ce qui est beaucoup plus grossier.</div>";
  return h + "</div>";
}

function ecranLecon(){
  const L = LECONS[ui.lecon];
  if(!L){ ui.ecran = "accueil"; return ecranPrep(); }
  const p = progLecon(ui.lecon);
  const i = Math.min(p.index, L.diapos.length - 1);
  const d = L.diapos[i];
  let h = '<div class="lecon lect"><div class="lecon-haut">' +
    '<button class="fermer" data-act="fermer-lecon" aria-label="Fermer">×</button>' +
    '<div class="pts">' + L.diapos.map((_,k) => '<span class="' + (k <= i ? "f" : "") + '"></span>').join("") + "</div>" +
    '<span class="src">' + (i+1) + "/" + L.diapos.length + '</span></div><div class="diapo">';
  h += '<p class="kick">' + esc(d.kick || "") + "</p>";
  if(d.t === "intro"){
    h += "<h2>" + esc(d.titre) + "</h2><p>" + esc(d.texte) + "</p>";
  } else if(d.t === "notion"){
    h += "<h3>" + esc(d.titre) + "</h3>" + d.paras.map(x => "<p>" + esc(x) + "</p>").join("");
    if(d.encart) h += encartHtml(d.encart);
  } else if(d.t === "vocab"){
    h += "<h3>" + esc(d.titre) + '</h3><ul class="vocab">' +
      d.mots.map(m => "<li><b>" + esc(m.m) + "</b><span>" + esc(m.d) + "</span></li>").join("") + "</ul>";
  } else if(d.t === "etapes"){
    h += "<h3>" + esc(d.titre) + '</h3><ol class="etapes">' + d.etapes.map(e => "<li>" + esc(e) + "</li>").join("") + "</ol>";
    if(d.note) h += encartHtml({type:"info", titre:"Précision", texte:d.note});
  } else if(d.t === "chiffres"){
    h += "<h3>" + esc(d.titre) + '</h3><ul class="chiffres">' +
      d.lignes.map(l => "<li><b>" + esc(l.v) + "</b><span>" + esc(l.l) + "</span></li>").join("") + "</ul>";
    if(d.note) h += '<p style="font-size:13.5px;color:var(--encre2);margin-top:10px">' + esc(d.note) + "</p>";
  } else if(d.t === "encart"){
    h += "<h3>" + esc(d.titre) + "</h3>" + encartHtml({type:d.type, titre:"", texte:d.texte});
  } else if(d.t === "quiz"){
    h += "<h3>" + esc(d.question) + "</h3>";
    d.options.forEach((o,k) => {
      let cl = "opt";
      if(ui.quizRep !== null){ if(k === d.bonne) cl = "opt juste"; else if(k === ui.quizRep) cl = "opt faux"; }
      h += '<button class="' + cl + '" data-act="quiz" data-k="' + k + '"' + (ui.quizRep !== null ? " disabled" : "") + ">" + esc(o) + "</button>";
    });
    if(ui.quizRep !== null){
      const bon = ui.quizRep === d.bonne;
      if(ui.motQuiz === undefined || ui.motQuizPour !== progLecon(ui.lecon).index){
        ui.motQuiz = motVerdict(bon); ui.motQuizPour = progLecon(ui.lecon).index;
      }
      h += '<div class="verdict ' + (bon ? "ok" : "ko") + '">' + marque(bon) +
        "<b>" + esc(ui.motQuiz) + "</b>" + esc(d.expl) + "</div>";
    }
  } else if(d.t === "sources"){
    h += "<h3>" + esc(d.titre) + '</h3><ul class="sources">' + d.liste.map(s =>
      "<li><b>" + esc(s.titre) + "</b>" + esc(s.ref) +
      (s.url ? '<br><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(tronquer(s.url,58)) + "</a>"
             : '<br><span class="src">document transmis par l\'IUT</span>') + "</li>").join("") + "</ul>";
    if(d.note) h += '<p style="font-size:13.5px;color:var(--encre2);margin-top:12px">' + esc(d.note) + "</p>";
  }
  h += "</div>";
  const dernier = i === L.diapos.length - 1;
  const bloque = d.t === "quiz" && ui.quizRep === null;
  h += '<div style="display:flex;gap:9px;align-items:center">' +
    (i > 0 ? '<button class="btn" data-act="diapo-prec">Retour</button>' : "") +
    '<button class="cta" style="flex:1;margin-top:0" data-act="diapo-suiv"' + (bloque ? " disabled" : "") + ">" +
    (bloque ? "Choisis une réponse" : (dernier ? "Terminer" : "Continuer")) + "</button></div>";
  return h + "</div>";
}

function schemasDe(c){ if(!Array.isArray(c.schemas)) c.schemas = []; return c.schemas; }
function schemaHtml(x, pourImpression){
  const svg = SVG_SCHEMA[x.id];
  if(x.erreur) return `<div class="visManquant">Ce schéma ne se rend pas : ${esc(x.erreur)}</div>`;
  if(!svg) return `<div class="visManquant">Rendu du schéma…</div>`;
  return `<figure class="schema${pourImpression ? " schema-imp" : ""}">${svg}
    ${x.titre ? `<figcaption>${esc(x.titre)}</figcaption>` : ""}</figure>`;
}
async function faireSchema(id, type){
  const c = S.cours.find(x => x.id === id);
  if(!c) return;
  if(S.reglages.moteur !== "gemini" || !S.reglages.cleGemini || !S.reglages.modele){
    ui.message = {type:"err", titre:"Gemini est nécessaire",
      txt:"Écrire le code d'un schéma demande l'API. Le rendu, lui, se fait sur l'appareil."};
    rendre(); return;
  }
  ui.occupe = true; ui.etape = "Construction du schéma…"; ui.message = null; rendre();
  try{
    const r = await schemaGemini(c.fiche, c.ressId, type, S.reglages.cleGemini, S.reglages.modele);
    const x = {id:uid(), titre:r.titre, type, code:r.code, cree:Date.now()};
    try{ await rendreSchema(x.id, x.code); }
    catch(e){ x.erreur = String(e && e.message || e).slice(0,160); }
    schemasDe(c).push(x);
    sauver();
    ui.message = x.erreur
      ? {type:"err", titre:"Schéma à corriger", txt:"Le code produit ne se rend pas. Ouvrez-le et corrigez la ligne fautive."}
      : {type:"info", titre:"Schéma ajouté", txt:"Il se range dans la fiche et s'imprime avec elle."};
  }catch(e){ ui.message = {type:"err", titre:"Construction interrompue", txt:e.message}; }
  ui.occupe = false; ui.etape = ""; rendre();
}
async function reRendreSchema(idCours, idSchema){
  const c = S.cours.find(x => x.id === idCours);
  const x = c && schemasDe(c).find(y => y.id === idSchema);
  if(!x) return;
  x.code = nettoyerMermaid(ui.codeSchema || x.code);
  delete x.erreur; delete SVG_SCHEMA[x.id];
  ui.occupe = true; rendre();
  try{ await rendreSchema(x.id, x.code); ui.message = {type:"info", titre:"Schéma refait", txt:"Le rendu est à jour."}; }
  catch(e){ x.erreur = String(e && e.message || e).slice(0,160);
    ui.message = {type:"err", titre:"Code refusé", txt:x.erreur}; }
  ui.occupe = false; sauver(); rendre();
}
function ecranSchemas(){
  const c = S.cours.find(x => x.id === ui.fiche);

  h += `<p class="sousTitre">Le modèle écrit le code du schéma, l'application le dessine. Rien n'y figure qui ne soit dans la fiche validée.</p>`;
  if(!ia) h += `<div class="avis"><b>Gemini est nécessaire pour construire</b>

  else {
    h += `<p class="kick">Construire un schéma</p><div class="liste-puces">${
      Object.keys(TYPES_SCHEMA).map(k => `<button class="btn mini" data-act="faire-schema" data-id="${c.id}" data-v="${k}"${ui.occupe?" disabled":""}
        title="${esc(TYPES_SCHEMA[k].desc)}">${esc(TYPES_SCHEMA[k].nom)}</button>`).join("")}</div>
      ${ui.occupe ? `<p style="font-size:13px;color:var(--encre2)">${esc(ui.etape || "En cours…")}</p>` : ""}`;
  }
  if(!l.length) return h + `<div class="vide"><div class="em">◈</div><h3>Aucun schéma</h3>
    <p>Un enchaînement d'étapes, une arborescence, une comparaison ou une carte mentale, construits sur les points que vous avez retenus.</p></div></div>`;
  l.forEach(x => {
    h += `<div class="bloc">${schemaHtml(x)}
      <label class="champ" for="sc-${esc(x.id)}" style="margin-top:10px">Titre</label>
      <input type="text" id="sc-${esc(x.id)}" data-act="titre-schema" data-c="${c.id}" data-s="${esc(x.id)}" value="${esc(x.titre||"")}">
      <div class="rang"><span class="puce mono">${esc((TYPES_SCHEMA[x.type]||{nom:x.type}).nom)}</span>
        <button class="btn mini" data-act="ouvrir-code" data-s="${esc(x.id)}">${ui.codeOuvert === x.id ? "Masquer le code" : "Voir et corriger le code"}</button>
        <button class="btn mini" data-act="suppr-schema" data-c="${c.id}" data-s="${esc(x.id)}" style="color:var(--rouge)">Supprimer</button></div>
      ${ui.codeOuvert === x.id ? `<textarea data-bind="codeSchema" style="min-height:150px;font-family:'IBM Plex Mono',monospace;font-size:12.5px">${esc(x.code)}</textarea>
        <div class="rang"><button class="btn plein mini" data-act="refaire-schema" data-c="${c.id}" data-s="${esc(x.id)}"${ui.occupe?" disabled":""}>Redessiner</button></div>
        <p style="font-size:12.5px;color:var(--encre3);margin-top:-6px">Format Mermaid. Évitez les parenthèses et les guillemets dans les libellés : ils cassent le rendu.</p>` : ""}</div>`;
  });
  return h + `</div>`;
}

    "sur ce que tu gardes.</p>";

    '<span class="puce mono">' + retenus + "/" + total + " retenus</span></div>";

    l.forEach((x,i) => {

let pdfDoc = null;
async function dessinerPage(){
  const cv = document.getElementById("pdfCanvas");
  if(!cv || !ui.pdfBuf) return;
  try{
    await chargerPdfJs();
    if(!pdfDoc || ui.pdfRecharge){
      pdfDoc = await window.pdfjsLib.getDocument({data: ui.pdfBuf.slice(0)}).promise;
      ui.pdfTotal = pdfDoc.numPages; ui.pdfRecharge = false;
    }
    const page = await pdfDoc.getPage(Math.min(ui.pdfPage || 1, pdfDoc.numPages));
    const vp = page.getViewport({scale: 2});
    cv.width = vp.width; cv.height = vp.height;
    await page.render({canvasContext: cv.getContext("2d"), viewport: vp}).promise;
    brancherSelection(cv);
  }catch(e){
    ui.message = {type:"err", titre:"Affichage impossible", txt:e.message}; rendre();
  }
}
function brancherSelection(cv){
  const zone = document.getElementById("pdfZone");
  if(!zone || zone.dataset.branche) return;
  zone.dataset.branche = "1";
  let dep = null;
  const pos = ev => {
    const r = zone.getBoundingClientRect();
    return {x: Math.min(100, Math.max(0, (ev.clientX - r.left) / r.width * 100)),
            y: Math.min(100, Math.max(0, (ev.clientY - r.top) / r.height * 100))};
  };
  const maj = p => {
    ui.sel = {x: Math.min(dep.x, p.x), y: Math.min(dep.y, p.y),
      w: Math.abs(p.x - dep.x), h: Math.abs(p.y - dep.y)};
    let cadre = zone.querySelector(".cadreSel");
    if(!cadre){ cadre = document.createElement("div"); cadre.className = "cadreSel"; zone.appendChild(cadre); }
    cadre.style.left = ui.sel.x + "%"; cadre.style.top = ui.sel.y + "%";
    cadre.style.width = ui.sel.w + "%"; cadre.style.height = ui.sel.h + "%";
  };
  zone.addEventListener("pointerdown", ev => { dep = pos(ev); zone.setPointerCapture(ev.pointerId); maj(dep); });
  zone.addEventListener("pointermove", ev => { if(dep) maj(pos(ev)); });
  zone.addEventListener("pointerup", ev => {
    if(dep){ maj(pos(ev)); dep = null;
      const b = document.querySelector('[data-act="pdf-couper"]');
      if(b && ui.sel.w > 3 && ui.sel.h > 2){ b.disabled = false; b.textContent = "Découper cette zone"; } }
  });
}
async function couperZone(){
  const cv = document.getElementById("pdfCanvas");
  const c = S.cours.find(x => x.id === ui.fiche);
  if(!cv || !c || !ui.sel) return;
  const x = Math.round(ui.sel.x / 100 * cv.width), y = Math.round(ui.sel.y / 100 * cv.height);
  const w = Math.round(ui.sel.w / 100 * cv.width), h = Math.round(ui.sel.h / 100 * cv.height);
  if(w < 20 || h < 20){ ui.message = {titre:"Zone trop petite", txt:"Sélectionne une zone plus large."}; rendre(); return; }
  const d = document.createElement("canvas");
  d.width = w; d.height = h;
  const g = d.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
  g.drawImage(cv, x, y, w, h, 0, 0, w, h);
  const red = await reduireImage(d.toDataURL("image/png"));
  const vid = uid();
  await poserImage(vid, red.data);
  c.visuels = c.visuels || [];
  c.visuels.push({id:vid, kind:"image", legende:"Schéma page " + (ui.pdfPage||1), ancre:"",
    w:red.w, h:red.h, ko:poidsData(red.data)});
  sauver();
  ui.sel = null;
  await chargerVignettes(c);
  ui.ecran = "visuels";
  ui.message = {type:"info", titre:"Schéma découpé", txt:"Ajoute-lui une légende et choisis où il se place dans la fiche."};
  rendre(); window.scrollTo(0,0);
}

function itemsNiveau(n){ return tousItems().filter(i => viseeDe(i) === "comprehension" && niveauDe(i) === n); }
function etatNiveau(n){
  const l = itemsNiveau(n);
  if(!l.length) return {total:0, vus:0, sus:0, part:0, etat:"vide"};
  const vus = l.filter(i => S.progres[i.id] && S.progres[i.id].vus > 0).length;
  const sus = l.filter(i => S.progres[i.id] && S.progres[i.id].boite === 3).length;
  const part = Math.round(sus / l.length * 100);
  return {total:l.length, vus, sus, part, etat: part >= 70 ? "acquis" : (vus ? "encours" : "neuf")};
}

function corrigerItem(it, choix, assoc, ordre){
  switch(it.type){
    case "qcm": case "choix": return choix === it.reponse;
    case "qcmMulti": { const a=(choix||[]).slice().sort().join(","), b=(it.reponses||[]).slice().sort().join(",");
      return a === b && a !== ""; }
    case "vf": return choix === it.reponse;
    case "cloze": {
      const mot = (Array.isArray(it.options) && typeof choix === "number") ? it.options[choix] : choix;
      return normaliser(mot) === normaliser(it.reponse) && normaliser(mot) !== ""; }
    case "ordre": return (ordre||[]).join(",") === it.etapes.map((_,i)=>i).join(",");
    case "paires": return it.paires.every((p,i) => String((assoc||{})[i]) === String(i));
    case "classer": return (it.elements||[]).every((e,i) => String((assoc||{})[i]) === String(e.col));
    default: return null;
  }
}

const OUVERTS = ["ouverte","erreur","situation","comparer","pourquoi","redaction"];
/* Correction d'une rédaction par l'API. Le modèle ne juge que par rapport
   à l'attendu et au passage source : il ne réintroduit pas de savoir extérieur. */
async function evaluerRedaction(it, reponse){
  const cle = S.reglages.cleGemini, modele = S.reglages.modele;
  if(S.reglages.moteur !== "gemini" || !cle || !modele) return null;
  const consigneEval = [
    "Tu corriges la réponse d'une étudiante de première année de B.U.T. Techniques de commercialisation.",
    "Juge UNIQUEMENT par rapport à l'attendu et au passage de cours fournis. N'exige rien qui n'y figure pas.",
    "Sois exigeant sur le fond, indulgent sur la forme et l'orthographe.",
    "Réponds uniquement par un objet JSON :",
    '{"juste":true,"note":3,"retour":"deux phrases maximum, tutoie","manque":["élément absent"],"bon":["élément présent"]}',
    "La note va de 0 à 3. \"juste\" vaut true à partir de 2."
  ].join("\n");
  const corps = {
    systemInstruction:{parts:[{text:consigneEval}]},
    contents:[{role:"user", parts:[{text:
      "QUESTION :\n" + (it.question || "") +
      "\n\nATTENDU :\n" + (it.attendu || "") +
      "\n\nPASSAGE DU COURS :\n" + (it.source || "") +
      "\n\nRÉPONSE DE L'ÉTUDIANTE :\n" + (reponse || "")}]}],
    generationConfig:{temperature:0.1, responseMimeType:"application/json", maxOutputTokens:700}
  };
  try{
    const d = await appelGemini(cle, modele, corps);
    const cand = (d.candidates || [])[0];
    if(!cand) return null;
    const brut = ((cand.content && cand.content.parts) || []).map(p => p.text || "").join("");
    const o = JSON.parse(brut.replace(/^```json\s*|```\s*$/g,"").trim());
    return {juste: o.juste === true, note: Math.max(0, Math.min(3, Number(o.note) || 0)),
      retour: String(o.retour || ""), manque: Array.isArray(o.manque) ? o.manque : [],
      bon: Array.isArray(o.bon) ? o.bon : []};
  }catch(e){ return null; }
}

function motsTrouves(rep, cles){ const n = " " + normaliser(rep) + " ";
  return (cles||[]).map(c => ({mot:c, ok:n.includes(normaliser(c))})); }
function autoNote(it, rep){ const m = motsTrouves(rep||"", it.motsCles);
  return m.length ? m.filter(x=>x.ok).length / m.length >= .5 : false; }

let banqueSession = "rev";
/* On commence par comprendre, du plus simple au plus exigeant, puis on mémorise.
   À l'intérieur d'un même palier, l'ordre reste aléatoire. */
function ordonner(liste){
  const paliers = [[],[],[],[],[]];
  liste.forEach(i => {
    if(viseeDe(i) === "comprehension") paliers[niveauDe(i) - 1].push(i);
    else paliers[4].push(i);
  });
  return paliers.reduce((t, p) => t.concat(melanger(p)), []);
}
/* Rotation : sur un gros stock, une séance n'en présente qu'une portion, en
   commençant par ce qui a été vu le moins souvent et le plus anciennement.
   Sans cela, les mêmes exercices reviennent séance après séance. */
const PORTION = 20;
function portionner(liste, banque){
  if(liste.length <= PORTION) return liste;
  const t = banque === "prep" ? S.prepProgres : S.progres;
  const cle = i => { const p = t[i.id]; return [p ? p.vus : 0, p ? p.dernier : 0]; };
  return liste.slice().sort((a, b) => {
    const ca = cle(a), cb = cle(b);
    return ca[0] - cb[0] || ca[1] - cb[1];
  }).slice(0, PORTION);
}
function ouvrirSession(liste, mode, limite){
  liste = (liste || []).filter(Boolean);
  if(!liste.length){ ui.message = {titre:"Rien ici", txt:"Aucun exercice ne correspond à ce filtre."}; rendre(); return; }
  const _stock = liste.length;
  if(mode !== "examen" && mode !== "sprint") liste = portionner(liste, banqueSession);
  ui.session = {stock:_stock, liste: mode === "martelage" ? melanger(liste) : ordonner(liste), i:0, mode, limite:limite||null, debut:Date.now(),
    etat:"q", choix:null, sur:null, ordre:[], assoc:{}, resultats:[], melangeD:null,
    evaluation:null, martelage: mode === "martelage", aRefaire:[], compteur:{}, tour:1,
    banque: banqueSession || "rev"};
  if(mode === "sprint") ui.session.liste = melanger(ui.session.liste).slice(0,10);
  preparerQuestion();
  ui.ecran = "session"; ui.tab = (banqueSession === "prep") ? "prep" : "rev";
  rendre(); lancerMinuteur();
}
function preparerQuestion(){
  const s = ui.session, it = s.liste[s.i];
  s.etat = "q"; s.choix = it.type === "qcmMulti" ? [] : null; s.sur = null; s.assoc = {}; s.melangeD = null;
  s.mot = undefined; s.motPour = -1;
  s.ordre = it.type === "ordre" ? melanger(it.etapes.map((_,i)=>i)) : [];
  s.ordreEls = it.type === "classer" ? melanger(it.elements.map((_,i)=>i)) : [];
  // les propositions changent de place à chaque passage : on ne retient pas une position
  s.ordreOpts = Array.isArray(it.options) ? melanger(it.options.map((_,i)=>i)) : [];
}
function lancerMinuteur(){
  clearInterval(minuteur);
  if(!ui.session || (ui.session.mode !== "sprint" && ui.session.mode !== "examen")) return;
  minuteur = setInterval(() => {
    const el = document.getElementById("chrono");
    if(!el || !ui.session){ clearInterval(minuteur); return; }
    const e = Math.floor((Date.now() - ui.session.debut)/1000);
    if(ui.session.limite){ const r = ui.session.limite - e;
      if(r <= 0){ clearInterval(minuteur); terminerSession(); return; }
      el.textContent = mmss(r); } else el.textContent = mmss(e);
  }, 1000);
}

async function valider(){
  const s = ui.session, it = s.liste[s.i];
  if((it.type === "cloze" && !Array.isArray(it.options)) || OUVERTS.includes(it.type)){
    const el = document.getElementById("rep") || document.getElementById("repLong");
    if(el) s.choix = el.value;
  }
  let j = corrigerItem(it, s.choix, s.assoc, s.ordre);
  s.evaluation = null;
  if(it.type === "redaction" && (s.choix || "").trim().length > 5 && s.mode !== "examen"){
    s.etat = "correction"; rendre();
    const ev = await evaluerRedaction(it, s.choix);
    if(ev){ s.evaluation = ev; j = ev.juste; }
  }
  s.dernierJuste = j;
  if(s.mode === "examen"){
    s.resultats.push({id:it.id, ressId:it.ressId, juste: j === null ? autoNote(it, s.choix) : j});
    suivant(); return;
  }
  if(j !== null && j !== undefined){
    majProg(it.id, j, s.sur, s.banque);
    s.resultats.push({id:it.id, ressId:it.ressId, juste:j});
    if(s.martelage){
      s.compteur[it.id] = j ? (s.compteur[it.id] || 0) + 1 : 0;
      if(s.compteur[it.id] < 2) s.aRefaire.push(it);
    }
  }
  s.etat = "c"; rendre();
}
function suivant(){
  const s = ui.session; s.i++;
  if(s.i >= s.liste.length){
    if(s.martelage && s.aRefaire.length && s.tour < 4){
      s.liste = melanger(s.aRefaire); s.aRefaire = []; s.i = 0; s.tour++;
      preparerQuestion(); rendre(); window.scrollTo(0,0);
      return;
    }
    terminerSession(); return;
  }
  preparerQuestion(); rendre(); window.scrollTo(0,0);
}
function terminerSession(){
  clearInterval(minuteur);
  const s = ui.session; if(!s) return;
  if(s.mode === "examen"){
    const r = calculerExamen(s); S.examens.push(r); sauver();
    ui.resultat = r; ui.session = null; ui.ecran = "examen"; rendre(); return;
  }
  const t = s.resultats.length, b = s.resultats.filter(x => x.juste).length;
  const prep = s.banque === "prep";
  ui.session = null;
  ui.tab = prep ? "prep" : "rev";
  ui.ecran = prep ? "exercices" : "reviser";
  const reste = (s.stock || 0) - (s.liste ? s.liste.length : 0);
  ui.message = {type:"info", titre:"Session terminée",
    txt: (t ? b + " réussite" + (b>1?"s":"") + " sur " + t + "." : "Session close.") +
      (reste > 0 ? " " + reste + " autre" + (reste>1?"s":"") + " exercice" + (reste>1?"s":"") + " en réserve pour les prochaines séances." : "")};
  rendre();
}
function lancerSessionPrep(source, lecon){
  let l = [];
  if(source === "prep-dus") l = itemsDusPrep();
  else if(source === "prep-erreurs") l = erreursPrep();
  else if(source === "prep-lecon") l = itemsPrep(lecon);
  else if(source === "prep-memo") l = itemsPrep().filter(i => viseeDe(i) === "memo");
  else if(source === "prep-dus-memo") l = itemsDusPrep().filter(i => viseeDe(i) === "memo");
  else if(source === "prep-niveau") l = itemsPrep().filter(i => viseeDe(i) === "comprehension" && niveauDe(i) === Number(lecon));

function lancerSession(source, ress, id){
  let l = [];
  if(source === "dus") l = itemsDus();
  else if(source === "memo") l = itemsDus().filter(i => viseeDe(i) === "memo");
  else if(source === "niveau") l = itemsNiveau(Number(ress));
  else if(source === "temps") l = selonLeTemps(Number(ress) || 20).liste;
  else if(source === "lexique"){
    const ids = new Set(entreesLexique(ui.langue || "A", ui.semestre || 1).map(e => e.id));
    l = itemsLexique().filter(i => ids.has(i.entreeId));
  }
  else if(source === "martelage"){
    l = itemsDus().filter(i => viseeDe(i) === "memo" && corrigerItem(i, null, {}, []) !== null);
    if(l.length > 12) l = melanger(l).slice(0,12);
  }
  else if(source === "comprehension") l = itemsDus().filter(i => viseeDe(i) === "comprehension");
  else if(source === "erreurs") l = carnetErreurs();
  else if(source === "confiantes") l = erreursConfiantes();
  else if(source === "ress") l = tousItems().filter(i => i.ressId === ress);
  else if(source === "cours"){ const c = S.cours.find(x => x.id === id); l = c ? c.items.slice() : []; }
  else if(source === "sprint"){ l = itemsDus(); if(l.length < 10) l = tousItems(); }
  ouvrirSession(l, source === "sprint" ? "sprint" : (source === "martelage" ? "martelage" : "libre"));
}

/* ---- épreuve blanche, planning, réglages ---- */
function composerExamen(nb){
  const dispo = tousItems().filter(i => i.type !== "flash");
  if(dispo.length < 5) return [];
  const parR = {}; dispo.forEach(i => (parR[i.ressId] = parR[i.ressId] || []).push(i));
  const ids = Object.keys(parR);
  const poids = id => { const r = RESSOURCE(id); return r ? coefTotal(r) : 1; };
  const pt = ids.reduce((s,id) => s + poids(id), 0);
  let out = [];
  ids.forEach(id => { const part = Math.max(1, Math.round(nb * poids(id) / pt));
    out = out.concat(melanger(parR[id]).slice(0, part)); });
  return melanger(out).slice(0, nb);
}
function calculerExamen(s){
  const parR = {};
  s.resultats.forEach(r => { const e = parR[r.ressId] = parR[r.ressId] || {total:0,bons:0};
    e.total++; if(r.juste) e.bons++; });
  const ress = Object.keys(parR).map(id => { const r = RESSOURCE(id), e = parR[id];
    return {id, nom:r?r.nom:id, coef:r?coefTotal(r):1, total:e.total, bons:e.bons,
      note: Math.round(e.bons/e.total*200)/10}; });
  const ues = [1,2,3].map(u => {
    const l = ress.filter(x => { const r = RESSOURCE(x.id); return r && r.c[u]; });
    if(!l.length) return {ue:u, presente:false};
    const p = l.reduce((s2,x) => s2 + RESSOURCE(x.id).c[u], 0);
    const note = Math.round(l.reduce((s2,x) => s2 + x.note * RESSOURCE(x.id).c[u], 0)/p*10)/10;
    return {ue:u, presente:true, note};
  });
  return {date:new Date().toISOString(), duree:Math.round((Date.now()-s.debut)/1000),
    questions:s.resultats.length, bons:s.resultats.filter(r=>r.juste).length, ress, ues};
}

function ecranPlanning(){
  const d = S.reglages.dateExamen;
  let h = '<div class="ecran">' + retour("accueil", "Planning");
  h += '<label class="champ" for="p-date">Prochaine échéance</label>' +
    '<input type="date" id="p-date" data-bind="dateExamen" value="' + esc(d||"") + '">';
  if(!d) return h + '<div class="avis info" style="margin-top:14px"><b>Aucune date</b>' +
    "Renseigne un contrôle, une SAÉ à rendre ou une fin de semestre pour construire le rétroplanning.</div></div>";
  const j = joursEntre(new Date(), d);
  if(j <= 0) return h + '<div class="avis" style="margin-top:14px"><b>Date passée</b>Choisis une date à venir.</div></div>';
  const actives = TOUTES().filter(r => statsRess(r.id).total > 0);
  if(!actives.length) return h + '<div class="avis" style="margin-top:14px"><b>Aucun cours importé</b>' +
    "Le plan se construit sur les ressources que tu alimentes.</div></div>";
  const sem = Math.max(1, Math.min(12, Math.ceil(j/7)));
  const scores = actives.map(r => { const s = statsRess(r.id);
    return {r, poids: coefTotal(r) * (1 + (100 - s.part)/100), part:s.part, total:s.total}; })
    .sort((a,b) => b.poids - a.poids);
  h += '<p class="sousTitre" style="margin-top:14px">' + j + " jours, soit " + sem + " semaine" + (sem>1?"s":"") + " de travail.</p>";
  for(let k = 0; k < sem; k++){
    const lot = scores.filter((_,i) => i % sem === k);
    h += '<div class="semaine"><div class="quand">Semaine ' + (k+1) + " — dès le " +
      dateFr(new Date(Date.now()+k*7*JOUR).toISOString()) + "</div>" +
      '<h4 style="font-size:15px">' + (lot.length ? lot.map(x => esc(x.r.id)).join(" · ") : "Reprise libre") + "</h4>" +
      lot.map(x => '<div style="font-size:13.5px;color:var(--encre2)">' + esc(tronquer(x.r.nom,48)) +
        " — " + x.total + " exercices, " + x.part + " % acquis</div>").join("") + "</div>";
  }
  return h + '<p style="font-size:12.5px;color:var(--encre3)">Les ressources à fort coefficient et peu acquises passent en premier. ' +
    "La révision du jour reste prioritaire : elle suit les échéances des trois boîtes.</p></div>";
}

  if(l.length){
    h += '<p class="kick" style="margin-top:20px">Notes saisies</p><table class="tableau"><tbody>' +

          esc(tronquer(n.libelle || "", 26)) + '</span></td><td class="n">' + Number(n.valeur).toFixed(2) + "</td>" +

  if(ui.occupe) h += '<div class="rang"><button class="btn mini" data-act="annuler-appel" style="color:var(--rouge)">Annuler</button>' +
    '<span class="puce mono">délai maximal ' + Math.round(DELAI_APPEL/1000) + ' s</span></div>';

  }
  h += '<div class="avis" style="margin-top:16px"><b>Ce que devient ta voix</b>' +

    "sur l'appareil et ne sont envoyées nulle part. En fermant la séance, elles disparaissent.</div>";

}

function ecranOralSeance(){
  const o = ui.oral;
  if(!o){ ui.ecran = "oral"; return ecranOral(); }
  const s = o.scenario;
  let h = '<div class="lecon"><div class="lecon-haut">' +
    '<button class="fermer" data-act="oral-quitter" aria-label="Quitter">×</button>' +
    '<div class="pts">' + s.tours.map((_,k) => '<span class="' + (k < o.tour ? "f" : "") + '"></span>').join("") + "</div>" +
    (o.phase === "parle" ? '<span class="chrono" id="chronoOral">00:00</span>'
      : '<span class="src">' + Math.min(o.tour + 1, s.tours.length) + "/" + s.tours.length + "</span>") +
    '</div><div class="diapo">';

  if(o.phase === "contexte"){
    h += '<p class="kick">Mise en situation</p><h3>' + esc(s.titre) + "</h3>" +
      "<p>" + esc(s.contexte) + "</p>" +
      encartHtml({type:"info", titre:"Je joue", texte:s.role}) +
      (s.objectif ? encartHtml({type:"astuce", titre:"Ton objectif", texte:s.objectif}) : "");
    if(!o.micro) h += encartHtml({type:"piege", titre:"Sans micro",
      texte:"Le micro n'est pas disponible ou a été refusé. La séance se déroule au chronomètre : " +
        "tu parles quand même, mais tu ne pourras pas te réécouter."});
    h += "</div>" + '<button class="cta" data-act="oral-demarrer">Commencer</button></div>';
    return h;
  }

  if(o.phase === "bilan"){
    h += '<p class="kick">Bilan</p><h3>Réécoute-toi, puis juge</h3>';
    if(o.prises.some(Boolean)){
      h += '<p style="font-size:13.5px;color:var(--encre2);margin-bottom:10px">Une prise par tour.</p>';
      o.prises.forEach((u,i) => {
        h += '<div class="vign" style="padding:10px 12px"><div style="font-size:13px;color:var(--encre2);margin-bottom:6px">' +
          "Tour " + (i+1) + " · " + esc(tronquer(s.tours[i].attente || "", 70)) + "</div>" +
          (u ? '<audio controls src="' + u + '" style="width:100%"></audio>'
             : '<span class="src">prise manquante</span>') + "</div>";
      });
    } else {
      h += '<div class="avis"><b>Aucune prise</b>La séance s\'est déroulée sans micro. ' +
        "La grille reste utile : réponds de mémoire, honnêtement.</div>";
    }
    const tout = s.grille.map(g => Object.assign({fond:true}, g)).concat(FORME.map(g => Object.assign({fond:false}, g)));
    h += '<p class="kick" style="margin-top:16px">Le fond</p>';
    tout.forEach((g,i) => {
      if(i === s.grille.length) h += '<p class="kick" style="margin-top:16px">La forme</p>';
      h += '<div class="triLigne"><input type="checkbox" data-act="oral-critere" data-i="' + i + '"' +
        (o.coches[i] ? " checked" : "") + '><span class="tx">' + esc(g.critere) +
        (g.aide ? '<br><span class="src">' + esc(g.aide) + "</span>" : "") + "</span></div>";
    });
    const score = Object.keys(o.coches).filter(k => o.coches[k]).length;
    h += '<div class="verdict ' + (score >= tout.length * 0.6 ? "ok" : "ko") + '"><b>' +
      score + " sur " + tout.length + "</b>" +
      (score === tout.length ? "Rien à redire. Refais-le dans quelques jours pour vérifier."
       : "Les critères non cochés sont exactement ce qu'il faut retravailler au prochain passage.") + "</div>";
    h += "</div>" + '<button class="cta" data-act="oral-terminer">Enregistrer ce passage</button>' +
      '<button class="cta sec" data-act="oral-quitter" style="margin-top:9px">Fermer sans garder</button></div>';
    return h;
  }

  const t = s.tours[Math.min(o.tour, s.tours.length - 1)];
  h += '<p class="kick">Tour ' + (o.tour + 1) + " sur " + s.tours.length + "</p>";
  h += '<div class="verdict ok" style="margin-top:0"><b>' + esc(s.role) + "</b>" + esc(t.app) + "</div>";
  if(o.phase === "ecoute"){
    h += '<div class="rang"><button class="btn mini" data-act="oral-rejouer">Réécouter</button></div>';
    if(t.attente) h += encartHtml({type:"astuce", titre:"À toi de", texte:t.attente});
    h += "</div>" + '<button class="cta" data-act="oral-parler">Je réponds' +
      (o.micro ? " · " + t.secondes + " s" : "") + "</button></div>";
    return h;
  }
  h += encartHtml({type:"info", titre:"Parle", texte: t.attente || "Réponds à voix haute."}) +
    '<p style="font-size:13.5px;color:var(--encre2);margin-top:10px">' +
    (o.micro ? "Ta voix est captée. Prends le temps d'aller au bout." : "Le chronomètre tourne. Parle quand même à voix haute.") +
    "</p></div>" +
    '<button class="cta" data-act="oral-fini">J\'ai fini</button></div>';
  return h;
}

/* ---- pilotage de la séance orale ---- */
let chronoOral = null;
function lancerChronoOral(){
  clearInterval(chronoOral);
  chronoOral = setInterval(() => {
    const el = document.getElementById("chronoOral");
    const o = ui.oral;
    if(!el || !o || o.phase !== "parle"){ clearInterval(chronoOral); return; }
    const t = o.scenario.tours[o.tour];
    const reste = t.secondes - Math.floor((Date.now() - o.debutTour) / 1000);
    el.textContent = reste >= 0 ? mmss(reste) : "+" + mmss(-reste);
    el.style.color = reste < 0 ? "var(--rouge)" : "";
  }, 500);
}
async function ouvrirOral(id){
  const s = (S.oral || []).find(x => x.id === id);
  if(!s) return;
  const micro = await ouvrirMicro();
  ui.oral = {scenario:s, tour:0, phase:"contexte", prises:[], coches:{}, micro, debutTour:0};
  ui.ecran = "oralSeance"; ui.tab = "rev";
  rendre(); window.scrollTo(0,0);
}
function tourSuivantOral(){
  const o = ui.oral;
  o.phase = "ecoute";
  rendre();
  direReplique(o.scenario.tours[o.tour].app);
}
async function finirTourOral(){
  const o = ui.oral;
  clearInterval(chronoOral);
  const url = await arreterPrise();
  o.prises.push(url);
  o.tour++;
  if(o.tour >= o.scenario.tours.length){
    o.phase = "bilan";
    if(window.speechSynthesis) speechSynthesis.cancel();
    rendre(); window.scrollTo(0,0);
    return;
  }
  tourSuivantOral();
}
function quitterOral(){
  clearInterval(chronoOral);
  if(window.speechSynthesis) speechSynthesis.cancel();
  const o = ui.oral;
  if(o) o.prises.forEach(u => libererUrl(u));
  arreterPrise().then(() => fermerMicro());
  ui.oral = null; ui.ecran = "oral"; ui.tab = "rev";
  rendre();
}
function terminerOral(){
  const o = ui.oral;
  if(!o) return;
  const total = o.scenario.grille.length + FORME.length;
  const score = Object.keys(o.coches).filter(k => o.coches[k]).length;
  S.oralPassages.push({scenarioId:o.scenario.id, ressId:o.scenario.ressId,
    date:new Date().toISOString(), score, total});
  sauver();
  ui.message = {type:"info", titre:"Passage enregistré",
    txt: score + " critère" + (score>1?"s":"") + " sur " + total + ". Seul le score est conservé, pas ta voix."};
  quitterOral();
}
async function creerOral(){
  const c = S.cours.find(x => x.id === ui.oralCours);
  if(!c) return;
  if(!S.reglages.cleGemini || !S.reglages.modele){
    ui.message = {type:"err", titre:"Clé manquante", txt:"Renseigne la clé et le modèle dans les réglages."};
    rendre(); return;

      txt: l.length + " scénario" + (l.length>1?"s":"") + " écrit" + (l.length>1?"s":"") + " à partir de « " + tronquer(c.titre, 30) + " »."};
  }catch(e){
    ui.message = {type:"err", titre:"Écriture interrompue", txt:e.message};
  }
  ui.occupe = false; ui.etape = ""; rendre();
}

/* Un seul geste : écrire le texte puis le mettre en voix.
   Le contenu de départ a déjà été validé point par point à l'import. */
/* Reformule toutes les notions retenues en un seul appel. */
async function reformuler(niveau){
  const c = S.cours.find(x => x.id === ui.fiche);
  if(!c || !(c.fiche.notions || []).length) return;
  if(S.reglages.moteur !== "gemini" || !S.reglages.cleGemini || !S.reglages.modele){
    ui.message = {type:"err", titre:"Gemini est nécessaire", txt:"Reformuler demande l'API. Renseigne la clé dans les réglages."};
    rendre(); return;
  }
  ui.occupe = true; ui.etape = "Reformulation en cours…"; ui.message = null; rendre();
  try{
    const out = await reformulerGemini(c.fiche.notions, niveau, S.reglages.cleGemini, S.reglages.modele);
    let n = 0;
    Object.keys(out).forEach(i => {
      const x = c.fiche.notions[Number(i)];
      if(!x) return;
      if(!x.reform) x.reform = {};
      x.reform[niveau] = out[i]; n++;
    });
    sauver();
    ui.voirReform = niveau;
    ui.message = n ? {type:"info", titre:"Reformulé",
      txt: n + " notion" + (n>1?"s":"") + " en « " + NIVEAUX_REFORM[niveau].nom.toLowerCase() + " ». Le texte du cours reste affiché au-dessus."}
      : {titre:"Rien n'est revenu", txt:"Relance, ou essaie un autre niveau."};
  }catch(e){ ui.message = {type:"err", titre:"Reformulation interrompue", txt:e.message}; }
  ui.occupe = false; ui.etape = ""; rendre();
}

/* Fabrique de nouveaux exercices sur la même fiche, sans effacer les anciens. */
async function plusExercices(){
  const c = S.cours.find(x => x.id === ui.fiche);
  if(!c) return;
  if(c.origine !== "gemini" || !S.reglages.cleGemini || !S.reglages.modele){
    ui.message = {type:"err", titre:"Gemini est nécessaire",
      txt:"Produire de nouveaux exercices demande l'API."};
    rendre(); return;
  }
  ui.occupe = true; ui.etape = "Fabrication de nouveaux exercices…"; ui.message = null; rendre();
  try{
    const dejaVu = c.items.map(i => i.question || i.recto || "").filter(Boolean).slice(0, 60);
    const nouveaux = await exercicesGemini(ficheRetenue(c), c.ressId,
      S.reglages.cleGemini, S.reglages.modele, dejaVu);
    const connus = new Set(c.items.map(i => normaliser(i.question || i.recto || "")));
    const garde = nouveaux.filter(i => !connus.has(normaliser(i.question || i.recto || "")));
    if(!garde.length){
      ui.message = {titre:"Rien de nouveau", txt:"Le modèle n'a produit que des variantes de ce que tu as déjà. Reformule d'abord les notions, puis réessaie."};
    } else {
      garde.forEach(i => i.ressId = c.ressId);
      c.items = c.items.concat(garde);
      sauver();
      const v = compteVisees(garde);
      ui.message = {type:"info", titre:"Nouveaux exercices",
        txt: garde.length + " ajoutés · " + v.memo + " en mémorisation, " + v.comprehension + " en compréhension. Les anciens sont conservés."};
    }
  }catch(e){ ui.message = {type:"err", titre:"Fabrication interrompue", txt:e.message}; }
  ui.occupe = false; ui.etape = ""; rendre();
}

/* =========================================================================
   STATISTIQUES
   Les deux banques restent séparées : les exercices des leçons ne mesurent
   pas le travail sur tes propres cours, et inversement.
   ========================================================================= */
function serieJours(b){
  const cle = b === "prep" ? "journalPrep" : "journal";
  const t = S[cle] || {};
  let n = 0;
  for(let i = 0; i < 400; i++){
    const d = new Date(Date.now() - i * JOUR).toISOString().slice(0,10);
    if(t[d] && t[d].n) n++;
    else if(i > 0) break;   // aujourd'hui vide ne casse pas encore la série
  }
  return n;
}
function comptePour(l, t){
  let vus = 0, ok = 0, acquis = 0, faits = 0;
  l.forEach(i => { const p = t[i.id]; if(!p || !p.vus) return;
    faits++; vus += p.vus; ok += p.ok; if(p.boite === 3) acquis++; });
  return {total:l.length, faits, vus, ok, acquis, part: vus ? Math.round(ok / vus * 100) : 0};
}
function grapheLong(b, jours){
  const l = activite(b, jours);
  const max = Math.max(1, ...l.map(x => x.n));
  return '<div class="activite">' + l.map(x =>
    '<div class="j' + (x.n ? "" : " vide") + '" title="' + esc(x.jour + " · " + x.n) + '">' +
    (x.n ? '<i style="height:' + Math.max(8, Math.round(x.n / max * 100)) + '%"></i>' : "") + "</div>").join("") + "</div>" +
    '<div class="legJours"><span>il y a ' + jours + " jours</span><span>aujourd'hui</span></div>";
}
function blocBanque(nom, c, coul, b){
  const a30 = activite(b, 30).reduce((s,x) => s + x.n, 0);
  return '<div class="bloc"><div class="bloc-t"><span class="point" style="background:' + coul + '"></span>' +
    '<span class="bloc-nom">' + esc(nom) + '</span><span class="bloc-meta">' + c.total + " ex.</span></div>" +
    '<div class="jauge"><i style="width:' + (c.total ? Math.round(c.acquis / c.total * 100) : 0) + "%;background:" + coul + '"></i></div>' +
    '<div style="font-size:12px;color:var(--encre3);margin-top:6px;font-variant-numeric:tabular-nums">' +
    c.acquis + " acquis · " + c.faits + " travaillés · " + c.part + " % de bonnes réponses · " +
    a30 + " sur 30 jours · série " + serieJours(b) + " j</div></div>";
}

  }));
  const types = Object.keys(parType).sort((a,b) => parType[a].ok / parType[a].vus - parType[b].ok / parType[b].vus);
  if(types.length){
    h += '<p class="kick">Réussite par type d\'exercice</p><table class="tableau">' +
      "<thead><tr><th>Type</th><th>Tentatives</th><th>Réussite</th></tr></thead><tbody>" +
      types.map(k => { const e = parType[k], part = Math.round(e.ok / e.vus * 100);

      '</tbody></table><p style="font-size:12.5px;color:var(--encre3);margin:8px 0 16px">' +
      "En tête de liste, les types que tu rates le plus.</p>";

    const b = comptePour(prep.filter(i => i.ressId === r.id), S.prepProgres);
    return {r, a, b};
  }).filter(x => x.a.total || x.b.total);
  if(lignes.length){
    h += '<p class="kick">Acquis par matière</p>';
    lignes.forEach(x => {
      h += '<div class="bloc"><div class="bloc-t"><span class="point" style="background:var(--c' + ueDominante(x.r) + ')"></span>' +
        '<span class="bloc-nom">' + esc(x.r.id + " · " + tronquer(x.r.nom, 26)) + "</span></div>" +
        (x.a.total ? '<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--encre3)">' +
          '<span style="width:78px">Révision</span><div class="jauge" style="flex:1"><i style="width:' + Math.round(x.a.acquis / x.a.total * 100) + '%"></i></div>' +
          '<span style="font-variant-numeric:tabular-nums">' + x.a.acquis + "/" + x.a.total + "</span></div>" : "") +
        (x.b.total ? '<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--encre3);margin-top:5px">' +
          '<span style="width:78px">Préparation</span><div class="jauge" style="flex:1"><i style="width:' + Math.round(x.b.acquis / x.b.total * 100) + '%;background:var(--c1)"></i></div>' +
          '<span style="font-variant-numeric:tabular-nums">' + x.b.acquis + "/" + x.b.total + "</span></div>" : "") + "</div>";
    });
  }
  if(S.examens.length){
    h += '<p class="kick" style="margin-top:16px">Épreuves blanches</p><table class="tableau">' +
      "<thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>" +
      S.examens.slice().reverse().map(e => "<tr><td>" + dateFr(e.date) + '</td><td class="n">' + e.bons + "/" + e.questions + "</td></tr>").join("") +
      "</tbody></table>";
  }
  return h + "</div>";
}

/* =========================================================================
   RECHERCHE PLEIN TEXTE
   Dans les leçons, les fiches et les exercices. Ni accents ni majuscules.
   ========================================================================= */
function textesDe(o, sauf){
  if(o == null) return "";
  if(typeof o === "string") return o;
  if(typeof o === "number") return String(o);
  if(Array.isArray(o)) return o.map(x => textesDe(x, sauf)).join(" ");
  if(typeof o === "object") return Object.keys(o).filter(k => !(sauf || []).includes(k))
    .map(k => textesDe(o[k], sauf)).join(" ");
  return "";
}
function extraitAutour(txt, n){
  const plat = String(txt || "").replace(/\s+/g, " ").trim();
  const i = normaliser(plat).indexOf(n);
  if(i < 0) return tronquer(plat, 150);
  let d = Math.max(0, i - 50);
  if(d){ const esp = plat.indexOf(" ", d); if(esp > -1 && esp < i) d = esp + 1; }
  return (d ? "…" : "") + tronquer(plat.slice(d), 150);
}
function chercher(q){
  const n = normaliser(q).trim(); if(n.length < 3) return [];
  const out = [];
  const trouve = t => normaliser(t).includes(n);
  Object.keys(LECONS).forEach(k => {
    const L = LECONS[k];
    (L.diapos || []).forEach((d, i) => {
      const bloc = textesDe(d, ["t", "bonne", "url"]);
      if(trouve(bloc)) out.push({ou:"Leçon " + (L.ressId || "d'accueil"), titre:d.titre || d.question || ("Écran " + (i + 1)),
        extrait:extraitAutour(bloc, n), attr:'data-act="aller-diapo" data-l="' + esc(k) + '" data-i="' + i + '"'});
    });
  });
  S.cours.forEach(c => {
    const bloc = textesDe(c.fiche);
    if(trouve(c.titre) || trouve(bloc)) out.push({ou:"Fiche " + (c.ressId || ""), titre:c.titre,
      extrait:extraitAutour(bloc, n), attr:'data-act="aller-fiche" data-id="' + esc(c.id) + '"'});
    (c.items || []).forEach(i => {
      const t = [i.question, i.source, i.reponse].map(x => textesDe(x)).join(" ");
      if(trouve(t)) out.push({ou:"Exercice · " + c.titre, titre:tronquer(textesDe(i.question), 70),
        extrait:extraitAutour(textesDe(i.source) || t, n), attr:'data-act="aller-fiche" data-id="' + esc(c.id) + '"'});
    });
  });
  return out.slice(0, 40);
}
function ecranRecherche(){
  let h = '<div class="ecran">' + retour("accueil", "Recherche");
  h += '<label class="champ" for="q-txt">Chercher dans les leçons, tes fiches et tes exercices</label>' +
    '<input type="text" id="q-txt" data-bind="requete" value="' + esc(ui.requete || "") + '" placeholder="segmentation, SWOT, contrat…" autocomplete="off">';
  const q = (ui.requete || "").trim();
  if(q.length < 3) return h + '<div class="avis info" style="margin-top:14px"><b>Trois lettres minimum</b>La recherche ignore les accents et les majuscules.</div></div>';
  const r = chercher(q);
  if(!r.length) return h + '<div class="vide"><div class="em">◌</div><h3>Aucun résultat</h3><p>Essaie un mot plus court ou une autre formulation.</p></div></div>';
  h += '<p class="sousTitre" style="margin-top:14px">' + r.length + " résultat" + (r.length > 1 ? "s" : "") + (r.length === 40 ? " (les quarante premiers)" : "") + "</p>";
  r.forEach(x => {
    h += '<button class="carteAct" ' + x.attr + '><span class="tx"><b>' + esc(tronquer(x.titre, 60)) + "</b><small>" +
      esc(x.ou) + " — " + esc(x.extrait) + '</small></span><span class="fl">›</span></button>';
  });
  return h + "</div>";
}

/* Le cours d'exemple reprend le contenu déjà vérifié de la leçon R1.01. */
function texteDemo(){
  const L = LECONS["R1.01"];
  const out = ["Fondamentaux du marketing — notes d'exemple", ""];
  L.diapos.forEach(d => {
    if(d.t === "vocab"){ out.push("Vocabulaire"); (d.mots || []).forEach(m => out.push(m.m + " : " + m.d)); out.push(""); }
    else if(d.t === "etapes"){ out.push(d.titre || "Étapes"); (d.etapes || []).forEach((e,i) => out.push((i+1) + ". " + e)); out.push(""); }
    else if(d.t === "notion" && d.titre){ out.push(d.titre); (d.paras || []).forEach(p => out.push(p)); out.push(""); }
  });
  return out.join("\n");
}

/* Google n'est jamais appelé pendant un tuto : les réponses sont simulées. */
async function fetchDemo(url){
  const u = String(url);
  const rep = o => ({ok:true, status:200, json: async () => o});
  if(/:generateContent/.test(u))
    return rep({candidates:[{content:{parts:[{text:'{"test":"ok"}'}]}, finishReason:"STOP"}]});
  if(/\/models/.test(u))
    return rep({models:[{name:"models/demo-tuto", displayName:"Modèle de démonstration",
      supportedGenerationMethods:["generateContent"]}]});
  return {ok:false, status:404, json: async () => ({})};
}
