  motsCles:["moyenne","panier","structure","hausses","frequemment"],
  source:"Insee, L'essentiel sur l'inflation"}
]},

/* ---- R1.07 Techniques quantitatives et représentations - 1 — vérifiée le 7 septembre 2026 ---- */
"R1.07": {titre:"Techniques quantitatives et représentations - 1", ressId:"R1.07", duree:"17 min", diapos:[
 {t:"intro", kick:"R1.07 · avant le premier cours", titre:"La seule matière qui sert dans les trois compétences",
  texte:"Le programme la rattache à la fois à Marketer, à Vendre et à Communiquer, et elle alimente les trois SAÉ du semestre plus le portfolio. Aucune autre ressource de première année n'est aussi transversale. Si les maths t'inquiètent, commence par cette information : ce n'est pas un cours de maths, c'est un cours pour lire des chiffres commerciaux."},

 {t:"notion", kick:"Le programme", titre:"Cinq objectifs, et le premier surprend",
  paras:["Le programme demande de se familiariser avec les nombres pour maîtriser le calcul mental et l'ordre de grandeur ; de maîtriser la cohérence des résultats obtenus ; de calculer, comprendre, analyser et interpréter des indicateurs pertinents pour évaluer un marché ou une action commerciale ; d'utiliser les statistiques pour représenter une situation commerciale ; enfin de percevoir et anticiper les variations d'un marché.",
   "Le premier objectif est du calcul mental et de l'ordre de grandeur. Ce n'est pas de la remise à niveau déguisée : en rendez-vous commercial, savoir dire de tête si un chiffre est plausible vaut mieux que de sortir une calculatrice."],
  encart:{type:"piege", titre:"L'objectif qu'on néglige", texte:"« Maîtriser la cohérence des résultats obtenus ». Autrement dit : repérer qu'un résultat est absurde. Une part de marché de 340 %, ça se voit sans vérifier le calcul."}},

 {t:"notion", kick:"Le programme", titre:"Le contenu en quatre blocs",
  paras:["Le contenu officiel liste : le calcul mental et l'ordre de grandeur ; les pourcentages, taux de variation, indices et élasticité ; la statistique descriptive, avec les généralités, les séries à un caractère, les paramètres de position, de dispersion et de concentration, et la représentation graphique ; enfin les équations et fonctions affines.",
   "Le programme ajoute que l'utilisation d'un tableur est conseillée. Sur 18 heures, 8 sont des travaux pratiques."],
  encart:{type:"astuce", titre:"À faire avant la rentrée", texte:"Ouvre un tableur et fais-toi la main sur les bases : saisir, faire une somme, une moyenne, un pourcentage, un graphique. Deux heures maintenant t'en feront gagner dix."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les cinq mots clés officiels", mots:[
  {m:"Taux", d:"Un rapport exprimé en pourcentage. Le programme insiste sur les taux de variation."},
  {m:"Pourcentage", d:"Une proportion rapportée à cent. La base de presque tout indicateur commercial."},
  {m:"Indice", d:"Une valeur rapportée à une base de référence, souvent 100, qui permet de comparer des évolutions."},
  {m:"Statistique descriptive", d:"L'ensemble des méthodes qui résument et décrivent un jeu de données."},
  {m:"Représentation graphique", d:"La mise en forme visuelle des données, pour rendre une évolution ou une répartition lisible."}],
  note:"Ces cinq termes sont les mots clés de la fiche officielle."},

 {t:"notion", kick:"L'outil de base", titre:"Le taux de variation",
  paras:["Le taux de variation exprime en pourcentage la différence entre une valeur finale et une valeur initiale, rapportée à cette valeur initiale. C'est l'outil que tu utiliseras le plus souvent de toute ton année.",
   "L'Insee s'en sert notamment pour publier les évolutions du produit intérieur brut et les glissements annuels de l'indice des prix à la consommation."],
  encart:{type:"piege", titre:"Le piège des points et des pourcents", texte:"Passer de 10 % à 12 %, c'est une hausse de deux points, mais de vingt pour cent. Confondre les deux est l'erreur la plus fréquente en première année, et elle se paie cher en évaluation."}},

 {t:"notion", kick:"L'outil de base", titre:"L'indice, pour comparer ce qui n'est pas comparable",
  paras:["Un indice ramène une série à une base de référence, généralement 100 à une date choisie. Il permet de comparer des évolutions entre grandeurs qui n'ont ni la même unité ni le même ordre de grandeur.",
   "L'Insee illustre bien le principe : depuis janvier 2026, l'indice des prix à la consommation est publié en base 2025 égale 100, en remplacement de la base 2015. Changer de base ne change pas l'évolution réelle, seulement la référence à partir de laquelle on la lit."],
  encart:{type:"info", titre:"Statut de cette information", texte:"Source : Insee. Cet exemple illustre la notion d'indice ; ton cours utilisera sans doute d'autres exemples."}},

 {t:"quiz", kick:"Vérification", question:"Le taux de conversion d'un site passe de 2 % à 3 %. Comment le dis-tu correctement ?",
  options:["Une hausse d'un pour cent",
   "Une hausse d'un point, soit cinquante pour cent",
   "Une hausse de trois pour cent"],
  bonne:1,
  expl:"L'écart absolu est d'un point de pourcentage. L'évolution relative est de 1 divisé par 2, soit cinquante pour cent. Les deux formulations sont justes, mais elles ne disent pas la même chose."},

 {t:"notion", kick:"L'outil de base", titre:"Le pourcentage, et les erreurs qu'il provoque",
  paras:["Le pourcentage est la base de presque tout indicateur commercial : part de marché, taux de marge, taux de conversion, taux de réponse. Le programme le place dans le même bloc que les taux, les indices et l'élasticité.",
   "Sa simplicité apparente le rend dangereux. Un pourcentage n'a de sens qu'avec sa base : trente pour cent de quoi, sur quelle période, comparé à quoi. Une part de marché sans périmètre défini ne veut rien dire."],
  encart:{type:"piege", titre:"Deux pièges classiques", texte:"Additionner des pourcentages qui n'ont pas la même base. Et appliquer une baisse de vingt pour cent après une hausse de vingt pour cent en croyant revenir au point de départ."}},

 {t:"notion", kick:"Modéliser", titre:"Équations et fonctions affines",
  paras:["Le dernier bloc du contenu porte sur les équations et les fonctions affines. C'est la partie la plus scolaire de la matière, et la plus courte.",
   "Son intérêt commercial est direct : une fonction affine décrit toute situation où une grandeur augmente d'un montant fixe par unité, à partir d'un point de départ. Un coût composé d'une part fixe et d'une part variable en est l'exemple type."],
  encart:{type:"info", titre:"Le pont avec le semestre 2", texte:"En Coûts, marges et prix d'une offre simple, tu retrouveras exactement cette structure pour calculer un seuil de rentabilité."}},

 {t:"notion", kick:"Décrire", titre:"La statistique descriptive, trois familles de paramètres",
  paras:["Le programme nomme précisément ce que tu verras : les généralités, les séries à un caractère, puis les paramètres de position, de dispersion et de concentration, et enfin la représentation graphique.",
   "Position, dispersion, concentration : trois questions différentes. Où se situe le centre de la série ? À quel point les valeurs s'écartent-elles les unes des autres ? La grandeur est-elle répartie également ou concentrée sur quelques-uns ?"],
  encart:{type:"astuce", titre:"Le réflexe commercial", texte:"Une moyenne seule ne dit presque rien. Deux magasins peuvent avoir le même panier moyen avec des clientèles totalement différentes. C'est la dispersion qui le révèle."}},

 {t:"notion", kick:"Décrire", titre:"La concentration, notion très commerciale",
  paras:["La concentration mesure si une grandeur est répartie également ou concentrée sur une petite part de la population. C'est une notion directement utile en commerce.",
   "Une entreprise peut réaliser l'essentiel de son chiffre d'affaires avec une poignée de clients. Le savoir change complètement la stratégie et la mesure du risque."],
  encart:{type:"info", titre:"Le pont avec la vente", texte:"C'est aussi ce qui justifie de traiter différemment les grands comptes et les petits clients, sujet abordé plus tard dans le cursus."}},

 {t:"notion", kick:"Représenter", titre:"Le graphique n'est pas une décoration",
  paras:["La représentation graphique est un point du contenu et un mot clé de la fiche. Ce n'est pas la mise au propre d'un tableau : c'est un choix qui oriente la lecture.",
   "Une courbe montre une évolution, un histogramme une répartition, un secteur une part d'un tout. Choisir le mauvais type, ou tronquer un axe, transforme une donnée juste en message faux."],
  encart:{type:"piege", titre:"Le classique de la copie", texte:"Un graphique sans titre, sans unité, sans source. Il ne vaut rien, quel que soit le soin apporté aux couleurs."}},

 {t:"notion", kick:"L'évaluation", titre:"Trois apprentissages critiques, dans trois compétences",
  paras:["Le programme rattache cette ressource à trois apprentissages critiques issus de trois compétences différentes : analyser l'environnement d'une entreprise en appréciant les sources d'informations ; évaluer la performance commerciale au moyen d'indicateurs ; analyser les indicateurs post campagne, impact et efficacité.",
   "Autrement dit, tu retrouveras ces techniques dans le dossier marketing, dans le bilan de prospection, et dans l'analyse de la campagne de communication."],
  encart:{type:"info", titre:"Et le portfolio", texte:"La fiche mentionne aussi le portfolio parmi les situations où la ressource est mobilisée. C'est la seule du semestre dans ce cas."}},

 {t:"quiz", kick:"Vérification", question:"À combien de SAÉ cette ressource est-elle rattachée par le programme ?",
  options:["Une seule, la SAÉ marketing",
   "Les trois SAÉ du semestre, plus le portfolio",
   "Aucune, c'est une matière théorique"],
  bonne:1,
  expl:"La fiche officielle cite les SAÉ marketing, vente et communication commerciale, ainsi que le portfolio du semestre 1. C'est la ressource la plus transversale de l'année."},

 {t:"notion", kick:"Le tableur", titre:"Conseillé par le programme, indispensable en pratique",
  paras:["Le contenu officiel indique que l'utilisation d'un tableur est conseillée. Dans les faits, huit heures de travaux pratiques sur dix-huit signifient que tu passeras beaucoup de temps devant un écran.",
   "La ressource Ressources et culture numériques, en parallèle, t'apprend les fonctions de base d'un tableur : création de tableaux, calculs simples, graphiques. Les deux matières s'appuient l'une sur l'autre."],
  encart:{type:"astuce", titre:"Le conseil qui compte", texte:"Apprends très tôt à figer une référence de cellule et à recopier une formule. Ce sont les deux gestes qui font gagner le plus de temps sur un devoir."}},

 {t:"encart", kick:"Si les maths t'inquiètent", titre:"Ce n'est pas un cours de mathématiques", type:"garde",
  texte:"Le contenu de cette ressource s'arrête aux pourcentages, taux, indices, statistique descriptive et fonctions affines. Il n'y a ni intégrales, ni trigonométrie, ni démonstrations. L'objectif affiché est de calculer, comprendre, analyser et interpréter des indicateurs commerciaux. La difficulté n'est presque jamais dans le calcul lui-même, mais dans l'interprétation : savoir ce que le chiffre veut dire, et ce qu'il ne dit pas. Ta maquette prévoit d'ailleurs un accompagnement en mathématiques en première année."},

 {t:"notion", kick:"La méthode", titre:"Interpréter, pas seulement calculer",
  paras:["Le programme demande de calculer, comprendre, analyser et interpréter. Le calcul n'est que le premier des quatre verbes, et c'est de loin le plus facile.",
   "Ce qu'on attend au bout, c'est une phrase : ce chiffre signifie que, et donc il faudrait. Un tableau de résultats sans commentaire n'est pas un travail terminé."],
  encart:{type:"astuce", titre:"La discipline à prendre", texte:"Sous chaque calcul, écris une phrase qui dit ce qu'il signifie. Prends cette habitude dès le premier TD, elle te suivra jusqu'en troisième année."}},

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",

/* ---- R1.08 Éléments financiers de l'entreprise — vérifiée le 7 septembre 2026 ---- */
"R1.08": {titre:"Éléments financiers de l'entreprise", ressId:"R1.08", duree:"16 min", diapos:[
 {t:"intro", kick:"R1.08 · avant le premier cours", titre:"Douze heures pour ne plus dire de bêtises sur l'argent",
  texte:"Le programme donne à cette matière un objectif unique et très clair : vérifier la cohérence des décisions marketing avec la situation financière de l'entreprise. Autrement dit, apprendre à repérer quand une idée commerciale séduisante est financièrement intenable. C'est court, c'est concret, et ça évite de proposer un plan que l'entreprise ne peut pas payer."},

 {t:"notion", kick:"Le programme", titre:"Un seul objectif, mais central",
  paras:["Le programme national énonce une seule contribution : vérifier la cohérence des décisions marketing avec la situation financière de l'entreprise.",
   "C'est inhabituel, la plupart des ressources en annoncent quatre ou cinq. Ici, tout converge vers une question : l'entreprise a-t-elle les moyens de ce qu'on lui propose ?"],
  encart:{type:"info", titre:"Deux compétences", texte:"La ressource est rattachée à Conduire les actions marketing et à Vendre une offre commerciale, et elle alimente les SAÉ marketing et vente."}},

 {t:"notion", kick:"Le programme", titre:"Cinq blocs de contenu",
  paras:["Le contenu officiel liste : le mécanisme de la comptabilité, avec les documents commerciaux, la TVA et l'impôt sur les sociétés ; le compte de résultat, avec les notions de produits, de charges et de résultat ; le contenu d'un bilan, avec l'actif, le passif et le rôle des amortissements et des provisions ; le tableau de trésorerie ; enfin la distinction entre les notions de bénéfice et de trésorerie.",
   "Les mots clés de la fiche résument l'enjeu : rentabilité, trésorerie, patrimoine. Trois questions différentes sur la même entreprise."],
  encart:{type:"astuce", titre:"Le fil rouge", texte:"Rentabilité, est-ce que ça rapporte ? Trésorerie, est-ce qu'il y a de l'argent maintenant ? Patrimoine, qu'est-ce que l'entreprise possède et doit ? Range chaque notion sous l'une de ces trois questions."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les mots à ne pas confondre", mots:[
  {m:"Produit", d:"En comptabilité, ce qui enrichit l'entreprise sur une période. Rien à voir avec le produit vendu au sens marketing."},
  {m:"Charge", d:"Ce qui appauvrit l'entreprise sur une période."},
  {m:"Résultat", d:"La différence entre les produits et les charges. Positif, c'est un bénéfice ; négatif, une perte."},
  {m:"Actif", d:"Ce que l'entreprise possède et utilise."},
  {m:"Passif", d:"L'origine des ressources : d'où vient l'argent qui a financé l'actif."}],
  note:"Le premier mot est un piège permanent en TC : le mot « produit » n'a pas le même sens en comptabilité et en marketing."},

 {t:"notion", kick:"Deux documents", titre:"Compte de résultat et bilan, deux regards",
  paras:["Le compte de résultat couvre une période : il raconte ce qui s'est passé pendant l'année, en produits et en charges, et se conclut par un résultat.",
   "Le bilan est une photographie à un instant donné : ce que l'entreprise possède à l'actif, et l'origine des ressources au passif. L'un est un film, l'autre est une photo."],
  encart:{type:"astuce", titre:"L'image qui marche", texte:"Le compte de résultat, c'est le relevé bancaire de l'année. Le bilan, c'est l'inventaire du 31 décembre au soir."}},

 {t:"notion", kick:"La nuance clé", titre:"Bénéfice et trésorerie, la distinction du programme",
  paras:["Le contenu officiel se termine par un point explicite : la distinction entre les notions de bénéfice et de trésorerie. Ce n'est pas un détail, c'est le point d'arrivée de la matière.",
   "Une entreprise peut être bénéficiaire et se retrouver sans argent disponible, parce que ses clients paient à soixante jours pendant qu'elle règle ses fournisseurs à trente. À l'inverse, elle peut avoir de la trésorerie tout en perdant de l'argent."],
  encart:{type:"piege", titre:"Le piège d'examen", texte:"Confondre les deux est l'erreur la plus fréquente, et c'est précisément ce que le programme demande de distinguer. Attends-toi à une question dessus."}},

 {t:"quiz", kick:"Vérification", question:"Une entreprise affiche un bénéfice de 40 000 euros mais ne peut pas payer ses salaires ce mois-ci. Est-ce possible ?",
  options:["Non, un bénéfice signifie qu'il y a de l'argent disponible",
   "Oui : le bénéfice mesure la rentabilité sur une période, la trésorerie mesure l'argent réellement disponible à un instant donné",
   "Non, cela révèle forcément une erreur comptable"],
  bonne:1,
  expl:"C'est exactement la distinction que le programme demande de maîtriser. Des ventes facturées mais non encaissées produisent du bénéfice sans produire de trésorerie."},

 {t:"notion", kick:"Rentabilité", titre:"Gagner de l'argent, et le savoir",
  paras:["La rentabilité, premier mot clé de la fiche, répond à une question : l'activité rapporte-t-elle plus qu'elle ne coûte ? Le compte de résultat y répond pour l'ensemble de l'entreprise.",
   "En commerce, la même question se pose à une échelle plus fine : ce client, cette gamme, cette action promotionnelle rapportent-ils ? C'est ce raisonnement que la matière prépare, et qui sera outillé au semestre 2."],
  encart:{type:"info", titre:"Le pont avec le semestre 2", texte:"Coûts, marges et prix d'une offre simple reprend cette question au niveau d'un produit. Ici, on la pose au niveau de l'entreprise."}},

 {t:"notion", kick:"Les documents", titre:"Ce que tu manipuleras concrètement",
  paras:["Le premier bloc porte sur le mécanisme de la comptabilité, avec les documents commerciaux, la TVA et l'impôt sur les sociétés.",
   "Les documents commerciaux, ce sont ceux que tu produiras en entreprise : devis, bon de commande, bon de livraison, facture, avoir. Savoir ce que chacun engage juridiquement et comptablement fait partie du métier."],
  encart:{type:"info", titre:"Le pont avec le droit", texte:"La ressource Environnement juridique traite les moyens de preuve. Un devis signé, une facture, un bon de livraison : ce sont aussi des preuves."}},

 {t:"notion", kick:"La TVA", titre:"L'entreprise collecte, elle ne gagne pas",
  paras:["Le programme cite la TVA dans le mécanisme comptable. L'idée de base à comprendre avant d'entrer en cours : l'entreprise collecte la taxe auprès de ses clients et la reverse ; ce n'est ni un produit ni un gain pour elle.",
   "C'est pourquoi on raisonne en commerce sur des montants hors taxes pour les marges, et toutes taxes comprises pour ce que paie le client final. Confondre les deux fausse tous les calculs."],
  encart:{type:"astuce", titre:"À vérifier toujours", texte:"Devant un prix, demande-toi hors taxes ou toutes taxes comprises. Cette question évite une bonne partie des erreurs de première année."}},

 {t:"notion", kick:"Le bilan", titre:"Amortissements et provisions, à quoi ça sert",
  paras:["Le contenu officiel mentionne le rôle des amortissements et des provisions dans le bilan. Ce sont deux mécanismes qui traduisent le temps et l'incertitude.",
   "L'amortissement constate qu'un bien perd de la valeur en étant utilisé. La provision anticipe une charge probable dont on ne connaît pas encore le montant exact. Les deux modifient le résultat sans mouvement d'argent immédiat."],
  encart:{type:"garde", titre:"Ce que je ne détaille pas", texte:"Les règles de calcul, les durées et les méthodes relèvent de conventions comptables précises. Je ne les écris pas de mémoire : ton cours les donnera."}},

 {t:"notion", kick:"La trésorerie", titre:"Le tableau de trésorerie",
  paras:["Le programme cite le tableau de trésorerie parmi les contenus. Il suit les encaissements et les décaissements dans le temps, et fait apparaître les moments où l'argent va manquer.",
   "Pour un commercial, c'est l'outil qui explique pourquoi une remise supplémentaire ou un délai de paiement allongé n'est jamais sans conséquence."],
  encart:{type:"info", titre:"Directement utile en vente", texte:"Accorder soixante jours de délai à un client, c'est financer son activité pendant deux mois. C'est une décision financière, pas seulement commerciale."}},

 {t:"quiz", kick:"Vérification", question:"À quoi sert le bilan par rapport au compte de résultat ?",
  options:["Le bilan couvre une période, le compte de résultat un instant",
   "Le bilan est une photographie du patrimoine à un instant donné, le compte de résultat retrace l'activité d'une période",
   "Les deux disent la même chose sous deux présentations"],
  bonne:1,
  expl:"Le bilan présente l'actif et le passif à une date. Le compte de résultat regroupe les produits et les charges d'une période et aboutit au résultat."},

 {t:"notion", kick:"L'évaluation", titre:"Deux apprentissages critiques, dont un inattendu",
  paras:["Le programme rattache cette ressource à deux apprentissages critiques : analyser l'environnement d'une entreprise en appréciant les sources d'informations, et concevoir des outils d'aide à la vente efficaces.",
   "Le second surprend. Il signifie que les notions financières ne restent pas théoriques : elles doivent nourrir les documents que tu présentes à un client, en assurant que ce que tu proposes tient debout financièrement."],
  encart:{type:"astuce", titre:"À retenir pour la SAÉ vente", texte:"Une proposition commerciale qui ignore la contrainte financière du client ne convainc pas. Chiffrer juste fait partie de l'argumentation."}},

 {t:"notion", kick:"La méthode", titre:"Lire un document, pas le produire",
  paras:["Tu n'es pas en formation comptable. L'objectif n'est pas de tenir des comptes, mais de savoir lire un compte de résultat ou un bilan et d'en tirer une conclusion commerciale.",
   "Quand tu regardes un document financier, la question est toujours la même : qu'est-ce que ça change à ce que je peux proposer ?"],
  encart:{type:"info", titre:"Le juste niveau", texte:"Douze heures, c'est court. On ne t'en demandera pas plus que ce que le programme annonce, mais on te le demandera précisément."}},

 {t:"etapes", kick:"La démarche", titre:"Comment le cours va probablement avancer",

 {t:"notion", kick:"Le patrimoine", titre:"Ce que l'entreprise possède, et ce qu'elle doit",
  paras:["Le troisième mot clé est le patrimoine, et c'est le bilan qui le décrit. À l'actif, ce que l'entreprise détient. Au passif, l'origine des ressources : capitaux apportés, bénéfices conservés, dettes.",
   "Les deux colonnes s'équilibrent nécessairement, puisqu'elles décrivent la même chose sous deux angles : ce qui est possédé, et d'où vient l'argent qui l'a financé."],
  encart:{type:"astuce", titre:"Ce que ça t'apprend", texte:"Une entreprise très endettée n'a pas la même liberté d'action qu'une entreprise financée par ses fonds propres. Ça change ce qu'on peut lui proposer."}},

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",

/* ---- R1.10 Initiation à la conduite de projet — vérifiée le 7 septembre 2026 ---- */
"R1.10": {titre:"Initiation à la conduite de projet", ressId:"R1.10", duree:"14 min", diapos:[
 {t:"intro", kick:"R1.10 · avant le premier cours", titre:"Huit heures qui décident de la réussite de tes SAÉ",
  texte:"C'est la matière la plus courte du semestre, et pourtant elle est rattachée aux trois compétences et aux trois SAÉ. La raison est simple : tout ton semestre se fera en groupe, sur des projets, avec des livrables et des échéances. Cette matière t'apprend à ne pas subir cette organisation."},

 {t:"notion", kick:"Le programme", titre:"Deux objectifs",
  paras:["Le programme énonce deux contributions : analyser le cahier des charges d'un commanditaire pour comprendre le projet, son environnement et ses objectifs ; mettre en place un plan d'actions à partir d'une problématique identifiée et d'un cahier des charges construit, et organiser un travail en groupe.",
   "Les deux verbes qui comptent : analyser une demande, puis organiser un travail collectif. Ce sont exactement les deux choses qui font échouer les projets étudiants."],
  encart:{type:"info", titre:"Trois compétences, trois SAÉ", texte:"La fiche cite les SAÉ marketing, vente et communication commerciale. Aucune n'y échappe."}},

 {t:"notion", kick:"Le programme", titre:"Trois blocs de contenu",
  paras:["Le contenu officiel liste : la définition des étapes de la conduite de projet, avec la phase de cadrage ou avant-projet et ses analyses préliminaires, aboutissant à une note de cadrage ; la conception et la planification, avec la constitution de l'équipe, l'organisation du travail en groupe, la répartition des tâches et la planification ; enfin la présentation des différents outils de gestion de projet.",
   "Les outils nommés sont : la carte mentale, la priorisation des tâches, la matrice des responsabilités, le diagramme de planification, les outils de travail collaboratif et l'organisation de réunions."],
  encart:{type:"astuce", titre:"Ce qu'il faut voir", texte:"Ce ne sont pas des outils abstraits. Ce sont exactement ceux dont ton groupe aura besoin la semaine suivante pour ne pas rendre son dossier en retard."}},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les six mots clés officiels", mots:[
  {m:"Projet", d:"Un ensemble d'actions coordonnées, avec un objectif, un début et une fin."},
  {m:"Cadrage", d:"La phase préalable où l'on définit le projet avant de commencer à le faire."},
  {m:"Note de cadrage", d:"Le document qui sort de cette phase : ce qu'on fait, pourquoi, pour qui, avec quoi, pour quand."},
  {m:"Tâche", d:"L'unité de travail élémentaire, attribuable à quelqu'un et mesurable."},
  {m:"Planification", d:"L'organisation des tâches dans le temps, avec leurs dépendances."},
  {m:"Organisation", d:"La répartition des rôles et des responsabilités dans l'équipe."}],
  note:"Ces six termes sont les mots clés de la fiche officielle."},

 {t:"notion", kick:"Avant de commencer", titre:"La phase de cadrage, celle qu'on saute",
  paras:["Le programme met le cadrage en premier, avec ses analyses préliminaires. C'est la phase où l'on comprend ce que veut vraiment le commanditaire avant de se mettre au travail.",
   "Un groupe qui démarre sans note de cadrage produit trois versions différentes du même livrable, découvre l'incohérence à trois jours du rendu, et passe le week-end à recoller les morceaux."],
  encart:{type:"piege", titre:"Le symptôme à repérer", texte:"Si les membres du groupe ne donnent pas la même réponse à la question « qu'est-ce qu'on doit rendre exactement ? », le cadrage n'a pas été fait."}},

 {t:"notion", kick:"Le point commun", titre:"Le cahier des charges, encore lui",
  paras:["Le premier objectif porte sur l'analyse du cahier des charges d'un commanditaire. Tu retrouveras exactement cette notion en Études marketing, où il s'agit de construire le cahier des charges d'une étude.",
   "D'un côté tu apprends à en écrire un, de l'autre à en lire un. C'est la même compétence, vue des deux bouts."],
  encart:{type:"info", titre:"Le pont", texte:"Cette convergence n'est pas un hasard : les deux ressources alimentent la même SAÉ marketing."}},

 {t:"quiz", kick:"Vérification", question:"Ton groupe se lance directement dans la rédaction du dossier sans note de cadrage. Quel risque principal ?",
  options:["Aucun, si chacun travaille sérieusement",
   "Que chacun ait compris la demande différemment, et que les parties produites ne s'assemblent pas",
   "Que le dossier soit trop long"],
  bonne:1,
  expl:"C'est la fonction même du cadrage : fixer une compréhension commune de la demande avant de produire. Le programme le place en première étape."},

 {t:"notion", kick:"Le vocabulaire", titre:"Ce qui fait qu'un travail est un projet",
  paras:["Un projet a trois caractéristiques : un objectif défini, une fin prévue, et des ressources limitées. C'est ce qui le distingue d'une activité courante, qui se répète sans terme.",
   "Tes SAÉ sont des projets au sens strict : une commande, un livrable, une date. Le vocabulaire du cours s'y applique directement, ce n'est pas une transposition."],
  encart:{type:"info", titre:"Pourquoi ça compte", texte:"Traiter une SAÉ comme un devoir ordinaire est l'erreur de départ. Un devoir se fait ; un projet se pilote."}},

 {t:"notion", kick:"L'équipe", titre:"Répartir n'est pas découper",
  paras:["Le deuxième bloc porte sur la constitution de l'équipe, l'organisation du travail en groupe et la répartition des tâches. Le programme cite parmi les outils la matrice des responsabilités.",
   "Répartir des tâches, ce n'est pas découper le dossier en quatre parts égales. C'est décider qui fait quoi, mais aussi qui valide, qui est consulté, et qui doit être informé. Une matrice des responsabilités sert précisément à ça."],
  encart:{type:"astuce", titre:"La question qui évite les conflits", texte:"Pour chaque tâche : qui la fait, qui la relit, qui décide si elle est bonne ? Poser ces trois questions au départ règle la moitié des tensions de groupe."}},

 {t:"notion", kick:"Le temps", titre:"Planifier, c'est repérer les dépendances",
  paras:["Le programme cite le diagramme de planification et la priorisation des tâches. Planifier ne consiste pas à répartir le travail sur les semaines restantes, mais à repérer ce qui ne peut pas commencer avant qu'autre chose soit fini.",
   "Dans une SAÉ de communication, on ne maquette pas l'affiche avant d'avoir arrêté le message. Dans une SAÉ de vente, on n'appelle pas avant d'avoir qualifié le fichier."],
  encart:{type:"piege", titre:"L'erreur de planning", texte:"Prévoir de tout finir la veille du rendu. Une tâche en retard en bloque trois autres, et l'effet se propage."}},

 {t:"quiz", kick:"Vérification", question:"Dans un groupe de quatre, chacun rédige sa partie sans relecture croisée. Quel outil du programme aurait évité le problème ?",
  options:["Le diagramme de planification",
   "La matrice des responsabilités, qui distingue qui fait, qui valide et qui est informé",
   "La carte mentale"],
  bonne:1,
  expl:"Répartir les tâches ne suffit pas : il faut aussi désigner qui relit et qui valide. C'est exactement la fonction de la matrice des responsabilités, citée dans le contenu officiel."},

 {t:"notion", kick:"Les outils", titre:"Carte mentale et travail collaboratif",
  paras:["Le programme cite la carte mentale parmi les outils de gestion de projet, ainsi que les outils de travail collaboratif et l'organisation de réunions.",
   "La carte mentale sert au démarrage, quand les idées sont éparses et qu'il faut voir leurs liens. Les outils collaboratifs servent ensuite, pour que le groupe travaille sur une seule version des documents."],
  encart:{type:"astuce", titre:"Le conseil qui sauve", texte:"Une seule version du fichier, en ligne, pour tout le groupe. Les dossiers échangés par courriel finissent toujours en « dossier_final_v3_corrigé_vraiment_final »."}},

 {t:"notion", kick:"L'évaluation", titre:"Quatre apprentissages critiques, dans trois compétences",
  paras:["Le programme rattache quatre apprentissages critiques : mettre en œuvre une étude de marché dans un environnement simple ; évaluer la performance commerciale au moyen d'indicateurs ; recourir aux techniques adaptées à la démarche de prospection ; élaborer des supports simples.",
   "Aucun ne porte sur la gestion de projet elle-même. Cette matière ne s'évalue pas pour elle-même : elle s'évalue à travers la qualité de tes projets."],
  encart:{type:"info", titre:"Ce que ça implique", texte:"Il n'y aura probablement pas de contrôle de connaissances sur les outils. En revanche, un projet mal organisé se verra dans tous les livrables."}},

 {t:"notion", kick:"Les réunions", titre:"Se réunir sans perdre son temps",
  paras:["Le programme cite l'organisation de réunions parmi les outils de gestion de projet. Une réunion de projet n'est pas une conversation : elle a un ordre du jour, une durée, et se termine par des décisions attribuées à quelqu'un avec une échéance.",
   "Sans relevé de décisions, la réunion suivante recommence la précédente. C'est le symptôme le plus courant des groupes qui n'avancent pas."],
  encart:{type:"astuce", titre:"La règle des trois lignes", texte:"À la fin de chaque réunion, écris trois lignes : ce qui a été décidé, qui fait quoi, pour quand. Cinq minutes qui en font gagner deux heures."}},

 {t:"notion", kick:"Honnêteté", titre:"Ce que cette leçon ne détaille pas",
  paras:["Le programme nomme des outils sans en imposer le formalisme : diagramme de planification, matrice des responsabilités, méthodes de priorisation. Chacun existe en plusieurs variantes, sous des noms différents selon les manuels.",
   "Je te donne donc leur fonction, pas leur formalisme. Celui de ton cours sera le bon, et c'est celui qu'on évaluera dans tes livrables."],
  encart:{type:"garde", titre:"Le réflexe", texte:"Note la version présentée en cours dès la première séance, avec un exemple. Tu la réutiliseras pendant trois ans."}},

 {t:"etapes", kick:"La démarche", titre:"L'enchaînement du programme",
  etapes:["Analyser le cahier des charges du commanditaire",
   "Mener les analyses préliminaires de la phase de cadrage",

   "Découper en tâches et planifier",

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",
  etapes:["Quel outil de planification sera exigé dans les livrables de SAÉ",
   "Quels outils collaboratifs sont recommandés ou imposés par l'IUT",
   "La note de cadrage fait-elle partie des livrables évalués"],

 {t:"notion", kick:"Le suivi", titre:"Un projet se pilote, il ne se lance pas",

/* ---- R1.13 Ressources et culture numériques - 1 — vérifiée le 7 septembre 2026 ---- */
"R1.13": {titre:"Ressources et culture numériques - 1", ressId:"R1.13", duree:"16 min", diapos:[
 {t:"intro", kick:"R1.13 · avant le premier cours", titre:"La matière qui rend toutes les autres faisables",
  texte:"Trois compétences, les trois SAÉ, plus le portfolio. Comme les techniques quantitatives, cette ressource est partout, pour une raison simple : tous tes livrables passeront par un logiciel. Un dossier mal mis en page, une présentation qui plante, une image déformée — ce sont des points perdus sur le fond à cause de la forme."},

 {t:"notion", kick:"Le programme", titre:"Cinq objectifs",
  paras:["Le programme énonce : rechercher de l'information et la sélectionner ; utiliser les outils numériques pour présenter un projet ; concevoir des outils adaptés à la démarche de prospection ; utiliser l'outil numérique pour produire des supports de communication simples ; collaborer pour conduire un projet.",
   "Chacun correspond à une SAÉ précise. Le troisième vise la prospection, le quatrième la communication, le premier le marketing."],
  encart:{type:"info", titre:"Ce que ça veut dire", texte:"Cette matière n'est pas un cours d'informatique générale. Chaque compétence numérique y est enseignée pour un usage commercial identifié."}},

 {t:"notion", kick:"Le programme", titre:"Un contenu très détaillé",
  paras:["Le contenu officiel est l'un des plus précis du semestre. Il couvre la prise en main de l'environnement numérique de travail, avec la netiquette du courriel, les réunions à distance et l'échange de fichiers ; l'organisation et la recherche d'information, avec le stockage, le réseau interne et la sécurité ; les outils de recherche sur Internet ; le traitement de texte ; la création de présentations professionnelles ; la retouche d'image ; et l'utilisation d'un tableur.",
   "Sur vingt heures, quinze sont des travaux pratiques. C'est la proportion la plus élevée de toutes les matières du semestre après la vente."],
  encart:{type:"astuce", titre:"Conséquence directe", texte:"On ne t'évaluera pas sur des définitions, mais sur ce que tu produis. La seule façon de progresser est de pratiquer."}},

 {t:"notion", kick:"Le courriel", titre:"La netiquette, citée par le programme",
  paras:["Le contenu commence par la prise en main de l'environnement numérique de travail et cite explicitement la netiquette du courriel.",
   "Ce n'est pas de la politesse décorative. Un objet vide, une pièce jointe de vingt méga-octets, une absence de formule ou un tutoiement à un professionnel : ce sont des erreurs qui ferment des portes, notamment pendant ta recherche de stage."],
  encart:{type:"astuce", titre:"Applique-le tout de suite", texte:"Tes courriels aux enseignants sont ton premier terrain d'entraînement. Objet explicite, phrase de contexte, demande claire, formule de politesse, signature."}},

 {t:"notion", kick:"À distance", titre:"Réunions en distanciel et échange de fichiers",
  paras:["Le contenu officiel cite les réunions en distanciel et l'échange de fichiers parmi les premières compétences à acquérir, aux côtés de la netiquette.",
   "Ce sont des gestes professionnels courants : partager un écran, couper son micro, envoyer un fichier lourd sans saturer une boîte, retrouver la bonne version. Rien de spectaculaire, mais leur absence se remarque immédiatement."],
  encart:{type:"astuce", titre:"À tester avant", texte:"Vérifie que ton micro et ta caméra fonctionnent avant la première réunion à distance, pas pendant."}},

 {t:"notion", kick:"Chercher", titre:"Trouver, mais surtout trier",
  paras:["Le premier objectif porte sur la recherche d'information et sa sélection. Le contenu détaille l'organisation et la recherche d'information, ainsi que les outils de recherche sur Internet.",
   "Le verbe qui compte est sélectionner. Trouver de l'information est devenu trivial ; décider laquelle mérite d'être citée ne l'est pas."],
  encart:{type:"info", titre:"Le pont avec les études", texte:"L'apprentissage critique sur la fiabilité et la pertinence des sources est le même que celui d'Études marketing. Les deux matières se renforcent."}},

 {t:"notion", kick:"Organiser", titre:"Stockage, réseau, sécurité",
  paras:["Le contenu cite l'organisation de l'information sur l'ordinateur, les supports de stockage, le réseau interne, et la sécurité ou protection.",
   "Nommage des fichiers, arborescence, sauvegarde : cela paraît trivial jusqu'au jour où un groupe entier cherche la bonne version d'un dossier à la veille du rendu."],
  encart:{type:"astuce", titre:"Une règle simple", texte:"Nomme tes fichiers avec la date à l'envers, année-mois-jour, suivie du sujet. Ils se classent tout seuls dans le bon ordre."}},

 {t:"quiz", kick:"Vérification", question:"Le programme place la netiquette du courriel dans le contenu de cette matière. Pourquoi est-ce un enjeu professionnel ?",
  options:["Parce que c'est une question de politesse sans conséquence pratique",
   "Parce qu'un courriel mal rédigé peut suffire à faire échouer une prise de contact, notamment en recherche de stage",
   "Parce que le courriel remplace tous les autres outils"],
  bonne:1,
  expl:"Le programme rattache cette ressource à la démarche de prospection. Le courriel est un outil de contact professionnel : sa forme conditionne la réponse."},

 {t:"notion", kick:"Le traitement de texte", titre:"Ce qu'on attend précisément",
  paras:["Le contenu détaille : saisie et import de texte, mise en page, mise en forme, insertion d'objets, export, structuration, gestion de documents longs.",
   "Deux mots méritent l'attention : structuration et documents longs. On ne te demande pas de savoir mettre en gras, mais de savoir construire un document de trente pages avec des styles, une table des matières automatique et une numérotation qui tient."],
  encart:{type:"piege", titre:"L'erreur qui coûte des heures", texte:"Mettre en forme les titres à la main plutôt qu'avec des styles. Sur un dossier long, chaque modification devient un chantier."}},

 {t:"notion", kick:"La présentation", titre:"Présenter n'est pas décorer",
  paras:["Le contenu vise la création et l'exploitation de présentations professionnelles, avec import et export, transitions, animations et insertion d'objets.",
   "Le mot professionnelles est là pour une raison. Une présentation de soutenance sert à soutenir un propos oral, pas à le remplacer. Des diapositives surchargées de texte que tu lis à voix haute constituent la faute la plus fréquente."],
  encart:{type:"info", titre:"Le pont avec l'oral", texte:"La ressource Expression, communication et culture travaille la prise de parole. Les deux se retrouvent à chaque soutenance de SAÉ."}},

 {t:"notion", kick:"L'image", titre:"Retouche pour supports commerciaux",
  paras:["Le contenu précise : création et exploitation d'images pour l'intégration dans un support commercial, à l'aide de logiciels de retouche d'image de type bitmap. Les gestes attendus sont l'import, l'export, le redimensionnement, le format, la transparence et les effets simples.",
   "C'est cette partie qui alimente directement la SAÉ de communication, où tu produiras une affiche ou un flyer."],
  encart:{type:"piege", titre:"Deux fautes classiques", texte:"Déformer une image en l'étirant pour la faire rentrer, et utiliser une image de trop basse définition qui devient floue à l'impression. Les deux se voient immédiatement."}},

 {t:"notion", kick:"La sécurité", titre:"Protéger, sauvegarder, ne pas tout perdre",
  paras:["Le contenu cite la sécurité et la protection dans la partie sur l'organisation de l'information. En entreprise, cela recouvre les mots de passe, les droits d'accès, et la sauvegarde.",
   "Pour toi, cela commence par une règle simple : un travail qui n'existe qu'à un seul endroit n'existe pas. Une panne de disque à trois jours d'un rendu est une histoire vraie qui arrive chaque année."],
  encart:{type:"piege", titre:"À ne pas faire", texte:"Travailler uniquement sur une clé USB. C'est le support le plus fragile et le plus facile à perdre."}},

 {t:"notion", kick:"Le tableur", titre:"Les fonctions de base, pas plus",
  paras:["Le contenu vise l'utilisation d'un tableur simple et de ses fonctions de base : création de tableaux, calculs de base, création de graphiques simples.",
   "Le niveau attendu est explicitement basique. Ce sont les Techniques quantitatives qui apportent le contenu à calculer ; ici, on apprend l'outil."],
  encart:{type:"astuce", titre:"Les deux gestes qui font tout", texte:"Figer une référence de cellule, et recopier une formule sur une colonne. Avec ces deux gestes, tu fais quatre-vingts pour cent de ce qu'on te demandera."}},

 {t:"notion", kick:"Collaborer", titre:"Travailler à plusieurs sans se perdre",
  paras:["Le cinquième objectif est de collaborer pour conduire un projet, et le contenu cite les réunions en distanciel et l'échange de fichiers.",
   "C'est le prolongement direct de la conduite de projet. La matière apporte les outils, l'autre apporte la méthode."],
  encart:{type:"info", titre:"Et le portfolio", texte:"La fiche cite le portfolio du semestre 1 parmi les situations mobilisant cette ressource. Ton portfolio sera un document numérique, et sa qualité de forme compte."}},

 {t:"quiz", kick:"Vérification", question:"Pour un dossier de trente pages, pourquoi utiliser les styles plutôt que de mettre en forme chaque titre à la main ?",
  options:["Parce que c'est plus joli",
   "Parce que la structuration permet une table des matières automatique et une modification globale en une opération",
   "Parce que le programme l'impose sans raison technique"],
  bonne:1,
  expl:"Le contenu officiel cite explicitement la structuration et la gestion de documents longs. Les styles sont ce qui rend un document long modifiable sans tout refaire."},

 {t:"encart", kick:"Attention", titre:"Une image trouvée en ligne n'est pas libre d'usage", type:"garde",
  texte:"Cette matière t'apprend à retoucher et intégrer des images dans un support commercial. Le droit qui encadre cet usage relève d'une autre ressource, Environnement juridique de l'entreprise, qui traite les droits d'auteur et le droit à l'image. Les deux matières se rejoignent dans la même SAÉ de communication : maîtriser l'outil ne dispense pas de vérifier que tu as le droit d'utiliser ce que tu manipules. Prends l'habitude de noter la provenance et la licence de chaque image, dès le premier devoir."},

 {t:"notion", kick:"L'évaluation", titre:"Une matière évaluée par ses productions",
  paras:["Avec quinze heures de travaux pratiques sur vingt, l'essentiel se joue sur ce que tu produis. Les apprentissages critiques rattachés portent sur l'analyse de l'environnement, la conception d'outils de prospection et l'élaboration de supports simples.",
   "Aucun ne porte sur la connaissance des logiciels pour eux-mêmes. On évalue l'usage, pas l'outil."],
  encart:{type:"astuce", titre:"La conséquence pratique", texte:"Ne cherche pas à mémoriser des menus. Cherche à savoir produire un document propre, et le reste suivra."}},

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",
  etapes:["Quels logiciels précis seront utilisés, et sont-ils fournis par l'IUT",
   "Faut-il installer quelque chose sur son ordinateur personnel avant les premiers TP",

/* ---- R1.11 Langue A - Anglais du commerce - 1 — vérifiée le 7 septembre 2026 ---- */
"R1.11": {titre:"Langue A - Anglais du commerce - 1", ressId:"R1.11", duree:"16 min", diapos:[
 {t:"intro", kick:"R1.11 · avant le premier cours", titre:"De l'anglais scolaire à l'anglais qui sert",
  texte:"Ce n'est plus le cours d'anglais du lycée. Le programme parle d'expression et d'interactivité en environnement professionnel international. Concrètement : se présenter, présenter une entreprise, prospecter au téléphone, poser des questions à un client. Tu vas parler, et tu vas parler de commerce."},

 {t:"notion", kick:"Le programme", titre:"Ce que dit exactement le texte",
  paras:["Le programme énonce un objectif général : développer les capacités de compréhension orale et écrite, d'expression orale et écrite et d'interactivité en environnement professionnel international.",
   "Puis il précise deux points : se présenter dans un contexte professionnel, et présenter une entreprise, son activité, son environnement. Ce sont les deux situations de base sur lesquelles tout le reste s'appuie."],
  encart:{type:"info", titre:"Trois compétences", texte:"Le programme rattache l'anglais aux trois compétences du tronc commun, et aux SAÉ marketing et communication commerciale."}},

 {t:"notion", kick:"Le programme", titre:"Six situations de travail",
  paras:["Le contenu officiel liste : la présentation d'une entreprise avec ses points forts et ses points faibles, et la présentation de soi ; la recherche d'informations et de documentation sur une entreprise ou un produit, avec restitution à l'oral et à l'écrit ; la traduction d'un questionnaire, d'une enquête ou d'une interview simple ; la prospection au téléphone et la prise de rendez-vous ; la rédaction et l'utilisation de questions pour connaître les besoins du client ; enfin la description d'un support de communication publicitaire dans sa dimension culturelle, et la présentation d'un brief.",
   "Chacune de ces situations correspond à quelque chose que tu fais déjà en français dans une autre matière."],
  encart:{type:"astuce", titre:"Le raccourci", texte:"Ce que tu apprends en vente, en marketing et en communication, tu le refais en anglais. Réviser une matière révise l'autre."}},

 {t:"notion", kick:"Le lien", titre:"L'anglais reprend le programme des autres matières",
  paras:["La prospection au téléphone et la prise de rendez-vous : c'est le contenu de Fondamentaux de la vente. La rédaction de questions pour connaître les besoins du client : c'est le plan de découverte. La présentation d'un brief : c'est la communication commerciale. Les points forts et les points faibles d'une entreprise : c'est le SWOT.",
   "Rien n'est ajouté. On te demande de faire en anglais ce que tu apprends à faire en français."],
  encart:{type:"info", titre:"Pourquoi c'est une bonne nouvelle", texte:"Tu n'as pas deux programmes à apprendre. Tu en as un, à maîtriser dans deux langues."}},

 {t:"notion", kick:"Les outils", titre:"Ce que le programme demande de travailler",
  paras:["La fiche détaille les outils linguistiques : conjugaison et emploi des temps adaptés à la situation, alphabet, vocabulaire adapté au contexte, forme interrogative, formules de politesse, possession, comparatifs, discours direct et indirect.",
   "Elle ajoute de veiller à la qualité phonétique et idiomatique de l'expression."],
  encart:{type:"piege", titre:"L'alphabet, vraiment", texte:"Il figure explicitement dans la liste. C'est logique : au téléphone, épeler un nom, une adresse électronique ou une référence est un geste quotidien, et le rater bloque tout l'échange."}},

 {t:"notion", kick:"Les outils", titre:"Les chiffres, les graphiques, les tendances",
  paras:["Le programme demande de manier toutes sortes de chiffres — dates, horaires, prix — de lire des graphiques et de décrire des tendances.",
   "Décrire une tendance en anglais est un exercice codifié : dire qu'une courbe monte fortement, se stabilise, chute légèrement. Ce vocabulaire s'apprend en une fois et sert pendant trois ans."],
  encart:{type:"astuce", titre:"Le pont avec les quantitatives", texte:"Tu apprends à lire un graphique en Techniques quantitatives. Ici tu apprends à le commenter en anglais. Fais les deux ensemble."}},

 {t:"quiz", kick:"Vérification", question:"Pourquoi le programme fait-il figurer l'alphabet dans les outils linguistiques d'un cours d'anglais du commerce ?",
  options:["Par souci de remise à niveau des débutants",
   "Parce qu'épeler un nom, une adresse ou une référence au téléphone est un geste professionnel quotidien",
   "Parce que c'est un prérequis de l'examen final"],
  bonne:1,
  expl:"Le contenu officiel associe l'alphabet à la prospection téléphonique et à la prise de rendez-vous. C'est un outil de travail, pas un rappel scolaire."},

 {t:"notion", kick:"Le vocabulaire", titre:"Maîtriser le lexique de base de l'entreprise",
  paras:["Le programme demande de maîtriser le vocabulaire basique général de l'entreprise, de la communication commerciale et du marketing, et de le restituer dans une situation professionnelle spécifique.",
   "Le mot restituer est important : il ne s'agit pas de reconnaître un mot dans un texte, mais de le sortir au bon moment dans un échange."],
  encart:{type:"astuce", titre:"Le lexique de l'application", texte:"L'onglet Révision contient un lexique bilingue. Chaque mot y est demandé dans les deux sens, et le passage du français vers l'anglais est justement celui qui compte pour restituer."}},

 {t:"notion", kick:"L'argumentation", titre:"Les connecteurs logiques",
  paras:["Le programme cite la mobilisation des connecteurs logiques pour l'argumentation. Ce sont les mots qui articulent un raisonnement : cependant, par conséquent, en revanche, c'est pourquoi.",
   "Sans eux, un discours devient une liste de phrases juxtaposées. Avec eux, il devient un argumentaire — et c'est bien d'argumentation commerciale qu'il s'agit."],
  encart:{type:"info", titre:"Le même travail en français", texte:"Expression, communication et culture travaille l'argumentation en français. Les deux matières visent la même compétence."}},

 {t:"notion", kick:"La culture", titre:"Décrire une publicité dans sa dimension culturelle",
  paras:["Le dernier point du contenu porte sur la description d'un support de communication commerciale dans sa dimension culturelle, et la présentation d'un brief.",
   "Une publicité qui fonctionne dans un pays peut être incompréhensible ou choquante dans un autre. Repérer ce qui relève du contexte culturel plutôt que du produit est une compétence commerciale, pas seulement linguistique."],
  encart:{type:"astuce", titre:"L'exercice gratuit", texte:"Compare une même campagne internationale dans deux pays. Les écarts sont souvent instructifs, et ça fait un excellent sujet d'exposé."}},

 {t:"quiz", kick:"Vérification", question:"Le programme demande de « restituer » le vocabulaire dans une situation professionnelle spécifique. Qu'est-ce que cela implique ?",
  options:["Savoir reconnaître les mots dans un texte écrit",
   "Savoir les employer soi-même, au bon moment, dans un échange professionnel",
   "Savoir les traduire du français vers l'anglais uniquement"],
  bonne:1,
  expl:"Reconnaître un mot est passif. Le restituer suppose de le mobiliser en situation, ce qui est nettement plus exigeant et se travaille par la pratique orale."},

 {t:"notion", kick:"L'écrit", titre:"Traduire un questionnaire, une enquête, une interview",
  paras:["Le contenu officiel cite la traduction d'un questionnaire, d'une enquête ou d'une interview simple. C'est le point le plus écrit du programme, et il rejoint directement les Études marketing.",
   "Traduire un questionnaire n'est pas transposer mot à mot : une question mal formulée dans la langue cible produit des réponses inutilisables, exactement comme en français."],
  encart:{type:"info", titre:"Le pont", texte:"Tu apprends à construire un questionnaire en Études marketing. Ici tu apprends à le faire fonctionner dans une autre langue."}},

 {t:"notion", kick:"L'évaluation", titre:"À quoi t'attendre",
  paras:["Vingt heures fixées nationalement, sur un semestre. Les situations décrites par le programme sont majoritairement orales ou interactives : présentation, prospection téléphonique, questionnement du client.",
   "Attends-toi donc à être évaluée en situation plutôt que sur des exercices de grammaire isolés."],
  encart:{type:"info", titre:"À Carcassonne", texte:"La matière pèse 0,5 en UE Marketer et 1 en UE Communiquer. La fiche de l'IUT mentionne aussi la préparation au TOEIC dans le cursus."}},

 {t:"notion", kick:"La méthode", titre:"Ce qui fait progresser en un semestre",
  paras:["Vingt heures de cours ne suffisent à personne pour progresser en langue. Ce qui fait la différence, c'est l'exposition régulière en dehors des cours.",
   "Quinze minutes par jour valent mieux que trois heures le dimanche. Écoute, lecture, et surtout production : c'est parler qui débloque, pas comprendre."],
  encart:{type:"astuce", titre:"Le plus efficace", texte:"Prends l'habitude de commenter à voix haute, en anglais, un graphique ou une actualité économique. Trois minutes par jour. C'est exactement ce qu'on te demandera en examen."}},

 {t:"etapes", kick:"La progression", titre:"L'ordre probable du semestre",
  etapes:["Se présenter dans un contexte professionnel",
   "Présenter une entreprise, son activité, ses points forts et faibles",
   "Rechercher et restituer de l'information sur une entreprise ou un produit",
   "Rédiger des questions pour découvrir les besoins d'un client",
   "Prospecter au téléphone et prendre un rendez-vous",
   "Décrire un support publicitaire et présenter un brief"],
  note:"Ordre déduit de la présentation du contenu officiel, qui va de la présentation de soi vers des situations de plus en plus complexes."},

 {t:"vocab", kick:"Le vocabulaire", titre:"Quatre familles à constituer dès maintenant", mots:[
  {m:"L'entreprise", d:"Structure, fonctions, métiers, secteurs d'activité."},
  {m:"Le marketing", d:"Marché, segmentation, cible, positionnement, offre."},
  {m:"La vente", d:"Prospect, client, besoin, rendez-vous, proposition."},
  {m:"Les chiffres et tendances", d:"Dates, prix, pourcentages, hausse, baisse, stabilité."}],
  note:"Ces quatre familles couvrent ce que le programme appelle le vocabulaire basique général de l'entreprise, de la communication commerciale et du marketing."},

 {t:"encart", kick:"Un conseil de méthode", titre:"Ne traduis pas, reformule", type:"garde",
  texte:"L'erreur la plus commune en première année est de composer une phrase en français puis de la traduire mot à mot. Le résultat est correct grammaticalement et sonne faux — c'est précisément ce que le programme désigne en demandant de veiller à la qualité idiomatique de l'expression. La parade est simple : quand une phrase te résiste, ne cherche pas la traduction, cherche une façon plus simple de dire la même chose avec les mots que tu possèdes déjà. Un commercial qui se fait comprendre vaut mieux qu'un traducteur bloqué."},

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",
  etapes:["Les évaluations seront-elles majoritairement orales ou écrites",
   "Un niveau de départ est-il évalué, et y a-t-il des groupes de niveau",
   "La préparation au TOEIC commence-t-elle dès la première année"],
  note:"La troisième détermine si tu dois travailler un format d'examen précis en plus du cours."},

/* ---- R1.12 Langue B du commerce - 1 — vérifiée le 7 septembre 2026 ---- */
"R1.12": {titre:"Langue B du commerce - 1", ressId:"R1.12", duree:"14 min", diapos:[
 {t:"intro", kick:"R1.12 · avant le premier cours", titre:"Une seconde langue, au même niveau d'exigence",
  texte:"À Carcassonne, la langue B est l'espagnol. Le programme national lui donne exactement le même contenu et les mêmes objectifs qu'à l'anglais : même volume, mêmes compétences, mêmes situations professionnelles. Ce n'est pas une matière secondaire, et le coefficient le confirme."},

 {t:"notion", kick:"Le programme", titre:"Un contenu identique à celui de la langue A",
  paras:["La fiche de la langue B reprend mot pour mot celle de la langue A : développer les capacités de compréhension orale et écrite, d'expression orale et écrite et d'interactivité en environnement professionnel international, avec la présentation de soi et de l'entreprise comme points d'entrée.",
   "Même contenu, même volume de vingt heures, mêmes trois compétences visées, mêmes SAÉ. La seule différence tient à la langue et donc à l'aire culturelle."],
  encart:{type:"info", titre:"La conséquence pratique", texte:"Tout ce que dit la leçon sur l'anglais s'applique ici. Si tu ne l'as pas lue, commence par elle."}},

 {t:"notion", kick:"Le contenu", titre:"Les six mêmes situations",
  paras:["Présentation d'une entreprise avec ses points forts et faibles, et présentation de soi. Recherche d'informations et de documentation, avec restitution à l'oral et à l'écrit. Traduction d'un questionnaire, d'une enquête ou d'une interview simple. Prospection au téléphone et prise de rendez-vous. Rédaction de questions pour connaître les besoins du client. Description d'un support publicitaire dans sa dimension culturelle et présentation d'un brief.",
   "Le texte officiel de la langue B est identique à celui de la langue A, à ceci près qu'il dit « en langue étrangère » là où l'autre dit « en anglais »."],
  encart:{type:"astuce", titre:"Économie d'effort", texte:"Les mêmes situations dans deux langues : prépare-les une fois, décline-les deux fois."}},

 {t:"notion", kick:"Les outils", titre:"Mêmes outils linguistiques",
  paras:["Conjugaison et emploi des temps adaptés à la situation, alphabet, vocabulaire en contexte, forme interrogative, formules de politesse, possession, comparatifs, discours direct et indirect.",
   "S'y ajoutent la qualité phonétique et idiomatique, le maniement des chiffres, la lecture de graphiques et la description de tendances, le vocabulaire de base de l'entreprise, et les connecteurs logiques pour l'argumentation."],
  encart:{type:"piege", titre:"La difficulté propre à l'espagnol", texte:"La proximité avec le français rend la compréhension facile et l'expression trompeuse. Les faux amis et les constructions calquées sont l'écueil principal."}},

 {t:"notion", kick:"La spécificité", titre:"Quelle aire culturelle",
  paras:["L'espagnol n'est pas la langue d'un pays mais d'un ensemble de pays, avec des usages commerciaux, des tournures et des références différents d'un continent à l'autre.",
   "Le programme demande précisément de décrire un support de communication dans sa dimension culturelle. En espagnol, cette dimension est plurielle : ce qui vaut à Madrid ne vaut pas nécessairement à Bogota ou à Mexico."],
  encart:{type:"astuce", titre:"Question utile", texte:"Demande à ton enseignant quelle variante est privilégiée dans le cours et dans les évaluations. C'est une question qui montre que tu as compris l'enjeu."}},

 {t:"notion", kick:"Les situations", titre:"Se présenter, présenter une entreprise",
  paras:["Comme en langue A, les deux points d'entrée du programme sont la présentation de soi dans un contexte professionnel, et la présentation d'une entreprise, de son activité et de son environnement.",
   "Ces deux exercices reviendront tout au long des trois années, en stage comme en entretien. Les travailler sérieusement au premier semestre fait gagner du temps ensuite."],
  encart:{type:"astuce", titre:"À préparer une fois pour toutes", texte:"Une présentation de toi de deux minutes, dans les deux langues. Tu la réutiliseras des dizaines de fois."}},

 {t:"notion", kick:"L'oral", titre:"La qualité phonétique, explicitement demandée",
  paras:["Le programme demande de veiller à la qualité phonétique et idiomatique de l'expression. En espagnol, cela recouvre notamment l'accentuation, qui change le sens des mots, et des sons qui n'existent pas en français.",
   "Une prononciation approximative ne bloque pas la compréhension entre langues proches, ce qui est précisément le problème : rien ne signale l'erreur, et elle s'installe."],
  encart:{type:"astuce", titre:"Le remède", texte:"Lire à voix haute cinq minutes par jour, en s'enregistrant de temps en temps. C'est ingrat et c'est ce qui marche."}},

 {t:"notion", kick:"L'atout", titre:"Une seconde langue pèse dans un CV",
  paras:["Beaucoup d'étudiants traitent la langue B comme un complément. C'est une erreur de calcul : sur les deux semestres, les deux langues représentent ensemble six points de coefficient, et une seconde langue maîtrisée distingue nettement un profil commercial.",

  encart:{type:"info", titre:"À Carcassonne", texte:"La fiche de l'université mentionne des mobilités en Espagne, en Roumanie et au Canada. La langue B en est la clé d'entrée la plus directe."}},

 {t:"notion", kick:"La méthode", titre:"Deux langues en parallèle, comment s'organiser",

 {t:"notion", kick:"La pratique", titre:"Ce qui fait progresser hors des cours",

 {t:"encart", kick:"Un conseil de méthode", titre:"Attention aux amis trop faciles", type:"garde",
  texte:"Entre le français et l'espagnol, une grande partie du vocabulaire se ressemble, et cette ressemblance est le principal piège. Certains mots proches ont un sens différent, d'autres n'existent pas, d'autres encore changent de registre. En contexte commercial, l'erreur ne prête pas seulement à sourire : elle peut modifier le sens d'une proposition. Le réflexe à prendre est simple, et il vaut pour les deux langues : vérifier plutôt que supposer, surtout sur les mots qui semblent évidents."},

/* ---- R1.14 Expression, communication et culture - 1 — vérifiée le 7 septembre 2026 ---- */
"R1.14": {titre:"Expression, communication et culture - 1", ressId:"R1.14", duree:"16 min", diapos:[
 {t:"intro", kick:"R1.14 · avant le premier cours", titre:"S'informer et informer, de manière critique",
  texte:"Le programme résume la matière en deux verbes : s'informer et informer de manière critique, et communiquer de manière adaptée aux situations. Ce n'est pas un cours de français au sens scolaire. C'est un entraînement à ne pas se faire avoir par une information, et à écrire des documents que des professionnels liront."},

 {t:"notion", kick:"Le programme", titre:"Deux objectifs, deux moitiés de cours",
  paras:["Le programme énonce deux contributions : s'informer et informer de manière critique, et communiquer de manière adaptée aux situations.",
   "Le contenu suit ce découpage. Une première moitié sur la recherche documentaire, la fiabilité des sources et l'esprit critique. Une seconde sur la communication professionnelle : les écrits, l'image, les normes de présentation."],
  encart:{type:"info", titre:"Une ressource transversale", texte:"Trois compétences, les trois SAÉ, plus le portfolio. Comme les techniques quantitatives et le numérique, cette matière est partout."}},

 {t:"notion", kick:"S'informer", titre:"Recherche documentaire et normes bibliographiques",
  paras:["Le contenu cite l'initiation à la recherche documentaire, en donnant pour exemples le recours à l'environnement numérique de travail, aux bases de données et aux normes bibliographiques.",
   "Les normes bibliographiques ne sont pas un caprice académique. Citer correctement permet à un lecteur de retrouver ta source, et te protège contre l'accusation de plagiat."],
  encart:{type:"astuce", titre:"À faire dès le premier dossier", texte:"Note la référence complète de chaque source au moment où tu la consultes. Reconstituer une bibliographie après coup prend trois fois plus de temps."}},

 {t:"notion", kick:"S'informer", titre:"Fiabilité, pertinence, et le mot qui fâche",
  paras:["Le programme demande l'étude de la fiabilité et de la pertinence des informations et des sources choisies. Il cite explicitement deux termes : les fausses informations et le plagiat.",
   "Il précise aussi les types de sources à examiner : médias grand public et spécialisés, internet."],
  encart:{type:"piege", titre:"Le plagiat", texte:"Ce n'est pas seulement recopier sans citer. Reformuler l'idée de quelqu'un sans le mentionner en est aussi. La règle est simple : si l'idée n'est pas de toi, dis d'où elle vient."}},

 {t:"notion", kick:"S'informer", titre:"Esprit critique et culture générale",
  paras:["Le troisième point demande le développement de l'esprit critique et de la culture générale, en privilégiant les sujets d'actualité socio-économique, géopolitique et culturelle.",
   "Pour un commercial, ce n'est pas un ornement. Comprendre le contexte dans lequel évolue un client, savoir de quoi on parle en rendez-vous, être capable de tenir une conversation informée : c'est du métier."],
  encart:{type:"astuce", titre:"L'habitude à prendre", texte:"Quinze minutes d'actualité économique par jour, sur une source sérieuse. Sur trois ans, l'écart avec ceux qui ne le font pas devient énorme."}},

 {t:"quiz", kick:"Vérification", question:"Tu reformules avec tes mots l'analyse d'un auteur, sans le citer. Que dit le programme ?",
  options:["C'est correct, puisque les mots sont les tiens",
   "C'est du plagiat : le programme cite explicitement le plagiat parmi les points à étudier, et l'idée reste celle d'un autre",
   "Cela dépend de la longueur du passage"],
  bonne:1,
  expl:"Le plagiat ne porte pas seulement sur les mots mais sur les idées. Le contenu officiel place le plagiat dans l'étude de la fiabilité des sources et de l'usage de l'information."},

 {t:"notion", kick:"Communiquer", titre:"La sémiologie, pour communiquer par l'image",
  paras:["Le contenu annonce le développement des savoirs et savoir-faire en sémiologie afin de communiquer par l'image, avec pour exemples le flyer, l'affiche et le support d'exposé.",
   "La sémiologie est l'étude des signes et de la façon dont ils produisent du sens. Appliquée à une affiche : pourquoi cette couleur, ce cadrage, ce regard vers l'objectif produisent-ils tel effet."],
  encart:{type:"info", titre:"Le pont avec la SAÉ", texte:"C'est exactement ce qu'il faut pour la SAÉ de communication commerciale, où tu produiras un support imprimé. Ici on apprend à lire l'image, ailleurs on apprend à la fabriquer."}},

 {t:"notion", kick:"S'informer", titre:"Distinguer les types de sources",
  paras:["Le contenu cite les sources à examiner : médias grand public et spécialisés, internet. Chacun a sa logique propre.",
   "Un média grand public simplifie pour toucher large ; un média spécialisé suppose des connaissances mais entre dans le détail. Aucun n'est meilleur en soi : tout dépend de ce que tu cherches et de ce que tu comptes en faire."],
  encart:{type:"astuce", titre:"La question à se poser", texte:"Qui parle, à qui, et pour quoi faire ? Trois questions qui suffisent à situer presque n'importe quelle source."}},

 {t:"notion", kick:"Communiquer", titre:"Les outils de présentation cités",
  paras:["Le programme cite les logiciels de carte heuristique, de diaporama et d'infographie parmi les outils de présentation à mobiliser.",
   "On retrouve la carte heuristique en conduite de projet, le diaporama en ressources numériques. Les matières se recoupent volontairement."],
  encart:{type:"astuce", titre:"Ce que ça t'évite", texte:"Trois matières t'enseignent le même outil sous trois angles. Ne les traite pas comme trois apprentissages séparés."}},

 {t:"notion", kick:"Communiquer", titre:"Lire les écritures professionnelles",
  paras:["Le contenu demande l'analyse et la compréhension des écritures professionnelles, à travers les textes de la presse généraliste ou spécialisée.",
   "Avant d'écrire comme un professionnel, on apprend à repérer comment les professionnels écrivent : structure d'un article, hiérarchie de l'information, choix du registre."],
  encart:{type:"info", titre:"Le lien avec l'actualité", texte:"C'est aussi le support du travail sur l'esprit critique : les mêmes textes servent aux deux moitiés du cours."}},

 {t:"notion", kick:"Communiquer", titre:"Les documents que tu vas produire",
  paras:["Le programme liste, à titre indicatif : revue de presse, dossier, plaquette de présentation, rapport simple, note, courrier, courriel.",
   "Chacun a ses codes. Une note n'est pas un courriel, un rapport n'est pas un dossier. Ce que le programme appelle communiquer de manière adaptée aux situations, c'est précisément savoir choisir le bon format."],
  encart:{type:"piege", titre:"L'erreur de format", texte:"Rendre un dossier là où une note d'une page était attendue n'est pas du zèle : c'est une réponse inadaptée à la situation, et c'est évalué comme telle."}},

 {t:"notion", kick:"La forme", titre:"Typographie, orthographe, syntaxe",
  paras:["Le dernier point du contenu porte sur la compréhension et le respect des normes de présentation écrites : typographie, orthographe et syntaxe.",
   "En commerce, un document fautif ne fait pas seulement mauvais effet : il jette un doute sur le sérieux de tout ce qu'il contient. Un devis avec trois fautes fait douter du chiffrage."],
  encart:{type:"astuce", titre:"À Carcassonne", texte:"La fiche de l'IUT mentionne le logiciel Voltaire et un module d'accompagnement en français. Si l'orthographe est un point faible, c'est le moment de le traiter."}},

 {t:"quiz", kick:"Vérification", question:"Ton enseignant demande une note d'une page. Tu rends un dossier de quinze pages très documenté. Que va-t-il constater ?",
  options:["Un travail supérieur aux attentes",
   "Une communication inadaptée à la situation, ce que le programme évalue précisément",
   "Un problème de gestion du temps uniquement"],
  bonne:1,
  expl:"Le deuxième objectif du programme est de communiquer de manière adaptée aux situations. Choisir le bon format fait partie de la compétence, et une note se caractérise par sa brièveté."},

 {t:"vocab", kick:"Le vocabulaire", titre:"Les formats à distinguer", mots:[
  {m:"Note", d:"Un document court, factuel, qui informe ou propose une décision. Une page au maximum."},
  {m:"Rapport", d:"Un document structuré qui rend compte d'un travail et débouche sur des conclusions."},
  {m:"Revue de presse", d:"Une sélection commentée d'articles sur un sujet, avec ses sources."},
  {m:"Plaquette de présentation", d:"Un support de communication soigné, destiné à un lecteur extérieur."}],
  note:"Ces quatre formats figurent dans la liste indicative du programme, avec le dossier, le courrier et le courriel."},

 {t:"notion", kick:"Communiquer", titre:"Adapter, c'est choisir le registre",
  paras:["Communiquer de manière adaptée aux situations ne concerne pas que le format. Le registre de langue compte autant : un courriel à un enseignant, un courrier à une entreprise et un message à un camarade de groupe ne s'écrivent pas pareil.",
   "Le programme range cette exigence avec les normes de présentation écrites. La forme n'est pas séparable du fond dans un écrit professionnel."],
  encart:{type:"piege", titre:"L'erreur fréquente", texte:"Écrire à une entreprise comme on écrit un message personnel. C'est le premier filtre, souvent inconscient, du recruteur qui te lit."}},

 {t:"notion", kick:"L'évaluation", titre:"Une matière évaluée partout",
  paras:["Trois compétences, trois SAÉ, plus le portfolio. Chaque livrable que tu produiras cette année passe par cette matière : sa structure, son registre, sa présentation, ses sources.",
   "Autrement dit, même si le cours lui-même est peu évalué en tant que tel, son effet se voit dans toutes les autres notes."],
  encart:{type:"info", titre:"À Carcassonne", texte:"La matière pèse 0,5 en UE Marketer, 1 en UE Vendre et 0,5 en UE Communiquer, pour vingt heures."}},

 {t:"encart", kick:"Attention", titre:"L'esprit critique s'applique aussi aux outils d'aide à la rédaction", type:"garde",
  texte:"Le programme demande d'étudier la fiabilité des informations et de développer l'esprit critique. Cette exigence vaut pour toutes les sources, y compris les outils qui rédigent ou résument à ta place. Un texte produit sans vérification peut contenir des affirmations fausses, des sources inventées ou des références qui n'existent pas — et c'est toi qui signes. Vérifie chaque fait et chaque référence avant de les reprendre à ton compte. Sur les règles applicables dans ta formation, demande à ton IUT : elles varient d'un établissement à l'autre et je ne les connais pas."},

 {t:"etapes", kick:"En pratique", titre:"Trois questions à poser au premier cours",
  etapes:["Quelle norme bibliographique est exigée dans les dossiers",
   "Quels formats d'écrits professionnels seront évalués au semestre 1",
   "Quelles règles s'appliquent aux outils d'aide à la rédaction dans les travaux rendus"],
  note:"La première évite de refaire une bibliographie entière, la troisième évite un malentendu qui peut coûter cher."},

 {t:"chiffres", kick:"Récapitulatif", titre:"Ce qu'il faut retenir", lignes:[
